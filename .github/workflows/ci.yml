name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The runner image can lag behind the newest 22.x; Astro 7.4 needs >=22.23.4.
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Astro incremental build cache and content data store (node_modules/.astro).
      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm validate
      - run: pnpm check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # CI builds are not deployed; any absolute URL will do.
          SITE_URL: https://example.com
