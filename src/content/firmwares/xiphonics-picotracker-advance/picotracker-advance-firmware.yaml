source_status: binary-only
license: unspecified
license_notes: The shared tracker code in the xiphonics/picoTracker repository is BSD-3-Clause, with copyright to Discodirt and xiphonics, inc. The Advance manual's credits page names third-party code but gives no license for the Advance firmware itself.
homepage: https://xiphonics.com/pages/picotracker
distribution: download
install_notes: >-
  Copy the .bin file to the top level of the SD card, insert it, then pick Update firmware on the Device screen and
  confirm. The Advance reboots into its bootloader, where you select the .bin file and press ENTER, then choose
  Reboot. Updates are blocked while the sequencer is playing. If the unit will not start, holding the boot button
  below the SD card slot while keeping the power button down for about eight seconds enters the bootloader.
brick_risk: false
tags: [official, tracker, sequencer, sampler, synth-engine, fm, sid, midi, usb-midi, recording]
