license: CC0-1.0
license_notes: >-
  The README dedicates the original guide material to the public domain under
  CC0 1.0 and says any executable code added later may carry a separate licence.
  Sonicake trademarks and third-party material are excluded.
distribution: source-only
requires_stock: Tested on Pocket Master firmware V1.3.3; the published baseline is the V1.3.0 MIDI table
install_notes: >-
  Documentation only; nothing to install. The example script in examples/ talks to a
  connected pedal, and the guide advises backing up user presets and testing writes
  on a spare slot.
brick_risk: false
