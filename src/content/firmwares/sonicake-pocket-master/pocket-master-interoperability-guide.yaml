device: sonicake-pocket-master
kind: tool
name: Pocket Master Interoperability Guide
summary: Unofficial notes on the Pocket Master's standard MIDI commands, vendor SysEx editor protocol and .prst preset format, with each finding labelled by how well it was tested.
description: >-
  A documentation repository that combines the published MIDI table with
  behaviour tested on firmware V1.3.3 over USB MIDI and Bluetooth MIDI. Findings
  are labelled as manual, confirmed, inferred or unknown, and commands as passive,
  device read, live or persistent. It covers the SysEx overview, the stored-preset
  structure, known limits and a safety section on backing up and verifying writes.
  A getting-started file and a small Python script give three bounded exercises.
  It states that it contains no vendor software, firmware or decompiled source.
status: active
