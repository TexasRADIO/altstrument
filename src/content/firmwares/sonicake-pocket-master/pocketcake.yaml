device: sonicake-pocket-master
also_devices: [sonicake-smart-box]
kind: tool
name: PocketCake
summary: Native Windows editor for the Pocket Master and Smart Box over USB-MIDI or Bluetooth, built with WinUI 3, with NAM clone import and an optional local MCP endpoint for AI agents.
description: >-
  A C# app that edits presets in real time, saves to user slots, shows the
  signal chain with per-module on/off, and covers every effect parameter,
  footswitch assignment and tap tempo. It also sets global options such as USB
  audio mode, uploads user IRs, converts Neural Amp Modeler files to the pedal's
  clone format, and imports and exports presets as JSON. A demo mode replays
  captured device traffic so it can be tried without a pedal. When switched on in
  settings, it serves a loopback-only MCP endpoint protected by a bearer token so
  an AI agent can edit presets in the running app; saving presets and writing IR
  or clone slots still ask for confirmation, and factory reset is not exposed.
  The protocol code and data tables are ported from SonicMaster. Not affiliated
  with Sonicake.
status: active
