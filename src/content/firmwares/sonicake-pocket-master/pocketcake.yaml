distribution: source-only
requires_stock: Pocket Master or Smart Box; the README names no firmware version
install_notes: >-
  Needs the .NET 10 SDK on Windows 10 or later. Run dotnet run --project
  src/PocketCake -p:Platform=x64 from a clone. The repository has no release
  builds. Saving writes to user presets on the pedal.
