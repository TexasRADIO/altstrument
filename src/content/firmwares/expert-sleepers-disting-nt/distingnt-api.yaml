device: expert-sleepers-disting-nt
name: distingNT_API
kind: tool
summary: Official Expert Sleepers C++ API and examples for writing plugin algorithms for the disting NT. Plugins are compiled .o files loaded from the SD card.
description: >-
  The API shipped with disting NT firmware 1.7.0, and each API release is
  tagged to the firmware version it matches (v1.18.0 requires API version 13).
  Plugins add algorithms to the stock firmware; they do not replace it. Help
  is on the module's Discord, linked from the repository README.
