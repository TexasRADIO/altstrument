source_status: open
license: MIT
homepage: https://synthux.academy/store/audrey-ii
distribution: download
install_notes: >-
  Download the latest .bin (the README links audrey-ii-v3.bin in
  simple-designer-instruments), open the Daisy Web Programmer in Chrome, put the
  Seed in bootloader mode with a data-capable USB cable, choose the file and
  press Program. Building needs the Daisy toolchain and make.
