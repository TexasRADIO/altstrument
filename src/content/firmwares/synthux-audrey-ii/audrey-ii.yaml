device: synthux-audrey-ii
name: Audrey II (official firmware)
summary: "Official firmware for Audrey II: a Karplus-Strong string fed back through distortion, reverb, EQ filters and a long delay, silent until the feedback control is raised."
description: >-
  Audrey II feeds an inaudible stream of white noise into a Karplus-Strong string
  model, takes the string output through a soft-clipping distortion, a reverb and
  gentle low-pass and high-pass filters, and returns it to the string through a
  longer delay line called the body. Nothing sounds until the outer feedback gain
  rises, and a tape-like delay with feedback that can grow without bound adds
  warbling and distortion. The same engine was ported to the Touch 2 as Audrey
  II Touch. The repository README links a build video and assembly guide.
status: active
