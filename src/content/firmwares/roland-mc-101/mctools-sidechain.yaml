device: roland-mc-101
name: mctools_sidechain
kind: tool
summary: Experimental Python scripts that imitate a sidechain effect on the MC-707, MC-101 and MV-1 by exchanging SysEx messages with the unit over USB.
description: >-
  The repository holds the scripts shown in the author's video. They include a
  SysEx communication layer that identifies the connected model, helpers for
  reading and editing sequencer steps and clips, and a script that finds
  trigger notes in a clip and uses them to shape another track so it ducks
  around them. The README calls it experimental, and the author's MIDI
  scripts choose between mido and ALSA backends.
status: active
authors:
  - name: Ada Locriana
    url: https://github.com/Locriana
source: https://github.com/Locriana/mctools_sidechain
source_status: open
license: MIT
homepage: https://www.youtube.com/watch?v=U5ZBAstmlmE
distribution: source-only
install_notes: >-
  Python scripts with no packaging; run the entry-point script in the
  repository after connecting the unit over USB. The README has no setup
  steps, so the video and the source are the documentation. It edits
  sequencer data on the unit, so keep a backup of your project.
brick_risk: false
