device: 4ms-metamodule
name: MetaModule plugin SDK and examples
kind: tool
summary: SDK with a VCV Rack wrapper for compiling existing Rack plugin source into MetaModule plugins, plus native plugin support. The examples repository builds Airwindows, Fundamental, Venom, Bogaudio and many other ports.
description: >-
  The SDK (github.com/4ms/metamodule-plugin-sdk) is a CMake project that needs
  arm-none-eabi-gcc. The examples repository (github.com/4ms/metamodule-plugin-examples)
  vendors community and VCV-ported plugins as submodules, some with small
  changes, and publishes per-plugin builds for each firmware version. It
  also holds two native examples (Airwindows and NativeExample).
status: active
