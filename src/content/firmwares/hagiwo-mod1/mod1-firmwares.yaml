device: hagiwo-mod1
name: mod1_firmwares
summary: Collection of Arduino sketches for the HAGIWO MOD1, including a three-channel LFO, a Grids-style drum pattern generator, a quantizer, a Euclidean sequencer, a Turing-machine with sample and hold, an attenuverter and a percussion envelope.
description: >-
  Each sketch lives in its own folder and documents its pin assignments for the
  MOD1's pots, jacks, button and LED. Others in the repository are a simple
  knob-to-CV and latch utility, a one-button drum sequencer, a CV sequence
  recorder marked as work in progress, and MS-20 converter sketches. The
  percussion sketch modifies another builder's dual attack-decay design to
  behave like the Befaco Percall.
status: active
