distribution: source-only
install_notes: >-
  Open a sketch in the Arduino IDE and upload it to the MOD1's Arduino Nano. If
  uploads fail, the MOD1 build page suggests switching the processor option to
  the other ATmega328P bootloader setting.
brick_risk: false
