device: benjamin-poilve-minichord
name: fvig2001 minichord fork (MIDI in, pedals, looper)
summary: Personal fork of the minichord firmware that plays incoming MIDI from a MIDI input or USB host connection, reads pedal messages for velocity and pitch bend, and adds a looper with overdub that records and replays played notes.
description: >-
  The fork's commits add playing notes received through MIDI input or a USB host connection, pedal control where a
  control change on channel 1 sets velocity and pitch bend on channels 1 and 2 bends up or down, a looper with
  overdub that records the notes played as timed events and replays them, started by a button press, serial
  communication, and separate audio channels for the looper and the external device. A prebuilt firmware.hex with
  MIDI input and USB host support is committed in the repository. The README is unchanged from upstream and
  documents none of these features, and the fork has had no commits since October 2025.
status: dormant
authors:
