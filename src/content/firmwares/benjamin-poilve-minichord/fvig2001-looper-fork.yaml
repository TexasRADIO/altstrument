    url: https://github.com/fvig2001
source: https://github.com/fvig2001/minichord
source_status: open
license: BSD-3-Clause
license_notes: Inherits the upstream firmware LICENSE; the repository metadata shows no license because the file sits in the firmware folder.
homepage: https://github.com/fvig2001/minichord
distribution: download
install_notes: >-
  Flash the fork's firmware/firmware.hex, or a build of its PlatformIO project, with PJRC's Teensy Loader as
  described for the stock firmware. The repository does not say how a pedal, MIDI input or USB host device is
  wired to the minichord.
