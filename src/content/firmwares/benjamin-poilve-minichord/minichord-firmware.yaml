homepage: https://minichord.com/source/
distribution: download
install_notes: >-
  Install PJRC's Teensy Loader, connect the battery, plug the minichord into the computer with a data-capable micro
  USB cable, plug in headphones so it powers on, and drop firmware.hex onto the loader. Then push a thin pin into the
  hole in the back of the case to press the Teensy's program button. The manual suggests using "reset all banks" in
  minicontrol afterwards, since a new firmware can make stored presets sound wrong. Building from source needs
  PlatformIO with the Teensy platform; no edits to the Teensy core are needed any more.
