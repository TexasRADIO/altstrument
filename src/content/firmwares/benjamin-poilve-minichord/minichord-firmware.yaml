device: benjamin-poilve-minichord
name: minichord firmware (official)
summary: Official open-source minichord firmware for the Teensy 4.0, with the chord and harp synth voices, 12 preset banks, an arpeggiator, two-port USB MIDI, USB audio output and the SysEx parameter interface.
description: >-
  The firmware is a PlatformIO project for the Teensy 4.0 built on the Teensy Audio Library. It runs a four-voice
  chord section of three oscillators and noise per voice and a twelve-string harp section, each with its own
  envelopes, vibrato, filter, waveshaper, delay and reverb, and stores 12 presets in flash. Every sound parameter has
  a SysEx address. A Python generator reads parameters.json and writes both the firmware's SysEx handler and the
  minicontrol web editor, so the two stay in step. Over USB the instrument is a two-port MIDI device with chords on
  one port and the harp on the other, and it also streams its audio to the host. The repository builds the firmware
  in GitHub Actions on every change and commits the result as firmware.hex, and it has merged community pull
  requests that add chord inversions, drop voicings and user-defined scales. The firmware reports itself
  as version 9.
