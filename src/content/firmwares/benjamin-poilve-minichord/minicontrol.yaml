device: benjamin-poilve-minichord
name: minicontrol
kind: tool
summary: Official browser editor that reads and writes every minichord sound parameter over Web MIDI SysEx, manages the 12 preset banks and shares presets as text codes, with a companion minishop page of community presets.
description: >-
  minicontrol shows the parameters of the preset that is playing, grouped into global, harp and chord settings with a
  tooltip for each, and sends changes to the minichord as they are made. Buttons save the live settings to a chosen
  bank, reset one bank or all banks to the factory presets, copy the current preset as a parameter string and load a
  string someone else shared. The minishop page lists community presets sent in by email, to try and save to a
  bank. The editor page is generated from the firmware's parameters.json by the same script that writes the
  firmware's SysEx handler. It is a single offline page that can be saved and opened locally, and it needs a
  browser with Web MIDI SysEx support; the manual recommends desktop Chrome.
status: active
