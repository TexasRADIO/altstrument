device: monome-arc
name: iii (arc)
summary: >-
  monome's iii firmware for the 2025 arc, which has a pushbutton: standalone Lua scripts on the arc itself, USB-MIDI and a serial REPL, with a serialosc mode for use with norns, ansible and computers.
description: >-
  The 2025 arc ships with iii support, so it needs no separate install; this
  entry tracks the arc build that is published beside the grid builds in each
  iii release (iii-arc.uf2). Hold the key while powering up to return the arc
  to serialosc mode. Older arcs cannot run it; viii runs iii scripts in a
  browser against them instead. Example scripts named in the docs include
  cycles, erosion and snows.
