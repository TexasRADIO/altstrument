device: valeton-gp-200
kind: tool
name: webGP-200
summary: >-
  Small hosted React page that controls the GP-200 over Web MIDI, with bank and patch changes, block toggles,
  tempo, CTRL switches, looper and drum controls, and a raw SysEx send box.
description: >-
  A Vite and MUI front end published on GitHub Pages. After finding the pedal's MIDI port it sends
  MIDI control changes for bank and patch stepping, switching each of the effect blocks on and off, tap
  tempo, CTRL 1 to 8, looper and drum functions, and sets patch volume and expression values. It also reads
  the patch name and module state back with SysEx queries, and has a field for sending hand-typed SysEx
  with a message log. The page says it is meant for controlling a GP-200 from a computer or a phone and
  that it is unaffiliated with Valeton. The repository has no README; a Python script in src/ opens
  the pedal's MIDI ports to send and monitor SysEx from a terminal. It does not edit or store presets.
