device: valeton-gp-200
name: GP-200 Firmware Mods
summary: >-
  Browser configurator that builds a modified GP-200 firmware from your own stock V1.8.0 or V1.8.2 image:
  DSP load readout, dual chains, scenes, preset trails, native NAM A2 Lite amps and replacement IRs. The
  repository also holds a precompiled modified image.
description: >-
  Rights warning: the repository's BIN folder holds a ready-made firmware image that is Valeton's V1.8.2
  firmware with the mods applied, so it redistributes Valeton's proprietary firmware in modified form
  and the project states no licence from Valeton for that. The GPL-3.0 licence file covers the author's own code and
  patches, not Valeton's firmware inside that image.

  The main route is the configurator, an offline HTML page. You load your own unmodified BIN, tick the
  mods you want and download a ZIP with the generated firmware, a manifest and, for some mods, replacement
  resources for Valeton's editor. The mods are a DSP load percentage at the top of the screen, a Dual Chain
  mode with two paths, a blend control, sample alignment and a polarity switch for the second path, a Scenes
  mode with four snapshots per preset on top of the saved preset, trails when switching patches, alternative effect algorithms for the wah, preamp, distortion and EQ slots, up to
  five native NAM A2 Lite amp models in the current version, up to 15 Sound Clone replacements for factory
  amps and replacement IRs for the 70 factory cabinets. The Dual Chain screens can be edited only on the
  pedal, because Valeton's editor does not understand them, and the editor shows no names for the NAM amps.
  The author lists a number of effects that must not be used in a patch while a NAM model is loaded, since
  the model takes about half of the DSP budget. The page says it is experimental and unofficial.

  The README credits tntexplosivesltd, author of gp200-patcher, for the reverse engineering it builds on.
  The configurator is a single bundled HTML file, not readable source, and the repository holds no
  separate source for the patches. It targets the GP-200 only; the GP-200LT is not mentioned.
status: active
