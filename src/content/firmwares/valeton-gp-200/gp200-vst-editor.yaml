device: valeton-gp-200
kind: tool
name: GP200 VST Editor
summary: VST3 plug-in, published as C++ source, that edits GP-200 presets over USB MIDI from a DAW, manages User IR and SnapTone slots and offers a tuner and Tone Match.
description: >-
  A JUCE plug-in project. It edits the supported effect blocks, chain order, bypass, parameters, name, volume,
  pan, BPM and bank or slot, saves its state with the DAW project and offers two snapshots to compare. It
  imports WAV impulse responses into User IR slots, sends Valeton .clo SnapTone files to the ten standard
  destinations and renames entries, and includes a chromatic tuner. Tone Match captures a source and a
  target signal and renders the difference as an impulse response. Several extra documents, mostly in
  Spanish, cover support for community firmware builds that add NAM amps or relocate effects; those need a
  matching generated JSON file. The repository ships sources only, without a compiled VST3, and does not
  bundle JUCE. It builds on Preset Forge's research. Not affiliated with Valeton.
status: active
authors:
- name: Goaltoday
  url: https://github.com/Goaltoday
source: https://github.com/Goaltoday/GP200-VST-Editor
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL v3. THIRD_PARTY_NOTICES.md says the open-source build uses JUCE under AGPL-3.0,
  that code adapted from Preset Forge stays under GPL-3.0-or-later and that the JUCE version is still a
  placeholder.
distribution: source-only
install_notes: >-
  Windows build only: Visual Studio 2022, CMake 3.22 or newer and your own JUCE checkout passed as
  JUCE_SOURCE_DIR, then point the DAW's plug-in scanner at the generated .vst3. Importing an IR or a
  SnapTone overwrites the destination slot, so back up presets, IRs and SnapTones first.
brick_risk: false
tags: [vst, editor, usb-midi, midi, presets, ir, nam, sysex]
