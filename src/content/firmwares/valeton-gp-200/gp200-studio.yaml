source_status: open
license: GPL-3.0-only
homepage: https://gp200studio.com/
distribution: browser-installer
install_notes: >-
  Open gp200studio.com in Chrome or Edge, connect the pedal over USB and press Connect. Saved .prst files
  can be edited without a pedal. Bulk apply overwrites the patches it touches, so make the backup zip first.
  To run it locally, clone the repository and use npm run dev.
brick_risk: false
