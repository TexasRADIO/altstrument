kind: tool
name: GP200 Studio
summary: Browser editor, patch manager and multi-track loop station for the GP-200 that talks to the pedal over Web MIDI, with no account or server.
description: >-
  A client-side TypeScript app hosted at gp200studio.com. It draws a patch as a pedalboard, with each of the
  305 effects labelled after the real amp or pedal it models, and sends knob changes, swaps, bypasses and
  chain reordering to the pedal as they happen. It lists all 256 patches for searching and renaming, backs
  the whole pedal up to one zip, and imports and exports .prst files. It assigns the CTRL footswitches and
  expression pedals, and the 1.1.0 release added a bulk apply that copies one patch's footswitch layout or
  volume into many patches. Separate from the pedal's single loop, it records any number of timed loop
  tracks and has a built-in drum machine and a remote panel for tuner, tempo and bank changes. Patches stay
  in the browser tab. The hosted site uses Google Analytics with a documented list of events. It needs
  Chrome or Edge, since Firefox and Safari lack the required MIDI support. The .prst and SysEx work builds
  on Preset Forge. Not affiliated with Valeton.
status: active
