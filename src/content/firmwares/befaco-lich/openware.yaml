name: OpenWare
summary: Rebel Technology's OWL firmware that Lich and Witch run. Loads patches written in Pure Data, Max gen~ or Faust from the Rebel Technology patch library over MIDI.
description: >-
  Source covers several Rebel Technology devices (including Wizard, Alchemist
  and Magus) and builds with STM32CubeMX plus arm-none-eabi-gcc. Last
  release on master is v22.5.0; the Owlsy port brings OpenWare to Daisy
  hardware.
