    url: https://github.com/patausx
source: https://github.com/patausx/descry
source_status: open
license: GPL-3.0-only
license_notes: LICENSE is the GPL version 3 text and the README says "GPL-3.0".
distribution: download
install_notes: >-
  Download descry.3dsx from the GitHub release, put it in /3ds/descry/ on the SD card and start it from the Homebrew
  Launcher, or install descry.cia with FBI for a Home Menu entry. Needs a New 3DS or New 2DS XL with custom firmware.
brick_risk: false
