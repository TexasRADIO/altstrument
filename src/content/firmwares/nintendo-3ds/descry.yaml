device: nintendo-3ds
name: descry
summary: Tracker and synthesizer for the New Nintendo 3DS with a song, chain and phrase sequencer, five synth engines, a Kaoss-style XY pad and microphone sampling.
description: >-
  descry is a music tracker that runs natively on New Nintendo 3DS and New 2DS XL consoles, since its synth engines
  use the faster CPU and extra core; the original 3DS is not supported. It has eight tracks arranged as song, chain
  and phrase, 23 effect commands, five synth engines running fixed-point at 32 kHz, a touch-screen XY pad, a mixer
  with touch faders, microphone sampling with slicing, and an in-app manual. Version 1.0.7 added stem export of the
  mix and each track as WAV files for use in a DAW.

  The project began on 2026-07-06 and has had eight releases since. It installs from a .3dsx file through the Homebrew
  Launcher or from a .cia.
status: active
authors:
