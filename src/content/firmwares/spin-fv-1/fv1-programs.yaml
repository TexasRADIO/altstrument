device: spin-fv-1
name: fv1-programs
kind: tool
summary: Community directory of FV-1 programs for DIY guitar pedals, published as a searchable website built from a programs list in the repository. Listed as a tool because it catalogues programs rather than shipping firmware.
description: >-
  A Nuxt-based site at mstratman.github.io/fv1-programs aggregating programs
  from Spin and from forum threads. Contributions come by pull request to the
  programs.js file or by email to the maintainer. The programs listed carry
  their own authors and terms; the repository itself has no license file.
