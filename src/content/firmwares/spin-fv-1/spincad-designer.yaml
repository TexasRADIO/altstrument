device: spin-fv-1
name: SpinCAD Designer
kind: tool
summary: Open-source Java visual patch builder with an audio simulator for the Spin FV-1 DSP chip. Requires Java 8 or later; runs on Windows, macOS and Linux.
description: >-
  Blocks are wired together on a canvas and compiled to FV-1 assembly. New
  blocks can be added through the SpinCAD Builder language, which is described
  as an advanced topic. The author maintains written and video tutorials on a
  GitBook site and block documentation in the repository. Frequent numbered
  releases are published as jar files.
status: active
authors:
