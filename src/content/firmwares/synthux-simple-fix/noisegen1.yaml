device: synthux-simple-fix
name: NoiseGen1
summary: "Generative noise synthesizer and audio destruction processor for the Simple Fix: 11 DSP noise patches stepped with the toggle switch, three knobs for density, register and input mangling."
description: >-
  NoiseGen1 combines eleven noise engines in one Arduino sketch for the Daisy
  Seed on the Simple Fix: a cascaded-FM core, sub drone, crackle bursts, a noise
  wall fired in bursts, radio static, an industrial grinder, metal scrape, an
  input-only mangler, harsh noise wall, FM boiling and cut-up collage. The
  switch advances to the next patch and the on-board LED blinks the patch
  number. The knobs set event density, base frequency range and the amount of
  destruction applied to the audio input. Synthux's July 2026 community
  highlights newsletter features it.
status: active
