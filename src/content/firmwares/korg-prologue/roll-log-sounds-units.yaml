homepage: https://rolllogsounds.com/
source_status: binary-only
license: proprietary
license_notes: No source or license text is published; the packs are distributed as downloads.
distribution: download
install_notes: >-
  Packs are pay-what-you-want downloads on Gumroad (Fume and Syng are priced
  separately). Load the unit files with Korg's Librarian app; the site has a
  manual covering the oscillators' parameters and modulation modes.
