device: korg-prologue
name: Staub (Staub Audio)
summary: Paid user oscillator for the logue family modelled on the rave hoover sound, using a modulated saw plus two further saws an octave apart and a sub oscillator. Sold by Staub Audio for $4.99.
description: >-
  The product page describes Staub as an oscillator initially for the minilogue
  xd; Korg's unit index lists it for prologue, minilogue xd and NTS-1. It
  combines a modulated sawtooth with two additional modulated saws one octave
  below and above and a sub oscillator, and can be layered with VCO 1 and VCO 2.
  Version 1.1 added four demo patches without changing the oscillator. The
  price is listed as $4.99 (plus VAT through PayPal via Gumroad), and the
  page carries a 2019 copyright notice.
