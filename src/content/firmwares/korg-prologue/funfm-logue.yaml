device: korg-prologue
name: FunFM
summary: Two-operator FM oscillator for the prologue, minilogue xd and NTS-1 with alias-suppressed operators, variable waveshape from pulse through sine to saw, bipolar modulation depth and filtered feedback.
description: >-
  Each of the two operators has a bandwidth control that moves its waveform
  from pulse to sine to sawtooth in a way the author compares to low-pass
  filtering rather than a crossfade. Operator 1 is phase modulated by operator 2,
  which has feedback with a first-order low-pass filter, and a mix control
  crossfades the operators. Negative modulation depth uses the absolute input,
  which can add odd harmonics. The shape LFO is routed to the modulation depth.
  The README warns that the NTS-1 starts parameters at minus 100, giving harsh
  noise until depths and pitches are centered.
status: maintained
