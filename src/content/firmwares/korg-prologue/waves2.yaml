device: korg-prologue
name: Waves2
summary: Wavetable oscillator that shifts the harmonic distribution of the SDK's 90 built-in waveforms with the Shape knob, for the prologue, minilogue xd, NTS-1 and NTS-1 mkII.
description: >-
  Waves2 uses the same predefined waveforms as Korg's factory Waves oscillator
  but plays a single waveform several times per cycle, shortening its length with
  the Shape parameter so the harmonics move up without a filter. Shift-Shape
  lowers the amplitude of the repeats to soften the result. Menu parameters
  choose the waveform and set an internal shape envelope and its attack, decay
  and intensity, the LFO attenuation and the envelope-to-amplitude amount. The
  author has other units on his blog and Gumroad page.
status: maintained
