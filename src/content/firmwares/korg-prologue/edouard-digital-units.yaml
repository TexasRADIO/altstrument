device: korg-prologue
name: Edouard Digital units (Blinds, JP-Booo)
summary: Two paid user oscillators by Edouard Digital for prologue, minilogue xd and NTS-1. Blinds is an eight-mode wave shaping oscillator with PWM for any waveform; JP-Booo is a Roland JP-8000 style super saw.
description: >-
  Blinds offers eight wave shaping modes (Blinds, Warp/Smudge, Rectify, Fold,
  Invert, Mirror, Mix and Phase, and soft clip) with eight parameters, and a
  free demo version is available. JP-Booo emulates the seven-saw oscillator
  of the Roland JP-8000 with Detune and Mix controls. The store lists Blinds
  at 49 euro, JP-Booo at 29 euro and a two-unit bundle at 69 euro. The pages
  carry a 2018 to 2022 copyright notice.
status: dormant
authors:
