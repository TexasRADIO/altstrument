homepage: https://edouard.digital/blinds/
source_status: binary-only
license: proprietary
license_notes: Sold as paid downloads; no source or license text is published.
distribution: commercial
requires_stock: >-
  prologue and minilogue xd 2.00 or later (including the voice update); NTS-1
  1.02 or later
install_notes: >-
  The Blinds page says the prologue and minilogue xd need firmware 2.00 with
  the voice update applied, otherwise the oscillator loads but its parameters
  do nothing; the NTS-1 needs 1.02. Send the unit with Korg's Sound Librarian.
