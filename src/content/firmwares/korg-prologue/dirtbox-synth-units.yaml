device: korg-prologue
name: DirtBoxSynth logue units
summary: Paid custom oscillators and effects from DirtBoxSynth for prologue, minilogue xd and NTS-1, sold singly or in bundles. The Origami wavefolder oscillator is free for owners who sign up to the newsletter.
description: >-
  Korg's unit index lists 15 DirtBoxSynth units. Oscillators include FMonsta,
  Morph (wavetables), ORGANism (drawbar organ), Origami (wavefolding), Physiq
  (digital waveguide), polyChord (NTS-1 only), PWG and SUPAwave. Effects
  include AMPit (distortion), Basic Autopanner, FILTAstep (tempo-synced
  filter sequence), Filter Pack, Pan and Tremolo Pack, Resonance and the
  Exotic Delay Pack. The store prices them in pounds from 0.99 for the
  autopanner to 19.99 for Physiq, with bundles including a Complete
  Oscillator Collection (29.99) and an Everything Bundle 2.0 (49.99). The
  store page says Origami is free to prologue, minilogue xd and NTS-1 owners
  who sign up to the newsletter. The site's last news post is from May 2020.
status: dormant
