device: korg-prologue
name: Junologue Chorus
summary: Juno-60 chorus emulation as a modulation effect for the prologue, minilogue xd and NTS-1, with Speed for the I, I-II and II modes and Depth for dry/wet.
description: >-
  The Speed knob switches between the three chorus modes, and within each mode
  turning it clockwise brightens the timbre. The author's I-II mode runs both
  choruses in parallel, which differs from the "both buttons in" mode of the
  original, which is a mono vibrato. Depth sets the dry and wet ratio. Release
  1.2-1 disables sub-voice processing on the minilogue xd and NTS-1 to reduce
  high CPU load. Audio examples are on the author's SoundCloud, linked from the
  README.
