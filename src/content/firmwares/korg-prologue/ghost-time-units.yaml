device: korg-prologue
name: Ghost Time custom oscillators
summary: "Seven pay-what-you-want units by Ghost Time Games for the logue family: five oscillators (Clang, Lapse, Sneq, Step, Warped), the Waver mod effect and the Slinky modulated delay."
description: >-
  The itch.io project describes a collection of custom oscillators for the
  Korg prologue, minilogue xd and NTS-1, and Korg's index lists all seven units
  for those three devices. Clang is a detuned three-sine bell oscillator, Sneq
  is a polyrhythmic pattern generator, Warped is a lo-fi oscillator inspired by
  Boards of Canada, Step is a per-key arpeggiator, Lapse is a stacked-LFO drone
  generator, Waver is a warbly mod effect and Slinky is a modulated multi-tap
  delay. The download is a set of .prlgunit files with a name-your-own-price
  checkout. The devlog entries run from November 2020 to October 2021.
