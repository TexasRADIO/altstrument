device: korg-prologue
name: Sinevibes KORG units
summary: Sinevibes' commercial unit line for the logue family. 8 oscillators for prologue, minilogue xd and NTS-1, 21 effects for those plus NTS-1 mkII, NTS-3 and microKORG2, and two NTS-3 only effects.
description: >-
  The Sinevibes KORG page lists 31 units. Eight are user oscillators (Bent,
  Dense, Flare, Groove, Node, Odds, Tube, Turbo) built for the first
  generation devices only: prologue, minilogue xd and NTS-1 (SDK 1). The
  effects include modulation, delay and reverb units (Albedo, Blend,
  Corrosion, Dipole, Droplet, Eternal, Hollow, Luminance, Shift, Whirl and
  others); 21 of them are offered for prologue, minilogue xd, NTS-1, NTS-1
  mkII, NTS-3 and microKORG2 (SDK 1 and SDK 2 builds). Cache and Quarta are
  multi-effects made for the NTS-3 kaoss pad only. Atom (a multi-mode
  filter) and Drift (a wind turbulence simulator) are free downloads; the
  other units are paid, listed at $19 for most effects, $29 to $39 for
  oscillators and $29 each for Cache and Quarta, with bundles of all
  oscillators ($99) and all effects ($199).
