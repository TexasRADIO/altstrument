install_notes: >-
  Buy or download from the product pages and load the unit file with Korg's
  Librarian app (prologue, minilogue xd, NTS-1, microKORG2) or KORG KONTROL
  Editor (NTS-1 mkII, NTS-3). Registered users can request updated download
  links on the Sinevibes updates page.
