device: korg-prologue
name: freeverb-logue
summary: Port of the public domain Freeverb reverb as a reverb unit for the prologue, minilogue xd, NTS-1, NTS-1 mkII, NTS-3 and drumlogue.
description: >-
  A logue SDK port of the Freeverb reverberator by Jezar at Dreampoint, with
  builds for both generations of units. The README notes that the algorithm
  needs a lot of CPU: on the NTS-1 and minilogue xd the delay effect must be off,
  and on the prologue the modulation effect must be off. The original readme is
  kept in the repository, and boochow's blog also lists a build for the
  microKORG2.
status: maintained
authors:
  - name: boochow
    url: https://github.com/boochow
source: https://github.com/boochow/freeverb-logue
source_status: open
license: MIT
license_notes: Freeverb itself is public domain; the repository's LICENSE covers this port.
homepage: https://github.com/boochow/freeverb-logue/releases
distribution: download
install_notes: Download the unit for your instrument from the releases page. Prologue, minilogue xd and NTS-1 units load with Korg's librarian; the others as described for each device.
tags: [revfx, genericfx, reverb, open-source, prologue, minilogue-xd, nts-1, nts-1-mkii, nts-3, drumlogue]
