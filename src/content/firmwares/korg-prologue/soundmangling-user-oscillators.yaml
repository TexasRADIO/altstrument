device: korg-prologue
name: Sound Mangling user oscillators
summary: Twelve paid user oscillators by Tim Shoebridge for prologue, minilogue xd and NTS-1, covering drum sounds, chords, drones, wavefolding, strings, Karplus-Strong plucks, vector synthesis and waveform morphing.
description: >-
  The Korg User Oscillators page of Sound Mangling lists twelve oscillators:
  Beats, Chord, Digital Waveform, Drone, Fold, Octave, One, Pluck v2, String,
  Three, Two and Vector Synthesis. Beats holds 28 beat-making sounds and comes
  with ten bonus minilogue xd presets. Each is a digital download sold through
  Sellfy (Beats from $22) and the page states that none of them work on the
  drumlogue or NTS-1 mkII. The pages date from 2020.
status: dormant
authors:
