    url: https://www.soundmangling.com/
homepage: https://www.soundmangling.com/useroscillators/
source_status: binary-only
license: proprietary
license_notes: >-
  Paid digital downloads. The site footer reads "Copyright Tim Shoebridge 2020.
  All rights reserved."
distribution: commercial
install_notes: >-
  Install the Korg MIDI USB driver and the Korg Sound Librarian for your
  synthesizer, then send the downloaded unit to a user slot; each product
  comes with installation instructions.
