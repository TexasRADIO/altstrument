device: korg-prologue
name: boochow instruments units
summary: "Mixed free and paid logue units from the boochow instruments blog: Alpha One, Pulsaw and Hoovic (paid) plus pay-what-you-want Lily, Pitchy, Vocoder, Delay Lab, minitone and Pure Data packs for several logue devices."
description: >-
  The blog groups its units by device. For prologue, minilogue xd and NTS-1
  there are Alpha One (an Alpha Juno DCO emulation with a separate chorus
  modfx), Pulsaw (Juno DCO emulation, $8), Hoovic (hoover oscillator, $2), a
  Lily port of Mutable Instruments Braids and a pack of Pure Data
  oscillators. For NTS-1 mkII there are Lily, Pitchy (pitch shifting audio
  input), Vocoder, Hoovic and 20 Pure Data units; for NTS-3 a Vocoder generic
  effect; for drumlogue Lillian, minitone, Delay Lab and Pure Data units.
  Freeverb for several devices is listed on the same blog. Lily, Pitchy,
  Vocoder, Delay Lab, minitone, Lillian and the Pure Data packs are listed at
  a $0 pay-what-you-want price. The blog page was last updated in November
  2025.
status: active
authors:
  - name: boochow
    url: https://blog.boochow.com/
homepage: https://blog.boochow.com/logue
source_status: binary-only
license: proprietary
license_notes: >-
  The units on the blog are distributed as binaries (paid or pay-what-you-want
  through Payhip) with no stated license. Some related code is MIT-licensed
  in the boochow GitHub account, for example the pitchy repository and the
  hvcc converters for the logue SDK, NTS-1 mkII, NTS-3 and drumlogue; those
  are not part of this entry.
distribution: commercial
install_notes: >-
  Each product page links a checkout and, for some units, a quick start guide.
  Use Korg's Librarian app (prologue, minilogue xd, NTS-1), KORG KONTROL
  Editor (NTS-1 mkII, NTS-3) or copy the .drmlgunit files to the drumlogue's
  Units folders. The pages state which devices each unit does and does not
  run on.
