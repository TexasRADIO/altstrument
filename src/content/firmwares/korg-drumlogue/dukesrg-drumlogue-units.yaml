device: korg-drumlogue
name: dukesrg drumlogue units (FM64, Tesseract, loguePADS, Gator 2, Vault, LogueTSF)
summary: "Free drumlogue units from Oleg Burdaev (dukesrg), distributed from a fork of the Korg logue SDK: FM64 FM synth, Tesseract, loguePADS, Hyperloops, Gator 2, Vault and a SoundFont loader."
description: >-
  The dukesrg/logue-sdk repository is a fork of Korg's logue SDK that carries
  several custom units by Oleg Burdaev (dukesrg), with the drumlogue sources
  on the drumlogue, mk2 and tsf branches. Synth units are FM64 (a 6-operator
  FM synth that loads DX7, DX21 and DX11-series voice banks, SY77 and opsix
  waves and logue wavetables as WAV files, with a converter on the project
  page), Tesseract (a 4-dimensional vector synth with customizable
  waveforms), loguePADS (a set of sample-based synths) and LogueTSF (an
  alpha-stage SF2 SoundFont loader for drumlogue and microKORG2, based on
  TinySoundFont, that reads .SF2 files from the Programs folder). Effects are
  Hyperloops (alpha delay, reverb and master variants) and Gator 2, a
  Kaossilator-style gate arpeggiator for delay, reverb and master FX slots
  that also runs on the NTS-1 mkII, NTS-3 and microKORG2. Vault is a program
  librarian unit for drumlogue and microKORG2. The FM64 unit file and manual
  are served from the project page; the others are zip files on the GitHub
  releases page.
status: active
authors:
  - name: Oleg Burdaev (dukesrg)
    url: https://github.com/dukesrg
source: https://github.com/dukesrg/logue-sdk
source_status: open
license: BSD-3-Clause
license_notes: >-
  The repository's license file is Korg's BSD 3-Clause logue SDK license,
  inherited from the fork. No separate license is stated for the added units.
homepage: https://dukesrg.github.io/logue-sdk
distribution: download
install_notes: >-
  Download the unit from the project page (FM64) or from a release zip, put
  the drumlogue into USB mass-storage mode and copy the .drmlgunit file into
  the matching Units folder (Synths, DelayFXs, ReverbFXs or MasterFXs), then
  restart. Release notes for LogueTSF say to copy .SF2 files to the
  Programs folder.
tags: [synth, delfx, revfx, masterfx, fm, sampler, soundfont, arpeggiator, drumlogue, nts-1-mkii, nts-3, microkorg2, open-source]
