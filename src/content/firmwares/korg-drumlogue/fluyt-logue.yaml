device: korg-drumlogue
name: Fluyt
summary: Nine engines from Felucca, the open M-VAVE FM-1 firmware, ported to the drumlogue as separate synth units with Felucca's own presets, from two-oscillator analog to six-operator FM. Also built for the microKORG2.
description: >-
  The units are ANALOG (two-oscillator virtual analog with a resonant filter, 12
  presets), TRIO (three-oscillator paraphonic), PHASE (phase distortion), LOFI
  (aliased low-bit pulse), WHEEL (tonewheel organ with rotor), NOISE (filtered
  noise with sample-rate crush), FORMANT (vocal synthesis), DRUM (a General MIDI
  numbered kit) and FM6 (a six-operator msfa port). Each plays from the panel,
  a keyboard or the drumlogue's sequencer, with up to 20 parameters over five
  pages generated from Felucca's own parameter tables. Felucca is included
  unmodified as a submodule at v1.0.2, with its lookup tables regenerated for
  48 kHz; three constants written into Felucca's source stay at 44.1 kHz, so
  NOISE, FORMANT and FM6 envelopes run about 8.8% off. Felucca's sample-based
  engines and PHYS are not ported. The same nine also build as microKORG2
  oscillator units (see the separate microKORG2 entry).
status: active
authors:
