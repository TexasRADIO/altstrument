source: https://github.com/rgrvmusic/fluyt-logue
source_status: open
license: GPL-3.0-only
license_notes: >-
  Build scripts are MIT; each unit's Makefile is the logue SDK's (BSD-3-Clause,
  KORG); the FM6 core is an msfa/Dexed port (Apache-2.0). See docs/LICENSING.md.
homepage: https://rgrvdotnl.itch.io/fluyt-logue
distribution: download
requires_stock: "1.00 or later (logue SDK 2.0 units)"
install_notes: >-
  Download the prebuilt units from the itch.io page (name your own price, free
  allowed) or build them with build.sh in the logue SDK container. Start the
  drumlogue in USB mass storage mode and copy the .drmlgunit files into
  Units/Synths, then pick the unit in the Multi-Engine part.
