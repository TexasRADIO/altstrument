distribution: download
install_notes: >-
  Download from the Gumroad page (pay what you want, minimum 0), put the
  drumlogue into USB mass-storage mode, copy the .drmlgunit file into
  Units/Synths and restart. FLINT 2 is on a separate page at
  https://derselenit.gumroad.com/l/etwemi.
