device: korg-drumlogue
name: derselenit VINCE and FLINT 2
summary: "Two pay-what-you-want drumlogue synth units on Gumroad: VINCE, inspired by the Kawai 100F, and FLINT 2, inspired by the Moog Prodigy."
description: >-
  derselenit sells two native drumlogue user synths through Gumroad at a price
  of 0 with a suggested donation. VINCE (listed as 2.0.5, with manual and
  presets) is inspired by the Kawai 100F and offers saw-to-pulse waveform
  morphing, a sub-harmonic bass generator, drive, bipolar key/FM modulation,
  BPM-synced portamento and factory presets. FLINT 2 (listed as 2.0) is
  inspired by the Moog Prodigy and has two morphing oscillators with PWM,
  sync, detune and glide, a ladder-style filter, separate VCA and VCF
  envelopes and a tempo-synced LFO. Source code is not published.
status: unknown
