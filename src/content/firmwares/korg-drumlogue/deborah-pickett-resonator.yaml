device: korg-drumlogue
name: Resonator
summary: Karplus-Strong resonator synth for the drumlogue that excites a string model with drumlogue samples, with up to eight-note polyphony and 18 motion-sequenceable parameters.
description: >-
  Resonator is a drumlogue synth unit by Deborah Pickett that extends the
  Karplus-Strong plucked-string model to produce plucked strings, struck metal
  bars and tuned metal drums. The excitation can be any drumlogue sample
  (the CH, OH, RS, CP and misc banks plus the user and external banks), with
  start and end points, a level control and a selectable filter. Decay and
  release phases have separate feedback and damping settings, and there are
  dispersion and key-tracking controls. The blog post lists 18 parameters that
  can all be motion-sequenced, polyphony up to eight notes, and pitch bend
  over MIDI. The blog describes version 1.1, and a reader comment there reports
  a freeze that the author said they would look into.
