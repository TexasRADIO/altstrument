license: BSD-3-Clause
license_notes: >-
  Released under the 3-clause BSD license; the blog post asks that the author
  be credited in derived works. The GitHub repository that holds it, a fork
  of the logue SDK, is archived.
homepage: https://www.icemoonprison.com/blog/?p=780
distribution: download
install_notes: >-
  Download and unzip the release, put the drumlogue into USB mass-storage mode
  by holding Rec while powering on, copy resonator.drmlgunit into Units/Synths
  and eject. Select the unit with Part and User, then turn the left parameter
  knob.
