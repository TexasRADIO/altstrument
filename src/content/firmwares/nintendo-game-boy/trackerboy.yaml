device: nintendo-game-boy
name: Trackerboy
kind: tool
summary: Desktop tracker for composing Game Boy and Game Boy Color music, still pre-1.0, with MIDI input, example modules and its own manual.
description: >-
  Trackerboy is a tracker for the Game Boy and Game Boy Color sound hardware, with builds for Windows, macOS
  and Linux. It has per-channel pattern editing, waveform and instrument editors, a live waveform view, MIDI keyboard
  input and drag-and-drop module loading. The author describes it as work in progress at major version 0. A companion
  repository, tbengine, holds the driver for playing its songs on a Game Boy.

  It runs on a computer, not on the Game Boy, and is listed here as a tool for the console.
status: maintained
