device: nintendo-game-boy
name: GAYBOY
summary: >-
  Game Boy ROM that combines a synth, piano-roll sequencer, ten-row sample drum machine and performance mixer, with
  MIDI input through Arduinoboy and a SameBoy-based player on the project's site.
description: >-
  GAYBOY is a 1 MiB MBC5 cartridge image with battery-backed save RAM that targets the original Game Boy and the
  Game Boy Color. Seven logical tracks share the four hardware sound channels, and the sample drums share the wave
  channel. It has a piano roll with note length and velocity, pattern pads, a mixer with pan and mute/solo, and
  drum kits with ten PCM rows and two noise voices. An Arduinoboy in mGB mode can play it from external MIDI gear.
  The author's page runs the ROM in a browser emulator with a tutorial. The README says it is a work in progress
  and that testing on physical hardware and audio is still going on, and the repository's notes list live
  pattern-launch timing that does not yet meet the author's target. The build needs GBDK 4.5.0 and audio inputs
  that are not in the repository. The GitHub owner is EvatechLTD and the README credits dpjpandone.
status: active
