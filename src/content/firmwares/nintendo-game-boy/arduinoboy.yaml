device: nintendo-game-boy
name: Arduinoboy
kind: tool
summary: Firmware for an Arduino-type board that connects a Game Boy link port to MIDI, for syncing LSDj and nanoloop and for playing mGB.
description: >-
  Arduinoboy is a sketch by trash80 that runs on an Arduino-compatible board wired to the Game Boy link port with a
  MIDI interface. It has seven modes: LSDj as MIDI slave or master sync, an LSDj keyboard mode, MIDI to nanoloop sync, full MIDI
  with mGB, which turns the Game Boy into a MIDI sound module, and the LSDj MIDIMAP and MIDIOUT modes. A push button selects the mode, and settings
  are stored in EEPROM and edited with a Max-based program. The board can be powered from the Game Boy.

  The firmware runs on the Arduino, not on the Game Boy, so it is listed as a tool. Later versions added support for
  Teensy, Leonardo, Due and Mega 2560 boards. Several community derivatives exist for Teensy, Pico and small
  custom boards; they are not listed here. The LSDj site hosts a ROM variant built to work with it.
status: dormant
authors:
  - name: trash80
    url: https://github.com/trash80
source: https://github.com/trash80/Arduinoboy
source_status: open
license: GPL-2.0-only
license_notes: LICENSE is the GPL version 2 text with no "or later" wording.
distribution: source-only
install_notes: >-
  Build and upload the Arduinoboy sketch from the Arduino IDE or PlatformIO, then wire the board to the Game Boy
  link cable and a MIDI interface following the schematic in the repository.
brick_risk: false
tags: [midi, sync, interface, arduino]
