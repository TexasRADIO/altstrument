    url: https://kennhartwig.de/instruments.html
source: https://github.com/kennhartwig/dmgarp
source_status: open
license: MIT
homepage: https://kennhartwig.de/instruments.html
distribution: download
requires_stock: Flash cartridge, or an emulator
install_notes: >-
  Download dmg-arp.gb from the latest release and open it in an emulator or
  write it to a flash cartridge. The repository documents flashing an EMS USB
  64M Smart Card with a patched ems-flasher on Linux. Some EMS 64M units fail to
  enable battery RAM under the 32 KB header, so the repository includes an SRAM
  test ROM to run first. Build with make setup and make build.
brick_risk: false
