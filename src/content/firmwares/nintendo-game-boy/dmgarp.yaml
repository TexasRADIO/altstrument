device: nintendo-game-boy
name: DMGARP
summary: Modal arpeggiator ROM for the original Game Boy with 28 scale banks, four-channel synthesis, a Euclidean kick, 8 battery save slots and a 4x4 preset matrix, written in RGBDS assembly.
description: >-
  A 32 KB ROM that plays an arpeggio from a chosen scale and root note, with
  ascending, descending, ping-pong and random patterns, tap tempo with swing and
  five gate modes. The 28 scale banks cover church modes, harmonic-minor modes,
  Messiaen modes and Ethiopian pentatonic scales. Channel 2 plays the arpeggio,
  channel 1 adds a companion voice such as an octave, a detuned unison or a
  fixed interval, channel 3 plays wavetable shapes, and channel 4 supplies
  accent, fill and tonal drum parts. A Euclidean kick runs on channel 1. Ten
  pages of parameters take effect immediately, WILD and MILD randomise them,
  and the cartridge's battery RAM holds eight save slots, each with its own
  matrix of 16 presets. The author reports it running on DMG hardware from an
  EMS 64M flash cartridge.
status: active
authors:
