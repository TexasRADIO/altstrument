device: elektron-analog-rytm
name: libanalogrytm
kind: tool
summary: Portable C library for decoding, editing and encoding the SysEx messages of the Analog Rytm (kits, sounds, patterns, settings, global data and whole-project dumps). No MIDI I/O or user interface; meant to be built into other software.
description: >-
  File formats were worked out by comparing many SysEx dumps sent by the unit;
  the project says it is not an official Elektron development. The library
  can turn a whole-project .syx into raw data and back. The kit, pattern,
  settings and global formats are mostly documented in the headers. The
  repository has a CI build and a Visual Studio test project.
