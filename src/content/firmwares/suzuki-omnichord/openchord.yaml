device: suzuki-omnichord
name: OpenChord
summary: Work-in-progress MicroPython firmware and hardware for a Waveshare RP2350-Zero that replaces the OM-27's dead chord logic and top-octave generator chips, adding chord types and optional MIDI out. Not yet tested on a real instrument.
description: >-
  OpenChord is aimed at OM-27s whose AY-5-1317A chord logic IC has failed. An RP2350-Zero sits in that chip's
  socket, scans the 27-button chord matrix and generates the top-octave frequencies in PIO, so the M083A
  top-octave generator, its 4069 clock and the 4001 bass routing gate are no longer needed. CD4520 adapter boards
  are planned to replace the two M747 octave dividers. The AY-5-1315 rhythm chip and the audio circuitry stay in
  place. Besides major, minor and seventh chords, the firmware adds minor 7th, major 7th, diminished, augmented,
  sus2, sus4 and slash chords from button combinations, Barry Harris voicings behind a solder jumper, and an
  optional DIN MIDI output. The code is split into instrument-independent core modules and per-instrument
  configuration. The OM-27 is the only instrument in the repository; the README also mentions a stub for the
  Hammond X-5's top-octave generator, which has not been committed. The README says nothing has been tested on hardware yet and that the GPIO map, component values and
  wiring are unverified.
