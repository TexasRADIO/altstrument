homepage: https://keyandcable.com/blog/Replacing_the_Brain_of_a_Suzuki_Omnichord_OM-27.html
distribution: source-only
requires_stock: OM-27 with a socketed AY-5-1317A
install_notes: >-
  Flash MicroPython to a Waveshare RP2350-Zero and copy main.py, config.py and the core modules to its root, then
  fit it in the AY-5-1317A socket on a daughterboard. The instrument runs on +12 V and +5 V logic, and the README
  warns that the AY-5-1315 bass-select outputs swing to +12 V and need voltage dividers, and that docs/
  center-negative.md must be read before wiring the outputs. Since nothing has been tested on a real OM-27, treat
  it as a bench project.
brick_risk: false
