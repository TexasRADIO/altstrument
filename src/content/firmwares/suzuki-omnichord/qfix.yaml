    url: https://github.com/dctsystems
source: https://github.com/dctsystems/QFix
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file and the README states no license.
homepage: https://github.com/dctsystems/QFix
distribution: source-only
requires_stock: Qchord QC-1
install_notes: >-
  Upload QFix.ino to an Arduino Uno with a MIDI shield, or QFix2.ino to a Leonardo, using the Arduino IDE, and
  connect the box between the Qchord's MIDI out and the next MIDI device or the computer.
