device: suzuki-omnichord
name: QFix
kind: tool
summary: Arduino sketches for a small box that sits on the Suzuki Qchord's MIDI output and turns its unusual MIDI stream into standard MIDI for a DAW, over DIN MIDI on an Uno or USB MIDI on a Leonardo.
description: >-
  The author built QFix for a friend who played the Qchord professionally and found its MIDI output hard to use
  in a DAW. QFix.ino runs on an Arduino Uno with the standard MIDI shield and was the version used in practice.
  QFix2.ino is a rework for the Leonardo that also acts as a USB MIDI interface; the README says its new features
  were tested but it may have new bugs, and that the author has no Qchord to develop it further. It does not
  change the instrument itself.
status: dormant
authors:
