device: synthstrom-deluge
name: deluge-card
kind: tool
summary: Python library for reading a Deluge SD card. Lists songs, samples and sample usage per song, reads tempo, key and scale from song XML, and moves samples while rewriting the song references. The deluge-cmd tools are built on it.
description: >-
  Written against firmware 3.15 song files. The 4.0 nested folder layout was
  planned but not added, and community firmware is not mentioned.
