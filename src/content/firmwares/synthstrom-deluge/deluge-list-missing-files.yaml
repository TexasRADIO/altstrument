device: synthstrom-deluge
name: deluge-list-missing-files
kind: tool
summary: Node.js command-line tool that scans every KIT, SYNTH and SONG XML on a Deluge SD card and lists the samples they reference that are missing from the card. Read-only.
description: >-
  The 2020 release has packaged executables for macOS, Linux and Windows; the
  README says only the macOS build was tested. Since then the maintainer has
  merged dependency updates (latest 2026-04-21) but made no functional changes.
