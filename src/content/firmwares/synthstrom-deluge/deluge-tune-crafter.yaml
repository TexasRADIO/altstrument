device: synthstrom-deluge
name: Deluge Tune Crafter
kind: tool
summary: Python script that turns audio into MIDI with Spotify's basic-pitch and MIDI into a Deluge SONG XML, using a bundled template song. Each track gets an instrument picked at random from a list of presets.
description: >-
  The template is in the community firmware 1.1.1 format. The output is a song
  skeleton rather than a faithful conversion. It is Windows-oriented and
  expects ffmpeg executables, which are committed to the repository.
