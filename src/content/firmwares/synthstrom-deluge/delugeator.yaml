device: synthstrom-deluge
name: Delugeator
kind: tool
summary: Free Windows editor for Deluge kits and synths, with a sample browser, a test drum machine, per-pad settings, and random synth and kit generation. The random synth generator is also offered as a hosted web app.
description: >-
  Version 2.0 (March 2023) is a WPF app for Windows 10 and 11, distributed as
  an installer through a Google Drive link in the author's forum thread. It
  has supported official firmware 4.0 since version 1.5 and saves kits in the
  4.0 format; community firmware support is not stated. The web randomiser at
  randomdelugesynth.azurewebsites.net generates subtractive, FM and ringmod
  SYNTH XML from per-section sliders and was still online when this entry was
  written. No source code is published for either.
