device: synthstrom-deluge
name: BRIBELUGE
summary: Fork of the community firmware 1.3 beta that adds alternative swing styles, kit pattern mode, autofill, a mono sequencer, Endless Record and drum synth engines (LXR-02, Model:Cycles-style, GIN and a 303 voice), plus delay feedback and tone, saturation and sample start offset.
description: >-
  Built on the Deluge Community Firmware's beta branch at a stated base commit,
  with the changes shipped as one patch in the repository and a prebuilt .bin.
  Besides the sequencing additions, it adds drum synth engines selectable per
  kit row, taken from the LXR-02 firmware, an open-source Model:Cycles engine
  set, GIN and Open303, with preset kits for the LXR and Cycles voices. The
  sample start offset is ported from the Owlet fork. Songs saved with the new
  features may not load the same elsewhere. The README calls the build
  experimental and says it was tested on a 7-segment Deluge, with the OLED
  screens written but not tried on hardware. The repository was a few days old
  when this entry was written; by v1.16.2 the README also lists an Affect all
  snapshot for LXR, Cycles and GIN kits, Pad Guides that light up each drum
  synth's setting pads, and a synth picker offering Deluge, DLFM or DX7.
