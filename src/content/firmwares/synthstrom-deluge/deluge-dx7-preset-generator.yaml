device: synthstrom-deluge
name: Deluge DX7 Preset Generator
kind: tool
summary: Browser app that picks 210 patches at random from a bundled database of about 16,000 DX7 voices in 18 categories, plus five drum kits, and downloads them as Deluge DX7 SYNTH and KIT files in a ready-to-copy folder tree.
description: >-
  Writes files in the community firmware 1.3 format, so it needs a firmware
  with the DX7 engine. The README describes the patch database as coming from
  public-domain ROM and cartridge dumps; that was not checked for this entry.
