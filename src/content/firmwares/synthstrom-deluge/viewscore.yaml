device: synthstrom-deluge
name: ViewScore
kind: tool
summary: Browser viewer for Deluge SONG, KIT and SYNTH XML from the Downrush project. Shows clips as a piano-roll score and can play them to a MIDI output.
description: >-
  Replaces the xmlView module of the original Downrush and lives in Synthstrom
  Audible's DelugeWeb repository. It views files and does not edit them. The
  DelugeWeb README says it has not been updated to show community firmware
  features, so newer song fields may not appear.
