device: synthstrom-deluge
name: deluge-synthstrom-utils
kind: tool
summary: Set of Deluge SD card helpers. An Electron app finds and repairs missing sample paths, a macOS script builds multisample SYNTH XML from folders of WAVs, a shell script converts or removes samples the Deluge cannot load, and a Ruby script archives unused recordings.
description: >-
  The missing-sample fixer writes a report and backs up files it changes. The
  README warns that the shell script's write modes delete or overwrite files
  without a backup. Written for 2.x and 3.x firmware; a 2022 issue reports a
  parse error on a newer file.
