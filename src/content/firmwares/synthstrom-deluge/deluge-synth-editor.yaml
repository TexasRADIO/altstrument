device: synthstrom-deluge
name: Deluge Synth Editor
kind: tool
summary: Browser editor for Deluge synth presets with graphical controls for every parameter, controlled randomisation, DX7 patch support and MIDI CC. Edits SYNTH XML files offline, or reads and writes them on the card over USB SysEx.
description: >-
  Offline editing works on XML from any firmware. Direct transfer to the SD
  card needs community firmware 1.3 or later, or official 4.0 or later, and
  uses the SysEx protocol from DEx. Generated files are written in the
  community 1.3 format. Kits and songs are not handled. The README says the
  editor is not fully tested and asks users to back up presets first.
