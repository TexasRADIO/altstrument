device: synthstrom-deluge
name: delugemu
kind: tool
summary: QEMU-based hardware emulator for the Deluge that boots the unmodified open-source firmware on a desktop. Emulates the RZ/A1L, OLED, pads, buttons, encoders, audio and SD card, with host MIDI and audio.
description: >-
  The SD card can be an image or a folder in the normal Deluge layout, written
  back on exit. USB is not emulated and the 7-segment display is a stub. On
  first launch it offers to download the community firmware and the factory
  SD card contents. Graham Wheeler started it in gramster/delugemu, where the
  prebuilt macOS, Linux and Windows bundles still live. A copy with the same
  history moved to Synthstrom Audible's GitHub organisation in October 2026,
  and other firmware developers now commit there.
