device: synthstrom-deluge
name: Deluge Commander
kind: tool
summary: Electron desktop app for organising the samples on a Deluge SD card. Rename, move and delete samples and folders, with the references in SONG, KIT and SYNTH XML rewritten to match. Can export a song, kit or synth with its samples.
description: >-
  Shows how many songs and kits use each sample and lets you audition them.
  It only rewrites file paths in the XML, so it does not depend on a firmware
  version, though no release has been tested with community firmware. The
  last release is a 2022 beta for Windows and Intel macOS. Building from
  source on Apple Silicon is reported to fail, and nine user issues are
  unanswered.
status: dormant
