device: synthstrom-deluge
name: Vuefinder for Deluge
kind: tool
summary: Web file manager for the Deluge SD card over USB MIDI SysEx. Browse, upload, download, rename and delete files, and preview WAV audio and XML, at roughly 200 KB/s.
description: >-
  Jamie Fenton adapted Yusuf Özdemir's Vuefinder component for the Deluge.
  It lives in the DelugeWeb repository under Synthstrom Audible's GitHub
  organisation, alongside the Downrush Waverly and ViewScore ports and some
  experimental tools. It needs a community firmware build with SysEx file
  transfer (1.3 or a recent nightly). The hosted copy is on the author's
  personal site, and the community docs say that address may change.
status: dormant
