device: synthstrom-deluge
name: Lama
summary: Custom build on top of Owlet 1.3 with a vowel filter, drawable LFO shapes, saturation and wavefold editors, bass mono and an EQ mid band. Removes the DX7 engine, ringmod, kick mode, four Phi oscillators and the Club filter.
description: >-
  Lama is the Owlet-based sibling of Deluge Community Custom, by the same
  author. It is six commits on an Owlet snapshot from 2026-07-07, so it does not
  include later Owlet releases. It also adds a table shaper tone control and
  low-memory fixes. The manual describes how older songs that use the removed
  engines load, for example as sine or subtractive sounds. Commits carry AI
  co-author trailers. The repository was three days old when this entry was
  written.
