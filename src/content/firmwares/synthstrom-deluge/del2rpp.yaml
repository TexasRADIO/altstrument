device: synthstrom-deluge
name: del2rpp
kind: tool
summary: Python converter from a Deluge arranger song to a REAPER project, with tracks, clips, audio clip paths and MIDI notes. Kit rows become MIDI pitches for a sampler. Also runs as a Colab notebook.
description: >-
  Built on pydel, the same author's song XML parsing library
  (github.com/dcower/pydel, also on PyPI), included as a submodule. The code
  only accepts songs from firmware 3.x, and a 2023 issue reports missing note
  data with firmware 4.0, so current community firmware songs are not
  expected to convert.
status: dormant
