device: synthstrom-deluge
name: Pharo-SynthstromDeluge
kind: tool
summary: Pharo Smalltalk library that models Deluge kits as objects and reads and writes KIT XML. An optional loader converts Akai MPC .PGM programs into Deluge kits and copies the samples.
description: >-
  Only kits are fully supported. Classes were generated from 3.x-era files,
  and the README advises starting from files the Deluge itself created.
