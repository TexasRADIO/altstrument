device: synthstrom-deluge
name: EspDelugeDisplay
kind: tool
summary: ESP32-S3 firmware that mirrors the Deluge's display on a Waveshare 1.91-inch AMOLED board over USB MIDI SysEx and streams it to a live web view. Aimed at owners of 7-segment Deluges.
description: >-
  The ESP32 acts as USB host and is powered by the Deluge. It uses the
  community firmware display SysEx, so it needs community firmware 1.0 or
  later, and works with OLED and 7-segment units. It also has a Wi-Fi debug
  page and OTA updates. The README credits GitHub Copilot with writing the
  code.
