device: synthstrom-deluge
name: DelugeHub
kind: tool
summary: PySide6 desktop manager for a Deluge SD card. Browse, rename and export songs with their samples, edit kits and synth parameters, manage samples with automatic XML path updates, find lost samples, batch operations, and ZIP backup and restore.
description: >-
  Changes are staged and only written when confirmed, and deleted files go to
  a trash folder. The README says the parser handles firmware 1.x and 2.x
  files. Community firmware and the 4.x format are not mentioned, though the
  changelog describes handling several XML generations. The README points to a
  Windows installer, but recent releases have no files attached, so run it from
  source with Python 3.10 or later. The repository includes an AI code review
  document.
