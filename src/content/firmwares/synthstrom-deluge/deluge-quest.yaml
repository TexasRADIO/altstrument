device: synthstrom-deluge
name: deluge.quest
kind: tool
summary: Browser toolbox that runs entirely client-side. SD card manager, song analyser and preview, kit builder, patch generator, song to MusicXML, MIDI or LilyPond, and MIDI to song import. The same tools ship as Python command-line programs.
description: >-
  The card manager fixes broken sample references, sorts songs, reclaims
  space and backs up the card through the File System Access API; other
  browsers get read-only drag and drop. The web app runs a Python wheel in
  Pyodide. The CLIs include deluge-score, deluge-import, deluge-stats,
  deluge-clean and deluge-backup, which keeps git-tracked card snapshots. It
  handles the firmware 4.0 note-row format and uses the community firmware
  source as its format reference. The repository includes AI assistant
  configuration.
status: active
