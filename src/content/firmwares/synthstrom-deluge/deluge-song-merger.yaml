device: synthstrom-deluge
name: Deluge Song Merger
kind: tool
summary: Single-page web app that merges several Deluge songs into one, copying their synth, kit, MIDI and CV instruments, and returns the merged XML to paste into a file.
description: >-
  Works only with files from firmware 3.0.0 or later. A user reported it
  working with official 4.0.1 in 2023 but losing a sample-based track. The
  code has not changed since 2019, and community firmware is untested.
