device: synthstrom-deluge
name: Midian
kind: tool
summary: Web converter from standard MIDI files to Deluge SONG.XML, with a beta mode that converts SONG.XML back to MIDI.
description: >-
  Part of the original Downrush repository rather than DelugeWeb. The source
  was last updated in November 2022 for official firmware 4.0.0, and community
  firmware song features are not covered. Open issues report a missing first
  track and empty MIDI output from the song-to-MIDI direction. The hosted copy
  is on the author's site under /catnip/, which is unrelated to the catnip app
  in DelugeWeb.
status: dormant
