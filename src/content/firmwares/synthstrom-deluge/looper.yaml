device: synthstrom-deluge
name: Looper
kind: tool
summary: Local Flask web app that turns freely played recordings into grid-aligned loops for hardware samplers, with the Deluge as a named target. Detects beats and sections, time-stretches to a BPM grid and exports sample-exact 44.1 kHz 24-bit WAVs.
description: >-
  Not specific to the Deluge. Requires librosa, pyrubberband and the
  Rubber Band library.
