device: synthstrom-deluge
name: Deluicer
kind: tool
summary: Tauri desktop editor that opens a Deluge SD card or a backup of it and edits kits and synth presets. Covers pads, sample assignment, zones, tuning and waveform trimming for kits, and oscillators, filters, envelopes, LFOs and effects for synths, with audio preview.
description: >-
  Imports samples into SAMPLES/Imported and saves XML with atomic file
  replacement. Kits and synths stored inside songs cannot be edited yet, and a
  parity audit in the repository lists known gaps. There are no prebuilt
  releases. The published history was squashed into an initial public commit.
