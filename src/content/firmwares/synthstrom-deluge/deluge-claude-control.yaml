device: synthstrom-deluge
name: deluge-claude-control
kind: tool
summary: Python script that uses the Deluge pad grid as a status display for Claude Code sessions over USB MIDI. Each chat lights a row of pads, and blinking, bright and dim pads show whether a session needs permission, is working or is idle.
description: >-
  Claude Code hooks call the script, and a watch process repaints the grid.
  It needs community firmware with the Midigrid community feature enabled. It
  does not read Deluge files or control sound.
