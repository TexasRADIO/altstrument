device: synthstrom-deluge
name: Delugr
kind: tool
summary: Web app that reads a Deluge SD card folder through the browser's File System Access API. Browse songs, synths, kits and samples, see where each sample is used, find unused or missing samples, preview audio and delete files.
description: >-
  Needs a Chromium-based desktop browser; Firefox, Safari and mobile browsers
  lack the API. Parsing was updated for community firmware XML in December
  2024, and later commits are build and deploy changes only. Deleting acts on
  the real card folder.
