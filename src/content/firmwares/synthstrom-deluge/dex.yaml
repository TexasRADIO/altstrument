    url: https://github.com/silicakes
source: https://github.com/silicakes/deluge-extensions
source_status: open
license: MIT
homepage: https://dex.silicak.es/
distribution: browser-installer
tags: [display-mirror, file-manager, sysex, web-midi, debug]
