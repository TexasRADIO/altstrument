device: synthstrom-deluge
name: DEx (Deluge EXtensions)
kind: tool
summary: Web app that talks to the Deluge over USB MIDI SysEx. Mirrors the OLED or 7-segment display, shows debug output, sends custom SysEx, and on community firmware 1.3 or later browses the SD card to upload, download, rename and delete files.
description: >-
  Installable as a progressive web app on desktop and Android; it needs Web
  MIDI, so Chromium-based browsers only. Files are moved as opaque data, not
  parsed. An April 2026 issue reports that the file browser fails on a recent
  nightly, and the maintainer says some SysEx regressions in nightlies were
  still being fixed. Its SysEx code is reused by the Deluge Synth Editor.
status: active
authors:
