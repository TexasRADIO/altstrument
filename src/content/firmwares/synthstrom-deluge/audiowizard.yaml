device: synthstrom-deluge
name: AudioWizard
kind: tool
summary: Audio analysis app that shows live tempo, key and chords, sends MIDI clock and separates stems. Its Deluge export builds a song from a recording, with stems as audio clips, melodic parts as synth clips, drums as a kit and detected sections as launchable sections.
description: >-
  Most of the app is not Deluge-specific. The exporter writes the community
  firmware 1.2.1 song format, and its code warns that files should be checked
  on the device. It runs on Windows, macOS, Linux and a Raspberry Pi kiosk,
  with a separate web version. The README is in German and credits Claude as
  a co-author.
