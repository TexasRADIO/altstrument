summary: Early Tauri desktop companion app prototype that connects to the Deluge over USB MIDI. Has an on-screen keyboard and scale helper and a Deluge-style LED font, but no file or editing features yet.
description: >-
  The README describes the goal as an Overbridge-style companion, which would
  need a firmware API that does not exist. It has never been released and
  builds from source only.
