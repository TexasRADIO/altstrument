summary: Proof-of-concept RP2040 firmware that shows the Deluge's display on an external OLED through the community firmware's display SysEx over USB host. Based on bfredl's delugeclient.
description: >-
  Built for an Adafruit Feather RP2040 Scorpio with an OLED FeatherWing. On a
  7-segment Deluge a button switches the firmware to sending OLED frames. The
  author said in 2025 that it was mainly a proof of concept.
