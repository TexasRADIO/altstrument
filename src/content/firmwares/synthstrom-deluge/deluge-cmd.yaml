device: synthstrom-deluge
name: deluge-cmd
kind: tool
summary: POSIX-style command-line tools for a Deluge SD card, built on deluge-card. List songs and samples with tempo, key and scale, check the card, filter by path, and move samples while updating song references.
description: >-
  The move command is marked experimental, and the README says to back up the
  card first. Written for firmware 3.15; support for the 4.0 folder layout,
  kits and synths was planned but not added.
