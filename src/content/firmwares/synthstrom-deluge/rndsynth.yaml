device: synthstrom-deluge
name: RNDSYNTH
kind: tool
summary: Python command-line script that writes randomised Deluge synth patches as SYNTH XML, with limits on pitch range, modulation, effects, resonance and bitcrushing, and optional random arpeggiator and mod FX.
description: >-
  Written in 2018 for firmware 3.x. Output has no firmwareVersion attribute,
  and loading on current official or community firmware is untested. Only
  automated dependency updates have landed since 2018.
