device: synthstrom-deluge
name: Deluge Community Custom
summary: Unofficial build of community firmware main with four additions. Adds a vowel (formant) filter mode, drawable custom LFO shapes with 8-bar sync, and editors for saturation and wavefolding.
description: >-
  Based on the upstream main branch as of 2026-10-15, with two commits of its
  own on top. The custom LFO editor takes up to 64 points and ships 40 preset
  shapes. Songs from the regular community firmware load, with the old 0-15
  saturation drive converted. The release notes say songs saved with this
  build lose its features on stock firmware. The same author publishes Lama,
  a sibling build of these features on top of Owlet. Commits carry AI
  co-author trailers. The repository was three days old when this entry was
  written.
