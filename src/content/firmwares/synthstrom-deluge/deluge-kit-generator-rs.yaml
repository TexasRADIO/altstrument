device: synthstrom-deluge
name: deluge-kit-generator (Rust)
kind: tool
summary: Rust command-line tool that builds a Deluge KIT from WAV files whose cue-point regions mark the individual hits, and copies the samples to the card. One option merges the regions of several files into a single kit.
description: >-
  XML writing comes from the author's deluge-rs library, included as a git
  submodule with an SSH URL, so a plain HTTPS clone may need the submodule URL
  changed. No prebuilt binaries and no firmware compatibility statement.
