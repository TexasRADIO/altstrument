device: synthstrom-deluge
name: deluge-rs
kind: tool
summary: Rust library that reads, edits and writes Deluge synth and kit patch XML, hides the differences between the three XML schema versions, and models a Deluge card's folder layout. Last changed in 2023.
description: >-
  The crate defines typed Synth and Kit structures with constrained value types such as pan, transpose and clipping
  amount, and loads patches written by older firmware versions as well as the current layout. It can create a card,
  check the folder structure and find the KITS, SYNTHS and SAMPLES directories, and includes a path replacer for sample
  references. The repository holds a large set of real patch files used by its tests. The author's deluge-kit-generator
  (Rust) uses it as a git submodule. The crate is not on crates.io under this repository; a different crate named deluge
  is published there.
status: dormant
authors:
