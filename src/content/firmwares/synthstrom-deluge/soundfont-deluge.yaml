summary: Rust command-line converter from SoundFont (SF2) files to Deluge SYNTH XML instruments, writing the extracted WAV samples with loop points and mapping zones to oscillators.
description: >-
  The author tested it with official firmware 4.0.0 beta. Open issues note that
  conversions come out too loud and that drum presets are not turned into kits.
  No prebuilt binaries.
