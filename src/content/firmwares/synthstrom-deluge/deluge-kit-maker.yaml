device: synthstrom-deluge
name: Deluge Kit Maker
kind: tool
summary: Tauri desktop app for building Deluge drum kits. Drop a folder of WAVs to sort them onto 16 pads, set volume, pan, pitch, reverse and trim per pad, audition on a 16-step sequencer, and save KIT XML with its samples to the card layout.
description: >-
  Targets the official 4.x kit format and is meant to load on community
  firmware 1.2 as well. The README says it is a proof of concept that has not
  been tested on a real Deluge. Windows 11 is the main platform and there is no
  prebuilt installer. The latest commit has an AI co-author trailer.
