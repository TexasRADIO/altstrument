    url: https://github.com/PaoloQuaranta
source: https://github.com/PaoloQuaranta/DelugePal
source_status: open
license: GPL-3.0-only
license_notes: LICENSE is the GPL version 3 text and the README says GPL-3.0, with no "or later" statement.
distribution: source-only
requires_stock: community firmware 1.3.0 beta
