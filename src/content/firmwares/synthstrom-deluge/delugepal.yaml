device: synthstrom-deluge
name: DelugePal
kind: tool
summary: Python library and command-line tools for writing Deluge songs from a description, by hand or through an AI assistant, and sending them to the device. Edits song XML with byte-exact round trips and transfers files over USB SysEx with read-back checking.
description: >-
  Builds synths and kits from the empty preset, adds patch cables, automation
  and arranger clips, transposes, and imports standard MIDI files. It targets
  community firmware 1.3.0 beta and says it does not support the official
  firmware. Much of the API documentation is in Italian. The README says it
  was built with Claude Code.
status: active
authors:
