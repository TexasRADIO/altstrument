device: teenage-engineering-po-32
name: libpo32
kind: tool
summary: Freestanding C99 library that reimplements the PO-32 audio data transfer (packet format, acoustic modem and decoder) and a compatible 21-parameter drum voice, with demo programs, a pattern editor and Go bindings.
description: >-
  The library builds and parses the patch, pattern and state packets the PO-32
  receives, renders them to modem audio to play into the device, and decodes
  recorded transfer audio back into packets. It also renders the drum voice
  locally, so sounds can be previewed without the hardware. The core uses no
  libc runtime, file I/O or audio APIs. The repository's example programs
  include a command-line pattern editor and a tool that dumps packets and
  patterns from a transfer recording. It is not a replacement for the device's
  firmware.
status: active
authors:
  - name: Eric Lewis
    url: https://github.com/ericlewis
source: https://github.com/ericlewis/libpo32
source_status: open
license: MIT
distribution: source-only
install_notes: >-
  Build with CMake and a C99 compiler; the README shows configure, build, test
  and install steps. To use a generated transfer on the device, render it to
  audio and play it into the PO-32 while it is in its receive mode.
tags: [sdk, drums, synth-engine, converter]
