device: novation-launchpad-pro
name: lpp-performance-cfw
summary: Custom firmware for the Launchpad Pro MK1 that keeps the stock modes and Ableton Live integration and adds a Performance mode with fast LED updates, Piano mode, custom mode slots, a palette editor and a SysEx API.
description: >-
  By mat1jaczyyy, built on the open framework. Performance mode accepts Top
  Lights as normal Note On messages and shows velocities through the selected
  palette, removing the need for Top Lights plugins. Setup mode opens with a
  single press, and the firmware offers three custom palettes editable on the
  device, three built-in palettes, MK2 layout emulation and a boot animation.
  The README claims considerably faster LED updating, especially with Apollo
  Studio. The repository contains an
  unbrick guide that requires an ST-LINK and opening the unit, for cases where
  the bootloader is no longer reachable.
status: dormant
