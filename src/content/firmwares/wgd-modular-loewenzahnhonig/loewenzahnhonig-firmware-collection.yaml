source_status: open
license: MIT
license_notes: >-
  The repository's own code is MIT. It builds on libDaisy and DaisySP, the Mutable Instruments eurorack code
  (MIT) and the cloudseed-daisy library, which are submodules with their own licenses. Some firmwares use the
  LGPL-licensed DaisySP-LGPL components.
homepage: https://wgd-modular.github.io/loewenzahnhonig-firmware/
distribution: browser-installer
install_notes: >-
  Open the web flasher in Chrome or Edge, connect the Daisy Seed over USB, hold BOOT and tap RESET to enter the
  bootloader, pick a firmware and flash it. The page can also flash a local .bin you built, and the same binaries
  are attached to each GitHub release. Building from source needs the submodules and the pixi toolchain.
brick_risk: false
tags: [reverb, delay, granular, distortion, daisy, mutable-instruments, collection]
