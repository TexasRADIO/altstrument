device: wgd-modular-loewenzahnhonig
name: Löwenzahnhonig Firmware Collection
summary: Open-source collection of fifteen prebuilt effect firmwares for the löwenzahnhonig, flashed one at a time from a browser page, including a Cloud Seed reverb, Clouds and Rings ports, a distortion and a VCA.
description: >-
  Each firmware is a small effect or utility program for the module's four knobs and two CV inputs, with its own
  folder, README and binary in the release. The collection includes Cloud Seed and Splooge reverbs, a basic reverb
  and a shimmer reverb, delays (a basic one and the 16-second Smoodge delay), a compressor, a ring modulator, a
  Metal Zone-inspired stereo distortion and a dual VCA. It also has a port of the Mutable Instruments Clouds
  granular processor (Nimbus, with Lofi, Looping Delay and Stretch variants) and the Rings resonator in seven
  variants. The Mutable Instruments code is MIT licensed and is included unchanged. Some entries are marked as work
  in progress. Contributors add folders by pull request, and a manual PDF is built from the READMEs for each release.
  The collection is kept as one entry because the programs share one repository, one release stream, one flasher
  and one hardware layer.
status: active
