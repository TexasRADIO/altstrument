device: erica-synths-lxr-02
name: OpenElixir-02
summary: Fork of Erica Synths' open LXR-02 firmware that sums voices and effects in 32 bit and limits each output instead of clipping, with a per-build memory report and a CPU load meter option.
description: >-
  A community fork of the firmware Erica Synths published as source in October
  2026, based on stock version 1.7. Release 0.1 replaces the hard clipping in
  the final mix with a 32-bit sum and a limiter on each DAC output, so loud kits
  are limited rather than clipped and quieter kits sound as before. It renames
  the unit on the start-up screen and as the USB-MIDI device, which means DAW
  mappings that use the old port name need to be set up again. Kits, patterns,
  projects and the MIDI implementation are unchanged. Every build prints a
  memory usage report per region compared with the stock firmware, and a
  development build option shows per-voice CPU load on the display. The
  author lists better oscillator quality, flexible voice engines and sample
  playback as possible later work. It is not affiliated with Erica Synths.
status: active
authors:
  - name: Moritz Waser (tunefish777)
    url: https://github.com/tunefish777
source: https://github.com/tunefish777/openelixir-02
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherits the stock firmware's NOTICE.md terms: permission to combine with
  STMicroelectronics libraries, and no rights to the Erica Synths, LXR and
  LXR-02 names or logos.
distribution: download
requires_stock: LXR-02 with the stock bootloader
install_notes: >-
  Copy LXR_OpenElixir-02_V0.1.img from the release to the top folder of the SD
  card, delete any other LXR*.img files, then hold the encoder button while
  switching the unit on until LXR Updater appears. The bootloader is not
  touched, so an interrupted update can be repeated. Installing an official
  Erica Synths update the same way returns to stock. The release also carries
  .hex and .elf files for use with an ST-Link, which a normal update does not
  need.
brick_risk: false
tags: [drums, fork, open-source]
versions:
  - version: "0.1"
    date: 2026-10-24
    url: https://github.com/tunefish777/openelixir-02/releases/tag/v0.1
    notes: Pre-release on GitHub. Limiter on each output, rename, memory report.
