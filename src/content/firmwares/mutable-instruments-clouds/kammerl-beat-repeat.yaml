    url: https://github.com/jkammerl
source: https://github.com/jkammerl/eurorack
source_status: open
license: MIT
license_notes: Inherits from Mutable Instruments; repository README states STM32 code is MIT.
homepage: https://www.kammerl.de/audio/clouds/
distribution: download
install_notes: >-
  Hold FREEZE while powering on, then play the firmware WAV into IN L with all
  other inputs unplugged. The project page warns of a small risk of bricking.
brick_risk: true
tags: [fx, looper, granular]
