device: mutable-instruments-clouds
name: Kammerl Beat-Repeat
summary: Clouds firmware adding a clocked beat-repeat and slicing mode ported from the Kammerl Kaske VST suite, plus a multiband Spectral Clouds mode that replaces the spectral processor.
description: >-
  Beat-Repeat needs a clock on the Trigger input. It slices the live input
  continuously and lets you choose among the eight most recent slices, with
  quantized loop start and size, four pitch modes, feedback and scratch-style
  modulation. The three original granular modes are kept. Hold button B for
  five seconds to cycle the new modes.
status: dormant
authors:
