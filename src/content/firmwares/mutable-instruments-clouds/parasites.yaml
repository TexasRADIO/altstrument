device: mutable-instruments-clouds
name: Parasites (Clouds)
summary: Clouds firmware adding a CV-controllable shimmer reverb, the Resonestor dual resonator with Karplus-Strong plucks, extended granular options and a tempo-synced looping delay. Builds for Tides, Warps and Frames are listed under those modules.
description: >-
  Reverb is called Miverb on the project page and Oliverb in the release
  history and in later ports. Granular gains reversed playback, asymmetric
  grain envelopes and much smaller grains; the looping delay adds tempo sync,
  ping-pong and an open feedback loop. The Tides, Warps and Frames builds from
  the same repository are listed under those modules. Recalibrate after
  updating.
status: dormant
authors:
  - name: Matthias Puech
    url: https://github.com/mqtthiqs
source: https://github.com/mqtthiqs/parasites
source_status: open
license: MIT
license_notes: >-
  Inherits from Mutable Instruments; the repository README states STM32
  projects are MIT and AVR projects GPL-3.0.
homepage: https://mqtthiqs.github.io/parasites/clouds.html
distribution: download
requires_stock: Use v1.3 or later if the module was bought in July 2015 or later
install_notes: >-
  Follow the firmware update procedure in the official Clouds manual, then
  recalibrate (press Save on startup). If the serial number ends in a number
  below 020, the project page advises contacting Mutable Instruments first
  because the bootloader may be faulty.
brick_risk: true
tags: [granular, reverb, delay, physical-modeling, fx]
