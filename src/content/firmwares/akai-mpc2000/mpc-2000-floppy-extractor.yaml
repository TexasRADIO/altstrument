    url: https://github.com/p3r7
source: https://github.com/p3r7/mpc-2000-floppy-extractor
source_status: open
license: MIT
distribution: source-only
install_notes: >-
  Needs Python and the kaitaistruct module (pip install kaitaistruct). Reading a
  raw device needs sudo; reading an image file does not.
