device: akai-mpc2000
name: MPC 2000 floppy extractor
kind: tool
summary: Python script that lists and extracts files, with their long names, from MPC2000 floppies, floppy images and Gotek-formatted USB drives.
description: >-
  The MPC2000 stores long file names in reserved space of FAT12 directory
  entries, so mtools and the system mount cannot show them. This script reads
  the volume layout with a Kaitai Struct parser and copies the files out under
  their full names. It can read a physical floppy, a disk image, or one or a
  range of virtual floppies on a Gotek-formatted USB stick, and the README gives
  dd recipes for making images.
status: dormant
authors:
