device: akai-mpc2000
name: pyMPC2000xl
kind: tool
summary: Python reader and writer for MPC2000XL .PGM program and .SND sample files, with a helper that maps pads to their default MIDI notes.
description: >-
  Two modules, PGM.py and SND.py, parse the program and sample file layouts of
  the MPC2000 family into Python objects and write them back, so programs and
  samples can be edited or generated by script instead of on the machine or in
  an editor. A padToMidi.py file holds the default pad-to-note table. The
  author started from third-party format notes and wanted finer control than a
  GUI editor gave. Last code change was in September 2022.
status: dormant
