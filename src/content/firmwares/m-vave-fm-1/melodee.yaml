device: m-vave-fm-1
name: Melodee
summary: >-
  Felucca fork with a Sequential Prophet-5 engine (all 200 factory programs, SysEx), a Casio CZ-1 phase-distortion
  engine (64 factory tones), FM6 with DX7 SysEx banks, 70 microtonal tunings and a unified note editor.
description: >-
  Four tracks, 32 pattern banks and 1,024 recorded notes, plus a web editor. Its four audio outputs appear
  as discrete USB audio streams, which take-taker (an Android recorder) can capture as separate tracks.
  1.0.0 followed 0.13.1; the 1.0.0 release is noted to have crashed on some units (fixed in later 1.x).
status: active
authors:
- name: keremimo
  url: https://github.com/keremimo
source: https://github.com/keremimo/melodee
source_status: open
license: GPL-3.0-only
license_notes: Fonts, icons, ported DSP and SDK files keep their own licences (LICENSES/).
homepage: https://keremimo.github.io/melodee/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer that saves a backup first and can return the FM-1 to V15. Releases also ship
  recovery archives (the 2026-10-13 correction makes them accept the unmodified V15 file).
brick_risk: true
tags: [synth-engine, sequencer, fm, usb-audio, midi, editor]
