device: m-vave-fm-1
name: Blue Hare
summary: >-
  Synthesizer firmware forked from Felucca: three tracks of synth, drum-kit and voice engines with an effects
  chain, an arpeggiator on the ARP button, and a browser studio for designing sounds; it has no sequencer of its own.
description: >-
  Blue Hare was started as a tracker (the repository was called fel-tracker until 2026-10-25) and was renamed on 2026-10-16.
  It keeps Felucca's platform layer and removes its groovebox features, including the step sequencer, slicer
  and sample engines, to become a synthesizer with its own engines. The current distribution has three tracks:
  synths (VA, SANDSTORM, HOOVER, SID, OBIE), drums (KIT, RHYTHM, VAKIT, LINNKIT, WAR) and voices (SPEECH, ONYX,
  VOCODER, VOSIM, DUBSIREN, RISERS, NOISE); many more are archived in the tree. It is played from an external
  sequencer or the FM-1's keys, and REC records what the sequencer plays into a loop per track. ARP is an
  arpeggiator with settings for each track. The tree also holds a browser sound
  design studio, a browser emulator, a desktop build and an archived plugin. The repository's default branch is an unchanged copy of Felucca 1.4.1;
  the work is on the blue-hare branch (formerly called tracker). The README names AI coding agents as part of the development. It calls the
  firmware a beta, says it runs on the FM-1 but has been played on few units, and warns that Felucca songs and
  sounds do not load. It publishes no GitHub release or installable package.
status: active
authors:
