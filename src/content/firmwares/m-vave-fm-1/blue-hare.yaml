source_status: open
license: GPL-3.0-only
license_notes: >-
  Same licence as Felucca (LICENSING.md on the blue-hare branch). The Felucca-derived files keep Leo Kuroshita's
  copyright; Fukiai and DotGothic16 fonts and a ported DaisySP file keep their own licences.
distribution: source-only
install_notes: >-
  No release or package is published; build build/bluehare.fwsc following BUILDING.md (JieLi toolchain and SDK)
  and install it with tools/fm1_install.py. The first install of 0.40.0 writes a boot protection during which
  an interrupted transfer cannot be repaired from the FM-1, so the README asks for a direct cable and a charged
  unit. The README says M-VAVE's updater or an installer's return to the official V15 firmware
  recovers the unit.
brick_risk: true
