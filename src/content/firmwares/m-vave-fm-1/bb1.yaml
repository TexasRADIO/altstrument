device: m-vave-fm-1
name: BB1
summary: >-
  Felucca-based rhythm firmware with two simultaneous drum machines (a synthesised 808 plus seven sampled machines), the
  Dillo bass synth, tape echo and spring reverb, and a library of 67 songs, 21 eras and 138 classic rhythms.
description: >-
  Rights warning: the sound library and pattern data come from commercial drum machines. The sampled LinnDrum,
  DrumTraks, DMX, LM-1, Simmons, Rhythm King and Drumulator kits live in a separate sound library, and the
  repository's catalogue holds the factory presets of four Roland rhythm boxes and drum patterns in the style of
  existing records. BIG-BEAT-LICENSING.md covers the LinnDrum, DrumTraks and DMX samples and the pattern data with a
  quoted statement from "the project owner" and says that statement does not establish the original sources or
  third-party provenance. It says nothing about the four machines added in 1.2.

  BB1 runs two drum layers at once, each with its own kit, pattern and level, and a monophonic bass synth called Dillo with
  eight presets. A three-head tape echo and a spring reverb are shared, and holding REC and FX throws the echo. Kits
  and patterns change on the next bar. The content is 67 songs, 21 original eras with bass lines and 138 preset
  rhythms, and the 808 is synthesised in real time. The sound library is written over USB-MIDI by the installer. Saving into a scene
  that holds another firmware's data asks you to hold SAVE for two seconds to replace it. The README lists dense two-drum
  playback as above its preferred processing headroom, and a browser player runs the same firmware. The project publishes the
  full source, but the bit-for-bit rebuild needs build inputs that are not all in the repository.
status: active
authors:
- name: TexasRADIO
  url: https://github.com/TexasRADIO
source: https://github.com/TexasRADIO/bb1-firmware
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL v3 text. LICENSING.md, inherited from Felucca, states GPL-3.0-only, and BIG-BEAT-LICENSING.md says
  the same for the Big Beat code, with the 9W9 TR-909 voices ported under their own GPL-3.0 text. The CC0 instrument
  samples, DaisySP, Rings and msfa parts keep their own licences, and three JieLi SDK files inside each package are
  Apache-2.0. The sampled drum kits and pattern data are not under the GPL; see the rights warning above. The release
  also carries the sound library as a separate bb1-sounds-1.2.bin.
homepage: https://thebigbeat.app/fm1/
distribution: browser-installer
requires_stock: M-VAVE stock firmware
install_notes: >-
  Web installer at thebigbeat.app/fm1/install in Chrome or Edge with the FM-1 on a USB data cable; it writes the
  firmware and the sound library in about five minutes and keeps your scenes. The .fwsc and the source archive are
  on the releases page. To go back, install M-VAVE's FM-1.fwsc with M-VAVE's updater; BB1 cannot export its music
  to a computer yet, so copy out what you want first. The README says installing is at your own risk.
brick_risk: true
