device: m-vave-fm-1
name: FM-1 Emulator
kind: tool
summary: >-
  Emulates the FM-1's CPU, screen, keys, knobs and audio so community firmwares run unchanged in a browser
  or in a native window; also ships a SID-chip firmware of its own.
description: >-
  Instruction set recovered from the firmwares themselves, with models of the chip's timers, flash, display,
  key matrix and MIDI UART. The web page fetches each community firmware package from its author's own site
  when you start it, and plays through the computer keyboard, mouse, touch or Web MIDI. The native build
  (Rust, fm1-live) runs at full clock speed on Apple silicon Macs and interprets elsewhere. Also contains
  FM-1 SID, a Commodore 64 SID synth firmware with a sequencer and effects, which has its own page.
status: active
authors:
- name: Joakim Eriksson (joakimeriksson)
  url: https://github.com/joakimeriksson
source: https://github.com/joakimeriksson/fm1-emu
source_status: open
license: MIT
license_notes: >-
  The emulator is MIT. The firmwares it runs belong to their authors and are not in the repository; the
  fm1-sid directory has files under other licences, including GPL-3.0 for its player firmware.
homepage: https://joakimeriksson.github.io/fm1-emu/
install_notes: >-
  Browser version needs nothing installed. To run M-VAVE's stock firmware, download FM-1.fwsc from M-VAVE and
  open it on the page; the emulator does not bundle or fetch it. Native build: cargo run --release -p
  fm1-live.
brick_risk: false
tags: [emulator, research]
