device: m-vave-fm-1
name: Drift
summary: >-
  Ambient instrument fork of Felucca with no menus or drums: PLAY starts a chord progression, white keys switch
  layers, black keys jump to chords and four knobs set space, echo, brightness and motion.
description: >-
  Replaces Felucca's keyboard, interface and screen with a small set of controls and keeps Felucca's engines,
  effects, USB, update loader and storage. Seven layers (pad, bass, arp, sparkle, melody, voice, shimmer) play
  notes that stay inside the chosen key, and nine presets, five behaviours and six progressions change the
  character. The README says it is a work in progress that runs in the browser emulator and has not been
  flashed to an FM-1, and that the install page is not live yet. The author says it is developed with AI coding
  agents. Building with FELUCCA_DRIFT=0 gives plain Felucca.
status: active
authors:
- name: Dominik Siemon (thebrodi)
  url: https://github.com/thebrodi
source: https://github.com/thebrodi/fm1-drift
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md, inherited from Felucca. The engines in firmware/engines are MIT, the
  sample set is CC0, ported DSP and the fonts keep their own licenses (LICENSES/).
homepage: https://thebrodi.github.io/fm1-drift/
distribution: source-only
install_notes: >-
  Build as Felucca does (BUILDING.md: Docker, JieLi toolchain and AC79 SDK). No release package is published and
  the project's install page says the firmware is not released yet. The README advises backing up first and
  keeping M-VAVE's updater with the official V15 ready. The default branch is drift.
brick_risk: true
