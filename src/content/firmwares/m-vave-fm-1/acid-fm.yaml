device: m-vave-fm-1
name: ACID FM
summary: >-
  Fork of JIANT FM aimed at IDM and braindance: its README is at 0.4, with trimmed engines, an acid-coloured screen
  theme and IDM genres in the song generator; chopped breaks and tape effects are still planned.
description: >-
  Fork of JIANT FM, which is itself a Felucca fork using SLOOP's song system, so it keeps JIANT's engines,
  sequencer, browser installer, editor and emulator. The README lists the work in steps: 0.2 trimmed the engines
  and set aside 128 KiB of flash for breakbeats, 0.3 brought one acid palette, a home screen with TRACKS, VISUAL and
  GEN views and a new splash, and 0.4 redrew the sound sections (EDIT, ENV, ARP, SCL, LFO, FX) in that look, narrowed
  the generator to ten IDM genres and added a short demo that plays at power-on. Still planned are loading and
  chopping your own breakbeats from the web page, tape and 303-style accent and slide effects, new voices and
  further song-generator styles. SEQ, GLO, SAVE and the menu keep their inherited layouts in the new colours, and
  parts of the manual still describe JIANT FM. No release is tagged yet, so the version below is a commit. The
  repository includes a browser emulator and a manual site.
