device: m-vave-fm-1
name: PIGEON
summary: >-
  Felucca 1.5.1 derivative that turns the FM-1 into an audio-only performance sampler: two chopped song samples
  and a 16-pad drum kit, a 64-step sequencer, patterns and arrangement, with a browser emulator and sample tool.
description: >-
  PIGEON removes the synth engines and builds the instrument around samples. Two song samples (indexed mono
  MP3 or IMA ADPCM) and a 16-pad drum kit share 408 KiB of flash. Each song takes up to 32 chops with transient
  detection, per-chop pitch, envelope, one-shot, hold, loop and latch settings. A paged step grid of up to 64
  steps per track records live or by step, with microtiming, conditions, probability and repeats, and feeds
  patterns A to D and a 16-section arrangement. A three-track mixer, filter, delay, chorus, reverb, distortion
  and compression sit on top. Samples are prepared in a browser sample tool and sent over USB; a separate
  browser emulator runs the firmware without a device. The installer reads the running firmware and refuses
  Sloop, old Felucca betas and unknown builds, and the package adds a recovery boot stub adapted from
  ChoralRoot. Hardware verification of the beta build is listed as pending in the repository.
status: active
authors:
