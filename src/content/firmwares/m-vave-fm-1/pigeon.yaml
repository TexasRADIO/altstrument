homepage: https://theshrimpblimp.com/pigeon/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Web installer on the project site (desktop Chrome or Edge, USB), or tools/fm1_install.py from the
  repository. Return to official M-VAVE V15 with your current firmware's stock-return procedure first; the
  installer refuses Sloop, Felucca 0.x betas and unrecognised firmware. Back up before installing or replacing
  sample banks. Recovery notes are in docs/PIGEON_RECOVERY.md.
brick_risk: true
