  url: https://github.com/ip2k
source: https://github.com/ip2k/lunar-modulator
source_status: open
license: MIT
license_notes: MIT for the project; builds that include fm1-x0x-derived engines are GPL.
distribution: source-only
tags: [synth-engine, sequencer, emulator, research]
