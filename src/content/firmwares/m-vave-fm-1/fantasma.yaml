homepage: https://gadlele.github.io/Pelucco/
distribution: download
install_notes: >-
  The README points to Felucca's web installer (Chrome or Edge, USB) or the FM-1 Firmware Hub for installing a
  package. The repository's CI publishes the package on fwsc-fw-fantasma branches, and the homepage is a browser
  emulator, not an installer. Hold OCT- alone at power-on to reach USB rescue. The README links FM-1 Transporter
  for a unit stuck in the chip's boot mode.
