device: m-vave-fm-1
name: FANTASMA
summary: >-
  Felucca fork with a self-playing ambient machine (pad, bells and endless noise on a shared scale), an
  Omnichord-style chord mode and a neon ghost theme. Lives on branches of the Pelucco repository.
description: >-
  FANTASMA is the themed build of Pelucco, a personal Felucca fork. Pelucco adds an AMBIENT page that, on one
  key press, picks a root and scale and sets up a pad that plays its own chord progression, a bell part that
  scatters notes and a noise part that never stops, all running on their own clock even with the transport
  stopped. It also adds a long-tail AMBI reverb, a bell engine, an OMNI chord mode on the pad and lead, and
  parts named for their role. FANTASMA changes the look: a neon palette, an animated ghost splash and a
  ghost on the ambient page. A rescue mode, entered by holding OCT- at power-on or after two failed boots,
  starts a minimal updater that the web installer can reach. The default branch of the repository is plain
  Felucca; the work is on the fantasma, fantasma-1.0 and claude/pelucco-all branches.
status: active
