device: m-vave-fm-1
name: GameDude
summary: >-
  Game Boy emulator for the FM-1: the keys are the d-pad and buttons, and games are added to an on-device library
  over USB or Bluetooth. Browser site with a player, game uploader and installer.
description: >-
  Built on Peanut-GB and the Felucca hardware layer, with the second CPU core scaling the picture. The site
  plays a dropped .gb file or ZIP in the browser. Release 2.0 changed the FM-1 firmware from one embedded
  cartridge to a library: the core is installed once and games of up to 256 KiB each are then sent from the
  site's Add games tab, with 360 KiB of library space on the FM-1. Games stay across power cycles, can be picked
  and deleted on the device, and installing the firmware again clears the library. Nine licensed homebrew games
  and an original diagnostic cartridge are bundled; no commercial ROMs or Nintendo boot ROM are. Game Boy (DMG)
  cartridges only. The author tested earlier FM-1 builds on hardware, and the current package has host and
  simulated-flash tests. The repository also builds for the SMK-37 Pro and Elite, and the simulator shows their
  layouts. That entry is not listed under the SMK-37, because its installer downloads M-VAVE's SMK-37 stock
  package from a third-party mirror.
status: active
authors:
- name: Chance Roth (ChanceTheMaker)
  url: https://github.com/ChanceTheMaker
source: https://github.com/ChanceTheMaker/gamedude-fm1-smk
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0-only with retained third-party notices; Peanut-GB is MIT. The bundled homebrew ROMs
  each carry their own licence (MIT, GPL-3.0 with source zip, Zlib, WTFPL, BSD-3-Clause, CC-BY-4.0 for Tobu
  Tobu Girl's assets); NOTICE.txt lists them. Includes M-VAVE's FM-1 V15 image (FM-1_015.fwsc), which M-VAVE
  licenses under Apache-2.0 in m-vave/fm1_open; the copy at web/firmware/fm1-original.fwsc has the matching git
  blob ce49cc1. The README says the file keeps its own ownership and is not GPL; the repository does not carry
  an Apache-2.0 notice for it.
homepage: https://chancethemaker.github.io/gamedude-fm1-smk/
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15, or a firmware with a compatible USB updater
install_notes: >-
  Chrome or Edge over USB. In the Install firmware tab choose FM-1 and install; the page checks the restart
  identity afterwards. Then use the Add games tab to send a cartridge over USB or Bluetooth. A Restore M-VAVE
  firmware button reinstalls V15. Without a working USB updater on the device you need the recovery adapter.
  Cartridge save RAM on the device is lost at restart.
brick_risk: true
tags: [game, emulator]
