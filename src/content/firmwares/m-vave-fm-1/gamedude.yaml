device: m-vave-fm-1
name: GameDude
summary: >-
  Game Boy emulator for the FM-1: the keys are the d-pad and buttons and one cartridge is embedded per
  install. Browser site with a player, ROM-to-firmware builder and installer.
description: >-
  Built on Peanut-GB and the Felucca hardware layer, with the second CPU core scaling the picture. The site
  plays a dropped .gb file or ZIP in the browser and prepares a firmware with that cartridge embedded, up to
  512 KiB. Nine licensed homebrew games and an original diagnostic cartridge are bundled; no commercial ROMs
  or Nintendo boot ROM are. Game Boy (DMG) cartridges only. The author tested an earlier build on hardware
  and the current FM-1 package has host and simulated-flash tests. The browser simulator also shows SMK-37
  layouts and the SMK-37 firmware compiles, but the README says SMK-37 flashing is not enabled.
status: active
authors:
- name: Chance Roth (ChanceTheMaker)
  url: https://github.com/ChanceTheMaker
source: https://github.com/ChanceTheMaker/gamedude-fm1-smk
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0-only with retained third-party notices; Peanut-GB is MIT. The bundled homebrew ROMs
  each carry their own licence (MIT, GPL-3.0 with source zip, Zlib, WTFPL, BSD-3-Clause, CC-BY-4.0 for Tobu
  Tobu Girl's assets); NOTICE.txt lists them. Includes M-VAVE's FM-1 V15 image (FM-1_015.fwsc), which M-VAVE
  licenses under Apache-2.0 in m-vave/fm1_open; the copy at web/firmware/fm1-original.fwsc has the matching git
  blob ce49cc1. The README says the file keeps its own ownership and is not GPL; the repository does not carry
  an Apache-2.0 notice for it.
homepage: https://chancethemaker.github.io/gamedude-fm1-smk/
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15, or a firmware with a compatible USB updater
install_notes: >-
  Chrome or Edge over USB. Load a cartridge, prepare the firmware in the browser, then install and wait for the
  restart identity check. A Restore M-VAVE firmware button reinstalls V15. Without a working USB updater on the
  device you need the recovery adapter. Cartridge save RAM on the device is lost at restart.
brick_risk: true
tags: [game, emulator]
