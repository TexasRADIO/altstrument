device: m-vave-fm-1
name: ETCH
summary: >-
  Draw-your-own-waveform synth: 8 voices, single-cycle waves A, B and a modulating C drawn on the device,
  morphing between them, a wave library, motion recording and an arpeggiator with a generative RIFF mode.
