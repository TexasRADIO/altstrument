- name: M-VAVE
  url: https://github.com/m-vave
source: https://github.com/balancechiang/fm1-midi-converter
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only with M-VAVE's section 7 permission to link with the FM-1 binary SDK, the same terms as the
  upstream FM-1 Open kit (LICENSE.md, copyright M-VAVE). The converter, string table and page styles come from that
  kit; this repository adds the page shell and build script.
homepage: https://balancechiang.github.io/fm1-midi-converter/
distribution: browser-installer
install_notes: >-
  Open the hosted page, or download index.html and open it from disk. There is nothing to flash. Back up an
  existing project before replacing it on the device.
brick_risk: false
