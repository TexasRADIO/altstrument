device: m-vave-fm-1
name: FM1 MIDI Converter
kind: tool
summary: >-
  Offline single-page converter between standard MIDI files and FM-1 V4 project files: MIDI in, a project built on
  a template you supply, or the stored step sequences of a project out as MIDI.
description: >-
  Writes the first 64 sixteenth-note steps of a MIDI file into a project, mapping General MIDI drum notes onto the
  808 kit and melody parts onto template tracks whose engine can play them. A V4 project to use as the sound
  template is required; none is bundled, and the template's presets, effects and arpeggiator settings are kept. The
  other direction exports the eight 64-step sequences of a project as format 1 MIDI. Files are read in the browser
  and not uploaded, and the page has English and Simplified Chinese interfaces. The code is extracted from the
  converter in M-VAVE's FM-1 Open kit. The repository holds no firmware and no flashing code.
status: active
authors:
