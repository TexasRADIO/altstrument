  headers (the Felucca platform code is GPL-3.0-only).
distribution: source-only
install_notes: >-
  No release yet. tools/build.py needs the JieLi pi32v2 toolchain (JIELI_TOOLCHAIN) and produces
  build/ctrl.fwsc, which tools/fm1_install.py installs over USB. Back up first and have M-VAVE's updater ready.
