device: m-vave-fm-1
name: FM-1 Ctrl
summary: >-
  Thin controller firmware that sends the FM-1's keys, knobs and buttons out as raw USB MIDI and takes MIDI
  back to light its LEDs, so the hardware can drive a firmware's browser emulator.
description: >-
  Contains no sound engine, sequencer or storage. Mapping lives on the browser side as a JSON control map, with
  a convention document and a first map for the Melodee emulator. The panel is reported as 7 encoders and 14
  buttons on CC 40 to 53, and a later commit adds LED feedback on CC 54 to 67. The repository has a host
  simulator, a browser panel emulator that shows the MIDI bytes, and a WebAssembly build of the firmware's own
  code. It builds on the x0x build and the Felucca platform layer. The author's notes mark the on-device flash and
  LED check as pending, and USB MIDI both ways as verified on a unit.
status: active
