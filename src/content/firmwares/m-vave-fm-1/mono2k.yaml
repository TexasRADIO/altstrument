device: m-vave-fm-1
name: MONO2K
summary: >-
  Prototype Monomachine-style firmware core: six tracks each with one mono machine, a 64-step sequencer with
  parameter locks and a lofi effects bus, on a 1-bit screen; no FM-1 build yet, runs in the browser.
description: >-
  Each track has one of nine machines (sine and noise, 8-bit SID-style, two FM, two wave, a digital wave machine and
  a vocal machine) written without floating point, with amplitude, filter, effects, distortion and
  three LFOs per track. The sequencer has 64 steps per track with accents, slides, parameter locks, trig
  conditions, ratchets, swing and live recording. The bus adds a reverb, beat repeat, tape wobble and ADPCM
  crunch, and MIDI uses Monomachine-style channels and CC numbers. The README says the core runs in a browser
  emulator and in a desktop test harness, that the FM-1 build around Felucca's platform layer is the next step,
  and that nothing has been flashed yet.
