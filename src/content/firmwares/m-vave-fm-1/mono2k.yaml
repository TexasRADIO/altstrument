  LICENSE file and README state GPL-3.0-only; the Inter Tight font is SIL OFL 1.1.
homepage: https://inigohernandez.github.io/mono2k/
distribution: download
install_notes: >-
  Download mono2k-0.1.fwsc (identity FM-1_980) from the releases page, or install it from the project's installer
  page or the FM-1 Firmware Hub over USB in Chrome or Edge. Back up what the FM-1 holds first. Installing another
  firmware replaces it, and holding OCT- while switching on reaches the updater. The repository also holds the
  sound and sequencer core, a browser emulator (web/build.sh) and a host harness.
brick_risk: true
