install_notes: >-
  No package is published yet. The repository holds the sound and sequencer core, a browser emulator
  (build it with web/build.sh), a host harness and an FM-1 build (firmware/fm1) whose first package is untested
  on hardware; the site's installer takes a .fwsc you build yourself.
