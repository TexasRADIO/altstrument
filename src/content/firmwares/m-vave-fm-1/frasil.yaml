distribution: download
install_notes: >-
  Download frasil-1.0.fwsc from the releases page and install it with base/tools/fm1_install.py from a recursive
  clone. The README says the FM-1 Firmware Hub will offer a browser install once FRASIL is listed there. To build
  it yourself, run ./build.sh (Docker and the JieLi toolchain and AC79 SDK are needed). To go back, install
  M-VAVE's V15; if the unit does not start, hold OCT- while switching it on for update mode.
brick_risk: true
