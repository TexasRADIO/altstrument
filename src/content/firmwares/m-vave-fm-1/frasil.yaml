device: m-vave-fm-1
name: FRASIL
summary: >-
  Ambient drone and texture instrument: tapped keys latch layered drones that swell with pressure, into a
  freezable reverb with tails up to a minute, with an arpeggiated bell voice on top.
description: >-
  Up to eight drone voices have three layers each: detuned saws, drifting additive partials and tuned noise. They
  feed an eight-line reverb with shimmer and a freeze control. A second voice, GLINT, plays two-operator FM bells
  by hand or through an arpeggiator that follows MIDI clock. There are twelve scales, chords built in the scale,
  sixteen scene slots with eight factory scenes, and MIDI over USB and TRS that sends incoming notes through the
  harmony. The README says it has no sequencer and composes nothing, and calls the status beta, saying the way
  scenes are saved may change. It is built on fm1-base and felucca-bsp. There is no release yet and the
  project's Pages site returned 404 when checked, so it has to be built from source.
status: active
