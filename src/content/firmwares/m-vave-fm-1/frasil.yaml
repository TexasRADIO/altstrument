distribution: source-only
install_notes: >-
  No package is published yet. Build it with ./build.sh in a recursive clone (Docker and the JieLi toolchain
  and AC79 SDK are needed) and install the package with base/tools/fm1_install.py. The README plans a listing on
  the FM-1 Firmware Hub for web installs. To go back, install M-VAVE's V15; if the unit does not start, hold
  OCT- while switching it on for update mode.
