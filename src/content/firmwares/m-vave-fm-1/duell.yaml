device: m-vave-fm-1
name: DUELL
summary: >-
  Bi-timbral synth built on Felucca: two simultaneous sound parts with their own engines, patches, effects,
  EQ and arpeggiators, in LAYER, SPLIT or STEREO modes, with patch morphing and about 100 factory sounds.
description: >-
  Developed emulator-first. The author has flashed it on one real FM-1 and reports the return to official
  V15 working about three times on that unit; this is untested elsewhere. Recovery notes in docs/RECOVERY.md.
