license: MIT
license_notes: >-
  LICENSE and NOTICE state that the page is MIT, relicensed on 2026-10-26; copies received earlier under GPL-3.0-only
  keep that licence. The update protocol and package reader copied unmodified from fm1-base (vendor/fm1-base/) stay
