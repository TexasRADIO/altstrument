device: m-vave-fm-1
name: fm-static
kind: tool
summary: >-
  Browser page that installs a .fwsc file you choose onto an FM-1 whose MIDI port has an unexpected name on your
  computer, so that the usual updaters cannot find it.
description: >-
  Built for the case where an operating system keeps a cached name for a USB MIDI port, which happens on macOS
  because many FM-1 firmwares share one USB id and send no serial number. The page reads a package in the
  browser, checks its CRCs and shows its identity and SHA-256, lists every MIDI port, and only sends data to a
  port with a usual FM-1 name or to one you pick with Try this port. It remembers your own port names, follows
  the FM-1 when its port changes during the update and can finish an update that was cut off. Only the unmodified
  official V15 is recognised by hash; a file of unknown origin needs a confirmation. The README says to use the
  firmware's own updater, or M-VAVE's, if that works for you.
status: active
authors:
- name: Chris Farrell (seajaysec)
  url: https://github.com/seajaysec
source: https://github.com/seajaysec/fm-static
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and NOTICE. src/fm1ota.js and src/fm1pkg.js are modified copies of Felucca's web installer
  files and keep Felucca's copyright lines.
homepage: https://seajaysec.github.io/fm-static/
distribution: browser-installer
install_notes: >-
  Needs Chrome or Edge on a computer with Web MIDI SysEx, on https or localhost. No firmware is included; you
  supply the .fwsc. The README says installing firmware is at your own risk.
brick_risk: true
tags: [flasher, utility, midi]
