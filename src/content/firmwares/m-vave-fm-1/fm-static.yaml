device: m-vave-fm-1
name: fm-static
kind: tool
summary: >-
  Browser installer for FM-1 firmware packages you choose, with a package and flash-layout analyser, guided
  intermediate installs and a way to reach FM-1s whose MIDI port has an unexpected name that the usual updaters miss.
description: >-
  Began as a fix for an operating system keeping a cached name for a USB MIDI port, which happens on macOS because
  many FM-1 firmwares share one USB id and send no serial number, and now covers more of the install. The page reads a
  package in the browser, checks its CRCs and shows its identity and SHA-256, lists every MIDI port, and only sends data
  to a port with a usual FM-1 name or to one you pick with Try this port. A layout view decodes the package's tables and
  previews the writes a supported loader would make, and can compare a raw flash backup file against a package. Where a
  firmware's updater refuses a package, the page can install a pinned generic updater first and then the chosen
  firmware, can finish an update that was cut off, and offers an optional cleanup that goes through official V15 and
  rewrites the voice region; it also treats Bubba Machine and Felucca-family loaders as special cases, and can install
  the m-bootloader for reviewed packages. Only the unmodified official V15 is recognised by hash; a file of unknown
  origin needs a confirmation. The README separates routes tested on a real FM-1 from ones that are not, and says to use
  the firmware's own updater, or M-VAVE's, if that works for you.
status: active
