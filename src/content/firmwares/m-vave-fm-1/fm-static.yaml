homepage: https://seajaysec.github.io/fm-static/
distribution: browser-installer
install_notes: >-
  Needs Chrome or Edge on a computer with Web MIDI SysEx, on https or localhost. You supply the .fwsc; NOTICE says no
  firmware is included, though the page vendors m-bootloader 1.2's installer package and fetches a pinned generic
  updater template from fm1-base for the routes that need them. The README says installing firmware is at your own risk.
