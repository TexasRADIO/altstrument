  their converted PCM data are CC0-1.0 (NOTICE.md). Restricted upstream artwork and sample packs are excluded.
homepage: https://dspaudio.github.io/mc-1/
distribution: source-only
install_notes: >-
  Build the experimental .fwsc package with tools/build_package.py (BUILDING.md). The author says installing it
  on hardware is unverified. Saves use two flash banks at 0x99000..0xAAFFF that other firmware may share. Hold
  OCT- and OCT+ for five seconds while stopped to reach UBOOT.
brick_risk: true
