device: m-vave-fm-1
name: PERF-1
summary: >-
  Live-performance groovebox for the FM-1: sixteen genres of self-playing pieces you
  steer in real time, with an auto-DJ, a deep drum sequencer, an acid line that
  answers itself, editable effects, Flex Beat, DJ snips, a web editor and your own DX7 voices.
description: >-
  A fork of RedtailWorks' HYP-1. The pad, bass, acid line, pluck and drums play
  by themselves from power-on; one button breaks the music down, builds it and drops
  it, and an auto-DJ can run that whole arc, bring in the next piece and follow the
  chords. There are sixteen genres of ten pieces (hypnotic techno, lofi, house, dubstep,
  dub, DnB, breaks, garage, electro, trap, disco, funk, reggae, synthwave, amapiano,
  trip-hop), each with its own kits, patterns, effects, compressor and chord habits, and
  any piece can be stored. The drum sequencer has Euclidean fills, per-lane chance, lane
  lengths for polymeter, a density control, a source pattern per lane, drum drift, a steps
  page (ratchets, push, ghost and accent on every step) and a phrase page (pattern chains,
  slices, half and double time, conditions). The acid line answers itself and can be edited
  step by step and frozen; the bass can play as a line; the pluck can remember and repeat
  itself (deja vu). The pluck can be one of 30 built-in DX7-style voices or up to 16 of your
  own loaded from a .syx file. The home screen shows the chord as a turning sigil with an
  eye that follows the section. There are four banks of effects (every effect has a page
  that draws it), beat FX, 27 Flex Beat patterns and DJ snips, scenes, undo, a mood macro,
  a JAM page, a stereo compressor and look-ahead limiter, and MIDI clock in. The second
  core renders the reverb, pad and DX voices, with load shedding and a USB status log. The
  project site has the installer (with backup and restore), a browser emulator with sound,
  a parameter and DX7 voice editor, and a manual.
status: active
authors:
