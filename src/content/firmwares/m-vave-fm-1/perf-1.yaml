device: m-vave-fm-1
name: PERF-1
summary: >-
  Live-performance groovebox for the FM-1: ten genres of self-playing pieces you
  steer in real time, with an auto-DJ, a deep drum sequencer, an acid line that
  answers itself, effects, a web editor and your own DX7 voices.
description: >-
  A fork of RedtailWorks' HYP-1. The pad, drone, acid line, pluck and drums play
  by themselves from power-on; one button breaks the music down, builds it and drops
  it, and an auto-DJ can run that whole arc, bring in the next piece and follow the
  chords. There are ten genres of ten pieces (hypnotic techno, lofi, house, dubstep,
  jungle, DnB, breaks, garage, electro, trap), each with its own kits, patterns,
  effects and chord habits, and any piece can be stored. The drum sequencer has
  Euclidean fills, per-lane chance, lane lengths for polymeter, a density control that
  thins or fills a lane by importance, a source pattern per lane, held pattern keys
  and drum drift. The acid line answers itself (octave, fifth, scale third, mirror,
  reverse, rotate, sparse or accents, up or down, on a bar or loop count or before a
  drum change). The pluck can be one of 22 built-in DX7-style voices or up to 16 of
  your own loaded from a .syx file. The home screen shows the chord as a turning
  sigil with an eye that follows the section. There are four banks of effects
  and DJ snips, scenes, undo, a mood macro, a JAM page and MIDI clock in. The
  reverb runs on the second core, with load shedding, and a USB status log.
  The project site has the installer, a browser emulator with sound, a parameter and
  DX7 voice editor, and a manual.
status: active
authors:
