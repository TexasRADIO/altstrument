homepage: https://fm1-redacted-installer.xrhetor.chatgpt.site/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer on the project page (Chrome or Edge, USB), which checks each package against a
  known hash and the FM-1's identity. It asks you to back up first and to keep M-VAVE's restoration firmware
  and updater at hand. Its backup editor works for Felucca only; stock firmware needs its own backup method.
