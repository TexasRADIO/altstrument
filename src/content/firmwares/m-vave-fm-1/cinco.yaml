homepage: https://mrjoshida.github.io/CINCO/
distribution: source-only
requires_stock: V15 or Felucca
install_notes: >-
  Build with ./build.sh (Docker and the JieLi toolchain) and install the result with the Felucca tools. The README
  says to return to M-VAVE's firmware with Felucca's Return to official V15 option or the OCT- and OCT+ boot
  recovery. The browser emulator on the project page needs no hardware.
