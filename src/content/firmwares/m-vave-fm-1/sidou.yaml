device: m-vave-fm-1
name: SIDOU
summary: >-
  Commodore 64 SID instrument and GoatTracker 2 compatible tracker for the FM-1 with its own two-chip SID emulation,
  a step sequencer, live play and MIDI input. Tested on one real FM-1.
description: >-
  Plays the SID's three voices on two chips with a 6581 or 8580 model, four presets, filter and pulse-width knobs
  and MIDI over TRS and USB, and adds three stereo effect slots after the chip. Songs are written on the panel with
  a step view and a tracker, can record notes from the keys, and are saved to the FM-1's flash as GoatTracker 2 files.
  The SID core is the author's own C code and the repository carries reference tests against libresidfp. .sid
  playback is still planned. It is built on Felucca's hardware layer, USB stack and update loader, and is also checked
  in the fm1-emu emulator. The release notes say version 0.2.0 has run on one real FM-1, and that the earlier
  0.2.0-m2-preview could not be updated over USB. It is a separate project from FM-1 SID.
status: active
authors:
- name: Denis Sablic (dsablic)
  url: https://github.com/dsablic
source: https://github.com/dsablic/sidou
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The project's own files are GPL-3.0-or-later. The firmware image links Felucca's GPL-3.0-only hardware layer
  and USB stack, so the image as a whole is GPL-3.0-only. It also carries data derived from reSID 0.16 and
  libresidfp (GPL-2.0-or-later), an MIT port of the Rings reverb, and three unmodified JieLi AC79 SDK files
  (Apache-2.0) in each package (LICENSING.md).
distribution: download
install_notes: >-
  Install the .fwsc from the releases page with Felucca's installer (fm1_install.py sidou-0.2.0.fwsc); the README
  says to read docs/flash-day.md first and keep the way back ready. To return to stock, install M-VAVE's official
  FM-1.fwsc the same way. If the unit does not boot, hold OCT- at power-on for the chip's ROM boot mode and restore
  with the unbricker. The author plans a wider test before v0.3.0, which is meant to be the first release for everyone.
brick_risk: true
tags: [synth-engine, fx, midi, emulator, research]
versions:
- version: 0.2.0
  date: 2026-10-22
  url: https://github.com/dsablic/sidou/releases/tag/v0.2.0
  notes: Adds on-device song writing with a step view and tracker, key recording, a second SID chip, MIDI clock and SysEx, and fixes USB-MIDI output so the unit installs and updates over USB.
