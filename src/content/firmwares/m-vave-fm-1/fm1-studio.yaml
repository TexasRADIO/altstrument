device: m-vave-fm-1
name: FM-1 Studio
kind: tool
summary: >-
  Android app that runs community FM-1 firmware engines (SLOOP, FM1 MOVE, Felucca, sloopDX, Ghoulbox, zp12) on a
  phone or tablet with a touch panel, piano roll and sound editors.
description: >-
  Builds each firmware's own C source into an Android app, showing the native 240 x 240 display with touch
  controls for keys, buttons and encoders. It adds a piano roll, drum and chord editors, a
  mixer, performance pads, external USB and Bluetooth LE MIDI input, and per-engine projects. The firmwares are
  pinned submodules and keep their upstream licences and credits. An ESP32-P4 port in the tree is described as
  internal and unfinished.
status: active
authors:
- name: thingsapart
  url: https://github.com/thingsapart
source: https://github.com/thingsapart/fm1-studio
source_status: open
license: GPL-3.0-only
license_notes: >-
  The app code is GPL-3.0-only; the bundled firmware, fonts and samples keep their own terms, listed in
  LICENSING.md. Some inherited icon atlases are marked all rights reserved by Hügelton Instruments and are not
  under the GPL.
homepage: https://github.com/thingsapart/fm1-studio
distribution: download
install_notes: >-
  Preview APKs are attached to the GitHub releases, or build with python3 android/build.py. It runs the
  firmwares on the phone and does not flash the FM-1.
brick_risk: false
tags: [emulator, editor, sequencer, midi]
