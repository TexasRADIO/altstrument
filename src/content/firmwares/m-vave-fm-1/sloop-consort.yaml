requires_stock: SLOOP 2.7
install_notes: >-
  Sideload consort.apk from the latest release (Android 6.0 or later with USB host support; the build is signed
  with a debug key), or open the web page in a Web MIDI browser. Back up the FM-1 project first; sample writes
  replace slot contents.
