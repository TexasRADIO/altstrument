device: m-vave-fm-1
name: Consort
kind: tool
summary: >-
  Android app and web page that works as a companion for an FM-1 running SLOOP 2.7: sampler, punch-in effects,
  song and backup library, theme sync and an offline renderer.
description: >-
  Narrow in scope on purpose, leaving sequencing and sound design to the machine and the SLOOP editor. The sampler
  records from the phone or imports audio, trims, normalises, sets loop points and root pitch, and sends IMA
  ADPCM at 22.05 kHz to the four user slots. The FX page holds the 27 punch-in effects as pads. The Songs page
  backs up the whole project including samples and keeps a phone-side library of .sloopsong files, and themes can
  be read, saved and written back. An offline renderer built from SLOOP 2.7.1 compiled to WebAssembly turns a
  song into a WAV. The same page runs as a PWA, where an iPhone needs a Web MIDI browser to reach the FM-1.
  The APK is signed with a debug key. The README says it was verified on a real FM-1 but not yet smoke-tested
  on a physical Android phone.
