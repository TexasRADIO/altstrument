homepage: https://grimmbient.github.io/grimm/
distribution: browser-installer
install_notes: >-
  Install from the FM-1 Firmware Hub in Chrome or Edge, or download grimm.fwsc from the release and run
  tools/fm1_install.py. Sounds, slots, settings and samples stay on the FM-1 across updates. The README points to
  the hub's Rescue page for a stuck FM-1.
