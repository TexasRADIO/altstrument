device: m-vave-fm-1
name: REGGAE-OS
summary: >-
  Early Felucca 1.6.1 derivative that adds four reggae sounds (organ and bass), four-knob editing and an
  animated organ and sound-system home screen. Untested on hardware.
description: >-
  Adds the Roots Organ, Rocksteady, Deep Roots and Digital Bass presets on top of Felucca's unchanged engines,
  with a home screen that edits four parameters per sound and animates an organ or a sound system. Felucca's
  other engines, effects, sequencing, MIDI and user presets are kept. The changes over Felucca are two new C
  files and small edits to the UI and engine tables. The README calls it a prototype and the hardware notes
  say no physical FM-1 has been used. A browser build of the emulator is hosted on GitHub Pages; the public
  Felucca installer does not install this firmware.
status: active
authors:
- name: Kemar Pennant (KemstheSage)
