source: https://github.com/KemstheSage/reggae-os
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherits Felucca's licensing: GPL-3.0-only as a combined firmware, with the Felucca-Engines submodule under
  MIT and ported DSP and fonts under their own licences (LICENSING.md, CREDITS.md).
homepage: https://kemsthesage.github.io/reggae-os/
distribution: source-only
install_notes: >-
  Build it yourself with the JieLi toolchain and AC79 SDK (BUILDING.md); no package is published. The author
  marks installation and recovery as hardware untested and points to Felucca's installation wiki and the
  FM-1 transporter for recovery.
