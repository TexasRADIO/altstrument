device: m-vave-fm-1
name: RemoteFM1
summary: >-
  Firmware that turns the FM-1 into a remote panel: keys, buttons, encoders and screen are streamed over USB so an
  FM-1 firmware built as an emulator core runs on a computer, with the unit as its panel.
description: >-
  The device sends its input as plain MIDI and draws the screen from tiles sent back over USB SysEx or a vendor bulk
  interface. A host program on macOS runs a firmware core such as ChoralRoot, Felucca or Melodee, using FM1VST's engine,
  and the sound plays on the computer. The stock firmware cannot run this way. It is built on TransitFM1, which comes
  from Dinghy, and keeps TransitFM1's boot stub and staged update loader. It answers installers as V15 so any installer
  can write over it later. The README calls the project early: one unit has run ChoralRoot at 20 frames a second.
status: active
authors:
- name: Quixotic7
  url: https://github.com/Quixotic7
source: https://github.com/Quixotic7/RemoteFM1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only. Parts come from Felucca and SLOOP through Dinghy and TransitFM1, and the boot
  stub from ChoralRoot FM-1. The Terminus font is SIL OFL 1.1, and JieLi SDK files are read from the user's own SDK
  checkout at build time.
homepage: https://quixotic7.github.io/RemoteFM1/
distribution: browser-installer
install_notes: >-
  Installer page in Chrome or Edge over USB, or tools/fm1_install.py with the .fwsc; the repository holds remote-0.1.1.fwsc.
  The README says RemoteFM1 answers as the official V15, so any Felucca-family installer can replace it. The host
  program is built with CMake on macOS and expects an FM1VST checkout. The README keeps the FM-1 Transporter and
  MvaveFM1Unbricker at hand for recovery.
brick_risk: true
tags: [platform, emulator, usb-midi, research]
