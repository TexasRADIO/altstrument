  notes: Bluetooth about six times faster and each screen change shown whole.
- version: 0.2.1
  date: 2026-10-27
  url: https://github.com/Quixotic7/RemoteFM1/releases/tag/v0.2.1
  notes: Moves to fm1-base with Bluetooth MIDI and USB audio, answers as its own firmware identity instead of V15, and adds a USB-only package.
