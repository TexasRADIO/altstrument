device: m-vave-fm-1
name: FM1VST
kind: tool
summary: >-
  Work-in-progress VST3, AU and standalone plugin that runs the firmware source of ChoralRoot, Felucca and
  Melodee against a host-side FM-1 model, with the panel as its editor.
description: >-
  Each firmware is compiled from its own unmodified source into a loadable core module, and a plugin switches
  between them. The eight physical knobs and the panel's 41 buttons and keys are exposed as host parameters,
  with settings for how a controller's buttons and clicking encoders are interpreted, MIDI in and out, and
  presets per firmware. The editor draws the FM-1 panel with colour themes. The README gives the status as
  phase 4 of a plan and builds only on macOS so far; there are no releases, so it is built from source with
  CMake.
status: active
authors:
- name: Quixotic7
  url: https://github.com/Quixotic7
source: https://github.com/Quixotic7/FM1VST
source_status: open
license: GPL-3.0-only
license_notes: >-
  Required by the firmware cores it builds; those are GPL-3.0-only under their own authors' copyrights.
distribution: source-only
install_notes: >-
  Clone with submodules and build with CMake 3.22 or newer and clang; JUCE is fetched at configure time. The
  build installs the VST3 and AU into the user's plug-in folders.
brick_risk: false
tags: [emulator, synth-engine, vst]
