device: m-vave-fm-1
name: FM1VST
kind: tool
summary: >-
  VST3, AU and standalone plugin for macOS on Apple silicon that plays community FM-1 firmware: about twenty are built
  from their own source as loadable cores, and any other .fwsc package runs in an emulator. The FM-1 panel is the editor.
description: >-
  Each native firmware is compiled from its unmodified source into a core module and the plugin switches between them,
  ChoralRoot, Felucca, Melodee, PIGEON, FMini-1 and others. An emulated core based on fm1-emu runs any firmware package
  from The Firmware Hub, or a .fwsc you load yourself. The eight physical knobs and the panel's 41 buttons and keys are
  exposed as host parameters, with settings for how a controller's buttons and clicking encoders are interpreted, MIDI in
  and out, and presets per firmware. The editor draws the FM-1 panel with colour themes. A virtual MIDI port lets a
  firmware's own web editor talk to the plugin, and the standalone app can record the screen and sound as a video. A
  Remote FM-1 mode connects to a unit running the RemoteFM1 firmware. The releases are unsigned and not notarised, and are
  built for macOS 11 or later on Apple silicon only.
status: active
authors:
- name: Quixotic7
  url: https://github.com/Quixotic7
source: https://github.com/Quixotic7/FM1VST
source_status: open
license: GPL-3.0-only
license_notes: >-
  Required by the firmware cores it builds; those are GPL-3.0-only under their own authors' copyrights.
distribution: download
install_notes: >-
  Download the .pkg installer or the .zip from a release (macOS 11 or later, Apple silicon). Neither is signed with
  a Developer ID or notarised, so macOS asks you to allow them in Privacy & Security; the zip's INSTALL.txt has the
  steps and how to rescan in Live and Logic. To build from source, clone with submodules and use CMake 3.22 or newer
  and clang; JUCE is fetched at configure time.
brick_risk: false
tags: [emulator, synth-engine, vst]
