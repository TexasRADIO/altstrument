  msfa is Apache-2.0, the samples are CC0 and the fonts are SIL OFL; the logo artwork is by the author.
homepage: https://marcocasanova00.github.io/amaru-os/
distribution: source-only
requires_stock: V15
install_notes: >-
  The repository publishes source only, with firmware/BUILDING.md for the build. The project site has an
  emulator and an install page that checks a package's hash and size before flashing over WebMIDI. Back up V15
  first. Holding OCT- at power-on opens the update-mode recovery, and docs/RESCUE.md names the rescue tools.
brick_risk: true
