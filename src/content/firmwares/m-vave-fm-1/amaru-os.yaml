device: m-vave-fm-1
name: AMARU OS
summary: >-
  Four-track generative firmware for hard dance genres on the FM-1, derived from Bunker Evolved: a seeded generator
  for tekno, acid, hardcore, jungle, drum and bass and psytrance with a choice of synthesis engines per track.
description: >-
  A derivative of Bunker Evolved that keeps its pages and adds a GEN page, where genre, seed, energy and form
  (a loop of one, two or four bars) set a repeatable pattern; the OCT keys step the seed or reset it. The tracks are
  named AIR, MELODY, ROOT and SPARK, and any engine (analog, phase, grain, FM6, formant, physical, noise, lo-fi or
  sample) can be placed on any track. The genre rules are modelled on JIANT's generator and some timbres are
  parameter shapes taken from Carnac OS and Mycelium, with no binaries from either. It has three monochrome
  palettes and a browser emulator. The README says it was tested on a real FM-1, while the quick-start guide says
  hardware validation is still pending, and no release or flashable package is published yet.
status: active
authors:
