device: m-vave-fm-1
name: Hortator
summary: >-
  Drum-machine firmware on Felucca: eight tracks of TR-808, TR-909 and Plaits drum models and samples,
  64-step sequencer with motion recording, Mutable Instruments Grids, a ducking compressor, resonators
  and live effects.
status: active
authors:
- name: DEADACTIVE
  url: https://github.com/DeadActive
source: https://github.com/DeadActive/hortator
source_status: open
license: GPL-3.0-only
license_notes: A C port of the Grids pattern engine is GPL-3.0-or-later; see LICENSING.md.
homepage: https://deadactive.github.io/hortator/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer; leaves through M-VAVE's M-UPGRADE. Browser emulator runs the real firmware
  compiled to WebAssembly. Beta per the fm1-editor.com directory.
brick_risk: true
tags: [drums, sequencer, sampler, fx, performance]
versions:
- version: 0.26.0
  date: 2026-10-28
  url: https://github.com/DeadActive/hortator/releases/tag/drum-v0.26.0
  notes: Adds MIDI clock out, MIDI-in routing and thru, live cueing of project slots and eight variations per slot, FILL step probability and slot copy and paste. The Bluetooth package gets a page for saved devices and FM-Link between two FM-1s.
- version: 0.25.0
  date: 2026-10-27
  url: https://github.com/DeadActive/hortator/releases/tag/drum-v0.25.0
  notes: Adds USB audio with a choice of two channels or ten (master plus the eight tracks on separate channels). The Bluetooth build stays two-channel.
- version: 0.24.0
  date: 2026-10-25
  url: https://github.com/DeadActive/hortator/releases/tag/drum-v0.24.0
  notes: Adds per-step parameter locks. A second package adds experimental Bluetooth MIDI.
- version: 0.23.3
  date: 2026-10-23
  url: https://github.com/DeadActive/hortator/releases/tag/drum-v0.23.3
  notes: Knobs speed up on fast turns and no longer skip clicks, a held step no longer turns off, and the USB name is now Hortator instead of Felucca.
- version: 0.23.2
  date: 2026-10-22
  url: https://github.com/DeadActive/hortator/releases/tag/drum-v0.23.2
  notes: REC arms tracks instead of starting playback; a REC tap off the TRACKS page arms every track for live finger-drumming.
- version: 0.23.1
  date: 2026-10-22
  url: https://github.com/DeadActive/hortator/releases/tag/drum-v0.23.1
  notes: Firmware unchanged from 0.23.0; the project site adds an anonymous install counter.
- version: 0.23.0
  date: 2026-10-22
  url: https://github.com/DeadActive/hortator/releases/tag/drum-v0.23.0
  notes: First release since 0.16.0; adds a Machinedrum-style voice bank, 151 factory presets, a four-slot LFO routing and a redrawn screen.
- version: 0.16.0
  date: 2026-10-11
  url: https://github.com/DeadActive/hortator/releases/tag/drum-v0.16.0
- version: 0.14.0
  date: 2026-10-08
  url: https://github.com/DeadActive/hortator/releases/tag/drum-v0.14.0
