source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Melodee and Felucca (LICENSING.md). Plaits, Braids, stmlib, DaisySP and Rings are MIT, the fonts
  and some ported code keep their own licences (LICENSES/), and the CZ-1 and Prophet-5/10 factory sound data is
  Casio's and Sequential's, with no licence granted.
homepage: https://seattleuser0.github.io/OrangeCat/
distribution: browser-installer
install_notes: >-
  The project site has a web installer for the latest build of main, and a web editor. Builds run on GitHub
  Actions through zvenson's fm1-build. The installer is Melodee's and offers a backup first and a way back to V15,
  but the README says the firmware is early and installing is at your own risk. The card features need a USB card
  reader on a powered hub.
brick_risk: true
