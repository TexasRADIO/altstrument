device: m-vave-fm-1
name: NOCT FM
summary: >-
  MIDI controller firmware for the FM-1 with a pixel night-sky screen and mapped profiles for FL Studio and Ableton
  Live, switched from the PRESETS knob, with DAW scripts for both.
description: >-
  Modifies CTL-1. Four banks of four knobs send fixed CCs on MIDI channel 16 for mixer, send and device or macro
  control, while notes go out on a chosen keyboard channel, with transport, record, panic, sustain, modulation,
  aftertouch and an optional built-in General MIDI voice. Feedback from the DAW updates the knob values on
  screen. The repository holds an FL Studio MIDI script and an Ableton Live remote script, a browser installer that
  checks the package size, SHA-256 and identity before writing, and a Windows simulator. The README is in Russian and
  calls the build an engineering alpha: the USB package builds in GitHub Actions, but nothing has been tested on a
  real FM-1 or inside the DAWs, and the Bluetooth build is unverified. It cannot import FM-1 factory projects.
status: active
