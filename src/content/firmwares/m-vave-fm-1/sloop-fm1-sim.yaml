device: m-vave-fm-1
name: Sloop FM-1 Simulator
kind: tool
summary: >-
  Self-contained browser simulator of an FM-1 running SLOOP 2.4.1, with the device keys or an expanded
  keyboard, USB-MIDI input and session import and export.
description: >-
  A static page that plays SLOOP's engine, compiled to WebAssembly, through Web Audio. It has a Device layout and
  an Expanded layout, selectable FM-1 colour finishes, a guided tutorial and an extra panel for audio settings,
  USB-MIDI input and session files. The author says playback may differ from the hardware. The repository holds
  the built site, a source archive and release metadata that names the source commit in the author's
  development repository. The engine is SLOOP 2.4.1, older than the current SLOOP release.
status: active
