device: m-vave-fm-1
name: Mutable Dreams
summary: >-
  Six-track generative instrument with eight engines taken from or modelled on Mutable Instruments' Plaits and
  Rings, 65 editable biomes, 128 sound presets and a granular send, with a browser version of the engine.
description: >-
  Each of the six tracks can take any engine: selected Plaits drum, FM, virtual analog and harmonic models, a
  Rings-style modal resonator and a choir voice written by the author. The 64 biomes (plus a blank one) set
  up scales, Euclidean rhythms, probability, swing and accents, and four live macros reshape them while playing.
  Tracks have their own filters, envelopes and granular sends, and the grain cloud can be frozen, reversed and
  transposed. A browser instrument runs the firmware engine for playing and for editing and exporting patch files,
  which stay in the browser and are not sent to the hardware. The device holds one saved state, and the granular
  audio is not saved. The README lists a physical FM-1 test run with stress cases, a ten-minute soak and a return
  to V15. The repository holds the release documents and source zips rather than a browsable source tree, and
  the author describes it as selected algorithms, not complete module ports.
