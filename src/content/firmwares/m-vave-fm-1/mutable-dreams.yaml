distribution: browser-installer
install_notes: >-
  Use the project installer in desktop Chrome or Edge over USB, or the Python installer kit.
  Direct update from Mutable Dreams 1.0 to 1.1 is supported and tested; visiting V15 first is unnecessary
  for that route. Stock V15 installation and return are documented in Recovery-1.1.txt and the illustrated
  English guide. Follow the published instructions for other starting firmwares; not every route is tested.
  Back up first. On 1.1 save both .mddb for stored banks and JSON for unsaved live edits; 1.0 does not
  support the new .mddb protocol. Returning to V15 erases 1.1 User Banks and preferences.
  Use the current website or supplemental 1.1 Browser.html, not the HTML in the original offline ZIP.
