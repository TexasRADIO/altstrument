homepage: https://mutable-dreams.sugarypixie10.chatgpt.site/
distribution: browser-installer
install_notes: >-
  Browser installer in desktop Chrome or Edge over USB, which checks the package fingerprint and the identity
  after the restart, or the Python updater in the installer kit. Start from M-VAVE V15; the guide says to
  restore V15 first if M-VAVE Open firmware is installed. A firmware change does not back up your project, so
  save your own copy first. See the Recovery guide in the repository.
