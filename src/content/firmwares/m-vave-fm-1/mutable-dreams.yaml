device: m-vave-fm-1
name: Mutable Dreams
summary: >-
  Six-track generative instrument with twelve engines, 76 editable Biomes plus Blank, 224 tones,
  user banks and granular, delay and room sends, with a playable browser instrument and live editor.
description: >-
  Each of the six tracks can use any engine. Selected Plaits, Rings and Elements algorithms sit alongside
  original voices including Choir, Round Bass, Mellow Drift and Satin Morph. Biomes combine scales,
  Euclidean rhythms, probability, swing and accents; bassline modes, glide and editable 16-step phrases
  provide additional ways to shape a piece. A global mixer controls track levels and shared effect sends.
  The device stores sixteen named User Biomes and 64 User Sounds. The browser instrument also works as
  a bidirectional hardware editor, with live-patch JSON transfer and full .mddb saved-bank backup and restore.
  Full-bank restore requires physical SEL confirmation. Granular audio is not saved in a Biome.
  USB MIDI was tested; TRS MIDI input is implemented but its physical cable test remains outstanding.
  The complete 1.1 source tree is directly browsable, with build instructions and a device test report
  describing the qualification scope. These are selected algorithms and inspired functions, not full
  ports of every Mutable Instruments module.
