device: m-vave-fm-1
name: EDDA OS
summary: >-
  Felucca 1.1.5.1 fork for one artist's live set: thirteen preloaded songs, 16-WAV user drum kits, a fourth
  sample slot, chord and filter additions, sequencer MIDI out with clock and twelve full-screen visualisers.
description: >-
  Built for the author's live performance of an album, with the album's songs loadable and cued from the keys, a
  Camelot-wheel key lock, a bank of rhythm patterns and a hard stop that re-enters on the one. Other additions
  are user drum kits of 16 WAV pads built from the web editor, a fourth user sample slot, CHORD+ with voice
  leading and strum, a one-knob filter per track, micro timing per step, dotted delay times, a sequencer output
  on USB MIDI with clock, and twelve visualisers over the HOME screen. The author's guide says the build passes
  the project's host tests and compiles with JieLi's toolchain on GitHub, and that it had not yet been flashed
  onto an FM-1. Install instructions are written for a Windows laptop with GitHub Actions doing the build. Felucca
  settings, projects and user samples are kept when moving between the two.
