homepage: https://github.com/mrsheez/felucca/blob/main/EDDA-OS.md
distribution: source-only
install_notes: >-
  EDDA-OS.md has two routes: let GitHub Actions build the package and publish an installer page from your own
  fork, or build with WSL2 on Windows and serve the installer locally, then install in Chrome or Edge over USB or
  with tools/fm1_install.py. The CI also writes its latest package to the ci-out branch. The installer's Return to
  official V15 and Felucca's own installer go back; the guide says installing is at your own risk.
