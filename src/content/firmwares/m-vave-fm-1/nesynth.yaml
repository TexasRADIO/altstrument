device: m-vave-fm-1
name: NESynth
summary: >-
  NES emulator for the FM-1: the keys are the controller, the audio runs on a second CPU core, and games are added
  to an on-device library over USB or Bluetooth. Browser site with a player, game uploader and installer.
description: >-
  Built on InfoNES and the Felucca hardware layer. Supports NTSC cartridges with mappers 0, 1, 2, 3, 4, 9 and
  11 and one controller. The site plays a dropped .nes or ZIP file in the browser. The installed core starts with
  an empty library and games are then sent from the site's Add games tab; the README's size limit is 256 KiB per
  cartridge. Three licensed homebrew games and an original diagnostic cartridge are included and no commercial
  ROMs are. The author reports about 60 emulated frames a second on the FM-1 in one game, with a lower screen
  refresh rate, and calls other games experimental. The browser simulator has FM-1 and SMK-37 layouts and a CRT
  television view. The repository also builds for the SMK-37 Pro and Elite, with their own releases. Those builds
  are not listed under the SMK-37, because their installer downloads M-VAVE's SMK-37 stock package from a
  third-party mirror.
status: active
authors:
- name: Chance Roth (ChanceTheMaker)
  url: https://github.com/ChanceTheMaker
source: https://github.com/ChanceTheMaker/NESynth-FM1-SMK
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says the integration is GPL-3.0-only; InfoNES is Apache-2.0. The bundled homebrew ROMs are
  From Below (MIT), CodeMaster (GPL-3.0, with its source zip) and Diamond Chase (MIT); the licence files are
  beside them. Includes M-VAVE's FM-1 V15 image (FM-1_015.fwsc), which M-VAVE licenses under Apache-2.0 in
  m-vave/fm1_open; the copy at web/firmware/fm1-original.fwsc has the matching git blob ce49cc1. The
  repository's notice calls it the unmodified vendor package under its own terms and does not carry an
  Apache-2.0 notice for it.
homepage: https://chancethemaker.github.io/NESynth-FM1-SMK/
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15
install_notes: >-
  Chrome or Edge over USB. In the Install firmware tab choose FM-1 and install; the page prepares and checks the
  package locally and expects the new firmware identity after the restart. Then use the Add games tab to send a
  cartridge over USB or Bluetooth. A Return to the original M-VAVE synth option reinstalls V15. The author tested
  the FM-1 build on hardware and lists some mapper support as untested there.
brick_risk: true
tags: [game, emulator]
