  url: https://github.com/adamcharleswilsonmusic-code
source: https://github.com/adamcharleswilsonmusic-code/Fart-Machine-One
source_status: open
license: GPL-3.0-only
license_notes: >-
  Covers the code and original artwork. The recordings have separate, unverified terms (samples/ATTRIBUTION.md),
  and the code licence does not relicense them.
distribution: download
install_notes: >-
  Download fart-machine-one.fwsc and the source zip from the release, then run tools/fm1_install.py (Python 3 with
  mido and python-rtmidi). Installation replaces the current firmware. If an update is interrupted, run the same
  command again.
brick_risk: true
