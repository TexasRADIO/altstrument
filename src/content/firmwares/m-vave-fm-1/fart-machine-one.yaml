device: m-vave-fm-1
name: Fart Machine One
summary: >-
  Novelty sample instrument: eleven fart sounds across all 27 keys, a one-bar 16-step loop recorder, reverb and
  delay, with an animated cartoon on the screen.
description: >-
  A derivative of FoMni. Keys play one-shot samples; REC records and overdubs one pattern that is kept in RAM
  only and lost at power-off. Tempo, reverb and delay have knobs, and MIDI channel 1 notes 53-79 play the keys.
  The author reports the eleven recordings come from Pixabay and says their individual redistribution terms
  are not independently verified.
status: active
authors:
