license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md, as for GHOULBOX and Felucca. The five vendored Felucca engines are MIT, the Hügelton Sample
  Pack is CC0 1.0, ported DaisySP and Rings code is MIT and msfa is Apache-2.0; other bundled parts keep their own
  licences, listed in LICENSING.md.
homepage: https://fm-1.drewr.dev/estampie/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or the .fwsc from the release with FM1Kit or FM-SWITCH. The installer
  bundles M-VAVE's V15 to go back to stock and offers an optional full backup first. The README says M-VAVE's own
  updater returns the FM-1 to stock, and the release notes ask for a backup before installing.
brick_risk: true
