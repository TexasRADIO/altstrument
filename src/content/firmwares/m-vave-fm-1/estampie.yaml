device: m-vave-fm-1
name: ESTAMPIE
summary: >-
  Groovebox for medieval dance music, forked from GHOULBOX and Felucca: thirteen engines on four tracks, hurdy-gurdy,
  lute, shawm and bagpipe sounds, modal tunings, velocity and aftertouch from the FM-1's own keys, and a screen-reader link.
description: >-
  ESTAMPIE keeps GHOULBOX's hurdy-gurdy, drone latch and historical temperaments and rebases them on Felucca 1.6.1, with
  Felucca's later sequencer and effect additions, then adds its own look, a parchment-coloured screen with an illuminated
  boot screen, and a TROTTO scene, a DANCE drum kit and medieval presets. KEY TOUCH estimates how hard 20 of the keys
  are pressed to give velocity and aftertouch, after Charles Vestal's Velo and MONK-1, and has a calibration page. A screen
  reader on the computer can read what the FM-1's screen shows through fm1-reader, using ESTAMPIE's own wording. The
  project site has a browser emulator, a web installer, an editor and a user guide. The author says most sounds are
  still GHOULBOX's, that 0.2.0 was tested on one FM-1, and that 0.3.0 was tested in the simulator and browser version.
status: active
authors:
