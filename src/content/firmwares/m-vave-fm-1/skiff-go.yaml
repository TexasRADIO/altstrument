homepage: https://github.com/jahlib/skiff-go
distribution: source-only
requires_stock: Skiff 2.0 or later
install_notes: >-
  Build with JDK 17 and the Android SDK using build-android.sh, which makes a debug APK or a debug-signed release APK.
  The phone needs USB host support and an FM-1 already running Skiff. Back up the FM-1 first, since the app writes to
  the unit.
