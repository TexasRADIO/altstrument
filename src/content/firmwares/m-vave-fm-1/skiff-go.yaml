device: m-vave-fm-1
name: Skiff Go
kind: tool
summary: >-
  Native Android editor and performance companion for Skiff on the FM-1, talking to the unit over USB-MIDI; early,
  with sound, mixer and sequencer pages so far.
description: >-
  A Kotlin and Jetpack Compose app, sister to Sloop Go, that connects to an FM-1 over Android's MIDI API and uses
  Skiff's editor protocol. It checks the unit's identity and refuses SLOOP and Felucca, and wants Skiff 2.0 or later.
  So far it has transport controls, the sound pages for the selected track (envelope, LFO, modulation, effects, scale,
  arpeggiator and others), a six-strip mixer, a sequencer page with a piano roll on Skiff 2.0's per-note lengths, a drum
  grid and a step sheet, and saving or opening patch and library files in the format of the Skiff web editor.
  Parameter locks, the song, menu settings, FM6, samples and backup are listed as next. Its first release, 0.1.0, is
  marked pre-release and carries an APK.
status: active
