device: m-vave-fm-1
name: Skiff Go
kind: tool
summary: >-
  Native Android editor and performance companion for Skiff on the FM-1, talking to the unit over USB-MIDI; early MVP
  with the sound and mixer pages so far.
description: >-
  A Kotlin and Jetpack Compose app, sister to Sloop Go, that connects to an FM-1 over Android's MIDI API and uses
  Skiff's editor protocol. It checks the unit's identity and refuses SLOOP and Felucca, and wants Skiff 2.0 or later.
  So far it has transport controls, the sound pages for the selected track (envelope, LFO, modulation, effects, scale,
  arpeggiator and others), a six-strip mixer, and saving or opening patch and library files in the format of the Skiff
  web editor. The sequencer, song, FM6, sample and backup pages are listed as still to come. The README calls it an
  MVP that has not been tested yet, and no APK is published.
status: active
