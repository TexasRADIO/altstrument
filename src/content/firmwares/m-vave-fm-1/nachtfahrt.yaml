device: m-vave-fm-1
name: NACHTFAHRT
summary: >-
  Generative Berlin School instrument that plays itself from power-on: two drifting sequences over a chord drone, a
  gliding lead and an atmosphere, in eight pieces after Tangerine Dream, Klaus Schulze and Ashra.
description: >-
  A fork of DUB-1, which is a fork of AMB-1, keeping their echo, plate reverb, pieces system and platform. The first
  sequence has up to 16 steps on a plucked analog-style voice, with its notes repeated at the echo times (a dotted
  eighth by default). The second sequence is often a step shorter, so the two drift apart and meet again. A drone plays
  a walking chord on two banks of voices with a pedal and a phaser, a lead plays long glided phrases deep in the
  reverb, and an atmosphere layer offers wind, surf, rain, space, air or tape. Every layer's filter moves on its own clock
  around the cutoff you set, a bridge in the middle of each piece brings the layers' filters apart and together, and
  a piece repeats until switched off. The white keys play the lead in the piece's scale, the black keys are
  eleven effects held while pressed, and a PERFORM page mutes and solos layers. The project site has a browser
  emulator and a manual. The README and manual still describe version 0.1 as untested on hardware, while the 0.9.0
  release notes say it has run on a real FM-1, at about 48% average and 73% peak audio CPU load.
