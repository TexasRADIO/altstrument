device: m-vave-fm-1
name: Felucca Try (MIDI knobs)
kind: tool
summary: >-
  Copy of the browser Felucca emulator page with an opt-in setting that lets a MIDI controller's knobs turn the
  panel's knobs.
description: >-
  Runs the unchanged Felucca 1.5.1 build in the browser, the same as the project's own emulator page. The one
  addition is an option, off by default, that maps CC 20 to 27 on any channel to the panel's select, algorithm,
  presets, four knobs and master volume. A selector chooses how the controller sends them (absolute, or three
  relative encodings), and both settings are kept in the browser. With the option off every CC goes to the
  firmware as before. Needs Chrome or Edge for Web MIDI. The page changes are published on a branch of the
  author's Felucca fork.
