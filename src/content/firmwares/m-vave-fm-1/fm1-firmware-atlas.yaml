device: m-vave-fm-1
name: FM-1 Firmware Atlas
kind: tool
summary: >-
  Single-page directory of 67 FM-1 firmwares with their purpose, engines, MIDI behaviour and a project-health rating taken
  from GitHub activity, plus a six-step guide for new owners.
description: >-
  The data lives in a JSON file with one object per firmware, and a build script generates the page and a Markdown copy
  of the tables from it; a second script refreshes last-push dates and stars. Health is rated from the repository's last
  push, or marked removed when the repository returns 404. The README says it was seeded from aroum/fm1-custom-fw. It
  links to other directories and does not host firmware files.
