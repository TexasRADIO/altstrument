  ESP8266SAM is GPL-3.0. The installer page's head model is CC-BY-4.0 and the Terminus font is SIL OFL 1.1.
homepage: https://mhellar.github.io/numetal-skratchmaster-pro-fm1/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Web installer on the project's page in Chrome or Edge over USB, or numetal-pro-2.0.fwsc from the repository
  with tools/fm1_install.py. Holding OCT- at power-on enters a rescue mode with only the updater. The
  first start of 2.0 resets saved settings to defaults.
