device: m-vave-fm-1
name: NU//METAL SKRATCHMASTER PRO
summary: >-
  Robot-turntablist firmware: a speech synthesizer says 27 words onto a virtual record that you scratch with the
  keys and encoder, over a drop-tuned guitar, bass and drum band, with a rap mode, an LFO and a mixer.
description: >-
  Rights warning: the speech engine is a C port of SAM, the 1982 Software Automatic Mouth, via ESP8266SAM
  (GPL-3.0); the original program has no stated licence. Built on Dinghy and Felucca's platform code, it says its
  words in eight voices and scratches them with 17 techniques scored the way turntablists notate them, plus combo
  routines, a hamster switch, crossfader curve and motor torque settings. Rap mode alternates four bars of rhyming
  verse with four bars of hook in a growled voice, over ten grooves. The PRO edition adds a tempo-locked LFO with
  seven shapes and six destinations, a tone-play mode where the keys are a pitch fader, a mixer page and a
  larger sound chain with reverb, compressor and limiter. It installs over the earlier 1.0 release, which uses
  the same identity, FM-1_926. The README says 2.0 runs on the FM-1.
status: active
authors:
