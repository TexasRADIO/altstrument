device: m-vave-fm-1
name: Trawler
summary: >-
  Tracker-style firmware for the FM-1 in the line of LSDJ, with Song, Chain, Phrase, Instrument, Table and
  Groove views. Stopped after its phrase editor; it only runs in a browser emulator.
description: >-
  Reached two of its planned phases: a data model, a sample-exact sequencer, a wave engine with filter and
  envelope, and a phrase view with note and hex entry. It runs as the same C code natively for tests and as
  WebAssembly in a virtual FM-1 page played from the computer keyboard. The author archived it on 2026-10-10,
  judging the FM-1's encoders and small screen unsuited to a tracker, and moved the platform and DSP into
  FM80S. There is no build for the device, and the documentation is in French.
