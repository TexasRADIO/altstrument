device: m-vave-fm-1
name: FM-1 Designer
kind: tool
summary: >-
  Browser editor for designing FM-1 panel states: key and button LEDs, knob labels and a mock-up of the 240x240
  screen, saved as JSON that people and LLMs can edit.
description: >-
  Models the 27 keys, 14 buttons, seven encoders, the master pot and the colour screen as the open firmwares
  see them. Designs have up to 24 states, with LED levels painted per control, per-state labels, notes, and
  screen layouts built from templates in Felucca's palettes. It exports PNG sheets and a documented
  fm1-panel-design JSON format, and a small Python server can render exports from a script. It was written to
  plan the ChoralRoot firmware and does not talk to the hardware. A single index.html with no build step.
