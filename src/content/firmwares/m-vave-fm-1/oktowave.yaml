install_notes: >-
  Web installer on the project site (Chrome or Edge, USB), which serves the project's own build and, for the
  return to official firmware, asks you to select M-VAVE's FM-1.fwsc that you downloaded from M-VAVE; the site
  does not host it. The README advises a backup first and says 0.1 is untested on hardware.
