device: m-vave-fm-1
name: OKTOWAVE
summary: >-
  Felucca 1.6.1 with one added engine, WAVELET, a fixed-point port of the subtractive engine of the author's own
  Wavelet Synthesizer plug-in, with 69 of its presets. The author says 0.1 has not been run on an FM-1.
description: >-
  WAVELET splits one cycle of a source wave with a discrete wavelet transform (Haar, Daubechies 2 to 20, a
  symlet and a coiflet) into nine bands of atoms. The smallest atoms can be dropped with a sparsity setting, and
  the bands play through a scale filter (low-pass, high-pass or band-pass with slope and resonance) and a
  window that lets the dry cycle through. It is the fourteenth engine alongside Felucca's, and the rest of
  Felucca (four tracks, sequencer, arpeggiator, effects, USB audio and MIDI) is unchanged apart from small edits
  for the engine table, a per-block build scheduler, package names and the site. The same author's Wavelet
  Synthesizer is a separate web app and VST3/VST2 plug-in under GPL-3.0, which is not firmware and is not
  catalogued. The README says the build was tested only on computers: Felucca's host suite, the engine's own
  test against a floating-point reference, and the browser build. The project site has an installer, a Try
  page and a manual.
