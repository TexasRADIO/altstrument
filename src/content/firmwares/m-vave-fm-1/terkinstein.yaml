device: m-vave-fm-1
name: TERKINSTEIN
summary: >-
  Dark performance synth and four-track groovebox with 64 curated sounds, six-operator FM, metallic distortion,
  synthesized drum kits and pads, a reactive purple-and-green display, and 64-step tracks with four pattern banks.
description: >-
  Derived from Dinghy with Felucca and SLOOP platform work. Tracks are drum, melody, atmosphere and bass, with
  live recording, held notes, an arpeggiator, a metronome and MIDI notes, wheels and pedals. The home screen
  animates in response to playing. The README calls 0.22.0-dev a development preview built and installed on
  one FM-1.
