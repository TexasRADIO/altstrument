license: GPL-3.0-only
license_notes: >-
  Stated as GPL-3.0 only in the README and THIRD_PARTY.md. The Beads port in core/beads keeps Mutable Instruments'
  MIT licence, the screen fonts are SIL OFL 1.1, and the FM-1 platform layer and installer are Felucca's and X0X's
  (GPL-3.0). A package also carries three JieLi AC79 SDK files (Apache-2.0).
homepage: https://de-pattern.github.io/Ravel_FM1/
distribution: source-only
install_notes: >-
  Build with tools/build_fm1.py (JieLi toolchain and three AC79 SDK files fetched by scripts in tools/) and install
  the package with tools/fm1_install.py. The README also describes a web installer and a downloadable
  Ravel-FM1.fwsc on the project site, but on 2026-10-19 the site served only the README and those paths returned
  404. Holding OCT- and OCT+ for five seconds enters update mode, a firmware that crashes twice at start comes up
  in a safe mode the installer can reach, and the installer's return to stock asks you to pick M-VAVE's own V15
  file, which it checks by SHA-256. The README warns that it is untested on hardware.
brick_risk: true
