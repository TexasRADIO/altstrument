device: m-vave-fm-1
name: Ravel
summary: >-
  Eight-track sound-design groovebox with synth, strike and tape tracks that share a capture tape, an influence grid
  where tracks modulate each other, a step and graph sequencer, and a browser emulator. Not yet run on an FM-1.
description: >-
  Tracks 1 to 4 are synths with six engines (virtual analog, phase distortion, FM, physical models, formant and
  particle), tracks 5 and 6 excite resonant bodies, and tracks 7 and 8 have no oscillator and play back a shared
  capture tape as looping playheads, grain clouds (a fixed-point port of Mutable Instruments Beads) or slices. Any
  track can modulate, trigger or clock another through an eight by eight influence grid. Each track runs either a
  step sequencer or a graph of cords, and there are two LFOs, a modulation matrix, four macros, delay, reverb,
  feedback, filter-pair and vocoder buses, scenes, an arrangement and eight project slots. The same C sources
  build the FM-1 firmware, a desktop simulator and a one-file WebAssembly emulator. The README says the firmware
  builds but has not been run on a real FM-1, and the FM-1 side takes its platform layer from Felucca by way of
  X0X.
status: active
