device: m-vave-fm-1
name: zp12
summary: >-
  12-bit sampling drum machine in the spirit of the SP-1200: 32 pads at 26 kHz without interpolation,
  8 filtered channels on the knobs, loops on the black keys, songs, swing and punch-in FX.
description: >-
  A SLOOP fork on sloopDX's platform that saves beside sloopDX's banks without touching them. User samples
  are dropped onto pads from a browser editor and sent over WebMIDI. The fm1-editor.com directory lists
  it as a test build.
status: active
authors:
- name: Sven Trogus (zvenson)
  url: https://github.com/zvenson
source: https://github.com/zvenson/zp12
source_status: open
license: GPL-3.0-only
license_notes: >-
  Code inherits GPL-3.0-only from Felucca and SLOOP; assets are covered in LICENSING.md.
homepage: https://zp12.designburgapps.com/
distribution: browser-installer
install_notes: Browser WebMIDI installer from the project site. Sample editor in the browser.
brick_risk: true
tags: [drums, sampler, sequencer, fx, performance]
