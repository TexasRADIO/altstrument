distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py with the .fwsc from the releases page.
  The installer's Back to M-VAVE's firmware option writes V15 back; a failed start twice in a row enters a
  safe mode the installer can still reach. The author has tested it on one unit so far.
brick_risk: true
