device: m-vave-fm-1
name: Niagara Drift
summary: >-
  Drone synth: two always-on drones with partner and sub oscillators, resonant filters, an LFO with two waves,
  a rhythmic swell, delay and reverb, 16 scenes and slow automatic drift.
description: >-
  Each drone has a waveform blend from sine to square, a partner oscillator at an interval, a sub or
  subharmonic, noise and a self-oscillating filter. The drones can be linked by pitch, hard sync or filter
  cross-modulation. Parameter changes glide over a set morph time, and a motion loop records knob moves. Built
  on FoMni, X0X and Felucca's platform. A browser emulator runs the same code with sound.
status: active
authors:
