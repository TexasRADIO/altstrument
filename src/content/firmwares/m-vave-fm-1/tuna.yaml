device: m-vave-fm-1
name: Tuna
summary: >-
  Generative music firmware built on Felucca's engines that plays in the manner of 89 composers and styles and 86 genres, with Marbles-style randomness shaped by music theory.
description: >-
  Tuna composes melody, bass, accompaniment and percussion as it plays; the same seed always plays the same music.
  The library is organised by era and decade, each entry with its own harmony, rhythm and instruments (93 on
  Felucca's engines), and eight character presets work without a composer. It adds odd meters, historical
  tunings, a sympathetic-string resonator, a sequencer that freezes what you hear into an editable pattern with
  conditions and parameter locks, 16 save slots, and per-part MIDI out with clock. The Marbles random section is
  a port (MIT). The project site has a browser emulator and a web installer, and the repository keeps Felucca's own
  README as docs/FELUCCA.md.
status: active
