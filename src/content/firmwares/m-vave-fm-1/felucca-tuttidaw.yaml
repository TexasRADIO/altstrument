  url: https://github.com/weavejam
source: https://github.com/weavejam/Felucca
source_status: open
license: GPL-3.0-only
license_notes: >-
  The plugin and the changes to Felucca are GPL-3.0-only (LICENSING.md); the engines Felucca bundles keep their
  MIT licence.
homepage: https://felucca.plugins.tooljams.com/
install_notes: >-
  Add the plugin from tuttidaw, or open the page on its own as an emulator; saves stay in the browser. To build it
  you need emcc and node (web/plugin/build.sh).
