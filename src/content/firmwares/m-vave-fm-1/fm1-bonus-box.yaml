device: m-vave-fm-1
name: FM-1 Bonus Box
kind: tool
summary: >-
  DIY ESP32-S3 box for the FM-1's MIDI input with a preset browser, sustain input, WiFi soundbank page and a
  sing-on-key trainer, plus a Python command-line tool that reorders and sends 128-voice banks over USB.
description: >-
  The computer-side tool, fm1_soundbank.py, lists, moves and exports the 128 presets as four DX7 bank files
  and sends them over USB MIDI, for example to put a chosen voice in slot 001. The box is the author's own
  hardware design, with Arduino sketches, schematics and a USB-host bridge, and does not modify the FM-1's
  firmware. The README says the v2 box and its WiFi page have not been built or tested on a real board, and
  that the FM-1 needs a knob turn on the unit to confirm each received bank. No voice data is included.
  An earlier version was an Arduino sustain-pedal converter.
status: active
authors:
- name: pfkellogg
  url: https://github.com/pfkellogg
source: https://github.com/pfkellogg/fm1-bonus-box
source_status: open
license: unspecified
license_notes: >-
  No LICENSE file. The README says the DOO VOICE patch generated by tools/doo_voice.py is CC0.
distribution: source-only
requires_stock: V14 or later for live preset browsing
install_notes: >-
  The CLI needs Python with mido and python-rtmidi and your own .syx banks in banks/. The box is built from the
  listed parts and flashed from the Arduino IDE with the esp32 core and a LittleFS partition scheme. Back up
  the FM-1's current banks first; the unit cannot send its voices back.
brick_risk: false
tags: [librarian, midi, hardware]
