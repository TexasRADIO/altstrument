device: m-vave-fm-1
name: Frodhes
summary: >-
  Physically modelled Fender Rhodes electric piano: hammer, tine, tonebar and pickup computed live, with four instrument types, a compressor-to-reverb effects chain, arpeggiator, chord mode and a pattern recorder.
description: >-
  Four instrument types (Stage 77, Suitcase, Early Felt, Bell Dyno) are adjustable in tone, bark, bell, hammer,
  decay and noise. The effects are compressor, drive, tremolo or wah, phaser, chorus, delay and reverb, with a
  PERFORM page that puts effect amounts on the four knobs. Also included are tap tempo with MIDI clock sync,
  scales, chord mode, an arpeggiator, a 1 to 16 bar pattern recorder with quantise and overdub, a sustain pedal,
  12 factory and 16 user presets, and MIDI over USB and TRS. The README describes it as built on Dinghy and the Felucca
  platform layer, and the project site has a browser emulator and a manual. Hardware test scripts are
  in the repository.
status: active
authors:
