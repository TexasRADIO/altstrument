device: m-vave-fm-1
name: Bubba Machine
summary: >-
  Six-track live groovebox written from scratch in C99: TR-style drum machine, 8-slice sampler, wavetable
  bass and three assignable synth/kit/MIDI tracks, with polymeter, p-locks and crash-resilient flash saves.
description: >-
  No code from other FM-1 firmware; only hardware facts from public reverse engineering. The README says
  to install only once a tested version exists: it runs in a desktop simulation and a WebAssembly emulator,
  and a hardware flasher is on the roadmap. The GitHub releases carry no firmware assets. Documentation
  is mostly Spanish.
