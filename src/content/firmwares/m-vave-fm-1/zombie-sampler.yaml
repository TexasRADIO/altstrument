device: m-vave-fm-1
name: Zombie Sampler
summary: >-
  Dedicated FM-1 sampler firmware from the Zombie Core project: 32 pads, four user PCM slots, chop, reverse, choke
  groups and one-shot, gate or loop playback, with Minecraft sound effects as starter material.
description: >-
  Rights warning: the Sampler bundles short Minecraft Java 1.21.1 mob sounds (zombie, hurt, death, creeper, XP and
  boom), converted to 11 kHz mono WAVs; the project's own provenance file says they are Mojang/Microsoft
  copyrighted, not CC0 and not covered by the code licence.
  The Sampler is the second edition split out of Zombie Core in 0.8.0, next to Zombie Groovebox. It boots into
  Standalone mode, and HOME plus SEL cycles Standalone, DAW Synth and DAW Controller for the session. Pads are
  edited on the device and in the browser editor, which also loads user WAV files. The developer reports host,
  WebAssembly and stub-DAW tests only and says physical FM-1 flashing, the display and real DAW sessions are not
  verified; the release notes mark hardware testing as pending. Dedicated FL Studio and Ableton Live profiles map
  the pads.
status: active
