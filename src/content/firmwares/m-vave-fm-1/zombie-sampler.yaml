license: MIT
license_notes: >-
  Application, DSP, UI and DAW profiles are MIT; the hardware, boot and update platform is MPL-2.0. The bundled
  Minecraft sound effects (audio-provenance/ in the source archive, with the original asset URLs and SHA-1
  hashes) belong to Mojang/Microsoft and are outside both licences.
homepage: https://joolo09.github.io/zombie-fm1-web/
distribution: browser-installer
install_notes: >-
  Open the project page in Chrome or Edge, pick the Sampler package, find the FM-1 and install; the installer
  checks size, SHA-256 and package identity and verifies the restarted unit. Close DAWs and other MIDI tabs, and
  back up projects and WAVs first. No stock-return tool is documented.
