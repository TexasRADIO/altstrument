device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: FM-1 Firmware Developers' Wiki
kind: tool
summary: >-
  Community-written reference for people writing custom firmware for the FM-1 and SMK-37: hardware, memory
  map, boot chain, package format, update protocol, recovery and programming notes.
description: >-
  Pages cover the JieLi AC79 chip, pinout, display, controls and audio output, the bootloaders, the .fwsc
  package format and the update protocol, flash storage, the second core, debugging, and simulators and
  emulators, plus a list of known projects and tools and a page of open questions. Each fact is tagged by
  where it comes from: measured on a unit, the vendor SDK, reverse engineering, working firmware, or
  unverified. It is published as a site and takes corrections by pull request.
