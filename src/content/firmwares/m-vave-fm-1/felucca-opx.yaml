device: m-vave-fm-1
name: Felucca-OPX
summary: >-
  Felucca 1.5.1 fork that adds OPX, a six-operator altered-FM engine after the Korg opsix with its 40 algorithms, a user modulation matrix, 23 waveforms and seven factory patches.
description: >-
  OPX plays up to six voices, each with six operators that have their own waveform, ratio or fixed pitch, level
  and envelope. The algorithms are the DX7's 32 plus the opsix's eight, and a USER 6 by 6 matrix sets how much
  each operator modulates each other one. Macros on the edit pages are reachable from automation, step locks and
  MIDI CC. The opsix's other operator modes, extra envelopes, LFOs, filter and effects are not implemented yet,
  and an OPX track's own patch is not saved in user presets or the editor's backup. The rest of Felucca is
  unchanged. User sample slot 3 is halved to 40 KB, and a project with an OPX track opens only on this firmware. The
  project has a web installer and a browser emulator.
