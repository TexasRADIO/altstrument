  url: https://github.com/shcherbakov7
source: https://github.com/shcherbakov7/m-wave-fm1-browser-emulator
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSES.md states GPL-3.0-only for the project and for the emulator core taken from simonjohansson/fm1-emulator;
  the Apache-2.0 JieLi SDK text is kept in LICENSES/. The firmwares the page loads keep their own licences.
homepage: https://shcherbakov7.github.io/m-wave-fm1-browser-emulator/
distribution: browser-installer
install_notes: >-
  Open the hosted page and choose a firmware. For M-VAVE's official firmware the page requests FM-1.fwsc from
  M-VAVE's own file server in your browser instead of hosting it; the file there is currently 699,956 bytes, the
  size of the V15 package, and if the server refuses the request the page links to the file so you can load it yourself.
  Building locally needs Rust with the wasm32-unknown-unknown target and tools/build-web.sh.
brick_risk: false
