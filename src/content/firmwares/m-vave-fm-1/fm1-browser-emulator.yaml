device: m-vave-fm-1
name: FM-1 Browser Emulator
kind: tool
summary: >-
  Rust and WebAssembly emulator of the FM-1's two-core JieLi chip that runs unmodified .fwsc packages in a
  browser, with a clickable panel, 240x240 screen, audio and flash. Its README is in Russian.
description: >-
  A pi32v2 interpreter with a JIT that translates hot code into WebAssembly, plus models of the FM-1's display,
  keys, buttons, knobs and flash. It is based on the Rust core of the earlier simonjohansson/fm1-emulator
  (before that project moved to QEMU). The page offers current builds of the open firmwares (Felucca, SLOOP,
  X0X, Melodee, FoMni, Jangada, ChoralRoot, FiMba, fm1-nes and SLOOP ALG), fetched from their authors'
  repositories by the site build and checked in the emulator, and a Your file button for any other .fwsc. The
  README reports stock V13 to V15, Felucca, SLOOP, X0X and Melodee as loading with screen and sound, and
  lists several others as not tried. It runs at roughly half of real speed on a slow test CPU, and USB MIDI,
  Bluetooth and over-the-air updates are not emulated. The repository holds only small test firmwares built by
  the upstream project.
status: active
authors:
