  url: https://github.com/illuminus5
source: https://github.com/illuminus5/skiff
source_status: open
license: GPL-3.0-only
license_notes: >-
  Bundled fonts, ported DSP and SDK files keep their own licences (LICENSES/); the Hügelton Sample Pack is
  GPL-3.0-only, not CC0.
homepage: https://illuminus5.github.io/skiff/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, or tools/fm1_install.py with the .fwsc from the releases page.
  The installer page can return the FM-1 to official V15 after saving a backup. An FM-1 stuck in boot mode
  (WL80UBOOT) can be recovered with tools/fm1_install.py or FM-1 Transporter.
brick_risk: true
