device: m-vave-fm-1
name: Skiff
summary: >-
  Six-track groovebox forked from Felucca: 14 synth and drum engines, 64-step sequencer with trig conditions and
  parameter locks, pattern pool and songs, performance layer, FM6 editing on the unit and a browser editor.
description: >-
  Fork of Felucca 1.1.5 that keeps its engines, sounds and file formats, so Felucca sounds and projects load.
  Each page draws what its knobs do, and holding HOME shows every control's job. Version 1.1 adds editing of
  every FM6 operator value on the FM-1 and a graph of the operator envelopes. It has a web editor, a browser
  emulator and a stereo USB audio input for recording the master on a computer.
status: active
authors:
