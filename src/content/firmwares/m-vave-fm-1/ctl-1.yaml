device: m-vave-fm-1
name: CTL-1
summary: >-
  Turns the FM-1 into a MIDI master controller: 4 CC banks on the knobs, program change, scale keys with
  chords, arpeggiator and a 4-track Euclidean drum sequencer, plus General MIDI sounds of its own.
description: >-
  The released build is USB-only (USB MIDI plus TRS MIDI in). A Bluetooth build exists in the repository
  but is withheld from distribution: JieLi's Bluetooth libraries are binary-only and cannot be shipped
  with a GPL-3.0 firmware until a section 7 permission is granted (asked of Felucca's copyright holders).
  Anyone can build the Bluetooth version themselves.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-ctl
source_status: open
license: GPL-3.0-only
homepage: https://charlesvestal.github.io/fm1-ctl/install/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer, which can put M-VAVE firmware back; an FM-1 that fails to start twice comes
  up in a safe mode the installer can reach. Firmware file also on the releases page.
brick_risk: true
tags: [controller-mode, midi, usb-midi, sequencer, drums, chords]
versions:
- version: '0.9'
  date: 2026-10-10
  url: https://github.com/charlesvestal/fm1-ctl/releases/tag/v0.9
  notes: USB-only build.
