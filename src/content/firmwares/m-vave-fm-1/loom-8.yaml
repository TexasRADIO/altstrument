device: m-vave-fm-1
name: LOOM-8
summary: >-
  Groovebox in the manner of the OP-XY: eight instrument tracks over synth engines, a sampler, a break slicer and a
  drum kit, a 64-step sequencer with step tricks, weave, a chord conductor, throws, scenes and a song.
description: >-
  The repository is fm1-loom, its GitHub description and design notes call the project XY-1, and the README and
  licence file call it LOOM-8. It is a separate project from Loom FM-1 by Co-oscillator. Eight tracks each get a colour and an
  instrument, with eight synth engines, a sample player, a break slicer and a drum kit. The sequencer has
  parameter locks and step tricks, players (arpeggiator, strum, hold) and weave, which crosses two patterns bar by
  bar, step by step, or one's rhythm with the other's notes. A conductor track moves the song through a chord
  progression, throws are momentary effects, and there are two send-effect tracks (one reverb has the PlayStation
  reverbs among its modes), a mixer with EQ, a master compressor, scenes and a song. Projects and presets can be
  backed up to a computer, and user samples load from WAV files with a script. It is built on the author's
  fm1-base platform repository (a git submodule) and has a browser emulator and a long manual.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-loom
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0 only for LOOM-8's own code. The fm1-base and felucca-bsp submodule files stay
  MPL-2.0 file by file. The Braids engine ports, the PlayStation reverb port and the supersaw bank are MIT, the
  fonts are SIL OFL 1.1, and the package uses three Apache-2.0 JieLi AC79 SDK files at build time.
homepage: https://charlesvestal.github.io/fm1-loom/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge with the FM-1 on USB, or download the .fwsc from the releases page. The README
  says the web installer can put M-VAVE's firmware back and that a firmware which keeps crashing starts in a safe
  mode. To build it yourself, clone with git submodules and run ./build.sh (BUILDING.md; the JieLi toolchain runs
  in Docker on a Mac).
brick_risk: true
tags: [groovebox, sequencer, sampler, synth-engine, drums, chords, fx, arpeggiator, emulator, midi]
