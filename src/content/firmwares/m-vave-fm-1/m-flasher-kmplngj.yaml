device: m-vave-fm-1
name: M-Flasher (Kampling fork)
kind: tool
summary: >-
  Integration fork of M-Flasher for the FM-1 and SMK-37 Pro/Elite that adds saved-file inspection commands and an experimental
  read-only FM-1 reader to upstream's backup, restore and flashing through download mode.
description: >-
  A GitHub fork of jvitkauskas/m-flasher created on 2026-10-21, after the owner renamed the previous repository at this
  address to m-flasher-legacy (since deleted or made private) and upstream was recreated with a new history. It starts from upstream 0.5.1 and ports the earlier additions: inspect, verify and dry-plan commands that
  check saved dumps and packages without any device attached, an opt-in RAM reader and a raw-backup procedure for the FM-1,
  and the offline test setup. Upstream's m-bootloader builds, download mode over USB MIDI and the SCSI byte-count handling
  are kept. The native MIDI command line for Felucca packages is left out, and Felucca uses its Python updater instead.
  The project's rules keep day-to-day development offline, against fixtures and fakes, with hardware checks recorded
  separately. It has no releases yet, and the full app is built from source.
status: active
authors:
- name: Jan Kampling (kmplngj)
  url: https://github.com/kmplngj
- name: Julius Vitkauskas (jvitkauskas)
  url: https://github.com/jvitkauskas
source: https://github.com/kmplngj/m-flasher
source_status: open
license: MIT
license_notes: >-
  MIT, copyright Julius Vitkauskas, as upstream. The RAM reader in ram-reader/ is Apache-2.0, and the bundled m-bootloader
  v1.2 builds and flash loaders are listed in data/NOTICE.md. The fixtures under tests/fixtures are small synthetic .fwsc
  packages, not M-VAVE images.
distribution: source-only
install_notes: >-
  Build with Rust (cargo build --release). A unit running M-VAVE's firmware or Felucca is found over USB MIDI, where a
  DOWNLOAD MODE button restarts it into download mode, and a unit with m-bootloader enters it with REC held at power-on.
  Bring your own official .fwsc files; the repository holds only synthetic test packages. Treat it as experimental and take a
  full backup before any write.
brick_risk: true
tags: [flasher, loader, utility]
versions:
- version: main @ f0ff8e8
  date: 2026-10-21
  url: https://github.com/kmplngj/m-flasher/commit/f0ff8e8556df7bac85fcff303000e124ed57246b
  notes: No tagged releases; this is the latest commit, which ports the FM-1 backup and diagnostics work onto upstream 0.5.1.
