device: nintendo-switch
name: Little Piggy Tracker (Switch port)
summary: Homebrew build of Little Piggy Tracker, the LSDj-style tracker for portable consoles, as a Nintendo Switch .nro app. Built from source with devkitPro.
description: >-
  This repository is a fork of djdiskmachine's Little Piggy Tracker, itself a fork of Marc Nostromo's LittleGPTracker,
  with Switch support added. The changelog describes a homebrew .nro built with devkitPro and libnx, launched from the
  Homebrew Menu and installed in /switch/lgpt on the SD card, and notes a fix for songs playing too fast on the Switch
  caused by a missing semaphore function. The project has a Makefile.SWITCH among its platform makefiles.

  The tracker follows the song, chain and phrase layout of LSDj. The upstream Little Piggy Tracker repository has no
  Switch build. The fork's only GitHub release is an RG35XX-plus build, so a Switch app has to be built from source.
