device: 203-systems-mystrix
also_devices: [203-systems-mystrix-pro]
name: Matrix Bootloader
summary: 203 Systems' fork of the TinyUF2 bootloader for ESP32-S3 Mystrix controllers, which provides the USB drive used to install Matrix OS and adds LED animations.
description: >-
  Compared with upstream TinyUF2 the fork adds support for the RGB pad LEDs, a faster start-up, a Mystrix-specific
  update animation and some device functions. It is what shows the red and green arrow and the USB drive when the
  controller is in OS update mode. Boards are defined for Mystrix and for a Mystrix Ultra prototype, and the
  repository README describes building and flashing the bootloader through the boot pin and a USB-serial adapter.
  Matrix OS 3.0 shipped a self-updating bootloader image for units that could not update or boot.
status: maintained
authors:
  - name: 203 Systems
    url: https://github.com/203-Systems
  - name: Ha Thach
    url: https://github.com/hathach
source: https://github.com/203-Systems/Matrix-Bootloader
source_status: open
license: MIT
license_notes: Fork of Adafruit's TinyUF2 by Ha Thach, whose MIT licence it keeps.
homepage: https://github.com/203-Systems/MatrixOS/releases/tag/V3.0.0
distribution: download
install_notes: >-
  The V3.0.0 Matrix OS release carries Matrix-Bootloader-Update-2025-9-25.uf2, which is copied to the controller
  in OS update mode like an OS image; the release notes recommend it when the OS will not update or boot, then
  flashing Matrix OS afterwards. Building from source and flashing a bare board needs the boot pin held to ground
  and a USB-serial adapter, as the repository README describes.
brick_risk: false
tags: [official, bootloader, loader, controller-mode, grid]
