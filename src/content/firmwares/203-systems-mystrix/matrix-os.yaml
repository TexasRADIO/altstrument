device: 203-systems-mystrix
also_devices: [203-systems-mystrix-pro]
name: Matrix OS
summary: Official open-source operating system for 203 Systems' Mystrix grid controllers, with built-in note, sequencer, strum and control-map apps and support for Python and C++ apps.
description: >-
  Matrix OS is the operating system 203 Systems ships on Mystrix and Mystrix Pro. It is written in C++ on
  FreeRTOS and TinyUSB for the ESP32-S3 and exposes the pads, LEDs, touch strips, USB and Bluetooth MIDI to
  apps. Built-in apps include a note player with scales, chords and an arpeggiator, a performance mode, an
  8-track step sequencer that records to a microSD card, a strum app, a custom control map that sends MIDI,
  SysEx and keyboard events, and a Bitfocus Companion integration. Since version 3.0 it also runs apps written in
  MicroPython from the SD card, and C++ apps can be added to a build by listing their Git repository. The
  repository also contains a Mystrix simulator target and builds for a Mystrix 2 hardware family, which
  appear in the nightly builds.
