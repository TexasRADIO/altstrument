distribution: download
install_notes: >-
  Download the .uf2 file for Mystrix from the GitHub releases page. Put the device into OS update mode, either
  with the red button in the settings menu or by holding the function key while plugging it in, and wait for the
  green arrow. The device appears as a USB drive; copy the .uf2 file onto it and it reboots into the new OS. The
  wiki advises against downgrading because older versions may wipe user data or may not be compatible with the device.
  The 3.0 release notes say to install the separate bootloader update first if the OS will not
  update or boot. Version 3.2 uses a microSD card for the sequencer. Nightly builds are published as pre-releases
  on the same page.
brick_risk: false
