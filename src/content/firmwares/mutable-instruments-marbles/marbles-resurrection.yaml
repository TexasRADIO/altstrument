device: mutable-instruments-marbles
name: Marbles alternative firmware (Resurrection)
summary: Adds a chord mode, X clock as T reset or hold, CV-selectable quantizer scales and roots, extra Deja Vu loop buffer modes and loop save/load to Marbles.
description: >-
  Entered with a long press of the t range button. Alternatives cover T rate
  CV as Deja Vu loop length or start position, T jitter CV as X scale slot
  select, X spread CV as X quantizer root, five chord modes and five Deja Vu
  buffer-size modes, plus a Markov algorithm for t mode in normal operation.
  Loop sequences can be saved to and loaded from RAM (volatile). Builds target
  Marbles firmware v1.2 and later. The author also published Rings firmware
  releases in the same repository.
