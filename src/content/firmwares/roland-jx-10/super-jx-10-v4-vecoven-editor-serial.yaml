    url: https://github.com/craigyjp
source: https://github.com/craigyjp/Super-JX-10-V4-Vecoven-Editor-Serial
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file and no license statement in the README or source headers.
distribution: source-only
install_notes: >-
  Build the sketch in src/ for a Teensy 4.1 with the Arduino IDE and Teensyduino.
  It replaces the assigner board, so it only applies to a custom build that
  wires the JX-10 voice boards to the Teensy as described in the schematics.
  It is not an update for a stock or Vecoven-equipped JX-10.
