device: roland-jx-10
name: Super-JX-10 V4 Vecoven Editor (Serial)
summary: Teensy 4.1 sketch for a DIY assigner, editor and patch manager that sends tone data over a serial line to the JX-10 voice boards in place of the stock assigner. Early; the README says the voice board connection is still to be tested.
description: >-
  This is the second approach by the same author, after a SysEx-based panel.
  The README says that after seeing an MKS-70 edited over a serial link wired
  to its voice cards, the author chose to bypass the JX-10 assigner and build a
  new assigner, editor and patch manager for JX-10 voice boards fitted into a
  CME UF-70 chassis. The sketch sends tone parameters out of a serial port at
  the MIDI baud rate and also handles notes, hold, the arpeggiator, chase play,
  patches, tone loading and MIDI settings, with a display, buttons, encoders
  and sliders read through MCP23017 expanders. The repository includes PDF
  schematics for the buttons, sliders, MCP23017 boards and programmer. The
  README calls the project early days and says the author was nearly ready to
  connect the assigner to the voice cards, so hardware results are not
  recorded.
status: active
authors:
