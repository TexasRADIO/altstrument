device: sega-mega-drive
name: Mega Drive MIDI Interface
summary: ROM that lets a Mega Drive be played as a MIDI synthesizer, driving the YM2612 FM chip and the PSG over USB, serial or MegaWiFi.
description: >-
  Controls the console's YM2612 FM chip and PSG from MIDI. It has built-in General MIDI-compatible FM presets, PSG
  envelopes based on the EEF format, support for MIDI 1.0 controllers and events, user presets loaded over SysEx and
  saved to SRAM on supported EverDrives, polyphony through dynamic FM channel mapping, portamento and experimental DAC
  support. It also answers GenMDM-style controller messages. The screen shows per-channel activity and a log. It
  reaches a computer through the USB port of a Mega EverDrive X7, CORE or PRO, through a custom USB serial cable on a
  controller or extension port, or through MegaWiFi cartridge hardware or the BlastEm emulator.

  Three ROM variants are released: for genuine Mega EverDrives, for other flash cartridges and for MegaWiFi.
