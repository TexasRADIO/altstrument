device: sega-mega-drive
name: genmddj
summary: LSDJ-style tracker for the Mega Drive, Genesis and Nomad with six FM voices, three PSG squares, noise and PCM, written in 68000 and Z80 assembly.
description: >-
  A tracker with ten voices: six YM2612 FM channels, three SN76489 squares and a noise channel, where the sixth FM
  channel doubles as the PCM and wavetable host. Notes sit in phrases, phrases in chains and chains in a song, and
  there are six instrument types (FM, kit, wave, tone, noise and percussion). It supports save and load, hardware sync
  through the controller port in output, pulse and input modes, and a mode in which a MIDI keyboard or DAW plays the
  ten voices live. The author reports testing on NTSC and PAL consoles and the Nomad, and calls it work in progress.
  It is a sibling of SMSGGDJ.
status: active
