device: sega-mega-drive
name: MD.Tracker
summary: Native tracker for the Mega Drive, Genesis and Nomad that drives the YM2612 FM and PSG chips and plays PCM samples, with saves in cartridge SRAM and a basic MIDI sync input; has a companion desktop editor for ROM sample banks.
description: >-
  Rights warning: the ROM's default sample bank (res/samples/samples_1.wav,
  about 6.7 MB) and the drum WAV files under the tools folder have no stated
  source or license, so their rights are unverified.

  A tracker written with SGDK that runs on the console itself, with a pattern
  matrix, a pattern editor and an instrument editor. It plays the FM channels,
  PSG voices and DAC samples. Version 1.05 added an expandable save format, a
  channel auto-glide command, FM channel 3 special-mode pitch commands and basic
  MIDI start, stop and tempo sync through an Everdrive USB port or a USB-serial
  adapter on controller port 2. The README lists BlastEm and the Mega Everdrive
  Pro as the working targets and PicoDrive as partial, and builds come in
  variants for different flash cartridges. The repository also holds a
  wxWidgets desktop editor that converts samples and saves and imports vgi and
  tfi instrument presets into a ROM, and a copy of the Mega Drive MIDI Interface
  release.
status: active
authors:
  - name: Corthax
    url: https://github.com/corthax
source: https://github.com/corthax/mdtracker
source_status: open
license: GPL-3.0-only
license_notes: >-
  The GPL-3.0 text is the repository's LICENSE file, with no or-later statement
  found. The default sample bank and the WAV files under mdtracker_tools have no
  stated source or license. The repository also bundles third-party parts under
  their own terms: a Dual PCM driver binary, the MSU-MD driver, SGDK headers and
  a zip of the Mega Drive MIDI Interface release.
homepage: https://github.com/corthax/mdtracker
distribution: download
requires_stock: Flash cartridge, or an emulator
install_notes: >-
  Download MD.Tracker.zip from the latest release and copy a ROM to a flash
  cartridge such as the Mega Everdrive Pro, or open it in BlastEm. The README
  says rom-pro.bin is the main build and rom-blastem.bin has a modified header
  for standalone BlastEm. Saves go to cartridge SRAM, and the desktop editor
  converts saves from older versions. Building needs SGDK and Code::Blocks.
brick_risk: false
tags: [tracker, ym2612, psg, pcm, midi, editor]
