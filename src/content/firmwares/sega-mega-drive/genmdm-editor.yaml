device: sega-mega-drive
name: genMDM Editor
kind: tool
summary: Web and desktop editor for the GenMDM and Mega Drive MIDI Interface that edits all FM and PSG parameters and loads presets.
description: >-
  A graphical editor for the GenMDM interface by little-scale and for Robert Hargreaves' Mega Drive MIDI Interface,
  which it calls "your Sega". It runs as a desktop application built with Electron and as a web page in Firefox
  99 or later and Chromium-based browsers, using Web MIDI. On iOS and iPadOS it works through a Web MIDI browser app.
