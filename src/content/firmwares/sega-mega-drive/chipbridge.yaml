  CERN-OHL-P-2.0 and documentation is CC BY 4.0. GitHub reports it as other.
homepage: https://github.com/little-scale/chipbridge
distribution: download
install_notes: >-
  Flash the shared UF2 from the releases folder to an RP2040-Zero over USB boot mode. The hardware directory has the
  bill of materials and the main and adapter boards. Console cables are specific to each system.
brick_risk: false
tags: [midi, sync, hardware, multi-console]
