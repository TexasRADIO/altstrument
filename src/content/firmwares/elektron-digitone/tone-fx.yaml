    url: https://github.com/DigiAlchemydsp
source: https://github.com/DigiAlchemydsp/RingTone
source_status: open
license: GPL-2.0-or-later
license_notes: Everything is GPL-2.0-or-later. The Tone-FX release repo ships only built .elemod packages; source is the separate RingTone development repo.
homepage: https://github.com/DigiAlchemydsp/Tone-FX/releases
distribution: patch-your-own
requires_stock: "1.43"
install_notes: Install core-dn1 and the tonefx elemod in elekloader with your own OS 1.43 file.
