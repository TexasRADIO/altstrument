device: elektron-digitone
name: Tone+FX
summary: "Master FX suite for the Digitone mk1 / Keys OS 1.43: ring mod, shelf EQ, lo-fi crush, wavefolder, a five-mode modulation insert, metering, a PERFORM page of momentary pads and a boot splash."
description: >-
  A set of elekloader mods packaged together as one .elemod (tonefx-3.2b). Seven
  master pages on FUNC + LFO; the PERFORM page's 16 trigs act as performance pads.
  Needs the core-dn1 mod. The release repository ships built packages only; the
  development source is in the DigiAlchemydsp/RingTone repository.
status: active
