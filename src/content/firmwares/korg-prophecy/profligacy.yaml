device: korg-prophecy
name: Profligacy
kind: tool
summary: Low-level emulator of the Korg Prophecy's chips that runs the original firmware from ROM dumps you supply, with a panel UI, desktop builds for macOS and Windows and a DSP JIT.
description: >-
  The emulator models the NEC V55PI, Hitachi H8/3003 and three TI TMS57002
  chips and runs the Prophecy's original firmware from the two ROM images
  of the user's own unit. The author compared the chip-to-chip traffic and
  DSP outputs with a real Prophecy, and added a dynamic recompiler to the DSP
  core to cut CPU use. The post-DAC analog stage is not modelled. A
  parameter-slider editor sits alongside the front panel. Releases are
  alpha builds for macOS on ARM and an experimental Windows x64 build. The
  repository does not include the ROMs.
status: active
