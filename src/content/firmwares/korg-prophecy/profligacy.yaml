  THIRD_PARTY_NOTICES.md. Korg's ROM dumps are not included.
homepage: https://github.com/joelanders/profligacy
distribution: download
install_notes: >-
  Bring your own ROM dumps. On first launch a folder picker asks for a
  directory with korgprop/ic12_v17.bin and korgprop/ic22_v17.bin, or a
  korgprop.zip holding both. Nothing is flashed to hardware.
