device: novation-circuit-rhythm
name: Arrhythmia
summary: Browser-installed patch of Novation's Circuit Rhythm 5706 firmware that fixes parameter-lock carry-over and a sound-processor hang, and adds a four-voice, four-operator FM synth on track 8 that plays chords, ten scales on tracks 1 to 7 and an SD card module loader.
description: >-
  Arrhythmia does not ship Novation's firmware. The installer page reads the
  5706 update file you supply, checks its SHA-256, patches it in the browser and
  sends it to the unit over USB MIDI, and the user confirms on the unit. Two
  builds are offered. The firmware build turns track 8 into a four-voice FM synth that
  plays one to four notes per pad or step, also from MIDI on track 8's channel.
  Sixteen sounds are chosen in the Sample view or per step, and eight macros set
  tune, the envelope, FM depth, cutoff and resonance. Earlier 0.1.x releases had
  a fixed saw sound instead. It also adds ten scales on tracks 1 to 7 and a
  loader for small programs on the microSD card.
  The devkit build adds a DSP load meter and module tools and has no synth. Both
  fix parameter locks so that a step without a lock returns to the knob's value,
  and limit how long the unit waits for the sound processor before flagging a
  fault with the Rec button. The 0.2 release notes say the synth's processing time
  has not been measured on the unit, that the final 0.2 image has not been run on
  hardware (a development build with the same synth code has), and that the fault
  handling and the devkit build are untested on hardware. The DSP voice source is
  now published, so the image rebuilds from the repository. Novation Components cannot restore stock; the
  installer has a Back to stock option.
status: active
authors:
  - name: llcoolkm
    url: https://github.com/llcoolkm
source: https://github.com/llcoolkm/arrhythmia
source_status: open
license: MIT
license_notes: >-
  Covers the code and documentation in the repository, including the synth's DSP
  voice source. Novation's firmware is not included and is not covered.
homepage: https://llcoolkm.github.io/arrhythmia/web/
distribution: browser-installer
requires_stock: "5706"
install_notes: >-
  Back up the microSD card first. Download Novation's 5706 update file yourself,
  close Novation Components and other MIDI software, open the installer page in
  Chrome, connect the unit, choose the file and press Install, then press Play
  on the unit when it flashes. The unit needs bootloader 4799. To go back, use
  Back to stock on the installer page or tools/flash.py on Linux. The README
  advises stopping and reporting if the unit does not start after an install.
  macOS is untested.
brick_risk: true
tags: [synth, chords, scales, sequencer, parameter-locks, modules]
