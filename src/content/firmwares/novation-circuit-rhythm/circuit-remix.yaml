device: novation-circuit-rhythm
name: Circuit Remix
summary: Alpha patches for the Circuit Rhythm 2.0.1 firmware (build 5706) that port CIRCUIT-HACKS features and add a sample arpeggiator, track copy and a pitch envelope and LFO, applied in the browser to your own Novation update file.
description: >-
  Applies patches to Novation's official 5706 update file with a browser page or a Python script, and checks the
  result against published SHA-256 hashes. It ports features from CIRCUIT-HACKS (the Circuit Tracks mod by the
  same author), including a metronome with count-in, quantize, mixer mutes and scene repeats, pattern chains with
  rules, sidechain and FX views, an arpeggiator and custom scales. It adds a track copy and reset, a sample and
  note arpeggiator, per-track scales, a pitch envelope and LFO page for the track knobs, and on-device pack
  delete and sample copy. Each version has an "S" variant without the features that create, change or delete SD
  card files by themselves. The repository holds the builders, an assembler, manuals in Spanish and English and
  per-version manifests, and no Novation code. The README says the features were checked mostly in emulation and
  partly on the device, and that the project was developed with Claude.
status: active
authors:
  - name: Ghillermo
    url: https://github.com/Ghillermo
source: https://github.com/Ghillermo/CIRCUIT-REMIX
source_status: open
license: MIT
license_notes: >-
  Covers the project's own tools, patches and documentation. It does not cover Novation's firmware, which is not
  included, or third-party dependencies (Capstone).
distribution: browser-installer
requires_stock: "5706 (2.0.1)"
install_notes: >-
  Download Novation's official 5706 update yourself (the README links Novation Components' own download), open
  rm_uploader.html from the release zip in Chrome or Edge, pick the official file and a version, and send it over
  Web MIDI, or build the .syx with tools/patch_official.py. The page checks the stock file's hash and refuses other
  devices. Back up the SD card first; 0.01S is the variant that never writes to the card by itself. The
  bootloader is not touched: Sample Rec + Samples + Note at power-on returns to the official firmware.
brick_risk: true
tags: [sampler, sequencer, drums, fx, midi, arpeggiator, performance]
versions:
