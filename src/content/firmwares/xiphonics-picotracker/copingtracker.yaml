    url: https://github.com/n1LS
source: https://github.com/n1LS/copingTracker
source_status: open
license: BSD-3-Clause
license_notes: Carries the picoTracker license text with an added 2026 copyright line, followed by a list of bundled third-party components under their own licenses.
homepage: https://github.com/n1LS/copingTracker
distribution: source-only
install_notes: >-
  Clone with submodules and run build.sh, which expects environment variables for the Pico CMake toolchain file and a
  General MIDI SoundFont. The repository has no release downloads and does not document the installation step.
