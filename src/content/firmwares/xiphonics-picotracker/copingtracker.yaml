device: xiphonics-picotracker
name: copingTracker
summary: Fork of picoTracker 2.3 by nILS Podewski that adds a stack multi-saw instrument, a General MIDI bank, chiptune drum and lead instruments, EQ, delay and a CPU load display.
description: >-
  copingTracker keeps the picoTracker song structure of eight channels, 256 chains and 128 phrases and raises the
  instrument count to 32. Its additions include a stack instrument that builds chord wavetables from multiple saws,
  an internal 135-instrument General MIDI bank, chiptune drum and lead instruments, a modulation page on the
  instrument screen, a delay effect, 3-band EQ on the master and per channel, a compressor and a CPU load readout.
  It targets the RP2040 and RP2350, and the README says there is no manual yet and points to a Discord server for
  discussion.
status: active
authors:
