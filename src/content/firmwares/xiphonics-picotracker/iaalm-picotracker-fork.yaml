    url: https://github.com/iaalm
source: https://github.com/iaalm/picoTracker
source_status: open
license: BSD-3-Clause
license_notes: Inherits the picoTracker license file, which also lists third-party components under their own licenses.
homepage: https://www.iaalm.net/picoTracker/
distribution: source-only
install_notes: >-
  The firmware builds like upstream picoTracker. The browser emulator needs no installation and is served from the
  homepage link. A desktop build needs SDL3 and a C++23 compiler, as described in emulator/README.md in the
  repository.
brick_risk: false
