device: xiphonics-picotracker
name: iaalm picoTracker fork
summary: Personal picoTracker fork with a KX1 synth instrument, flash wear reduction, a SID retrigger fix and an SDL and WebAssembly build that runs the firmware on a computer or in a browser.
description: >-
  The fork's changes to the firmware include a new KX1 synth instrument with presets, instrument parameters stored
  as packed 32-bit values, reduced flash wear, a fix for SID notes not retriggering, and a context-sensitive key
  help overlay. It also adds a host-side port that compiles the tracker sources against SDL, and a WebAssembly
  build of the same port that is published as a web page where the tracker runs in the browser with a bundled SD
  card and an on-screen keypad. The emulator is not an RP2040 emulator, so it does not reproduce memory limits,
  timing or MIDI. The repository has no description or releases of its own.
status: active
authors:
