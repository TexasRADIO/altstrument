source: https://github.com/xiphonics/picoTracker
source_status: open
license: BSD-3-Clause
license_notes: Derived from LittleGPTracker (copyright Discodirt). The LICENSE file also lists bundled third-party components, each under its own license.
homepage: https://xiphonics.com/pages/picotracker
distribution: download
install_notes: >-
  Download the UF2 for your board from the GitHub releases page. Hold the BOOTSEL button through the small hole on
  the bottom while switching the picoTracker on, so that it mounts as a USB drive, then copy the UF2 onto the drive
  and it reboots into the new firmware. The FAQ says to use the ST7789 build on v2 PCB kits and to install the
  firmware first on a newly built unit, since the display stays blank without it. The remote UI is enabled by
  default in current builds.
brick_risk: false
tags: [official, tracker, sequencer, sampler, midi, sid, chiptune, remote-ui, open-source]
