device: sony-psp
name: PSPOLY
summary: Ten-voice, four-part multitimbral polyphonic synthesizer for the PSP, played over MIDI through the PSP-MIDI adapter.
description: >-
  A synth app that makes the PSP a sound module for a DAW or hardware MIDI gear. It has ten voices allocated
  dynamically across four parts, eleven voice characters such as Juno Pad, PWM Strings, DX Keys, Supersaw and Sub
  Bass with four macro controls each, a MIDI channel per part with layering, and pitch bend, mod wheel, sustain,
  glide, cutoff, resonance and envelope controls. Output is 44.1 kHz stereo with a stated round trip latency of 3 to 5
  ms, and MIDI can pass through to the adapter's TRS out. The package contains the EBOOT, the usbmidi.prx driver and
  a manual.
