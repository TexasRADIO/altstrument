device: dirtywave-m8
name: rm8
kind: tool
summary: Rust client that mirrors the M8's screen on a computer, maps keyboard or gamepad keys to the M8 buttons and plays its USB audio, for the M8 and M8 Headless.
description: >-
  rm8 is written in Rust with SDL2 and talks to the M8 over its USB serial
  connection, or to a Teensy 4.1 running the M8 Headless firmware. The author
  started from m8c and rewrote it. It draws the display, sends key presses and
  gamepad input, adds a keyjazz mode for playing notes from the computer
  keyboard, and passes the M8's audio through to the default output. A config
  mode on the screen itself edits key mapping, colours, fonts and the zoom
  level, and the settings are stored in a JSON file. Builds exist for Windows
  and Arch Linux; other systems build from source.
status: dormant
authors:
  - name: Alex Boussinet
    url: https://github.com/asynkayo
source: https://github.com/asynkayo/rm8
source_status: open
license: MIT
homepage: https://github.com/asynkayo/rm8
distribution: download
install_notes: >-
  Download the Windows or Arch Linux archive from the releases page, connect the
  M8 or the Teensy with the headless firmware and run rm8; rm8 -list shows the
  detected devices. On other systems, build with Cargo, which needs the SDL2
  development libraries. The last commit on the master branch is newer than the
  last release.
brick_risk: false
tags: [ui, usb-audio, open-source]
