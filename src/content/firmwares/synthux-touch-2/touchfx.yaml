    url: https://github.com/Synthux-Academy
source: https://github.com/Synthux-Academy/TouchFX
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file; the earlier DaisyDuino version in simple-touch-instruments is MIT.
homepage: https://www.synthux.academy/firmware
distribution: download
install_notes: Download TouchFX.bin from the release and flash it from Synthux's firmware page or the Daisy Seed web programmer.
