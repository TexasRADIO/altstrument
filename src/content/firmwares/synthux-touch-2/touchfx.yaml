device: synthux-touch-2
name: TouchFX
summary: "Official effects processor for the Touch 2: modulated delay, reverb, three drive and three bit-crush zones switched from the pads, with per-effect bypass."
description: >-
  TouchFX turns the Touch 2 into an effects unit for its stereo input. The
  README lists a delay with mix, feedback, time and modulation speed and
  amount, a reverb with send, mix and size, and three drive and three bit-crush
  effects (A, B and C) triggered from the pads, with amount and mix set by
  knobs while a pad is held. Separate pads bypass the whole unit, the delay and
  the reverb, and the left switch toggles momentary or latched pad behaviour.
  TouchFX has a dedicated faceplate in the Touch 2 kit.
status: active
authors:
