source_status: open
license: unspecified
license_notes: The repository has no LICENSE file.
homepage: https://www.synthux.academy/firmware
distribution: download
install_notes: >-
  Flash the precompiled TouchString.bin from the releases page with the Daisy
  Seed web programmer (flash.daisy.audio) or Synthux's firmware page.
  Vincent Maurer's fork at github.com/vincentltm/TouchString publishes the same
  binary under its own releases.
