device: synthux-touch-2
name: TouchString
summary: Official polyphonic physical-modelling string synth for the Touch 2 with pluck and bow excitation, velocity-sensitive pads, an arpeggiator and seven scales.
description: >-
  TouchString plays seven strings from pads P03 to P09, with pluck, pluck plus
  bow and bow exciter modes, velocity and aftertouch response, string damping,
  keyboard octave shifts, a latchable or momentary arpeggiator with tap tempo,
  reverb and seven built-in scales (three handpan tunings, major, natural
  minor and two pentatonics). It can switch between polyphonic and monophonic
  voicing and accepts external audio input. Version 2 added polyphony, bowing
  and touch sensitivity; Vincent Maurer keeps a fork under the name
  TouchString(s) that has released slightly newer builds.
status: active
