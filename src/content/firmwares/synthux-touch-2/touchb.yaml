    url: https://github.com/Synthux-Academy
source: https://github.com/Synthux-Academy/TouchB
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file.
homepage: https://github.com/Synthux-Academy/TouchB/releases
distribution: download
install_notes: >-
  Download TouchB.bin from the latest release and flash it with the Daisy Seed
  web programmer, or build it with make libs and make and upload with make
  program-dfu.
