device: synthux-touch-2
name: TouchB (Simple B)
summary: Work-in-progress Synthux firmware for the Touch 2 that plays loops from the pads, with reverse and random modes, pitch, start and grain randomisation, loop size and start controls.
description: >-
  TouchB, titled Simple B in its README, assigns pads P03 to P09 to loops. The
  switches select fade-in, regular or latched playback and reverse, random or
  forward direction, and the knobs set reverb, a low-pass/high-pass filter,
  pitch (a fifth, one or two octaves either way), start randomisation, grain
  randomisation, loop size, loop start and output mix. All published builds are
  marked as pre-releases and the project has had many revisions since June 2026.
status: active
authors:
