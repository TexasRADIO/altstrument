device: synthux-touch-2
name: TouchBass
summary: Official polyphonic subtractive synth for the Touch 2 with two oscillators, filter, arpeggiator with Euclidean patterns, reverb and a MIDI CC map.
description: >-
  TouchBass is one of the instruments that has its own faceplate in the Touch 2
  kit. The README describes two oscillators (the second can act as a sound
  source or as AM), a resonant filter with envelope amount, an arpeggiator
  controlled by pattern, pitch and envelope randomisation knobs, reverb, and
  a choice of three scales. It plays monophonically or
  paraphonically and responds to MIDI control changes. Source for the C++
  version lives in its own repository, with older DaisyDuino sketches in
  simple-touch-instruments.
status: active
authors:
  - name: Vladislav Litvinenko (bleeptools)
    url: https://github.com/bleeptools
