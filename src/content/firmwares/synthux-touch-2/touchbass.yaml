    url: https://github.com/Synthux-Academy
source: https://github.com/Synthux-Academy/TouchBass
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file; the older sketches in simple-touch-instruments are MIT.
homepage: https://www.synthux.academy/firmware
distribution: download
install_notes: >-
  Download TouchBass.bin from the latest release and flash it with the Daisy
  Seed web programmer or Synthux's firmware page, or build it with the Daisy
  toolchain (make libs, then make, then make program-dfu).
tags: [official, synth, subtractive, arpeggiator, midi, open-source, touch-2]
