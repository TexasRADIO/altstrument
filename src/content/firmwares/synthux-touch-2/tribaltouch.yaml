device: synthux-touch-2
name: TribalTouch
summary: Seven-voice generative percussion instrument for the Touch 2 with synthesised drums, a Euclidean rhythm engine, three scenes, sidechain master chain and USB MIDI clock sync.
description: >-
  TribalTouch synthesises seven drum voices (kick, low tom, snare, FM hat,
  crash, mid tom and clap) with no samples. Hits and length are set per voice and
  a Euclidean algorithm places the hits, tracking eight-bar phrases with
  turnaround fills and a Chaos control for the noisy voices. Switch A rescales
  the grid to 16, 8 or 12 steps and switch B selects one of three scenes that
  also act as save slots. The master chain sidechain-ducks the kit from the
  kick, USB MIDI provides clock sync and note input, and a hot-pluggable touch
  display is optional. Only binaries are published.
status: active
authors:
