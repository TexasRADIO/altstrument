license: unspecified
license_notes: The repository has no license file and contains the compiled .bin files and bootloader, display firmware binaries, the README and images only.
homepage: https://tribaltouch.vercel.app/
distribution: download
install_notes: Download TribalTouch-V1.bin from the repository and flash it to the Daisy Seed, for example with the Daisy Seed web programmer. A separate TribalTouch-Display-V1.bin and display firmware are provided for the optional screen.
