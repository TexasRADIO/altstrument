device: synthux-touch-2
name: OceanTouch
summary: Dual-delay and reverb workstation for the Touch 2 with 27 effect zones, three routing modes, 12 performance pads, tap tempo and class-compliant USB MIDI.
description: >-
  OceanTouch turns the Touch 2 into an effects processor with three engines, a
  reverb and two delays (A and B), each with nine effect zones, for 27 in
  total. Delay and reverb types range from tape and analogue delays to shimmer,
  galaxy and low-bit bitcrushing. The delays can run in parallel, A into B, or
  B into A, the twelve pads give freezes, reverse washes and time dives, and the
  unit enumerates as a driverless USB MIDI device. An interactive web manual
  documents the signal flow, knob matrix and MIDI mapping. Version 1.1 added
  makeup gain and output protection. Only binaries are published.
