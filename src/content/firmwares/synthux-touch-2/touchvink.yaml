device: synthux-touch-2
name: TouchVink
summary: Self-regulating feedback instrument for the Touch 2 after Jaap Vink's tape, ring-mod and reverb patches, played from the pads with a web manual that mirrors the panel.
description: >-
  A delayed copy of the output is ring-modulated, reverberated and passed
  through a VCA that the loop's own loudness turns down, which lets the loop run
  above unity gain and keep moving. Pads excite the loop in oscillator or
  distortion mode, knobs set the oscillator/noise balance, external input,
  ring modulation, reverb, loop gain and delay time (2 ms to 1.9 s), and USB
  MIDI works in both directions. An interactive manual draws the panel in the
  browser. The README states that version 0.2 compiles and its DSP is tested on
  a desktop, but it had not yet been tested on hardware.
status: active
authors:
  - name: Jon Waterschoot
    url: https://github.com/jonwaterschoot
source: https://github.com/jonwaterschoot/TouchVink
source_status: open
license: MIT
license_notes: The firmware links DaisySP-LGPL (ReverbSc), which is LGPL-licensed.
homepage: https://jonwaterschoot.github.io/TouchVink/
distribution: download
install_notes: Download the .bin from the releases page and flash it at flash.daisy.audio with the Seed in DFU mode (hold BOOT, tap RESET), or build it from source.
tags: [feedback, drone, ring-modulation, reverb, experimental, midi, open-source, touch-2]
