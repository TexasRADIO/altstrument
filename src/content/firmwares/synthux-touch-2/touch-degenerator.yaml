device: synthux-touch-2
name: Touch Degenerator
summary: Layered stereo looper for the Touch 2 that irreversibly degrades the recorded material, after William Basinski's Disintegration Loops; a port of the Workshop Computer card.
description: >-
  Degenerator records a loop of up to 60 seconds in a stereo buffer and lets you
  shape it by adding and removing material while it degrades. Nothing is stored
  across power cycles because the buffer clears on boot. This version is a port
  of the author's Degenerator card for the Music Thing Modular Workshop
  Computer, rebuilt for the Touch 2's two switches, six knobs, two faders and
  twelve pressure-sensitive pads. The project is hosted on Codeberg.
status: active
