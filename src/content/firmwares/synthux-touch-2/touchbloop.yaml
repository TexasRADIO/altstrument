device: synthux-touch-2
name: TouchBloop (Bloop)
summary: Synthux glitch looper for the Touch 2, inspired by the Chase Bliss Blooper, that grabs the input when a pad is touched and loops it with a different distortion per pad, a digital-to-analog fader, reverse and random modes, and size, position, pitch and mod controls.
description: >-
  The repository began as TouchB, titled Simple B in its README, and is now
  called TouchBloop; its README calls the firmware Bloop. Pads P03 to P09 loop
  the incoming audio and each puts a different distortion on the loop, with the
  centre pad clean. The left fader morphs the distortion from digital to
  analog, the right fader is a low-pass/high-pass filter, and the switches
  choose momentary, latched or effects-only pads and forward, random or
  reverse playback. The knobs set loop size, position, pitch (with hidden
  snapping to fifths and octaves), mod, reverb and mix. The first release not
  marked as a pre-release, 1.0.0, followed many pre-releases since June 2026.
