    url: https://github.com/ymillion
source: https://github.com/ymillion/zentouch-Touch2-Firmware
source_status: binary-only
license: unspecified
license_notes: The repository has no license file and contains the compiled .bin files, the README and printable faceplates only.
homepage: https://zentouch-touch2.vercel.app/
distribution: download
install_notes: Download the newest ZenTouch .bin (V3 at last check) from the repository and flash it to the Daisy Seed, for example with the Daisy Seed web programmer. The manual covers calibration of the pads.
