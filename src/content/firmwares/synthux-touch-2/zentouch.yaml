device: synthux-touch-2
name: ZenTouch
summary: Karplus-Strong thumb-piano instrument for the Touch 2 with nine kalimba-style tines, eight voices, twelve scales and a three-layer audio looper.
description: >-
  ZenTouch lays nine playable tines across the Touch 2 pads in a kalimba
  pattern with the scale root at the centre pad. A knob selects one of eight
  Karplus-Strong voices and another sweeps a twelve-scale arc drawn mostly from
  Japanese, Chinese and Indian scales. One switch adds a fifth or a third on
  every tine, the other shifts octaves for new notes, and an audio-buffer
  looper with three overdub layers does not use up voices. The web manual has
  an in-browser emulator and downloadable faceplates. Only binaries are
  published.
status: active
authors:
