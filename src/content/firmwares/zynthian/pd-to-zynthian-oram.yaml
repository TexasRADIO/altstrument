device: zynthian
name: pd_to_zynthian_oram
kind: tool
summary: Shell scripts that compile a Pure Data patch into an LV2 plugin for Zynthian with the hvcc (Heavy) compiler and the DISTRHO Plugin Framework, then link it into the Zynthian plugin folder.
description: >-
  An initialisation script creates a Python virtual environment, installs
  hvcc and fetches heavylib, DPF and DPF-Widgets. A per-plugin config.sh sets
  the hvcc options, compile.sh generates C++ and builds the .lv2 bundle, and
  test.sh is a template for loading the plugin under JACK with an audio
  player. The README suggests developing and testing the patch in Pure Data
  or plugdata on a desktop, then cloning the scripts on the Zynthian, building
  there, symlinking the result into /zynthian/zynthian-plugins/lv2 and running
  Search For Engines in webconf. Patches must stay within the Pure Data
  objects hvcc supports. It was written for Oram.
status: dormant
