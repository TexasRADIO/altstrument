device: zynthian
name: zynthian-webconf
kind: tool
summary: Official browser-based configuration tool served by the Zynthian, used to set up hardware, audio and MIDI, manage presets, snapshots, sound packages and backups, choose the software branch and run updates.
description: >-
  Webconf is a Python web application that runs on the Zynthian and is opened
  from a browser on the same network at the unit's address (zynthian.local by
  default). It is where a DIY build or an older kit is configured: kit type,
  display, sound card and the wiring of encoders and switches. It also handles
  MIDI options and controller profiles, uploads of soundfonts, presets and LV2
  plugins, snapshot and data backups, the installable sound packages added in
  Vangelis, the software repository and branch the unit follows, and system
  updates. Its tags follow the ZynthianOS point releases.
