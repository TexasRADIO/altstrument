device: zynthian
name: zynthian-stm32controller
kind: tool
summary: Firmware for an STM32 Blue Pill board that adds a master volume knob to a Zynthian over USB, plus a host service on the Raspberry Pi that sets the ALSA mixer volume. Third-party add-on from 2018.
description: >-
  Joost Nieuwenhuijse wrote this as an I/O expander for Zynthian built around
  the STM32F103C8T6 Blue Pill, connected over USB, with a master volume control
  as the main aim. The firmware reads one potentiometer on an analog input and
  reports it as a vendor HID device. A small C++ service on the Pi reads the
  reports and sets the ALSA mixer volume, installed as a systemd unit by the
  build script. Prebuilt firmware images exist for linear and logarithmic
  potentiometers, and an update script flashes the board from the Pi through
  the STM32duino bootloader. The README describes soldering a cut USB cable to
  the Pi's internal USB pads and a resistor fix that most Blue Pill boards
  need. The repository belongs to the author; the zynthian organization holds
  an older fork of it.
