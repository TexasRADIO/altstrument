homepage: https://github.com/joostn/zynthian-stm32controller
distribution: download
install_notes: >-
  The STM32duino bootloader must first be flashed with an SWD programmer or a
  USB-serial converter. After that, clone the repository on the Zynthian, run
  build.sh to install the host service and updatefirmware.sh to flash the
  board over USB. Most Blue Pill boards need a resistor change on the USB
  pull-up, and the USB connection is wired inside the case. Written for 2018
  ZynthianOS and not checked against current releases.
