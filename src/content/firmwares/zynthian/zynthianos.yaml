license: GPL-2.0-or-later
license_notes: LICENSE.txt in zynthian-sys, zynthian-ui and zynthian-webconf is the GPLv3 text, but the source file headers grant "version 2 of the License, or any later version". The image bundles third-party engines, plugins and sound libraries under their own licenses.
homepage: https://wiki.zynthian.org/index.php/Zynthian_Software
distribution: download
requires_stock: Raspberry Pi 3, 4 or 5; first boot auto-detects the V5.1, V5, V4, V3, V2, Z2 and MINI V2 kits
install_notes: >-
  Download the stable image (zynthianos-last-stable.img.xz) from
  os.zynthian.org and write it to a microSD card of 32 GB or more with
  Raspberry Pi Imager, dd or the GNOME Disks tool; the wiki no longer
  recommends balenaEtcher. The first boot configures the system and reboots,
  which takes a few minutes. If a kit is not detected the card is marked as
  custom hardware; choose the kit or hardware in webconf, or run
  set_first_boot.sh, or write the card again. Point releases install from the
  update option in the UI or webconf. Moving from Oram to Vangelis needs a new
  image: copy snapshots and other data by hand and do not restore the old
  configuration.
