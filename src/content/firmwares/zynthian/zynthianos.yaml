device: zynthian
name: ZynthianOS
summary: Official Zynthian SD-card image, a Debian-based 64-bit Raspberry Pi OS build with the Zynthian UI, webconf, synth engines, LV2 plugins and sound libraries preinstalled and configured for the official kits.
description: >-
  ZynthianOS is the disk image the Zynthian project publishes at
  os.zynthian.org. It is built from a Raspberry Pi OS Lite 64-bit base by the
  setup scripts in the zynthian-sys repository, which also hold the system
  configuration, and it bundles the zynthian-ui, zynthian-webconf and zyncoder
  repositories, a real-time audio stack and the engines and plugins the UI
  can load. Major releases are named after electronic music pioneers: Oram
  (2024), the first 64-bit release, based on Debian Bookworm with Raspberry Pi
  5 support, and Vangelis (2026), based on Debian Trixie, which adds a
  clip launcher, the Clippy audio-clip engine, parameter automation in the
  pattern editor and installable sound packages. Between major releases the
  project tags point releases and publishes new stable images.

  From the webconf Repositories page a unit can follow the stable release, a
  fixed point release, the staging branch or a development branch. zynthian-sys
  also contains a setup script for Debian Bookworm on amd64.
