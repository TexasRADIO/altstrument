device: zynthian
name: zynthian-ui
summary: Official Python engine manager and touch user interface for Zynthian, which builds chains of synth engines, LV2 plugins and effects and runs the mixer, step sequencer, clip launcher and MIDI routing.
description: >-
  zynthian-ui is the main application of ZynthianOS. It starts and manages the
  audio engines (ZynAddSubFX, FluidSynth, sfizz, setBfree, Pure Data, Aeolus,
  LV2 plugins through jalv and others), maps the four encoders, the buttons
  and the touchscreen to their parameters, and saves the whole state as
  snapshots. It also contains the zynseq step sequencer, the audio mixer, MIDI
  learn and the controller drivers for external MIDI devices. New engines are
  added as Python classes; the wiki page "Creating a new Zynthian Synth
  Engine" describes the interface.

  The repository is tagged at each ZynthianOS point release, and the vangelis
  branch carries current development. A unit tracks one of these branches or
  tags from the webconf Repositories page and updates from the UI.
