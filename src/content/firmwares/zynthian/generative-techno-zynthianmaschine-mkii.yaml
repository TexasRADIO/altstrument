license_notes: LICENSE is the GPLv3 text and the README says GPL-3.0; no "or later" grant found. The daemon keeps the upstream maschine.rs license and notices.
homepage: https://witzman.github.io/Generative-Techno-ZynthianMaschine-MKII/
distribution: source-only
requires_stock: ZynthianOS Oram-2601-1 on a Raspberry Pi 4, with a Native Instruments Maschine MK2 over USB
install_notes: >-
  On a Pi already running ZynthianOS, clone the repository, run
  tools/check-prereqs.sh and then ./install.sh (--dry-run first shows what it
  would change); the daemon is built with Cargo on the Pi. The build guide
  also has a one-command fast install and a manual installation section that
  lists failure modes the installer cannot report. The README names Oram
  only; Vangelis is not mentioned.
