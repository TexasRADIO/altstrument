device: zynthian
name: Generative-Techno ZynthianMaschine MKII
summary: Installs onto ZynthianOS on a Raspberry Pi 4 and turns it into an eight-channel generative groovebox played from a Native Instruments Maschine MK2, with euclidean drum channels and Turing-machine melody voices.
description: >-
  The project adds a Zynthian controller driver, a Rust HID daemon for the
  Maschine MK2 (its pads, encoders, LEDs and two displays) and a set of
  snapshots. Five channels are euclidean drum generators and three are voices
  driven by Turing-machine shift registers or a bounded random walk, with a
  chord walker that moves their shared root along the scale. The generators
  write notes into Zynthian's own step sequencer, so patterns are saved in
  snapshots and show in the touchscreen pattern editor. Pads are pressure
  sensitive, and bar-synced macros, LFOs on any knob, a mute grid and master
  recording to WAV are mapped to the Maschine's buttons.

  The README targets ZynthianOS Oram-2601-1 on a Raspberry Pi 4 and uses the
  Pi's headphone output; other sound cards are untested. Third-party plugins
  and drum kits are not bundled: they come from Debian packages and the
  ZynthianOS image. The daemon descends from wrl/maschine.rs by William Light
  through the author's MaschineMK2_linux fork.
