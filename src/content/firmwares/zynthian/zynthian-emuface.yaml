device: zynthian
name: Zynthian Emuface
kind: tool
summary: Official desktop emulator of a 2016-2018 Zynthian box that runs the Zynthian UI and engines on a Linux computer, with on-screen encoders and switches in place of the GPIO controls.
description: >-
  Emuface is a Qt window that wraps the Zynthian UI with virtual rotary
  encoders and push switches, so the UI and its synth engines can be developed
  and tested on a Linux desktop. The GPIO is emulated through a wiringPi
  wrapper and the encoders through POSIX signals. The wiki's emulator page
  points to setup scripts for Debian Jessie and Fedora 23 and says they are
  out of date; the repository has had no commits since March 2018 and
  predates the Oram and Vangelis UI.
status: dormant
