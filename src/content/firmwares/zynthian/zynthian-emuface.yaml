homepage: https://wiki.zynthian.org/index.php/Zynthian_Emulator_Setup_for_Development
distribution: source-only
install_notes: Needs a Linux system with JACK, the Python ALSA sequencer and JACK client libraries and a checkout of zynthian-ui; engine binary paths may need adjusting.
