device: zynthian
name: Zynthian MIDI-USB Controller
summary: Official firmware, laser-cut case plans and photos for a 2017 USB MIDI controller with eight LED-ring encoders on a SparkFun ATmega32U4 board, giving 24 assignable MIDI CC parameters over three layers.
description: >-
  The repository holds a PlatformIO project for an Arduino-style board
  (SparkFun Pro Micro 16 MHz) that reads eight rotary encoders, lights an
  LED ring per encoder and sends MIDI CC over USB. Each encoder has three
  layers, shown in red, green and blue, which gives up to 24 controllable
  parameters. The case is described by SVG and DXF files for laser cutting,
  and the photos show the finished box. It is a stand-alone controller for the
  Zynthian platform rather than part of the main kit, and the code is derived
  from an Arduino MIDIUSB example. The code was added in May 2017 and the last
  commit, in 2019, only edited the README. The firmware/lib folder holds
  Adafruit NeoPixel and MIDIUSB submodule links that have no .gitmodules file
  in the repository.
