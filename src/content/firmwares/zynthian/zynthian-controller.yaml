license: GPL-3.0-only
license_notes: LICENSE.txt is the GPLv3 text; the sketch has no GPL header, only a credit to the Arduino MIDIUSB example it started from, so no "or later" grant was found.
homepage: https://github.com/zynthian/zynthian-controller
distribution: source-only
install_notes: >-
  Build the project in firmware/ with PlatformIO for the sparkfun_promicro16
  board and flash it over USB. The NeoPixel and MIDIUSB libraries have to be
  supplied separately because their submodule entries are not documented. The
  controller shows up as a class-compliant USB MIDI device.
