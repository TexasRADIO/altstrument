device: zynthian
name: zyncoder
summary: Official C library with Python bindings that reads the Zynthian encoders, switches and analog inputs, drives its audio output chips and runs the MIDI router and master output code used by zynthian-ui.
description: >-
  zyncoder sits between the Zynthian hardware and the user interface. It reads
  the push encoders, buttons, infinite potentiometers, ADS1115 analog inputs and
  time-of-flight sensors through GPIO and the MCP23008 and MCP23017 expanders,
  with a separate control map for each board generation (V5, V-series, Z2 and
  Mini V2). It also sets volume on the LM4811 and TPA6130 headphone amplifiers
  and holds the MIDI router and a JACK client for the master audio and MIDI
  output, which the UI calls through the zyncore Python module. An emulation layer lets the UI run on a desktop
  without the GPIO.

  The repository is tagged alongside each ZynthianOS point release, and the
  vangelis branch carries current development. It is built as part of
  ZynthianOS; the README gives a build.sh script that needs liblo and, for real
  hardware, wiringPi.
