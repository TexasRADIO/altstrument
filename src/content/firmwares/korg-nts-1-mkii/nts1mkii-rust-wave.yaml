device: korg-nts-1-mkii
name: nts1mkii-rust-wave
summary: "Custom oscillators for the NTS-1 mkII written in Rust: a port of the logue SDK Waves oscillator, a 32-byte wavetable oscillator and a simplified 2-operator FM oscillator, plus a template."
description: >-
  The repository ships prebuilt units osc_waves (a Rust port of the SDK Waves
  oscillator), osc_table32 (an oscillator driven by a 32-byte waveform
  memory), osc_fmo2 (a simplified 2-operator FM oscillator) and osc_dummy (a
  sine used to check the build). It also documents how to add a new unit in
  Rust using the same workspace, and builds with the Arm GCC toolchain plus
  cargo for thumbv7em-none-eabihf. The author's blog post is linked as the
  project homepage.
