device: korg-nts-1-mkii
name: Beatnicster NTS-1 mkII units
summary: NORM, a custom oscillator with main and sub waveforms plus noise, and Metronome, a modfx metronome. Both have a free download and a 300 JPY support version on BOOTH.
description: >-
  NORM is an oscillator with separately selectable main and sub waveforms
  (sine, square or saw), a pitch offset and detune for the sub oscillator, and
  a white noise level on knob B; the LFO affects pitch only. Metronome runs as
  a modfx unit so any oscillator can be played along with it, with volume on
  knob A and off, quarter, eighth or sixteenth note timing on knob B. Each
  BOOTH page offers a free download and a 300 JPY support version with the same
  contents. The pages forbid redistribution. The developer's shop also lists
  other NTS-1 mkII items, including an RC10 oscillator and a PTeq effect.
