device: korg-nts-1-mkii
name: Lirah-1
summary: "Lyra-8 style drone oscillator for the NTS-1 mkII: sine-core FM with wave folding, feedback, two AND-gated LFOs and a third assignable LFO. A 4-voice drumlogue version exists separately."
description: >-
  Lirah-1 is an osc unit based on James D. Cheetham's Lyre-1 project, inspired
  by the SOMA Laboratory Lyra-8. Knob A sets FM depth and knob B sets the
  depth of the Hyper LFO pitch jump, which comes from two internal LFOs that
  are AND-gated. Further parameters cover both LFO rates, fold, FM and carrier
  tuning, feedback, and a third LFO with a selectable target. It is sold on
  Gumroad (listed at 5 USD) with the source and a release on GitHub. A 4-voice
  polyphonic drumlogue version is in DanielMajid/lirah_4_drumlogue, which has
  no license file.
status: active
authors:
