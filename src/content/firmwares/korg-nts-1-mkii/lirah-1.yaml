    url: https://github.com/DanielMajid
source: https://github.com/DanielMajid/Lirah-1
source_status: open
license: MIT
homepage: https://danielmajid.gumroad.com/l/lirah-1
distribution: download
install_notes: >-
  Open KORG KONTROL Editor, drag the .nts1mkiiunit file into the oscillator
  category and sync. The unit can also be built from source with the logue
  SDK.
