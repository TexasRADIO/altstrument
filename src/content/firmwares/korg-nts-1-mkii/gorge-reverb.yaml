homepage: https://danielmajid.gumroad.com/l/aftjoy
distribution: download
install_notes: >-
  Load the Gorge.nts1mkiiunit file with KORG KONTROL Editor and sync it to
  the device. The unit can also be built from source with the logue SDK.
