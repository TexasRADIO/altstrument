device: korg-nts-1-mkii
name: Gorge
summary: Port of the Valley Audio Plateau reverb as a stereo revfx unit for the NTS-1 mkII, with size, decay, freeze, modulation, predelay, diffusion and high-cut controls.
description: >-
  Gorge is a stereo Dattorro-style plate reverb ported from Valley Audio's
  Plateau. Knob A sets size and knob B sets decay, with dry/wet mix on the
  delay shift. Freeze and modulation depth, rate and shape are further
  parameters, and predelay, diffusion and high-cut sit in the shift menu
  reached by holding the osc button. The Gumroad page warns that it is CPU
  heavy and may cause problems alongside other demanding oscillators and
  effects. It is sold on Gumroad (listed at 5 USD), and the source and
  release are on GitHub.
status: active
