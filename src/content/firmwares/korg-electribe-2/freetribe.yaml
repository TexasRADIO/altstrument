device: korg-electribe-2
name: Freetribe
summary: Ground-up open-source replacement firmware and API for the Electribe 2, still at a developer stage with basic examples rather than a finished instrument.
description: >-
  Built from original code and open-source components rather than patching
  Korg's firmware. Hardware initialisation and drivers are largely done:
  serial MIDI over the TRS port, the 128x64 display, backlight and LED
  control, panel control callbacks, commands to the Blackfin DSP and an audio
  module API. USB, SD card, DSP block processing and dynamic app loading are
  listed as planned. Tags v0.1.0 to v0.1.3 exist but there are no formal
  releases.
status: active
