distribution: source-only
install_notes: >-
  Build the circuit from the schematic, then compile midi2cv.ino in the Arduino IDE for an Arduino Nano and
  upload it. The README advises 1% resistors for the note output gain and says tuning can be trimmed with the
  NOTE_SF constant.
