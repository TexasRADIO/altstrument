device: elkayem-midi2cv
name: midi2cv
summary: Arduino sketch for a DIY MIDI to CV converter with note, pitch bend, velocity, control change, trigger, gate and clock outputs, plus selectable note priority.
description: >-
  A single Arduino sketch using the standard MIDI and SPI libraries to drive two MCP4822 DACs. Note CV covers 88
  keys at 1 V per octave, pitch bend is centred at 0.5 V, velocity and one control change number run from 0 to
  4 V, and the trigger, gate and clock outputs are 5 V pulses or levels. Note priority is read at start-up from a
  three-pin header or switch. The repository also holds the Eagle schematic and build photos. The author last
  pushed in 2018, and the sketch has been forked many times.
status: dormant
