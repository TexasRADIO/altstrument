    url: https://github.com/Morphanaut
source: https://github.com/Morphanaut/midi2cv
source_status: open
license: GPL-3.0-or-later
license_notes: Inherited from the upstream elkayem/midi2cv repository; the sketch headers grant GPL version 3 or any later version and the fork keeps the LICENSE file.
homepage: https://github.com/Morphanaut/midi2cv#readme
distribution: source-only
requires_stock: elkayem midi2cv hardware (Arduino Nano build)
install_notes: >-
  Choose a sketch folder, select Arduino Nano with the ATmega328P (Old Bootloader) option in the Arduino IDE
  and upload it to the converter. The README names that setting as the one tested.
brick_risk: false
