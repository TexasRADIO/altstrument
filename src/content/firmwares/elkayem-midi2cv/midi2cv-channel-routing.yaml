device: elkayem-midi2cv
name: midi2cv channel routing (Morphanaut fork)
summary: Fork of elkayem's midi2cv that adds two sketches giving the converter's outputs their own MIDI channels, one with three channels and one with six.
description: >-
  Keeps the original sketch unchanged and adds midi2cv_three_channels and midi2cv_full_channels, both for the
  original hardware, DAC scaling and voltage ranges. The three-channel sketch puts note CV, gate, velocity and
  pitch bend on channel 1, the trigger pulse on channel 2 and control change CV on channel 3. The full sketch
  gives note, gate, trigger, velocity, pitch bend and control change CV channels 1 to 6. Channel numbers are
  constants near the top of each sketch, and MIDI clock stays global because it has no channel. The fork has two
  commits from 2026-10-12.
status: active
authors:
