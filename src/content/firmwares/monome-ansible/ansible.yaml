device: monome-ansible
name: ansible
summary: >-
  Official open-source ansible firmware: Kria, Meadowphysics and Earthsea apps for grid and arc, MIDI modes, an i2c leader mode and USB preset storage.
description: >-
  The changelog lists MIDI by ngwese, the Earthsea implementation by
  scanner_darkly and the preset JSON engine by csboling. Version 3.0.0 added
  i2c leader mode for Just Friends, TELEXo or ER-301; 3.1.0 added Disting EX,
  W/syn and crow as followers; 3.2.0 supports CDC arc. monome lists ansible as
  discontinued.
status: maintained
