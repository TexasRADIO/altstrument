device: akai-mpc1000
name: mpc1k-seq
kind: tool
summary: Command-line Python utility that inspects MPC1000 .SEQ sequence files and batch-edits their audio-track file names, BPM and loop length.
description: >-
  Meant for the workflow of keeping one template sequence per speed of a backing
  track or drum loop. Given a folder of .SEQ files, it can search and replace
  strings in the file contents, point the audio track at a wav with the same
  base name, set the BPM or loop length to the values written in the file name,
  restrict processing to names matching a filter, and show hex values. It was written for files from an MPC1000 running JJOS; the
  author expects MPC2500 files to work and was unsure about the MPC500. Some
  example sequence files are in the repository. Self-contained Windows and
  macOS executables are attached to release v1.2.
status: dormant
