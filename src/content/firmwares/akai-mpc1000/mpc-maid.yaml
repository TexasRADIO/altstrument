device: akai-mpc1000
name: MPC Maid
kind: tool
summary: Java editor for MPC1000, MPC2500 and MPC500 .PGM programs, with drag-and-drop pad assignment, multisample and batch program creation, and a beat-detecting loop slicer that exports WAV slices, a program and a MIDI groove.
description: >-
  Opens one window per program and switches between the MPC500's 12-pad and the
  MPC1000's 16-pad layouts, adjusting the number of filters and sliders to
  match. Samples dropped on pads are assigned one per pad or one per layer, and
  programs are exported together with their sample files. Other features are
  multisample creation from files named with note names, a batch mode that
  builds listing programs from nested sample folders, copying one pad's settings
  to all pads, and the slicer. The file format work builds on published
  MPC1000 program documentation. The repository holds the Java source, a user
  manual and a prebuilt jar; the last commit is from 2016.
