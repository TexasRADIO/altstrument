device: monome-earthsea
name: polyearthsea
summary: scanner_darkly's polyphonic earthsea built on the multipass framework, targeting trilogy modules, ansible and Teletype; built from source or from a 2020 pre-release.
description: >-
  A multipass version of earthsea with polyphony. Build by choosing the module
  folder under multipass/monome_euro (for example ansible) and running make,
  following the libavr32 toolchain instructions. The only tag is a 0.0.1
  pre-release from December 2020 and the last commit is from October 2023.
