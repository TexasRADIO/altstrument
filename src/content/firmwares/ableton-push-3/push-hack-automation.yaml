device: ableton-push-3
name: Push Hack Automation
summary: >-
  Push Hack module that runs LFO-style MIDI CC lanes drawn as curves in a web page and sends them to Live on Push 3
  Standalone, following Live's tempo, for recording as automation or mapping to parameters.
description: >-
  The module serves a browser page, opened from Push Manager, where each lane gets a MIDI CC number, a channel and a
  looping curve of draggable breakpoints, with linear or smooth interpolation. A lane can loop over a number of beats
  in sync with Live, or run on its own tempo and length, and a lane can be muted without deleting it. There is a
  maximum of eight lanes. It creates a MIDI output port that Live has to enable for Remote in its MIDI preferences,
  after which each CC is mapped to a parameter with MIDI Learn. Tempo comes from the PushHack Remote Script, with MIDI
  clock and Push Manager's tempo as fallbacks, and the Push Play button starts and stops the lanes when Sync to Live
  is on. Lane settings are saved on the unit and survive restarts.
status: active
authors:
  - name: Federico P.
    url: https://github.com/federico-pepe
source: https://github.com/federico-pepe/push-hack-automation
source_status: open
license: unspecified
license_notes: The repository has no license file and no license statement.
homepage: https://github.com/federico-pepe/ableton-push-hack#readme
distribution: download
requires_stock: Push Hack with push-manager; Live 12.4 or later on Push; PushHack Remote Script 0.2.0 or newer for exact tempo
install_notes: >-
  Install it from Push Catalog on the unit, after Push Hack itself, then open it from Push Manager's menu bar. In
  Push's MIDI preferences, enable Remote on the Push Hack Automation input. Without the Remote Script, also enable Sync
  on the Push Hack Clock output. Releases are tarballs built by the project's GitHub workflow. The Push Hack warnings
  about backups, recovery and Push software updates apply.
brick_risk: false
