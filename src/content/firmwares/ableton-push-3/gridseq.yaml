distribution: source-only
requires_stock: Push Tethered App; python3 on the PATH
install_notes: >-
  Clone the repository and add the folder in Push Tethered App with Add module, or run pushapp -install with its
  path, then start it with pushapp -module gridseq. The module is not in the app's online catalog.
