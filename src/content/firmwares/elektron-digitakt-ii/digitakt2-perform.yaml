device: elektron-digitakt-ii
name: digitakt2-perform
summary: Two elekloader mods for PERFORM KIT on the Digitakt II OS 1.17. perform-direct makes PRESET toggle the mode; perform-levels keeps track levels when you leave it.
description: >-
  perform-levels works on a unit, and perform-direct's key swap works (an earlier
  version had a PERSONALIZE on/off row). The two together have been linted and
  built but not yet run on a unit. elekloader support for the Digitakt II is
  experimental.
status: active
