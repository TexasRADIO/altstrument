device: noise-engineering-legio
name: Stutterer Legio
summary: Stereo stutter, tape delay and DJ filter chain with clock sync, inertial tape speed on the encoder, selectable stutter subdivisions, a clock multiplier switch and a wet/dry switch.
description: >-
  Audio runs through the stutter, then the tape delay, a DJ filter and a soft
  clipper. The gate input is an external clock that falls back to 120 BPM
  after two seconds without edges, and holding the encoder at power-up starts
  a bypass mode. The V/Oct input is read but currently ignored. One of three
  Legio firmwares by the same author.
status: active
authors:
