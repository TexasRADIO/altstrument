  from plugin/ are also subject to JUCE's AGPL-3.0 terms unless a commercial
  JUCE license is held.
homepage: https://github.com/tashian/legio-sawstack
distribution: source-only
install_notes: >-
  No prebuilt binary. Build with make in firmware/ and flash with make
  program-dfu after entering the bootloader (hold BOOT and press RESET on the
  Patch SM). Calibrate V/Oct as described in the README. Noise Engineering's
  firmware portal restores the stock firmware.
