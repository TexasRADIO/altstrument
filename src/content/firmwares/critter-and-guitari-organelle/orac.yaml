source_status: open
license: GPL-3.0-only
license_notes: LICENSE is GPLv3; no "or later" grant was checked in the source files.
homepage: https://patchstorage.com/orac-2-0-for-organelle/
distribution: download
install_notes: Download the Orac package from Patchstorage, copy the .zop file into the Patches folder on a USB drive, load the drive on the Organelle and choose the Install entry in the patch menu.
