device: critter-and-guitari-organelle
name: Organelle OS
summary: Official Organelle operating system, a Linux disk image with the C++ menu application that loads Pure Data patches and drives the keys, knobs and OLED, plus WiFi, MIDI and a browser editor.
description: >-
  The Organelle_OS repository holds the menu application, system scripts and
  platform files for the Organelle. Its README describes a hardware layer for
  the Organelle M (Raspberry Pi CM3) and the Organelle S2 (CM4), and a single
  image that boots on both. Version 5, announced in April 2026, covers the
  Organelle M, S and S2, groups the factory patches into PLAY and EXPLORE
  folders, adds a browser-based code editor and a web terminal, and installs
  Lua, ChucK and Faust. It does not support the original Organelle.
status: active
authors:
