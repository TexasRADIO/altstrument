license_notes: LICENSE.txt grants BSD 3-Clause terms to files copyright Critter & Guitari; imported files carry their own authors and licenses in their comments.
homepage: https://critterandguitari.github.io/cg-docs/Organelle/og_sms2/
distribution: download
requires_stock: Organelle M, S or S2 (not the original Organelle)
install_notes: >-
  Download the disk image linked in section 7.1 of the user manual
  (OGSMS2_v5.1.img.zip for OS 5.1), write the zipped file to a microSD card of
  8 GB or more with balenaEtcher, and put the card back in the unit. This
  erases the card, so back up patches first. Check the version under
  Settings > Info.
