license: GPL-3.0-only
license_notes: LICENSE.txt is GPLv3; no "or later" grant was found in the project's own files. Bundled third-party code (e.g. Faust UI headers) keeps its own terms.
homepage: https://monome.org/docs/norns/
distribution: download
install_notes: Connect norns to the internet and use SYSTEM > UPDATE, or upload the release tgz to the device's update directory.
