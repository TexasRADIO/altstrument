device: monome-norns
name: norns
summary: >-
  Official open-source norns system software: the Lua UI and scripting layer, the SuperCollider-based audio engine (with the softcut submodule), updated on device from SYSTEM > UPDATE.
description: >-
  The main monome/norns repository is the operating-system layer that runs on
  norns, norns shield and compatible boards. Release 3.0.0 combined the
  previously separate matron and crone processes into one process that talks
  over shared memory instead of OSC. Releases are uploaded as tgz update
  packages with a checksum. GitHub marks the 3.0.x line as pre-release;
  2.9.4 is the latest release not marked pre-release.
status: active
