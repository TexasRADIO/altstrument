device: ableton-move
name: Organelle
summary: >-
  Schwung sound generator that runs Critter & Guitari Organelle Pure Data patches on Move through an embedded
  libpd, mapping the Organelle's knobs, encoder and screen to Move's controls.
description: >-
  The module embeds libpd and loads patch folders that contain a main.pd from a patches directory on the
  Move, translating the Organelle's four knobs, encoder, aux button, foot switch and 128 by 64 screen to Move
  controls and passing keyboard notes through from the slot's MIDI input. Six patches ship with it, five from
  Critter & Guitari's BSD-licensed patch repository, and others can be copied over SFTP. The README says the
  first version supports only vanilla Pure Data objects with no externals, and it describes the project as in
  development. An OSC compatibility bridge is planned in a design document.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-organelle
source_status: open
license: MIT
license_notes: >-
  The module is MIT. libpd and Pure Data are BSD-style, the 5x8 font and the six bundled Critter & Guitari patches
  are BSD-3-Clause, with a LICENSE.txt in each patch folder.
homepage: https://github.com/charlesvestal/schwung-organelle#readme
distribution: source-only
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. The repository has no release or module-store listing, so build it with the Docker script and
  deploy it to the Move over SSH with the install script. Patches go in
  /data/UserData/schwung/organelle-patches/ on the unit.
brick_risk: false
tags: [synth-engine, emulator, scripting, sdk]
