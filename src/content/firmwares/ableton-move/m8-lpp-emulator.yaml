homepage: https://chaolue.github.io/schwung-m8/
distribution: download
requires_stock: Schwung installed on the Move; a Dirtywave M8 set to Launchpad Pro control surface
install_notes: >-
  Needs Schwung and an M8. Install M8 LPP Emulator from the Utilities section of Schwung's Module Store, then on
  the M8 set MIDI Settings, CTRL SURFACE to Launchpad Pro and open the module from Schwung's Tools menu
  (Shift and step 13). The README says to keep Move tracks off MIDI channels 1 to 3 to avoid echo.
brick_risk: false
