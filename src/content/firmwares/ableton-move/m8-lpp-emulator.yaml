device: ableton-move
name: M8 LPP Emulator
summary: >-
  Schwung module that lets Move stand in for a Novation Launchpad Pro on a Dirtywave M8, with the M8's session,
  note, sequencer and beat-repeat screens on the pads and a bank of named, CC-mapped knobs.
description: >-
  The M8 treats a Launchpad Pro as a control surface. This module speaks that protocol to an M8 connected to
  Move's USB-A port, or to the M8 iPad app on the USB-C port, and shows half of the 8 by 8 grid on the pads at a
  time, with the colours, blinking and pulsing reproduced. The eight knobs send CC values to M8 mixer, send
  effect, instrument and EQ parameters that the user adds one at a time, shown in the M8's own units, with
  filter, envelope and LFO graphics. Pages of knobs are saved as songs and can be edited from a browser. The M8
  keeps running its own firmware on its own hardware; the module only exchanges MIDI with it. The first version
  was bobbydigitales's M8 module for Move Anything.
status: active
authors:
