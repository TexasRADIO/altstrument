device: ableton-move
name: dAVEBOx
summary: >-
  Eight-track MIDI sequencer for Schwung with per-clip effect chains, polyrhythmic drum lanes and a
  performance mode, routable to Move instruments, Schwung slots or external MIDI.
description: >-
  dAVEBOx is a sequencing environment that can replace the native Move sequencer's functions while following
  Move's workflow. It has eight melodic or drum tracks with 16 clips each, up to 256 steps per clip, a step
  arpeggiator, pitch randomisation, harmoniser and MIDI delay for each clip, 32 drum lanes with their own
  loop lengths and note repeat, eight automation lanes per track, conductor tracks for live transposition
  and snapshot slots for mute and solo states. Each track can send to Move's instruments, a Schwung slot or
  external MIDI, and sessions can be exported to Live. The README describes it as built with AI coding tools
  under a human designer and gives no warranty. The author has frozen this version as dAVEBOx Legacy; new
  work goes into the standalone successor dAVEBOx SA, which does not open Legacy projects.
status: maintained
