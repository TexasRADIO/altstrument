homepage: https://github.com/rgeissen/schwung-stacks#readme
distribution: source-only
requires_stock: Schwung 1.4 or later installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung with overtake tools and the Tool tab. Build it with scripts/build.sh, which cross-compiles in Docker,
  and copy it to the Move with scripts/install.sh over SSH. The README also describes installing a stacks-module.tar.gz
  from the Schwung web manager, but the repository has no release to download yet. Read Track following the selected
  track needs Schwung 1.6 or later.
