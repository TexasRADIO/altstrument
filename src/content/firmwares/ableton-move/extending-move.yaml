device: ableton-move
name: Extending Move
summary: >-
  Companion web server installed on the Move over SSH that serves a browser editor for sets, clips, presets
  and kits next to the stock Move server.
description: >-
  Extending Move runs a Python web server on the Move beside Ableton's own server and is reached at
  move.local on port 909. The pages restore and inspect sets, edit notes and envelopes in a piano roll,
  import MIDI files, edit the Drift, Wavetable and melodic sampler presets and their macro knobs, build
  chord kits and sliced drum kits from WAV files, and reverse or time-stretch samples using a bundled Rubber
  Band build. It works on the unit's own files and does not replace Move's software. The README says it is
  not affiliated with Ableton, that using SSH access carries a small risk of breaking things, and that
  Ableton's DFU restore is the fallback.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/extending-move
source_status: open
license: MIT
license_notes: >-
  Bundles a statically linked Rubber Band build, whose source is GPLv2, and several JavaScript libraries
  under Apache-2.0, BSD-3-Clause and MIT or GPLv3; see the third_party folder.
distribution: source-only
install_notes: >-
  The unit has to be reachable over Wi-Fi and have an SSH key added on its move.local/development/ssh page.
  Clone or download the repository and run the setup-ssh-and-install-on-move script from utility-scripts,
  which walks through the SSH setup and copies the server to the unit; further scripts set it to start on
  boot and update it. There are no tagged releases.
brick_risk: false
tags: [editor, sampler, sequencer, utility, python]
