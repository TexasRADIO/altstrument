device: ableton-move
name: Chiptune
summary: >-
  Schwung sound generator that emulates the NES 2A03 and Game Boy sound chips, with 32 presets, up to four voices,
  ADSR, vibrato and pitch bend.
description: >-
  Chiptune plays cycle-accurate emulations of the NES chip (two pulse channels, triangle and noise) and the Game Boy
  chip (two pulse channels, a 32-sample wave channel and noise), built on blargg's band-limited sound libraries. It
  has 16 NES and 16 Game Boy presets, eight programmable Game Boy wavetables, automatic voice allocation, and eight
  knobs for envelope, duty, vibrato and volume. It can run on its own or as the sound generator in a Schwung signal
  chain, and the repository ships two chain patches, one for each chip. The README still calls the host Move
  Everything, Schwung's earlier name, and says the module was developed with AI assistance.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-chiptune
source_status: open
license: MIT
license_notes: >-
  The plugin code is MIT. The vendored Nes_Snd_Emu and Gb_Snd_Emu libraries by Shay Green (blargg) are LGPL-2.1,
  and the module metadata reads MIT/LGPL-2.1.
homepage: https://github.com/charlesvestal/schwung-chiptune#readme
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Install Chiptune from the Sound Generators section of Schwung's Module Store, or build it from
  source with Docker or an ARM64 cross-compiler and install it over SSH.
brick_risk: false
tags: [synth-engine, chiptune, synth]
