device: ableton-move
name: RNBO for Schwung
summary: >-
  Schwung modules that host Max RNBO exports on Move: an overtake module wrapping Cycling '74's RNBO Runner,
  and chain modules that load .rnbopack synths and effects.
description: >-
  Two uses are covered. The RNBO Runner overtake module starts Cycling '74's RNBO Runner on the Move, with a
  JACK shadow driver, so that its patchers drive Move's pads, knobs, display and LEDs while a web panel serves
  the graph. The chain modules load .rnbopack files, each holding interconnected RNBO patchers compiled for
  ARM64, wire them as the set file describes and expose their parameters on the knobs, as a synth, an audio
  effect or a MIDI effect. A bridge library isolates the RNBO SDK version from the host. The repository
  does not ship the RNBO SDK or Runner; the README lists the RNBO Runner for Move and the schwung-jack shadow
  driver as prerequisites for the Runner mode.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-rnbo
source_status: open
license: unspecified
license_notes: >-
  No LICENSE file or licence statement in the repository. The RNBO SDK and Runner it builds against are
  Cycling '74 products with their own terms.
homepage: https://github.com/charlesvestal/schwung-rnbo#readme
distribution: source-only
requires_stock: Schwung installed on the Move; RNBO SDK 1.4.3 to build; Cycling '74's RNBO Runner for the Runner mode
install_notes: >-
  Needs Schwung. Build with Docker and a copy of the RNBO SDK 1.4.3, then install with the repository's install
  script over SSH. For Runner mode also install the RNBO Runner with Cycling '74's installer and build the
  schwung-jack shadow driver. Chain modules load .rnbopack files copied into their packs folder.
brick_risk: false
tags: [synth-engine, fx, sdk, platform]
