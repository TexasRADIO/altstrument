device: ableton-move
name: Smack
summary: >-
  Schwung effect that captures a quantized loop of live audio, slices it and assigns seeded glitch effects
  and a new slice order, with Smack In and Oversmack variants.
description: >-
  Smack grabs the last steps or bars you played, or records after arming, then slices the loop on a grid and
  rolls effects per slice at a set density. Patterns are seeded and repeat until re-rolled. There are 26
  effects, including retrigger, reverse, tape stop, scratch, bitcrush, filter sweeps, granular freeze and
  ring modulation, an A/B punch between clean and glitched loop, step editing and a dual mono mode. The same
  release ships Smack In, a standalone sound generator, and Oversmack, a full-surface module. It follows Tim
  Cox's other Schwung modules and is described as inspired by the Looperator plug-in and the Octatrack.
status: active
