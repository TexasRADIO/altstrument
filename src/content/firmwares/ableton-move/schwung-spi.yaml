device: ableton-move
name: schwung-spi
kind: tool
summary: >-
  Small C library, loaded with LD_PRELOAD, that intercepts the Move's SPI link to its audio and I/O processor
  and keeps a shadow buffer for audio, MIDI, display and LED data.
description: >-
  The library hooks open, mmap and ioctl so that code running next to Move's own software can read and write
  the SPI buffer. It exposes the 4096-byte layout with MIDI out, display, audio out, MIDI in and audio in
  regions, with helper functions for USB-MIDI encoding and for mixing and interleaving audio. A second file
  adds constants and helpers for Move's buttons, pads, encoders and LEDs, including palette and direct RGB
  colour. A sine-wave example mixes a tone into Move's output. The README says the protocol was derived from
  Ableton's GPL-2.0 ablspi library, which it says was obtained through a GPL source request for the Move JACK
  driver.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-spi
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is MIT. The README states that the SPI protocol was derived from Ableton's GPL-2.0 ablspi
  library, which is not copied into the repository.
homepage: https://github.com/charlesvestal/schwung-spi#readme
distribution: source-only
install_notes: >-
  A developer library with no installer: compile the C files for the Move's ARM64 processor, preload the
  result into a process with LD_PRELOAD, and use the callbacks in schwung_spi_lib.h. Needs SSH access to
  the unit, which Ableton does not support.
brick_risk: false
tags: [sdk, research, platform, midi]
