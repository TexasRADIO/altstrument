device: miyoo-miyoo-mini
name: Little Piggy Tracker
summary: >-
  Sample tracker with an LSDj-style interface, with a dedicated build for the Miyoo Mini.
description: >-
  Little Piggy Tracker (formerly LittleGPTracker) is a sample-based tracker with eight channels, 8 and 16 bit WAV
  samples, SoundFont import and a song, chain and phrase workflow. It is the maintained successor of Marc
  Nostromo's original LittleGPTracker (BSD-3-Clause, no commits since 2020), whose user interface follows Little
  Sound DJ. The MIYOO build is a port by Nine-H and ships in the recent releases, with an SDL 1.2 library bundled in the
  zip. The project's feature table lists no MIDI for this build.
status: active
authors:
  - name: djdiskmachine
    url: https://github.com/djdiskmachine
  - name: Marc Nostromo
    url: https://github.com/Mdashdotdashn
  - name: Nine-H
    url: https://ninethehacker.xyz
source: https://github.com/djdiskmachine/LittleGPTracker
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file applies GPLv3 to the fork's new work and keeps the original BSD-3-Clause terms (Copyright 2018
  Discodirt) for the code it derives from. It says "version 3" without an "or later" grant. GitHub shows no
  license for the repository because the file holds both texts.
homepage: https://littlepiggytracker.github.io/
distribution: download
install_notes: >-
  Download the MIYOO zip from the GitHub release and copy its files (lgpt-miyoo.elf, the SDL library, xml, shell
  and json files, and the icon) to /SdCard/App/LGPT/ on the SD card, the samplelib to /SdCard/Samples and your
  projects to /SdCard/Tracks. The install file in the zip shows this layout.
brick_risk: false
tags: [tracker, sampler, sequencer, open-source]
