device: novation-launchpad
name: Launchpad Firmware Utility
kind: tool
summary: Browser WebMIDI tool that updates Launchpad firmware and applies patches to stock images, including custom colour palettes and the Apollo Studio Fast LED mod. It also installs the Launchpad Pro CFW.
description: >-
  Runs at fw.mat1jaczyyy.com. Features per the README are custom palettes, the
  Apollo Studio Fast LED mod and installing the latest custom firmware on the
  Launchpad Pro. A hidden mode allows flashing custom SysEx files. The
  repository includes a ghidra directory and an x-fast-led-hack directory. It patches
  stock images and does not replace the operating system on MK3-era units.
