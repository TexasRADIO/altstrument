distribution: download
requires_stock: Cardputer ADV; M5Stack Unit MIDI for a DIN keyboard, or a Bluetooth MIDI source with the BLE build
install_notes: >-
  Each release has two merged images, a standard build with 12 voices and a BLE build with 10 voices and Bluetooth
  MIDI; pick one. Flash it with M5Burner, from the SD card through Launcher, or with any tool that writes a merged
  image at offset 0x0. To build from source, use PlatformIO with the morphase or morphase_ble environment. Patches are
  stored on the microSD card, and earphones are recommended because the internal speaker reproduces low notes poorly.
brick_risk: false
