device: m5stack-cardputer
name: MORPHASE
summary: >-
  Four-operator FM polysynth for the Cardputer ADV, played from a MIDI keyboard with the Cardputer as the sound editor,
  with patch morphing, an arpeggiator and optional tilt and distance-sensor control.
description: >-
  A 12-note polyphonic FM synth with 14 algorithms, operator waveforms that morph between eight shapes, fixed-frequency
  operators for percussion, a pitch envelope, a GLITCH stutter and reverse mode, an arpeggiator with a 16-step note
  pattern, crush, chorus, delay, reverb and drive effects, and 32 factory patches that are written to the microSD card
  on first start. Notes come from a MIDI keyboard through an M5Stack Unit MIDI on the Grove port; the Cardputer's own
  keys edit the sound, because the author found that its keyboard misses chords. The IMU can modulate the sound when
  the unit is tilted, and an optional Unit ToF4M distance sensor works as a theremin. A second build adds Bluetooth
  MIDI at the cost of two voices, giving 10. The original Cardputer is not supported, there is no step sequencer, and
  the README says the code was written by Claude from the author's descriptions.
status: active
