device: m5stack-cardputer
name: SynthCard
summary: >-
  Standalone groovebox for the Cardputer ADV with eight-voice synth in six engines, twelve synthesised drum lanes, a
  64-step sequencer, song mode and effects.
description: >-
  SynthCard has seven screens: live play, drums, a piano-roll step editor, sound design, effects, a song arranger
  and setup. The LEAD and BASS tracks choose from analog, FM, wavetable, Karplus-Strong pluck, organ and chip
  engines with 48 factory presets, and twelve drum voices are synthesised rather than sampled. The sequencer holds
  eight patterns of up to 64 steps with probability, slide and chord steps, live recording, scales, an
  arpeggiator and generators for beats and melodies. Delay, plate reverb, chorus and a compressor are built in, and
  projects are saved to the microSD card. It runs on the Cardputer ADV only and refuses to start on other boards.
  Output is mono and there is no MIDI. The repository has a host-side test and WAV render suite for the audio code.
status: active
authors:
