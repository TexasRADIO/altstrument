    url: https://github.com/meister5
source: https://github.com/meister5/synthcard
source_status: open
license: MIT
homepage: https://github.com/meister5/synthcard
distribution: download
install_notes: >-
  The repository keeps a built SynthCard.bin at its root, and tools/package.sh builds that file plus a merged image.
  Point M5Launcher at the SynthCard.bin file, flash the merged image at offset 0x0 with esptool or M5Burner, or
  upload with arduino-cli. Projects live in /synthcard on the microSD card; the card is optional for playing.
brick_risk: false
