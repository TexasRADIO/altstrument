device: m5stack-cardputer
name: Bonnethead
summary: >-
  Lo-fi drum machine for the Cardputer with eight tracks of 16 steps, 36 patterns, swing, SD-card kits and a
  key-drumming mode.
description: >-
  The repository is named cardputer_drums and its README calls the program Bonnethead. It plays 16 kHz samples on
  eight tracks of 16 steps, with 36 patterns, a pattern sequencer with fills, swing, per-step velocity and
  sub-tick timing, per-channel filters, retrigger and reverse effects, a live key-drumming mode, sample kits from
  the SD card and rendering to the SD card. It is written for the Cardputer, linking the original kit, and the README says it is available
  on M5Burner. The last commit is from February 2025.
status: maintained
authors:
  - name: johnhw
    url: https://github.com/johnhw
source: https://github.com/johnhw/cardputer_drums
source_status: open
license: MIT
distribution: download
install_notes: >-
  The README says Bonnethead is available on M5Burner. To build it yourself, open cardputer_drums.ino in the
  Arduino IDE; a build_m5burner.bat script is included. Drum kits live in the kits folder and on the SD card.
brick_risk: false
