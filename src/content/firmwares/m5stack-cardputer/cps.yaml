  allowed. GitHub does not detect it automatically.
distribution: download
requires_stock: Cardputer ADV or original Cardputer; microSD card for patches and settings
install_notes: >-
  The README lists M5Burner (search for C.P.S.), the Launcher firmware's OTA search or a .bin copied to the SD card root,
  and a PlatformIO build that also produces a merged image. A FAT32 microSD card is needed for patches, sequences and
  songs; the app still starts without one. Ten factory patches are in the repository's Patch folder and go in /CPS/Patch/
  on the card.
brick_risk: false
