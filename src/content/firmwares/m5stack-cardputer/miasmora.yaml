distribution: download
requires_stock: Cardputer ADV; the original Cardputer is untested
install_notes: >-
  Flash it from the M5Burner web page linked in the README, or copy the release's firmware.bin to the root of the SD
  card and flash it from Launcher. To build from source, use PlatformIO with the m5stack-cardputer-adv environment,
  which also produces a merged image for M5Burner and similar tools. The app creates a /MIASMORA folder on the
  microSD card for settings, scenes and exports; without a card, nothing is saved and export is unavailable. Started
  from Launcher, waking from deep sleep returns to Launcher. Earphones are recommended because the built-in speaker
  barely reproduces the lowest notes.
brick_risk: false
