device: m5stack-cardputer
name: MIASMORA
summary: >-
  Dark ambient drone generator for the Cardputer ADV, with 25 layers synthesised in real time, mood presets shared by
  seed, microphone-triggered silences, tilt control and WAV loop and stem export to microSD.
description: >-
  Plays an endless drone built from 11 drone layers, 13 event layers (creaks, drips, footsteps, scrapes and similar)
  and a reverb, with no samples. There are 24 mood presets plus random scenes, and a 6-digit seed that reproduces the
  same scene on another device. A DREAD control moves several parameters at once, Drift and Arc change the sound over
  10 to 30 minutes by themselves, and Listen uses the microphone's level, without recording, to make the sound fall
  silent after a sudden noise. The IMU drives a tilt mode and a prank mode that hides the device. Loops of 8 to 64
  seconds, stems, batches and one-shot sounds can be exported as WAV files to the microSD card, and live output can be
  recorded. Output is mono through the speaker or the 3.5 mm jack. Only the Cardputer ADV was tested, and the README
  says the code was written by Claude from the author's descriptions. The author calls it the sister firmware of
  Enso, a calm ambient generator.
