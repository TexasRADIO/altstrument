device: roland-sp-404-mkii
name: DOOM OS MIDI Conductor
summary: "Browser patcher for the SP-404MKII that builds DOOM OS 0.6.2-alpha plus a MIDI layer: pads and sequencer steps play external synths over DIN MIDI, 36 CTRL dials send CC, and dial moves can be recorded. Warning: it carries DOOM OS, whose license changed to restrictive terms."
description: >-
  Rights warning: this project is built on DOOM OS 0.6.2-alpha (build 3824), and
  its patcher carries the DOOM OS changes. Upstream relicensed DOOM OS from MIT
  to a custom license at that release; that license allows free use but does not
  allow passing on the patch, the patcher or a patched file. This repository
  keeps the earlier MIT text as LICENSE-DOOM-OS and licenses its own code MIT,
  and the README says the project is not affiliated with the DOOM OS author.
  On top of DOOM OS it adds a setup screen for assigning synths to pads, each on its own MIDI
  channel, with pattern steps and piano-roll pitches sent out as notes. Six
  banks of six CTRL dials send any CC, with built-in CC name lists for several
  synths and the option to load your own, and SHIFT + VALUE records dial moves
  into the pattern. It can route one synth's keys or dials to another, and a
  keyboard can play and record the SP's pads. A GHOST synth mode and per-track
  mute and solo CC mapping were added in the 0.6.x releases. The README calls it
  experimental, tested on one unit only with Roland 5.52, and says it changes
  some of Roland's own routines. It contains no Roland firmware.
status: active
authors:
  - name: danielmcc123
    url: https://github.com/danielmcc123
source: https://github.com/danielmcc123/doom-os-midi-conductor
source_status: patcher-only
license: MIT
license_notes: >-
  The repository's LICENSE (MIT) covers this project's own code. The patcher
  also carries the DOOM OS 0.6.2-alpha changes, which upstream licenses under
  its custom DOOM OS License (all rights reserved; free to use, but passing on
  or changing the patch, patcher or patched files needs written permission).
  NOTICE.md and LICENSE-DOOM-OS in this repository describe DOOM OS as MIT,
  which was true of DOOM OS up to 0.6.1. The patcher script is adapted from the
  DOOM OS patcher. No Roland firmware is included; the patcher carries only the
  bytes that differ from Roland's file.
homepage: https://danielmcc123.github.io/doom-os-midi-conductor/
distribution: patch-your-own
requires_stock: "5.52"
install_notes: >-
  Download Roland's 5.52 system update and drop its SP404MKII_APP1.bin onto the
  browser patcher, which accepts only the stock file and runs locally. Keep the
  name SP404MKII_APP1.bin and install it with Roland's original
  SP404MKII_APP0.bin, the same way as DOOM OS. Each release folder has
  checksums for the stock and patched images. Installing Roland's original
  files restores stock. The README says to keep them and warns that modified
  firmware can brick the unit.
brick_risk: true
tags: [midi, sequencer, performance, os]
