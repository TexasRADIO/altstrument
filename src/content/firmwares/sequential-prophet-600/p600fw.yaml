device: sequential-prophet-600
name: P600FW
summary: Firmware remake for the Prophet-600 that runs on a Teensy++ board in the Z80 socket. Adds faster envelopes, unison with detune, a rebuilt voice assigner, MIDI out, SysEx patch dumps and arpeggiator clock sync.
description: >-
  Written by GliGli; since 2022 the project is also maintained by Imogen (Image
  et Son), who publishes an improved v2022+ series with a user manual. The
  stable 2.0 release added a new user interface, assigner rework with unison
  track latch, MIDI out and SysEx patch dumps, arpeggiator sync to MIDI clock,
  unison detune, a dedicated vibrato and automatic modulation after a delay.
  The repository's alpha series restarted development in 2021/22 and recently
  moved storage to an external 24LC512 I2C EEPROM. A prebuilt Teensy programmer
  HEX file was added in April 2026. The README notes an unpublished 2.1 RC3
  from 2015.
