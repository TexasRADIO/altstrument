device: critter-and-guitari-etc
name: ETC modes
summary: Critter & Guitari's Python/Pygame modes for the ETC video synthesizer, scope modes (S) and trigger modes (T) such as classic scopes, grids, fonts and rotating shapes, one folder per mode.
description: >-
  The ETC_Modes repository holds the modes that shipped on the ETC's USB
  drive, and a second repository, ETC_Modes_Extra, holds more. Each mode is a
  folder containing a main.py that draws with Pygame. The repository has no
  license file, so the terms are not stated there.
