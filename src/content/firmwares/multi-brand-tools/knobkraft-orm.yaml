device: multi-brand-tools
name: KnobKraft Orm
kind: tool
summary: Cross-platform MIDI SysEx librarian that backs up, organises and sends patches for dozens of hardware synths, with per-synth support written as Python adaptations.
description: >-
  KnobKraft Orm reads patches from a connected synth over SysEx, keeps them in
  a local library, and sends them back to the synth. It covers synths from Access,
  Akai, Alesis, Behringer, Casio, Clavia, DSI and Sequential, Elektron, Kawai,
  Korg, Moog, Novation, Oberheim, Roland, Waldorf and Yamaha, among others
  (the Yamaha reface DX is listed as working in the project's support table), so
  it is catalogued once here rather than per synth. Support for new synths is
  added by writing an adaptation in Python. Windows, macOS and Linux
  builds are provided.
status: active
authors:
  - name: Christof
    url: https://github.com/christofmuc
source: https://github.com/christofmuc/KnobKraft-orm
source_status: open
license: AGPL-3.0-only
license_notes: The LICENSE.md file holds the AGPL-3.0 text; no "or later" statement was found in the README.
homepage: https://knobkraft.com/docs/
distribution: download
install_notes: >-
  Download the installer or archive for your platform from the GitHub releases
  page. The librarian only exchanges patch data over MIDI and does not change
  the synth's operating system. Back up the synth before sending large batches
  of patches.
brick_risk: false
tags: [librarian, editor, sysex, midi]
