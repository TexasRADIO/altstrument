    url: https://github.com/tracelistener
source: https://github.com/tracelistener/tracelistener-circuit-extended
source_status: open
license: MIT
license_notes: >-
  Covers the project's original code and documentation only. Novation firmware
  is third-party material. The project's uploader page includes a prebuilt
  patched update image, which contains Novation's code.
homepage: https://tracelistener.github.io/tracelistener-circuit-extended/
distribution: browser-installer
requires_stock: 1.8 build 3592
install_notes: >-
  Back up the Circuit in Novation Components first, then close Components and
  other MIDI software. Power on holding Scales + Note + Velocity to enter the
  bootloader, open the uploader in Chrome or Edge, pick the Bootloader port and
  upload. Stock firmware can be reinstalled through Novation Components.
tags: [synth-engine, fx, lfo, scales, midi, performance]
