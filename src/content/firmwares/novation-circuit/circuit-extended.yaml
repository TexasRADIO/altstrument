device: novation-circuit
name: Circuit Extended Firmware
summary: Browser-flashed patch for the original Circuit 1.8 firmware that adds Scale Follow, drum sample start, distortion type selection, a drum Filter LFO and Shift-Macro automation.
description: >-
  Adds a Scale Follow toggle (Shift + Scales) so drum pitch tracks the master
  scale, per-drum sample start, one of seven distortion algorithms per drum, an
  eight-speed Filter LFO and recording of these Shift-Macro moves. A newer
  experimental performance build adds pitch bend, mod wheel and aftertouch
  input, and the uploader can also rewrite the Circuit's MIDI CC numbers, with a
  Korg NTS-1 preset. The README says the performance build had one unexplained
  crash in hardware testing. Not compatible with Circuit Tracks, Circuit Rhythm
  or Circuit Mono Station. The author credits OpenAI Codex for reverse-engineering
  and implementation help.
status: active
