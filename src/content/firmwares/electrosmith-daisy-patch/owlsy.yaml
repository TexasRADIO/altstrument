device: electrosmith-daisy-patch
name: Owlsy
summary: OpenWare port that turns Daisy hardware into an OWL device. Loads existing OWL patches (Pure Data, gen~, Faust) over SysEx; supports Daisy Patch, Bluemchen, Patch.Init() / Patch SM and Daisy Pod.
description: >-
  Binary compatible with upstream OwlProgram and Rebel Technology patches.
  Adds quad-channel audio on Daisy Patch, a USB audio interface mode, SD card
  support with a browser menu, and a System menu with bootloader update over
  MIDI. Pod support (60 patches, 40 parameters) arrived in v25.1. Announcement
  and release thread is on the Daisy community forum.
