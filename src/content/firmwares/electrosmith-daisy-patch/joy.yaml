  the project is not affiliated with Mutable Instruments or Electrosmith.
homepage: https://eight4awish.com/modules/joy/
distribution: download
requires_stock: >-
  Daisy Patch.Init with the Daisy bootloader. Joy also needs a 64x48 SSD1306 OLED on the expansion header with the
  B8 toggle removed; Joy Lite needs the toggle fitted.
install_notes: >-
  Needs the Daisy bootloader in QSPI, installed once with make program-boot. Then copy joy.bin or joy_lite.bin from
  the release to a FAT32 SD card and power-cycle, or upload it with dfu-util during the bootloader's grace period.
