device: electrosmith-daisy-patch
name: Joy and Joy Lite
summary: >-
  Mutable Instruments Braids macro oscillator for the Patch.Init: Joy has 48 models and a 64x48 OLED navigator, and
  Joy Lite is a screenless build of 16 models for a stock unit.
description: >-
  Both builds compile Braids' own DSP unmodified and share a two-point V/Oct calibration done at power-on. Joy
  keeps all 48 models, uses the four knobs for sound parameters, selects patches with the B7 button and shows
  menus on a 64x48 SSD1306 OLED; it needs the B8 toggle removed to make room for the screen. Joy Lite leaves out the
  models that Plaits covers and offers 16 distinctively Braids ones in two toggle banks, with the model number shown
  by LED blinks. The last model is saved to QSPI flash. Both remain drones when no gate is patched, as a stock
  Braids does. They are the second of the author's nursery-rhyme family of Patch.Init firmwares. Panel files for
  3D printing and PCB faceplates are in the author's workshop repository.
status: active
authors:
