homepage: https://eight4awish.com/modules/wish-patch-init/
distribution: download
requires_stock: Stock Daisy Patch.Init with the Daisy bootloader installed once
install_notes: >-
  Needs the Daisy bootloader in QSPI, installed once with make program-boot. Copy wish_patch_init.bin from the
  release to a FAT32 SD card and power-cycle, or upload it with dfu-util during the bootloader's grace period.
