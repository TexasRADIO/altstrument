device: electrosmith-daisy-patch
name: Wish on Daisy patch.Init()
summary: >-
  Mutable Instruments Beads granular texture synthesizer on a stock Patch.Init, with four knobs on three layers, a
  freeze button, SEED and FREEZE gates and V/Oct calibration.
description: >-
  This build compiles Beads' own DSP and runs it behind the Patch.Init's four knobs, button, toggle and LED. The toggle
  picks PLAY or TONE, and holding B7 gives a RANDOM layer. B7 also freezes the buffer, grain gates appear on GATE OUT
  1, and the gate inputs trigger SEED and FREEZE. It uses the same pot laws and load governor as the author's Alchemy
  Lab version and shares Joy's V/Oct calibration. The README says the module was benched on one unit on the day of
  release, with loading and saving settings not tested before release.
