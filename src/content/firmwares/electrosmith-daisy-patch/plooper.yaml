device: electrosmith-daisy-patch
name: Plooper
summary: Four-playhead stereo looper for Daisy Patch with up to 60 seconds of loop, per-head speed, window, direction and pan, six reverb modes and tape-style fading on overdubs.
description: >-
  The first take sets the loop length, and holding the encoder punches in an
  overdub that can latch. Each of heads A to D has its own level, speed (reverse
  below centre), start, window length, direction and pan. Reverbs are Plate,
  Shimmer, Sub, Backwards, Ghost and Freeze. Dub fade, age and wow settings
  give a running tape-loop character. The repository includes a Mac simulation
  script for testing the audio code.
status: active
authors:
  - name: Bill W (billwolfhub)
    url: https://github.com/billwolfhub
source: https://github.com/billwolfhub/plooper
source_status: open
license: MIT
license_notes: >-
  Plooper is MIT. It uses ReverbSc from DaisySP-LGPL, which is LGPL-2.1.
distribution: download
install_notes: >-
  Needs the Daisy bootloader v6.4 installed first. Flash the release .bin to
  the QSPI address 0x90040000 with dfu-util; the release notes warn not to write
  it to internal flash at 0x08000000, which would overwrite the bootloader.
brick_risk: false
tags: [looper, reverb, tape, fx]
