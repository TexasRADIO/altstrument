device: electrosmith-daisy-patch
name: Plaitsy
summary: Port of Mutable Instruments Plaits to Daisy Patch, the first project in the Mutable Daisies series. Monophonic (low latency) and polyphonic (up to four voices) builds exist.
description: >-
  The repository plans further ports (Elements, Rings, Braids, Blades, Clouds,
  Beads) with a shared UI and preset system; only Plaits had been released at
  last check. Flashing needs the Daisy bootloader.
