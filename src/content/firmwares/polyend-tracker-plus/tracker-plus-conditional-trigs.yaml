device: polyend-tracker-plus
name: Tracker+ Conditional Trigs (CT6)
summary: Browser patcher that adds six conditional trigs (1:2, 2:2, 1:4, 2:4, 3:4 and 4:4) to your own Tracker+ 1.2.0 firmware file.
description: >-
  A static web page that patches a Tracker+ 1.2.0 .ptf in the browser and saves
  TrackerPlus_1.2.0_CT.ptf, after checking the output against a published
  SHA-256. The six conditions play a step only on the stated pass of a repeating
  cycle. The repository holds the patcher and the fixed patch program as
  generated code, while the author's development repository stays private. It
  reuses the PTF tools and research from the Modular-Trackular project, which
  later made its own condtrig mod from this one's behaviour. The README warns
  that Song Mode is not yet validated on hardware, and the documentation lists
  longer cycles and first-pass or neighbour conditions as research goals that
  are not implemented.
status: active
authors:
  - name: Psygoo
    url: https://github.com/Psygoo
source: https://github.com/Psygoo/TrackerPlus-CT-Web
source_status: patcher-only
license: MIT
license_notes: >-
  The LICENSE file is the MIT license of the Modular-Trackular contributors,
  kept from the code this repository reuses; NOTICE.md says it does not license
  Polyend firmware.
homepage: https://psygoo.github.io/TrackerPlus-CT-Web/
distribution: patch-your-own
requires_stock: "1.2.0"
install_notes: >-
  Open the web patcher, choose your own TrackerPlus 1.2.0 .ptf from Polyend and
  save the verified result. Back up the whole SD card first, then install it from
  Config, Firmware as the Tracker+ manual describes. For recovery, keep only the
  stock .ptf in /Firmware, because the emergency flash picks a file at random.
  The README says the project is unofficial, Song Mode is untested on hardware
  and recovery is not guaranteed.
brick_risk: true
tags: [patch, sequencer, web, midi]
