device: moog-matriarch
name: Matriarch Firmware Fixes
summary: Patcher that applies a fix for the paraphonic mixer gate hold to your own copy of Moog's Matriarch v1.3.0 firmware, as a browser page or a Python script.
description: >-
  In 2- and 4-note paraphonic modes, v1.3.0 keeps a released oscillator sounding for 125 ms while other keys are
  still held, which smears staccato playing. The patch rewrites the constant that sets that hold, and the user
  chooses a value from 0 to 125 ms (5 ms recommended, 50 ms matches v1.1.0). It changes two 16-bit words of the
  SysEx file and recomputes the affected record's checksum. The project documents the firmware's SysEx format and
  includes Ghidra scripts used to analyse it. The other known issues on Moog's v1.3.0 list are not fixed yet.
status: active
authors:
