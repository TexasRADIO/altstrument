device: roland-d-70
name: D-70 Rosetta OS
summary: Work-in-progress replacement OS for the D-70, built by patching a dump of your own v1.11 EPROMs. It adds a boot animation, a ROSETTA OS menu with live synth edit pages, common sliders and a SysEx battery-RAM dump.
description: >-
  The build scripts read the two EPROM dumps from your unit and write two new
  images for blank chips. The patched OS plays a 45-frame boot animation, starts
  in a ROSETTA OS menu and has SYNTH pages that edit the four layers while you
  play: wave, zone, pitch, filter, amp, both envelopes with a drawn curve, and
  the LFO. Edits go through the stock SysEx parameter code. Four sliders can be
  made common sliders that move one parameter on all four layers, and a tools
  page sends the battery RAM out as SysEx. The ROM PLAY demo is removed to free
  space. The README says the build runs on a real D-70 but not every page has
  had a long session on hardware. The stated goal is a full replacement of the
  stock OS, and today it is a patch on top of Roland's code. The author credits
  Claude, an AI assistant, with the reverse engineering and tool code. A
  homemade 80C196 assembler, disassembler and simulator are in the repository.
status: active
authors:
