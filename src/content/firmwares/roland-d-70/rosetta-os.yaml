source: https://github.com/yuyoi/D70-Rosetta-Os
source_status: open
license: MIT
license_notes: >-
  Covers the repository only. The README says no Roland code or ROM data is
  included, and the dumps folder is git-ignored; builds contain Roland's code
  and should not be shared.
distribution: patch-your-own
requires_stock: "1.11"
install_notes: >-
  Dump both EPROMs from your own D-70 (IC4 holds the even bytes and IC9 the odd
  ones) and read each twice to compare. The build script only accepts v1.11 and
  checks both dumps by MD5. Run it to produce two images, burn them to new
  27C512 chips, and swap them in with the originals kept aside. Hold EXIT at
  power-on for the plain D-70 and EDIT for the boot menu. Not every page has
  been used at length on hardware.
tags: [eprom, ui, boot-splash, sysex, performance, research]
