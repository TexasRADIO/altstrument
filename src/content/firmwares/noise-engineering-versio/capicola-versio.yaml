    url: https://github.com/timncox
  - name: Heavylight Industries
    url: https://github.com/heavylight-industries
source: https://github.com/timncox/capicola-versio
source_status: open
license: AGPL-3.0-only
license_notes: >-
  LICENSE is the GNU AGPL v3, inherited from upstream Capicola; no "or later" grant was found in the README or the source headers
  checked.
distribution: source-only
install_notes: >-
  No releases are published. Build the internal-flash image with make -C firmware APP_TYPE=BOOT_NONE after initialising the
  upstream submodule (not recursively), then upload the .bin on Noise Engineering's firmware page. A BOOT_SRAM build for the Daisy
  tooling is also described. Flashing an official Noise Engineering firmware restores the module to stock.
brick_risk: false
