device: noise-engineering-versio
name: Capicola Versio
summary: Port of Heavylight Industries' Capicola keyframe time stretcher and transient-driven auto-slicer to the Versio, with the original DSP unchanged.
description: >-
  Stereo input is stretched while a transient detector watches the same signal; when a transient passes the threshold, the
  read head jumps to the present with a short crossfade and continues stretching. Seven knobs set stretch, pitch, threshold,
  grain, quality, feedback and mix, and holding the button opens a second page of seven parameters. Because the Versio has
  no CV outputs, the envelope and trigger signals that Capicola puts on jacks drive the four RGB LEDs instead. The port
  layer is shared with the author's Ableton Move version. The DSP is compiled from upstream (a git submodule); the port
  is tested against it sample for sample on a computer. The README says it builds and passes its tests but has not yet been
  run on a Versio, and that the panel mapping is a proposal. The repository has one commit, and the upstream Capicola for the
  Alchemy Lab is catalogued separately.
status: active
authors:
