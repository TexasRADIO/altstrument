device: noise-engineering-versio
name: Stray Drum
summary: Beta FM and ring-modulation macro oscillator for kicks, snares, hats, percussion and chord stabs. Five octaves of pitch; V/Oct tracking needs a calibration that is not implemented yet.
description: >-
