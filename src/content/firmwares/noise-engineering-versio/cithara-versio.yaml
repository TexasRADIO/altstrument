device: noise-engineering-versio
name: Cithara Versio
summary: Microtonal sympathetic string resonator. Strings are tuned to 12-EDO or one of eight chosen microtonal tunings, with step subsets from scales, mode rotation and feedback controls.
description: >-
  Resonance morphs from a piano soundboard to a double bass, timpani or a long
  tube (per the community index). A PDF manual is in the repository.
