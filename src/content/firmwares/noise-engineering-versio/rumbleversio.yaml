device: noise-engineering-versio
name: RumbleVersio
summary: >-
  Techno kick rumble effect for Versio on the Daisy Seed: it takes a kick on the input and adds three tap levels, a
  resonant low-pass filter, saturation, a sub reverb and a freeze wash, clocked from the gate jack.
description: >-
  Written for Versio's Daisy Seed. The input kick is processed into a downbeat sub, a second sixteenth-note tap panned left
  and an offbeat tap panned right, with Tone, Blend and Regen setting the three levels (below about 8 percent each is
  silent, and all three at minimum mute the output). Speed sets a 24 dB per octave filter cutoff, Index its resonance, Size a
  sub reverb, Dense the drive, and switch 0 chooses one of three saturation models. Switch 1 shifts timing 12 ms early,
  on the beat or 18 ms late. Tempo follows clock pulses on the FSU gate jack, and the FSU button holds a long wash. The
  README is in French and the release notes in English; neither reports a test on a Versio.
status: active
