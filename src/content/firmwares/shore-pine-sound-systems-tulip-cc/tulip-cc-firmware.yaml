device: shore-pine-sound-systems-tulip-cc
name: Tulip CC firmware
summary: >-
  Official open-source Tulip firmware: MicroPython with the AMY synthesizer, sequencer, graphics, sprites,
  LVGL widgets, a code editor and the Tulip World file-sharing board, with web and desktop builds of the same code.
description: >-
  The firmware boots straight into a Python prompt. The AMY engine runs up to 120 voices of additive,
  subtractive, FM, sample and Karplus-Strong synthesis with filters and a sequencer, and the system ships with
  a drum machine, a voice and patch app and a Juno-6 editor. Graphics come from a scrolling background frame
  buffer, up to 32 sprites and a 128 by 50 text layer, with LVGL for touch interfaces. Programs can use MIDI,
  Wi-Fi, USB keyboards and mice, and I2C devices. The same code also builds as Tulip Web in the browser and as
  Tulip Desktop for macOS, Linux and Windows, and there is a port for the LilyGO T-Deck.
status: active
authors:
