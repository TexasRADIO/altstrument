    url: https://github.com/bwhitman
  - name: Shore Pine Sound Systems
    url: https://github.com/shorepine
source: https://github.com/shorepine/tulipcc
source_status: open
license: MIT
license_notes: Bundled components such as MicroPython, LVGL and TinyCC keep their own licenses.
homepage: https://tulip.computer/
distribution: download
install_notes: >-
  Run tulip.upgrade() on a Tulip connected to Wi-Fi and accept both the system folder and firmware upgrades;
  the unit reboots when done. Without Wi-Fi, or to run unreleased code, flash the release .bin files from a
  computer with esptool as described in docs/tulip_flashing.md. Releases are now built on every change; the
  June 2026 monthly release was the last prebuilt one for the N16R8, N32R8 and T-Deck boards.
brick_risk: false
