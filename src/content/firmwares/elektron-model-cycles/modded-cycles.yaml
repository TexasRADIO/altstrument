device: elektron-model-cycles
name: Modded Cycles
summary: "Single community OS for Model:Cycles OS 1.13, built in a browser flasher from your own official files: Sampler, Syntakt engines, MACRO (Braids) and ACID (Open303) machines, four LFOs, arpeggiator, step record, 546 BPM, 6-channel USB audio. Also covers Model:Samples."
description: >-
  Since release 2.0 the project ships one fixed OS instead of a list of mods to tick, so every user runs the same
  firmware. The flasher page builds it in your browser from your official Model:Cycles OS file and a Syntakt OS
  file (1.41 or 1.42), which the Syntakt engines are read from, and can send it over USB. It bundles Model-TG's
  Sampler as the seventh machine, five Syntakt machines, MACRO, ACID, a latching mute, trig preview and drumkilla's
  other tweaks. Per-track filter, the optimised OS and Chord Keys are not in 2.0; the README says Chord Keys was
  removed because of conflicts, and the older mod-picker builds remain buildable from the command line. The
  project marks the OS as experimental, since the exact 2.0 image had not run on a machine when the README was
  written. The same OS can be installed on a Model:Samples, and the Samples OS tab marks Cycles OS for
  Model:Samples and the return trip as experimental. Returning from Samples OS on a Cycles needs a MIDI
  interface.
status: active
