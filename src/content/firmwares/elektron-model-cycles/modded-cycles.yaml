source: https://github.com/18nelli18/Modded-Cycles
source_status: open
license: MIT
license_notes: Covers the project's original work; third-party components (Braids, Open303, elektron-model-tweaks and others) keep their own licences, listed in THIRD-PARTY-NOTICES.md.
homepage: https://18nelli18.github.io/Modded-Cycles/
distribution: browser-installer
requires_stock: "1.13"
install_notes: Drop your official Model:Cycles OS 1.13 file and a Syntakt OS file (1.41 or 1.42) into the flasher page, then flash over USB or download the .syx and send it with Elektron Transfer. Set any track that uses an added machine back to a stock machine before returning to the official firmware. Back up projects and samples first.
