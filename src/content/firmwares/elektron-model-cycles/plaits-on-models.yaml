device: elektron-model-cycles
name: plaits-on-models
summary: "Mutable Instruments Plaits engines in fixed point as a PLAITS machine for Model:Cycles OS 1.13 (and Model:Samples running the Cycles OS): waveshaping, FM, VA, bass drum, grain, chords, swarm, wavetable and six-operator FM. Emulator-only so far."
description: One knob picks the engine and can be p-locked per step. The README says it works in emulation and is not yet confirmed on hardware.
