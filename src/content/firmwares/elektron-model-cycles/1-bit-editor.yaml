device: elektron-model-cycles
name: 1-Bit Editor
kind: tool
summary: Single-page browser pixel editor for 1-bit icons, sprites and animation frames for Model:Cycles and Model:Samples mods, exporting the column-wise .bin layout the OS uses.
description: >-
  Works on the full 128 x 64 screen or any smaller size, with layers, text
  layers, patterns, slices that cut sprites out of a larger screen, a layout
  grid, guides and frames for knob-driven animation. It exports PNG and a .bin
  that a mod can include with an assembler directive, plus a JSON file with
  coordinates in the OS's bottom-up convention. It does not edit a sprite mask
  or import photos. It runs entirely in the browser with no dependencies, and
  the repository includes Node tests for the drawing and file code. It does not
  talk to the device and contains no Elektron firmware.
status: active
authors:
  - name: durchgemacht
    url: https://github.com/durchgemacht
source: https://github.com/durchgemacht/1-Bit-Editor
source_status: open
license: MIT
license_notes: The README states it is not affiliated with Elektron.
homepage: https://durchgemacht.github.io/1-Bit-Editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page, or open index.html from a clone in any current browser.
  Save the .bin and include it from a mod's assembly source; the file name has
  to carry the size, for example my_icon_48x33.bin.
tags: [editor, web, ui]
