license: GPL-2.0-only
license_notes: >-
  The README states GPL-2.0-only, the same terms as the statically linked Unicorn. Third-party code and licences are
  listed in THIRD-PARTY-NOTICES.md. Model:Cycles and Elektron are trademarks of Elektron Music Machines MAV AB, and
  the project says it is not affiliated with Elektron.
distribution: source-only
requires_stock: "1.13"
install_notes: >-
  Needs CMake and the Xcode command line tools. Run native/build.sh with the path to your own
  model-cycles_OS1.13.syx (Elektron's support page has it as a zip), then open the built app. Without the file the app
  asks for it on first run. Data lives in ~/Library/Application Support/Vladiktron Spoke/. Nothing is flashed to a
  device.
brick_risk: false
