device: elektron-model-cycles
name: Vladiktron Spoke
kind: tool
summary: macOS app that runs Elektron's own Model:Cycles OS 1.13 on an emulated board, with the screen, keys, knobs, pads, audio out, MIDI and USB audio, and an Arturia MiniLab 3 mapping. Bring your own OS file; no Elektron firmware is included.
description: >-
  Emulates the Model:Cycles' ColdFire CPU with a patched copy of Unicorn 2.1.4 and models the board around it: interrupt
  controllers, timers, DMA, SPI flash, the +Drive eMMC, the front-panel bus, the MIDI UART and the USB device with a
  built-in host. The SwiftUI front end draws the 128 by 64 screen and the panel, plays the audio through Core Audio,
  exposes the two MIDI port pairs as CoreMIDI ports and can send and receive USB audio through chosen Mac devices. On
  first run it asks for Elektron's official OS 1.13 file or the downloaded zip, checks the version and SHA-256 and
  decodes it into the app's data folder; other versions, modified OS files and the Model:Samples OS are refused. The
  repository contains no Elektron firmware, and its notes say it must stay that way. It reuses code from Modded-Cycles,
  elektron-model-tweaks and elektron-firmware-tool, all MIT, and the project's release notes list signing,
  notarisation and a first release as still open. The panel artwork follows the hardware's layout, which the notes
  flag as the part most likely to draw a complaint from Elektron.
status: active
authors:
