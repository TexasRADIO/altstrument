    url: https://github.com/durchgemacht
  - name: 18nelli18
    url: https://github.com/18nelli18
source: https://github.com/durchgemacht/model27
source_status: open
license: MIT
license_notes: >-
  Modded Cycles' copyright for what comes from it, model27's for the changes.
  Third-party code (Braids, Open303, Model-TG, elektron-model-tweaks and others)
  keeps its own license, listed in THIRD-PARTY-NOTICES.md. No Elektron firmware
  is included.
homepage: https://durchgemacht.github.io/model27/flasher/
distribution: browser-installer
requires_stock: "1.13"
install_notes: >-
  Open the web flasher in Chrome, Edge or Opera, tick SAMPLE, drop in your
  official model-cycles_OS1.13.syx, connect the Model:Cycles over USB and press
  Flash, then confirm on the unit. Back up projects and samples with Elektron
  Transfer first. To return to stock, send the official file the same way, after
  setting any track that uses an added machine back to one of the six original
  machines. The README describes recovery from the startup menu through MIDI IN.
tags: [machines, sampler, fork, flasher, usb-audio]
