device: elektron-model-cycles
name: Control All Config
summary: Lets you choose which of the six tracks follow Control All on a Model:Cycles running OS 1.13, by holding TRACK and pressing TRIG 1-6.
description: >-
  In stock OS, holding TRACK applies a change to every track. This mod adds a
  TRIG 1-6 selection while TRACK is held: lit keys mark tracks that follow
  Control All, dark ones are left out. The active track always follows, and
  left-out tracks also keep their machine, LFO destination and PUNCH and GATE
  settings. The choice is not saved, so every track follows again after
  power-on. The author states it was tested on a Model:Cycles and in the
  digiemu emulator. The patch is about 500 bytes and the build checks stock
  bytes at every write. It is also bundled into model27's web flasher.
status: active
authors:
  - name: durchgemacht
    url: https://github.com/durchgemacht
source: https://github.com/durchgemacht/cycles-control-all-config
source_status: open
license: MIT
license_notes: >-
  The repository holds no Elektron firmware, only addresses and the few stock
  bytes each write checks before replacing them. The build works on your own
  copy of the official OS file.
distribution: patch-your-own
requires_stock: "1.13"
install_notes: >-
  Run build.py with your official model-cycles_OS1.13.syx and a clone of
  elektron-firmware-tool; the m68k-elf binutils are needed as well. The script
  checks the SHA-256 of the stock file and verifies the result, then writes a
  .syx that you install over USB like an official update. Back up projects and
  samples first.
tags: [ui, utility]
