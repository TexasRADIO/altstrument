    url: https://github.com/zircothc
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/zircothc/x0x-tab5
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and the release notes state GPL-3.0-only, matching X0X, but the repository has no LICENSE file. The
  upstream X0X entry notes that its recorded breaks are not covered by its licence; this port bundles generated
  headers made from X0X's drum samples and breaks.
distribution: download
install_notes: >-
  The v0.1 release has a prebuilt .bin that the README flashes at address 0x0 with esptool for the esp32p4 chip.
  Alternatively, clone charlesvestal/fm1-x0x, copy this repository's tab5 folder into it and build tab5/idf with
  ESP-IDF v6.1. Flashing replaces the Tab5's factory firmware, which M5Stack documents restoring with M5Burner.
  The step-by-step guide is in Spanish.
brick_risk: false
tags: [groovebox, drums, sequencer, synth-engine, fx, midi, usb-midi, performance, fork, open-source]
