device: m5stack-tab5
name: X0X Tab5
summary: >-
  Port of the FM-1 groovebox firmware X0X to the Tab5, with the FM-1's panel drawn on the touchscreen, USB MIDI
  host input and MIDI learn.
description: >-
  X0X is Charles Vestal's groovebox for the M-VAVE FM-1 with a TR-909, a TR-808, two TB-303s and a break player.
  This port leaves the X0X source untouched and adds a Tab5 platform layer under tab5/: audio is rendered into the
  ES8388 codec, the FM-1's second processor core is emulated by a helper thread, and projects are saved to a flash
  partition with A/B sectors and checksums, as on the FM-1. The FM-1's 240 by 240 screen, 14 buttons, 7 encoders
  and 27 keys appear on the touchscreen, and USB MIDI devices on the USB-A port can be assigned with MIDI learn.
  The repository's notes list what the port omits: USB MIDI output, external clock over USB, the web editor, OTA
  updates, USB backup and user sample slots. The notes name X0X commit 54194c5 (18 October 2026) as the tested base.
status: active
authors:
