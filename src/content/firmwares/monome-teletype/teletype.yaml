device: monome-teletype
name: teletype
summary: >-
  Official open-source Teletype firmware: the scripting language and ops, scenes, grid and MIDI support, plus the manual source and a simple command parser and simulator, built on libavr32.
description: >-
  New ops arrive mostly as contributed pull requests to this repository
  (the 5.0.0 notes credit drum ops, support for multiple faderbanks and many
  contributors) rather than through long-lived forks. Release zips are attached
  to each GitHub release. Flashing replaces the whole image; back up scenes
  first. The community Dewb/monome-build Docker image can build it.
