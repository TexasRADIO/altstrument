    url: https://github.com/csboling
source: https://github.com/csboling/teluxn
source_status: open
license: GPL-2.0-only
license_notes: LICENSE is GPLv2; the repository vendors the multipass framework (also GPLv2).
homepage: https://wiki.xxiivv.com/site/uxn.html
distribution: source-only
requires_stock: Teletype hardware
tags: [emulator, research]
