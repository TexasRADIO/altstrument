device: monome-grid
name: monome kit (mk) firmware
summary: >-
  Original sources for the 2010 monome kit grids: default, encoder and tilt-sensor firmwares for 8x8, 16x8 and 16x16 hardware, plus "-old" builds for early 40h-style orientation.
description: >-
  The mk repository holds complete kit sources: bootloader, firmware and
  hardware files. Firmware folders include default, encoders (8 encoders on
  the aux port) and tilt, each with an "-old" variant for old 40h grids
  that tile in a rotated orientation. The README asks users to share their
  modifications.
