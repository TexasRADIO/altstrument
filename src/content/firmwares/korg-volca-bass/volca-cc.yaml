device: korg-volca-bass
name: Volca.CC
kind: tool
summary: Browser-based patch editor for the volca bass that uses Web MIDI to send the few parameters Korg exposes over MIDI. Includes an on-screen panel and keyboard and a local patch list.
description: >-
  Only a subset of the controls can be sent to the volca bass, because Korg's
  MIDI implementation for the volca series is sparse; the editor marks those
  controls with a "Show Sendable" option and keeps the rest as reference. It
  can route another MIDI controller through to the synth. The author
  recommends desktop Chrome because other browsers lack Web MIDI support.
