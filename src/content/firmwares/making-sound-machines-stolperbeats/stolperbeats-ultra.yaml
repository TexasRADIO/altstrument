device: making-sound-machines-stolperbeats
name: STOLPERBEATS ULTRA
summary: Browser tool that writes a modified Stolperbeats firmware from your own official firmware 163 file, adding alternative swing tables, ratchets, per-step pitch, fill mode and a fill gate on pattern CV 6, and can flash the result over USB.
description: >-
  The page patches the official firmware 163 file in the browser, swaps the four
  Timing buttons' tables for factory or alternative tables (including uploaded
  timing files), and adds optional code mods: one to four ratchet hits per step,
  a MIDI note per step, five levels of on-demand fills and a fill gate on
  pattern CV 6. Ratchet and pitch data are stored in extra pattern files on the
  SD card. The page refuses input that does not match the SHA-256 of firmware
  163, checks each build against a listed hash, and after a USB flash reads
  the contents back and compares them. It does not host or fetch the official
  firmware. The author says everything was tested on one module, except
  builds with only some of the mods, which were checked in an emulator. The
  patch data is published but not the source of the added code, so the source
  status is patcher-only. The same author's earlier repositories for this
  module are browser emulators and are not catalogued.
status: active
authors:
