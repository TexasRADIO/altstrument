    url: https://github.com/thisisbribery
source: https://github.com/thisisbribery/stolperbeats-ultra-v1
source_status: patcher-only
license: unspecified
license_notes: The repository has no license file.
homepage: https://thisisbribery.github.io/stolperbeats-ultra-v1/
distribution: patch-your-own
requires_stock: "163"
install_notes: >-
  Download the official Stolperbeats firmware 163 file (_MSM_stolperbeats_hw_rev4-163.bin)
  from Making Sound Machines, load it in the page, pick tables and mods, then
  download the patched file or flash it over USB from the page. The README says
  the STM32 bootloader is in ROM, so a bad flash can be undone, and the page has
  a button that flashes the official file back. Ratchet and pitch data need the
  extra pattern files the module saves to the SD card on Stop. The author gives
  no warranty and asks that Making Sound Machines not be contacted for help with
  modified firmware.
brick_risk: false
tags: [sequencer, drums, swing, midi, flasher, web]
