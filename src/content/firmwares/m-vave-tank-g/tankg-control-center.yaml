device: m-vave-tank-g
name: Tank-G Control Center
kind: tool
summary: Preset manager for the Tank-G on Windows, Linux and Android that talks the M-EFCS protocol directly over USB-MIDI or, on the v2, Bluetooth, with a virtual pedal panel, backups and a preset library.
description: >-
  Rights warning: the source repository's research/factory folder holds M-VAVE factory preset dumps
  extracted from M-EFCS, which its README describes as M-VAVE's property for local use, so their
  redistribution is not licensed.

  An independent replacement for M-VAVE's M-EFCS editor, based on a reverse-engineered protocol. It reads
  and writes the 36 presets with a read-back check, saves a backup of the whole bank before each write, and
  edits every control from a panel laid out like the pedal. It also covers preset and bank names, LED
  colour, import and export of presets and banks, a library of ready-made banks, live audition and
  Bluetooth connection on the v2. Optional features generate presets with an AI service using the user's own
  account or API key, upload amp models in M-VAVE's .am4data format over Bluetooth, and keep presets in the
  user's Google Drive. A command-line mode lists, backs up, exports, imports, copies and resets presets.
  Firmware updates, IR import and the global settings are not implemented. The app updates itself, and the
  README and app are in Spanish. Compiled builds are published both as releases of the source repository
  and in the separate tankg-control-center-releases repository, which holds only the installers and a short
  README.
status: active
