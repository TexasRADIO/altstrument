device: elektron-digitakt
name: DigiCandy
summary: Full-panel image overlay for the Digitakt mk1 (OS 1.53) and Digitone mk1 / Keys (OS 1.43). A key combo covers the 128x64 screen with an image while everything keeps running.
description: Digitakt uses TRK + YES, Digitone uses MIDI + YES. Ships ready-built .elemod overlays in the repository.
