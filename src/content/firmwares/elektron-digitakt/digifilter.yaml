device: elektron-digitakt
also_devices: [elektron-digitone]
name: DigiFilter
summary: Extra per-track filter modes (BP, BP2, COMB, TRASH, OB4, OB2) for the Digitakt mk1 (OS 1.54) and the Digitone mk1/Keys (OS 1.44), as elekloader mods.
status: active
authors:
  - name: DigiAlchemydsp
    url: https://github.com/DigiAlchemydsp
source: https://github.com/DigiAlchemydsp/DigiFilter
source_status: open
license: GPL-2.0-or-later
distribution: patch-your-own
requires_stock: 1.54 (Digitakt), 1.44 (Digitone)
install_notes: Format-2 elekloader mods, one for the Digitakt and one for the Digitone, each needing the matching stock OS .syx and the core mod. Releases up to 1.1b also had an OS 1.53 Digitakt build.
tags: [filter, fx]
image:
  url: https://raw.githubusercontent.com/DigiAlchemydsp/DigiFilter/master/docs/img/fltr-types.png
  alt: The Digitakt FLTR page showing the added LP, BP, BP2, COMB and TRASH filter types
  credit: DigiAlchemydsp
  source_url: https://github.com/DigiAlchemydsp/DigiFilter
  first_party: true
versions:
  - version: v1.3
    date: 2026-10-24
    url: https://github.com/DigiAlchemydsp/DigiFilter/releases/tag/v1.3
    notes: Adds a Digitone mk1/Keys build with the same six filter modes; the Digitakt build is unchanged from 1.2. The Filter+FX modes are split out into their own project.
  - version: v1.2
    date: 2026-10-24
    url: https://github.com/DigiAlchemydsp/DigiFilter/releases/tag/v1.2
    notes: Reworks the repository around one build per machine on the latest OS (Digitakt 1.54, Digitone 1.44), with a Digitone Filter+FX port that 1.3 removed, and caps the Digitakt OB resonance depth at 75%.
  - version: v1.1b
    date: 2026-10-18
    url: https://github.com/DigiAlchemydsp/DigiFilter/releases/tag/v1.1b
    notes: Cuts the per-voice processing cost of the BP, BP2, COMB and TRASH modes further.
  - version: v1.1a
    date: 2026-10-16
    url: https://github.com/DigiAlchemydsp/DigiFilter/releases/tag/v1.1a
    notes: Adds the OB4 and OB2 ladder modes and OS 1.54 support, and makes BP and BP2 cheaper to run. Includes 1.1, which had no release of its own.
  - version: v1.0k
    date: 2026-10-06
    url: https://github.com/DigiAlchemydsp/DigiFilter/releases/tag/v1.0k
    notes: Latest tag; no GitHub release.
  - version: v1.0i.2
    date: 2026-10-04
    url: https://github.com/DigiAlchemydsp/DigiFilter/releases/tag/v1.0i.2
