homepage: https://github.com/matozoid/novation_circuit_monostation_reverse_engineering#readme
distribution: source-only
requires_stock: "1.2 (build 800)"
install_notes: >-
  Needs Linux or macOS, Python 3 and arm-none-eabi-gcc. Unpack the stock 1.2 update, monostation-firmware-800.syx, from
  Novation Components 1.72.5 into firmware/, run the four build commands in the README to produce randomise-750.syx,
  then run tools/flash.py with the Mono Station off and Scales + Note + Velocity held while switching it on. The
  bootloader is never touched. To go back, flash the stock file the same way or accept the update in Novation
  Components. Back up your patches and sessions first.
brick_risk: false
