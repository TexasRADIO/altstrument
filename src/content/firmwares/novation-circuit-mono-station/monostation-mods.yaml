device: novation-circuit-mono-station
name: Mono Station Mods
summary: Source-built modifications of Novation's Circuit Mono Station 1.2 firmware, with reverse-engineering tools. The first mod makes Mutate randomise one property of the notes in the Velocity, Gate, Glide and Expand views.
description: >-
  The repository holds tools that decode Novation's 1.2 update file, turn it into assembly that rebuilds byte for byte,
  and let overlays replace stock functions by name with C or assembly, plus a flasher and notes on the bootloader,
  update protocol, patch and session SysEx formats and sequencer. Novation's code is not included: you unpack the stock
  update from Novation Components yourself and build locally with arm-none-eabi-gcc. The one finished mod, Randomise,
  changes Mutate on the Osc 1 and Osc 2 tracks so that in the Velocity, Gate, Glide and Expand views it randomises
  only that property of steps that already hold a note, leaving the rhythm alone. The Note and Pattern Settings views
  and the Mod Seq track behave as stock. The build reports itself as version 750, below the stock 800, so that Novation
  Components should offer to reinstall stock; the README says this has not been tried yet. The README says the work was
  done with Claude Code.
status: active
