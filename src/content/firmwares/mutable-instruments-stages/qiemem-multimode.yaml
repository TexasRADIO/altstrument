device: mutable-instruments-stages
name: Stages multi-mode firmware (bipolar)
summary: Fork of joeSeggiola's Stages firmware adding bipolar LFOs, retrigger control, harmonic oscillator, six DAHDSR envelopes and a random segment type, on top of official v1.2 and the extended sequencer.
description: >-
  Segment generator additions include very slow and audio-rate LFOs,
  resettable LFOs, quantized hold and step segments, start and end value
  tracking and probabilistic gates. The advanced segment generator mode adds
  random segments (double-scroll attractor, Turing-style shift register, random
  LFO, clocked random LFO), slew with independent rise and fall, and
  attenuverter segments. Chaining is supported. Each release ships a normal and
  a flipped (upside-down) image.
