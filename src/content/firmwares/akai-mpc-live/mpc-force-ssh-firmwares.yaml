device: akai-mpc-live
name: MPC-Force-SSH-Firmwares
summary: "Akai MPC (first generation) and Force update images with SSH and USB mouse support added, plus the shell script and sources to make them from Akai's own file. Warning: the ready-made images are modified Akai firmware."
description: >-
  Rights warning: the ready-made images are Akai's own update images with
  changes applied, shared through two Google Drive folders linked from the
  README, and no permission from Akai to redistribute them is stated; the
  README itself says the original firmware content belongs to inMusic. The
  changes are small. SSH is switched on, the networking files are copied in from
  the host, and a library preloaded by the MPC application's systemd service
  draws a mouse cursor, so a USB mouse can be used on the touchscreen UI. The
  SSH tooling comes from the MPC-LiveXplore project and the mouse add-on from
  the MockbaMod community and Amit Talwar. The Drive folders list Force images
  for 3.7.0, 3.7.1, 3.8.0 and 3.9.0 and first-generation MPC images for 3.7.0,
  3.7.1 and 3.8.0. The repository itself holds no firmware images; it has
  patch_firmware.sh, the mpcimg2 packer, the config files and the cursor
  library sources, so you can patch a stock update yourself. The author says
  the mouse library was last updated for MPC OS 3.9.0. This entry sits under
  the MPC Live family; the images also cover the Force.
status: active
