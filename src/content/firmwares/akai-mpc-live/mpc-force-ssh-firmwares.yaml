license: Unlicense
license_notes: >-
  The repository's LICENSE is the Unlicense. The README says the modifications
  and scripts are under various open source licenses and that the original
  firmware content is copyrighted by inMusic and its subsidiaries, so the
  Unlicense does not cover the Akai software inside the images. The images are
  hosted on Google Drive, not in the repository, and no permission from Akai
  to redistribute them is stated.
homepage: https://github.com/bonsaipanda/MPC-Force-SSH-Firmwares
distribution: download
requires_stock: MPC 3.7.0 to 3.8.0 (first generation) or Force 3.7.0 to 3.9.0, matching the image
install_notes: >-
  Download the image for your unit from the README's Drive links, copy it to the
  root of a USB stick or SD card, then in Preferences choose the update button
  and USB Drive Update. Installing any official Akai update afterwards
  overwrites the changes. Connect the mouse before boot; the cursor speed and
  input device are set in /etc/force_cursor.conf. The README warns that
  deleting or moving system files over SSH can leave the unit unrecoverable and
  says not to install it before a live show. To avoid the shared images, run
  patch_firmware.sh from the repository on Linux with Akai's update file; it
  needs sudo and udisksctl.
brick_risk: false
