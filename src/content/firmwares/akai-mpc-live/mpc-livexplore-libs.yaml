    url: https://github.com/TheKikGen
source: https://github.com/TheKikGen/MPCLiveXplore-libs
source_status: open
license: CC0-1.0
homepage: https://github.com/TheKikGen/MPCLiveXplore-libs/wiki
distribution: download
requires_stock: An MPC-LiveXplore SSH image
install_notes: >-
  Needs an MPC or Force running one of the SSH-enabled images from
  MPC-LiveXplore. The libraries are loaded with LD_PRELOAD from an SD card or
  USB stick, either by hand over SSH or from a bootstrap module; the README
  and wiki give the command lines. Building plugins needs an ARM
  cross-compiler and a glibc matching the one on the device (2.30 per the
  README).
