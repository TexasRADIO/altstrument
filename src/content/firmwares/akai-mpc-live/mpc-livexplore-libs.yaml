device: akai-mpc-live
name: MPCLiveXplore-libs
summary: "LD_PRELOAD libraries for SSH-enabled MPCs and the Force: a MIDI mapper with controller plugins, a control-surface substitution library, and a dump tool for the traffic between the app and the hardware controller."
description: >-
  A companion to the MPC-LiveXplore project, aimed at units that already run
  one of its SSH images. TKGL_MIDIMAPPER loads per-controller plugins written
  in C that remap incoming MIDI to the buttons the MIDI-learn screen cannot
  reach, such as Play Start and Stop on the MPC or Launch and Matrix on the
  Force. The IamForce2 launcher is built on it, with plugins for the APC Key 25
  Mk2, APC Mini Mk2, Launchpad Mini Mk3, Launchpad X and the author's Kikpad.
  TKGL_ANYCTRL lets another MIDI controller stand in for the built-in control
  surface, and TKGL_CTRLDUMP logs what the MPC application exchanges with its
  hardware controller. Older libraries are kept in a deprecated folder. The
  repository holds the C sources, compiled libraries and the plugins, with a
  wiki; the last commit is 2023-11-12.
status: dormant
authors:
