device: akai-mpc-live
name: LXRXXL
summary: Native VST2 drum machine for MPC and Force running the open-source LXR engine (the Erica Synths LXR-02 firmware engine from 0.6), with the whole panel on one touchscreen page, an LXR-02-style sequencer and FX unit, and a bundled preset project.
description: >-
  A port of the LXR drum synth for MPC OS. From 0.6 the six voices, filters,
  modulation, PWM and FX unit are the sound engine of the Erica Synths LXR-02
  firmware, which Erica open-sourced, with its plate reverb switched on (it is
  off in the hardware firmware); earlier releases used the LXR02Open port of
  the original engine and wrote the LXR-02 additions from its manual. The page
  shows the pots, faders, keys and step buttons, and the pads play the voices.
  The LXR-02-style sequencer has 64 patterns with parameter locks, rolls, songs
  and probability. Added here are random and sequence-random controls, a reset
  key, 64 kits and 16 demo patterns from the Hrtl LXR-02 DLC project, and tempo
  that follows MPC. The wrapper and installer come from sd88me's
  mpc-vst-plugins. The project is not affiliated with Sonic Potions or Erica
  Synths.
status: active
authors:
  - name: L'Cronx
    url: https://github.com/sunskiefer
source: https://github.com/sunskiefer/LXR02XXL
source_status: open
license: GPL-3.0-only
license_notes: >-
  From 0.6 the code is the Erica Synths LXR firmware engine under GPL-3.0, and
  every release comes with its complete source. Versions up to 0.5.10 were built
  on the LXR02 Open-Source license (source-available, non-commercial). The
  mpc-vst-plugins parts are MIT and the fonts SIL OFL 1.1.
distribution: download
requires_stock: MPC OS 3.x
install_notes: >-
  Needs root SSH access to the device (the README names MockbaMod as an
  example). Unzip the release, copy the folder to the device with scp and run
  install.sh, which stops MPC, copies the plugin to /sdcard/Synths, registers
  it and restarts MPC. Save the project first. uninstall.sh removes it. Tested
  on a Force; installing plugins this way is unofficial.
tags: [drums, synth-engine, sequencer, emulator, platform]
