license: unspecified
license_notes: No license file or statement.
homepage: https://github.com/frankvonwelt/MPCProjectManager
distribution: source-only
requires_stock: MPC software 2.10 project format (per the last commit)
install_notes: >-
  Open the Visual Studio solution to build it; a prebuilt zip sits in the
  Binaries folder of the repository. Work on copies of your projects, since the
  tool is unmaintained and untested against newer project formats.
