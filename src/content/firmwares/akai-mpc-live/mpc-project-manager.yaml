device: akai-mpc-live
kind: tool
name: MPCProjectManager
summary: "Windows desktop tool that reads project files from the current MPC software generation (MPC Live, Live II, X, One) and shows two projects side by side to copy sequences, programs and samples between them."
description: >-
  A WPF application written in C# that parses MPC project files and their
  _[ProjectData] folders: programs, sequences stored as MIDI files, songs,
  mixer and pad settings. The window shows a left and a right project and
  queues copy jobs between them. The repository has no README or license; the
  last commit, from January 2022, updated the project classes for the 2.10
  firmware structure, and a zipped build is kept in the Binaries folder.
status: dormant
