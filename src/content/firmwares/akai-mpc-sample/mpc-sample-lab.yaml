device: akai-mpc-sample
name: MPC Sample Lab
summary: Research repository for the MPC Sample (firmware 1.3.0.12) with an own Sample Mode application that runs from RAM in place of the stock app, plus the panel protocol, audio and display notes and a read-only eMMC backup script.
description: >-
  The author gets root over USB with a third-party SSH kit, stops the stock
  ac50 service and runs a replacement application, written independently from
  the User Guide, that is removed again when it exits; nothing is written to
  flash. Phase 1 of that application covers eight banks of 16 pads with 32
  voices, amp envelopes, tune, mono or poly play, mute groups, loop, reverse and
  Note On, three parameter pages, the knobs, encoder and Pad Volume fader, pad and
  button LEDs and a screen with waveform and envelope. It loads up to 128 WAV
  files from a folder on the SD card. Later phases, such as the filter, chop,
  recording, the sequencer and effects, are only planned. The repository
  also documents the control-surface protocol, the I2S audio and SPI display
  paths and the platform (Rockchip RK3566 with a signed boot chain and dm-verity
  root), and has tools to unpack Update.img and to back up the eMMC read-only. It
  says it holds no Akai firmware or eMMC images, and omits the panel's
  challenge-response key. An older patcher skeleton was never run on hardware
  and is marked outdated. Documentation is Russian first, with English copies.
status: active
authors:
