source: https://github.com/gospodindilly-ops/mpc-sample-lab
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and no licence statement. The bundled Terminus
  bitmap fonts carry their own licence file, assets/fonts/Terminus-LICENSE.txt.
distribution: source-only
requires_stock: "1.3.0.12"
install_notes: >-
  Needs root access on the unit; the README uses the separate mpc-sample-root-ssh
  autorun kit for that. Build the firmware directory with make (zig cc for static
  aarch64), copy the binary to /run on the unit, and start it with systemd-run so
  that ac50.service is stopped first and started again on exit, passing a folder
  of 44.1 kHz WAV files. Binaries run from /run or /tmp only, because the SD card
  is mounted noexec. The author backed up the eMMC first and says the restore
  procedure is untested, that /factory must not be touched, and that writing the
  dm-verity root filesystem breaks boot. Whether an alternative firmware can be
  flashed depends on secure boot, which the README lists as open.
brick_risk: false
tags: [research, sampler, platform, os, open-source]
