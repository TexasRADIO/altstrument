    url: https://github.com/uglifruit
source: https://github.com/uglifruit/GBA_FM
source_status: open
license: MIT
distribution: download
requires_stock: Music Thing Workshop Computer with this program card; link cable wired to the pulse jacks
install_notes: >-
  Flash UF2/gba_link.uf2 to the Workshop Computer, then connect a GBA link cable with the cartridge slot empty. Wire the
  cable to the pulse jacks through two 1 kOhm resistors, because the pulse outputs swing to about 6 V and the GBA runs at
  3.3 V. A Game Boy Color link cable is recommended. Switch on the Workshop first and the GBA second, and power-cycle
  the GBA after every re-flash of the Workshop. The GBA program is built from the payload folder with an
  arm-none-eabi toolchain and embedded in the card firmware.
brick_risk: false
