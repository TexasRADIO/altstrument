device: nintendo-game-boy-advance
name: GBA FM Voice
summary: >-
  FM synth voice that runs on a cartridge-less GBA booted over its link cable by a Music Thing Workshop Computer card, with two 2-operator voices or one 4-operator voice, a drum mode and an on-screen editor.
description: >-
  Like GBA PSG Voice, the Workshop Computer card firmware uploads a program into the GBA through the BIOS multiboot over
  the pulse jacks, so no cartridge or modification is needed, and the same cable works for both. The GBA program
  replaces the console's four Game Boy sound channels with a fixed-point FM engine on Direct Sound, played in stereo
  through the headphone jack. It offers two 2-operator voices or one 4-operator voice with eight DX21/TX81Z-style
  algorithms, plus a drum mode in which two audio inputs act as drum triggers. The Workshop's CV, gates and knobs play
  it, and the GBA sends its notes, gates and button states back to the rack. The editor on the GBA screen has eight
  pages, including 16 patch slots, envelopes, a mixer, a modulation matrix, button actions, scale quantising and
  calibration. The author calls it a beta and notes that the 4-operator mode had not been tested on hardware at the
  last commit.

  The repository's info.yaml is marked as a draft program card for the Workshop Computer library. It is not in the
  upstream releases folder yet, so no synced card entry exists; the sibling PSG project is catalogued there as card
  108_GBA.
status: active
authors:
