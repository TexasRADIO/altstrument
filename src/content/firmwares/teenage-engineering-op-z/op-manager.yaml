device: teenage-engineering-op-z
name: OP-Manager
kind: tool
summary: Python software for a Raspberry Pi Zero W handheld unit that acts as a USB host to back up, restore and upload OP-Z projects and samples and OP-1 patches and projects without a computer.
description: >-
  The project is a small battery-powered box built around a Raspberry Pi Zero
  W, an OLED screen and a few buttons, which plugs into the instrument over
  USB OTG. For the OP-Z it can freeze and recall the whole state, including
  projects and samples, and upload or delete samples. For the OP-1 it backs up
  and uploads patches and projects. It can also pass USB MIDI through to 5-pin
  MIDI ports. The OP-1 side of the project is listed here too, because
  the same README and code cover both instruments.
status: dormant
authors:
