    url: https://github.com/adwuard
source: https://github.com/adwuard/OP_Manager
source_status: open
license: MIT
distribution: source-only
install_notes: >-
  Needs the Raspberry Pi hardware described in the README (Pi Zero W, SD card,
  OLED panel, direction pad and buttons). Run the Python application on the Pi
  with run.py; opmanager.service is provided for starting it at boot.
