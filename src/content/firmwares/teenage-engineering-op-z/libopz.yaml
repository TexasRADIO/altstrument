  trial for commercial use). The README adds a Patron License for sponsors and
  contributors, who may ignore the noncommercial limit.
distribution: source-only
install_notes: >-
  Build with CMake; it needs libz and, for the C++ examples, ncurses. The
  OP-Z has to be connected and turned on before running opz_companion.
