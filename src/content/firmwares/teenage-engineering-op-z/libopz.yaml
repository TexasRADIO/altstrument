device: teenage-engineering-op-z
name: libopz
kind: tool
summary: C++ library for reading and saving OP-Z project files and syncing with a connected OP-Z over MIDI SysEx, with a terminal companion app that mirrors the official app's telemetry.
description: >-
  The library has classes for loading and saving .opz project files, for
  syncing project data and live telemetry from a device over SysEx, and for
  doing that through RtMidi. It parses project levels, tempo, pattern data,
  track notes and track sound parameters, while step components and writing
  changes back to the device are listed as not done yet. The examples include
  opz_companion, a terminal program that shows the device's state.
status: active
authors:
