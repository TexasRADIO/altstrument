source: https://github.com/ioma8/opz-firmware-notes
source_status: open
license: unspecified
license_notes: >-
  No license file or license statement at the repository root. A vendored copy
  of op-z-sysex under refs/ carries its own MIT license.
distribution: source-only
requires_stock: 1.2.45
install_notes: >-
  Scripts are run by hand from a clone and several expect device captures that
  are not in the repository. The README warns that sending console command 0x15
  in update mode formats the internal NAND and leaves the unit booting only
  into update mode, and that reflashing does not recover it. It also says never
  to enumerate unknown console command types. opz-sudo-install.sh installs a
  passwordless sudo rule, so read it before running.
brick_risk: true
tags: [research, sdk, emulator]
