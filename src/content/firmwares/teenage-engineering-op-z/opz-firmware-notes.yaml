device: teenage-engineering-op-z
name: opz-firmware-notes
kind: tool
summary: Reverse-engineering notes and Python tooling for the OP-Z OS 1.2.45 update container, console, file transfer and engine format, including an interpreter and a generator for custom synth engine modules.
description: >-
  Rights warning: the research files describe pulling factory sample packs and
  engines off units and link a third-party archive copy of Teenage
  Engineering's iOS app in the hunt for factory audio. The repository itself
  commits no firmware, engine or sample binaries, and its gitignore excludes
  them.

  The repository records an attempt to read the encrypted update archive of
  OP-Z OS 1.2.45 through the update-mode console, without having the key, and
  documents the bootloader, serial commands, SysEx, engine module format and
  the lighting and companion processors. Scripts cover USB and BLE file pulls,
  update-payload staging, a small Blackfin interpreter, and an engine builder
  that compiles a short declaration of partials into a loadable module. The
  author reports installing a self-written engine on a real unit through the
  updater's write path. The README says the unit used for the work was bricked
  by a console command and later recovered, and that some factory engines still
  do not play correctly in the simulator. It is an AI-assisted working
  repository with large status and hand-over files.
status: active
