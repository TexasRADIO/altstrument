summary: Feasibility research into porting the Machinedrum OS to Octatrack hardware as close to 1:1 as possible. Nothing boots yet; no flashable build.
description: >-
  Current stage per the README is feasibility research. A local Machinedrum UW
  OS 1.63 image has been identified and trace instrumentation compiled; booting
  the Machinedrum OS on octemu or hardware, ported DSP audio and a flashable
  build are unproved.
