    url: https://github.com/KaiDrange
source: https://github.com/KaiDrange/OctaChainer2
source_status: open
license: GPL-3.0-only
license_notes: README states the GNU General Public License v3.0; no "or later" wording.
homepage: https://ticticelectro.com/2017/08/26/octachainer-v1-3/
distribution: download
install_notes: >-
  Download the release for your platform from the GitHub releases page, or build
  with CMake and JUCE using the presets in the README. The homepage is the page
  for the original OctaChainer 1.3.
