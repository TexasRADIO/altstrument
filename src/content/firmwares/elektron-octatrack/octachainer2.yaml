device: elektron-octatrack
name: OctaChainer 2
kind: tool
summary: Desktop app and VST3 plug-in that joins audio files into one chain and writes the matching slice file for the Octatrack, and for other samplers.
description: >-
  A JUCE rewrite of the original Qt-based OctaChainer, which its author has
  abandoned in favour of this version. It combines several audio files into one
  long WAV and writes the .ot slice file the Octatrack reads, so each source file
  becomes a slice. It is released as a standalone application for Windows and
  macOS and as a VST3 plug-in for hosts that support drag and drop of files out
  of a plug-in. The original OctaChainer repository (KaiDrange/OctaChainer) is
  marked as replaced by this one.
status: active
authors:
