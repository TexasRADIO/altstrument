device: teenage-engineering-op-xy
name: OP-XY Multisampler Preset Builder
kind: tool
summary: Browser app that turns dropped audio files into OP-XY multisampler presets, detecting each sample's pitch and grouping velocity layers and round-robins.
description: >-
  Samples dropped onto the page are assigned to keys from their file names or
  by pitch detection, with a keyboard to fix any that cannot be detected. The
  app resamples them to the chosen rate and bit depth, writes the preset's
  patch.json with the key regions, and offers a ZIP containing the .preset
  folder. Everything runs in the browser, and the repository can also be built
  and served locally.
status: active
authors:
