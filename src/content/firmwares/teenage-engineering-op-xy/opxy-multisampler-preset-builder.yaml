homepage: https://sixthlaw.github.io/opxy-multisampler-preset-builder/
install_notes: >-
  Use the hosted page or run it locally with npm. Unzip the download, put the
  OP-XY in disk mode over USB, copy the .preset folder into the presets
  directory and eject the device.
