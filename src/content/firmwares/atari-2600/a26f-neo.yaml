device: atari-2600
name: A26F NEO
kind: tool
summary: MIDI interface for the Atari 2600 that pairs a 32 KB console ROM with Raspberry Pi Pico firmware, plus a browser sample patcher.
description: >-
  The release bundle holds NTSC and PAL ROM images for the 2600, UF2 files for a Raspberry Pi Pico or Pico 2W, with
  builds for a level shifter or for two NPN transistors, and a browser-based patcher for adding your own samples to the
  ROM. The Pico shows up as a USB MIDI device in a DAW and talks to the console through controller port 2. MIDI
  channels 1 and 2 map to the two TIA sound channels, and a drum mapping wraps across 32 slots. The author tested it
  with a 2600 Jr PAL console, a Unocart clone and a Pico 2W.

  This is the successor to the author's earlier A26F interface.
status: active
authors:
  - name: Sebastian Tomczak (little-scale)
    url: https://github.com/little-scale
source: https://github.com/little-scale/a26f-neo
source_status: open
license: MIT
homepage: https://github.com/little-scale/a26f-neo
distribution: download
requires_stock: Atari 2600 with a flash or EEPROM cartridge; Raspberry Pi Pico or Pico 2W; level shifter or NPN transistors
install_notes: >-
  Copy the ROM to the cartridge, flash the Pico with the UF2 that matches your wiring, and connect the Pico to controller
  port 2. The README says a direct Pico connection works but can expose the Pico's pins to 5 V.
brick_risk: false
