device: korg-logue-tools
name: loguetools
kind: tool
summary: "Python tools and a desktop GUI for Korg logue-series patch libraries: translate minilogue patches to the minilogue xd, split libraries into patch files, and print patch contents."
description: >-
  loguetools works on program collections rather than on user units. It
  translates patches from the original minilogue to the minilogue xd, extracts
  every patch in a collection into a separate file for the minilogue, minilogue
  xd, prologue, monologue and KingKORG, and prints the contents of minilogue
  and minilogue xd patches. It comes as a GUI for Windows, macOS and Linux
  (Linux untested) and as command line scripts that need Python 3.7 or later.
  Oleg Burdaev contributed the preset bank format, the collapse tool and the
  monologue and prologue support.
