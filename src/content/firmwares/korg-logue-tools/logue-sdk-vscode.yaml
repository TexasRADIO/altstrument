license_notes: The repository has no license file; the bundled SDK fork carries Korg's BSD-3-Clause license.
homepage: https://github.com/dukesrg/logue-sdk-vscode
distribution: source-only
install_notes: Open the folder in Visual Studio Code and accept the recommended extensions. The README describes the SDK setup, logue-cli, SendMIDI and the SVD file download.
