device: korg-logue-tools
name: logue SDK
kind: tool
summary: Korg's official SDK for building custom oscillators, synths and effects as user units for the prologue, minilogue xd, NTS-1 digital kit (mkI and mkII), NTS-3, drumlogue and microKORG2.
description: >-
  The repository holds the headers, linker files, template projects and demo
  oscillators for each supported instrument, a Docker image that builds any of
  them, the logue-cli command line tool, and a browser simulator (websim) for
  the NTS-1 mkII and NTS-3 that compiles unit code to WebAssembly with
  Emscripten. Version 1 targets the Cortex-M4 instruments (prologue, minilogue
  xd, NTS-1 mkI) and version 2 targets the Cortex-M7 and Cortex-A7 ones. The
  repository also keeps a registry of developer IDs and a unit index, hosted on
  its documentation site, that lists third-party units by type and platform.
  Korg states that the SDK is provided as-is with no technical support, and
  points developers to its Discord server.
status: active
authors:
  - name: KORG Inc.
    url: https://www.korg.com/
source: https://github.com/korginc/logue-sdk
source_status: open
license: BSD-3-Clause
homepage: https://korginc.github.io/logue-sdk/
distribution: source-only
requires_stock: "prologue and minilogue xd 2.00 or later; NTS-1 digital kit 1.02 or later; NTS-1 mkII, NTS-3 and drumlogue 1.0.0 or later; microKORG2 2.0.0 or later"
install_notes: >-
  Clone the repository with its submodules and install the Arm GNU toolchain
  and make, or use the Docker build environment in the docker/ folder. Each
  platform folder has its own README with the build command and unit file
  extension. Units are loaded with Korg's Librarian or KORG KONTROL Editor,
  with logue-cli, or on the drumlogue by copying files in USB mass-storage mode.
tags: [sdk, official, prologue, minilogue-xd, nts-1, nts-1-mkii, nts-3, drumlogue, microkorg2, docker, wasm]
versions:
  - version: 2.1.0
    date: 2025-08-04
    url: https://github.com/korginc/logue-sdk/releases/tag/2.1.0
    notes: WASM build support.
