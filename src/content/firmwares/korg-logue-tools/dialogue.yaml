device: korg-logue-tools
name: dialogue
kind: tool
summary: Command line tool, written in Go, that sends and receives prologue programs and user modules over MIDI.
description: >-
  Dialogue transfers program files (.prlgprog) and user module files
  (.prlgunit) to and from a prologue, lists MIDI ports, and reports module
  information for a given slot, for example delfx slot 2. At release it
  supported only the prologue, and the author, who calls it partly a Go
  learning project, planned support for other devices and file types.
