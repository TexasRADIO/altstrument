device: teenage-engineering-sp-1
name: SP-1 Tape Looper
summary: Four-track, tape-style looper firmware for the SP-1 with sixteen songs, stereo recording, effects pages, bounce and a browser tool for transferring loops.
description: >-
  Audio is fed in over USB-C, recorded to the four tracks with the track
  buttons and played back layered, with the rocker changing speed and pitch
  together like tape. Version 3 records in stereo and adds eight effect pages,
  per-track reverse and isolate, a beat grid and a speed range of 0.25x to
  1.5x. Loops and settings are stored per song on the SP-1's internal storage.
  A browser page connects over USB serial to download or upload tracks as WAV
  or MP3. The 3.0 update changes the storage format, so existing songs must be
  backed up first.
status: active
authors:
  - name: chattock
    url: https://github.com/chattock
  - name: marcabisamra
    url: https://github.com/marcabisamra
source: https://github.com/chattock/sp1-tape-looper
source_status: open
license: MIT
homepage: https://sp1-tape-looper.vercel.app/
distribution: download
install_notes: >-
  Flash sp1_looper.bin from the release page with the Solderless utility; hold
  Track 1 and Track 4 for 3 seconds while the looper runs, or while plugging in
  USB, to reach the bootloader. Updating from 2.x to 3.x reformats loop storage
  on first boot, so use the transfer page's Download all first.
brick_risk: false
tags: [looper, fx, usb-audio, performance]
