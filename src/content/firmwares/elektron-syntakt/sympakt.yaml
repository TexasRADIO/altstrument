device: elektron-syntakt
name: Sympakt
kind: tool
summary: Browser app for building 64-slot Syntakt sample packs, with previews, loop and slice editing, and export of converted WAV files in a ZIP.
description: >-
  Works offline as a single HTML file with no backend. Dropped audio is
  converted to the Syntakt's 16-bit, 48 kHz mono format, and a pack holds 64
  slots that can be reordered. It has loop points with crossfade, a built-in
  sample editor (trim, fades, normalise, reverse, bit and rate reduction,
  filters and slicing), a virtual keyboard for auditioning pitches, and LOFI
  modes that export pitched-up audio to fit longer samples. Dual-sample mode
  packs two samples in one slot, the second stored reversed. Packs are saved and
  reloaded as ZIP files, and the session is kept in the browser. It produces
  files only; the result still has to be transferred to the unit with Elektron's
  own transfer tools or another file-transfer program.
