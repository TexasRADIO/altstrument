device: elektron-syntakt
name: syntakt-machine45-research
kind: tool
summary: Research notes and a C header for adding a 46th Machine, raw ID 45, to Syntakt OS 1.41, plus a small script that checks stock OS metadata. Documentation only; no firmware, patch or installable mod.
description: >-
  The repository describes how a new Machine with its own public ID could be registered next to the stock IDs 0 to 44,
  covering the menu entry, selector value, engine-family slot, eight parameter fields and their save and load path.
  It also holds an evidence index, a draft issue for the SyntHack OS project, a DSP source interface header for future
  Machine code and a Python script that checks sections of a stock 1.41 file you supply against recorded hashes. The author
  states that the working candidate is private and frozen, that the public material cannot reproduce it, and that a
  complete Machine has not been shown running on a device or in a whole-device emulator. The README is headed
  research only and do not flash. It is meant to complement SyntHack OS and SY FM4 rather than replace them.
status: active
