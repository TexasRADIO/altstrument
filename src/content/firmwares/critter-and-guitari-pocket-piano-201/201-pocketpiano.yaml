device: critter-and-guitari-pocket-piano-201
name: 201 Pocket Piano software
summary: >-
  Open source software for the 201 Pocket Piano: the mother Pure Data patch, the six pattern and six synth or sampler module slots, and the C controller program that reads keys and knobs.
description: >-
  The 201-PocketPiano repository splits the system into a Pure Data patch that
  does synthesis, MIDI, sequencing and module loading, and a C controller
  program that sends key and knob events to Pd as OSC. Pattern modules take
  MIDI notes in and send notes out, synth modules receive notes and three
  knob values and output audio, and each module is a numbered folder with a
  module.pd file. The user manual links the v1.1 disk image, while the
  repository's newest tags are v1.2 and v1.3 with no attached release builds.
