device: erica-synths-black-sequencer
name: Black Sequencer MIDI Program Change patch
summary: Python and C patcher that turns your official 1.06 image into a 1.07 build in which MIDI Program Change messages select patterns, with an optional Bank Select, plus three new rows in the MIDI settings menu.
description: >-
  Adds one feature to the stock firmware: a Program Change on a chosen MIDI channel loads
  pattern 1 to 16 of the current bank, so an MPC, Octatrack or other sequencer can switch
  patterns while clocking the module. Three new rows under the MISC tab of SETUP, MIDI set the
  channel (off by default), whether the change waits for the end of the master track length or
  happens at once, and whether CC 0 on that channel selects the bank. Empty slots and requests
  for the pattern already playing are ignored. The build script checks that the input is the
  stock 1.06 file by size and CRC32, patches a few locations, appends the new code and writes
  an updater file labelled 1.07. The README says only the application is changed, never the
  bootloader, and that the patch has been tested in a CPU emulator but not yet on a physical
  Black Sequencer. It states that the project is not an official Erica Synths release.
status: active
authors:
