homepage: https://github.com/aleph-void/Erica-Synths-Black-Seqeuencer-Custom-MIDI-Program-Change-Firmware#readme
distribution: patch-your-own
requires_stock: "1.06 (EBSEQ_V1_06_7824E1DD.BIN, CRC32 7824E1DD)"
install_notes: >-
  Download the official 1.06 file from Erica Synths yourself and build with make; it needs
  arm-none-eabi-gcc and Python 3. Back up the PROJECTS folder on the SD card, copy the
  resulting EBSEQ_V1_07 file to the card's root, power on and answer YES to the bootloader
  prompt. To return to stock, delete the 1.07 file, put the official 1.06 file on the card
  (renamed to a higher version number if the bootloader skips it) and start the bootloader
  from SETUP, INFO. Do not share the generated image.
brick_risk: false
