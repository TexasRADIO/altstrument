source: https://github.com/critterandguitari/Organelle_OS
source_status: open
license: BSD-3-Clause
license_notes: LICENSE.txt grants BSD 3-Clause terms to files copyright Critter & Guitari; imported files carry their own authors and licenses in their comments.
homepage: https://critterandguitari.github.io/cg-docs/Organelle/og1/
distribution: download
requires_stock: Original Organelle only
install_notes: >-
  Download the OG1 image linked in section 7.1 of the Organelle 1 manual,
  write the zipped file with balenaEtcher to a microSD card of 8 GB or more
  (do not unzip it first, as the manual instructs), reinsert it and check the
  version under Settings > Info. This erases the card.
