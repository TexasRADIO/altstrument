device: critter-and-guitari-organelle-1
name: Organelle OS 4.0 (original Organelle)
summary: Last official OS image for the original Organelle, a Linux disk image with the Pure Data patch loader, WiFi and the patch manager; OS 5 does not support this model.
description: >-
  The Organelle_OS repository carried a separate platform folder for the
  original Organelle up to its v4.0 tag, and Critter & Guitari's manual for
  the original unit links the OG1-4.0 disk image as the current release, with
  OG1-3.1 as the previous one. Version 5 of the OS dropped support for this
  model.
status: dormant
