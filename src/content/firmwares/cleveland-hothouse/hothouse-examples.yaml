    url: https://clevelandmusicco.com/
source: https://github.com/clevelandmusicco/HothouseExamples
source_status: open
license: GPL-3.0-or-later
license_notes: Software only. The Hothouse hardware design is CC-BY-SA-4.0.
homepage: https://clevelandmusicco.github.io/HothouseFlasher/
distribution: browser-installer
install_notes: Flash a binary from the latest release with the Hothouse Flasher, or build an example with the Daisy toolchain.
