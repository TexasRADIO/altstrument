device: cleveland-hothouse
name: HothouseExamples
summary: Example effects and prebuilt binaries for the Hothouse pedal kit, with a web flasher, project scaffolding scripts, a dev container, Funbox ports, and support for Faust, plugdata/Pd and Max/MSP Gen~.
description: >-
  Source code for ready-to-flash effects (for example EchoKing tape delay,
  ShimmerVerb, Frippertronics, TapeSimulator, BasicChorus and Phaser) plus
  helper scripts for creating and building projects. Third-party toolchains can
  target the Hothouse: faust2hothouse and plugdata via HVCC. A Funbox-to-Hothouse
  port directory is included. Release v26.05.02 added a hold-both-footswitches
  DFU gesture to most binaries. The hardware is released separately under
  CC-BY-SA-4.0.
status: active
authors:
