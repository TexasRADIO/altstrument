device: mutable-instruments-braids
name: Braids Renaissance
summary: Beta Braids firmware adding SAM speech oscillators (16 words each), ten new chord algorithms and an inverted-encoder setting for DIY units.
description: >-
  Two speech models, SAM1 and SAM2, port the C64-era SAM synthesizer: Timbre
  scrubs through the selected word, Color switches words, and a trigger plays
  the word at natural speed. With the quantizer in a diatonic mode the chord
  models stay in key; the x6 modes stack six oscillators across the scale.
  Removed relative to Braids 1.9: the text editor, morse code easter egg,
  QPSK and the original WTx4 (replaced by WTCH). The author labels it beta
  with no warranty.
status: dormant
