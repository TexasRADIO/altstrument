device: poly-effects-beebo
also_devices: [poly-effects-hector]
name: Poly Effects Beebo/Hector firmware (digit_ui)
summary: Official Poly Effects firmware for Beebo and Hector, whose Qt/QML touchscreen UI and Python glue code are published on GitHub.
description: >-
  The digit_ui repository holds the user interface that Beebo and Hector run:
  Python code, QML screens, module definitions and the glue to the Ingen
  plugin host, which runs the DSP as LV2 plugins that live in other
  repositories (PolyLV2 and forks of Ingen and other LV2 projects). The
  repository README describes how to log in to a unit over SSH, restart the
  frontend, debug a single widget with show_single_widget.py and regenerate the
  module cache after adding an LV2 module. The root file system is read-only
  through an overlay by default. The same firmware runs on the Hector Eurorack
  module. The full firmware image, the
  update packages and the system packages other than this source are
  distributed from the Poly Effects site, not from the repository.
status: active
authors:
  - name: Loki Davison
    url: https://github.com/loki42
  - name: Poly Effects
    url: https://www.polyeffects.com/
source: https://github.com/polyeffects/digit_ui
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file. Its README says that code without its own
  notice is GPL, without naming a version. The related PolyLV2 plugins carry GPL
  COPYING files and per-file GPL notices.
homepage: https://www.polyeffects.com/firmware
distribution: download
requires_stock: "338 (units already on 403-406 can use a smaller update package)"
install_notes: >-
  Download the update from the Poly Effects firmware page, unzip it on a
  computer, copy the files to a FAT32 USB stick and start the unit with the
  stick inserted. The May 2026 installer for 407 formats and rewrites the
  storage while the unit runs, takes at least half an hour, and ships with a
  manual reflash procedure that needs the case opened if the update fails.
  Poly Effects asks that the update instructions are read in full and are
  linked whenever the files are shared. Do not apply Beebo and Hector updates
  to Verbs units, the firmware page says Verbs units with serial numbers above
  500 already have the latest firmware and that older firmware will not work
  on them.
brick_risk: true
tags: [official, os, ui, modular, fx, lv2]
