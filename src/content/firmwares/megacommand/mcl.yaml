device: megacommand
name: MCL
summary: Firmware for the MegaCommand and MegaCMD that turns them into a pattern-based MIDI sequencer and Machinedrum/Monomachine controller with projects, grids and live performance tools.
description: >-
  MCL is the sequencer and controller firmware written for the MegaCommand
  hardware. It stores projects on an SD card, sequences external MIDI gear next
  to Machinedrum and Monomachine tracks, and supports live recording and
  performance features. Version 5.00 introduced a new project format with
  folders and project versions, and expects Machinedrum OS X.13 and Monomachine
  OS X.01 on the connected units. The repository also holds the user manual,
  the build tooling and the compiled firmware manifest, and it builds for the
  AVR boards and, in progress, RP2040/RP2350 boards.
status: active
