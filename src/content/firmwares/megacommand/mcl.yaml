source_status: open
license: BSD-3-Clause
license_notes: >-
  The LICENSE file is the BSD 3-clause text, naming Justin Mammarella, Yatao Li
  and Manuel Odendahl as copyright holders (GitHub reports it as NOASSERTION).
  Bundled libraries such as the Arduino cores and SdFat keep their own licenses.
homepage: https://jmamma.github.io/MCL/
distribution: download
install_notes: >-
  Back up your projects before installing 5.00 or later, because existing
  projects are converted to the new format and older MCL versions cannot load
  them. Hold the Page button while powering on the MegaCommand, choose OS
  UPGRADE and run the PlatformIO upload command from the README, which fetches
  the latest firmware from the release manifest. Releases also carry a
  hex file for each version.
tags: [sequencer, midi, performance, ui, flasher]
