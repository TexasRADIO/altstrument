device: monome-white-whale
name: kria
summary: >-
  Alternative monome firmware for white whale: the multi-track Kria step sequencer for grid with per-parameter clock division and external sync. A version of Kria also ships inside ansible.
description: >-
  Kria was first released as an alt firmware for white whale. Release 0.4
  added external sync, and its notes say only clock division is available per
  param and track. The standalone repository is idle; development of Kria
  continues inside monome/ansible.
