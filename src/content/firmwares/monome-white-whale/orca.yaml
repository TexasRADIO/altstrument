device: monome-white-whale
name: Orca (white whale)
summary: >-
  scanner_darkly's alternative firmware for white whale: a grid and arc sequencer with preset banks, separate scales for CV A and B, arc rotate and mutate, and external clock division and multiplication.
description: >-
  Distributed as a zip per GitHub release. Release 2.5 added separate scales
  for the two CV outputs; 2.6 added saving individual presets and banks, scale
  editing on arc4 and moved libavr32 to a submodule. This is the original
  Orca firmware, not the Orca live-coding sequencer. Later work by the same author
  continued in the multipass framework.
