device: monome-white-whale
name: white whale
summary: Official open-source white whale firmware, the probabilistic step sequencer app for grid, with the stock grid support updated in 2021.
description: >-
  The 1.6.0 release adds support for the latest grids and bundles fixes that
  never had a proper release. The repository is part of the AVR32 module family built on
  libavr32.
