    url: https://github.com/16n-faderbank
source: https://github.com/16n-faderbank/16n-editor
source_status: open
license: MIT
homepage: https://16n-faderbank.github.io/editor
distribution: browser-installer
install_notes: Open the hosted editor in a WebMIDI-capable browser with the faderbank connected.
