device: 16n-faderbank
name: 16n editor
kind: tool
summary: >-
  Web-based SvelteKit editor for configuring 16n-family and 8mu controllers from the browser: channels, MIDI and i2c behaviour, and 14-bit mode where the firmware supports it.
description: >-
  The latest tagged release is v2.0.4 from April 2023, while package.json on
  the main branch is at 2.3.0 (8mu support, Svelte 5 and 14-bit CCs) with
  commits through September 2026. Older SAMD21 8mu firmware must be updated
  before using this editor.
status: active
