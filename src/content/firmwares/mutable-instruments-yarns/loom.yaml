device: mutable-instruments-yarns
name: Loom
summary: Yarns firmware with a cue sequencer, a looper-style sequencer with polyphonic recording, 27 oscillator shapes, ADSR envelopes, new paraphonic layouts and expanded MIDI CC support.
description: >-
  Also adds a sequencer-programmed arpeggiator, new polyphonic voice
  allocation algorithms and flexible hold-pedal behaviour. Some original
  features are cut to make room (the sequencer holds 30 notes instead of 64).
  Presets saved under Loom do not load on stock firmware and vice versa; run
  INIT after switching. The author says installation is at your own risk.
status: active
authors:
