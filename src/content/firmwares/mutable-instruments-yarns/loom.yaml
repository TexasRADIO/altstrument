    url: https://github.com/rcrogers
source: https://github.com/rcrogers/yarns-loom
source_status: open
license: MIT
license_notes: Stated in the repository README; no separate LICENSE file; code derives from Mutable Instruments (MIT).
distribution: download
install_notes: >-
  Download yarns-loom.syx from the latest release and follow the official
  Yarns firmware update procedure.
tags: [midi, sequencer, looper, synth-engine, envelopes]
