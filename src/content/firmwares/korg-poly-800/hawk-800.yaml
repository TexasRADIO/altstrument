    url: https://www.hawk800.com/
source: https://sourceforge.net/projects/hawk800/
source_status: open
license: unspecified
license_notes: No license is stated on the SourceForge project page. The project page says source assembly code is posted there.
homepage: https://www.hawk800.com/
distribution: download
install_notes: Needs the HAWK-800 hardware board installed in the synth; the firmware zip on SourceForge is for existing kits.
