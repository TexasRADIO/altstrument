device: zoom-multistomp
name: MIDISTOMP
summary: Patched OS for the Zoom MS-50G, MS-60B and MS-70CDR, built from your own MS-50G 3.10 updater, that adds MIDI program change, MIDI CC, MIDI clock with Start and Stop, a tempo screen and footswitch hold options.
description: >-
  A builder program writes a patched updater from Zoom's official MS-50G 3.10
  updater, which you then run with Zoom's own flasher; it refuses any other file
  and never rewrites the bootloader, so update mode stays available for recovery.
  Added features include program change for loading patches, CC control of the
  six effect slots and every knob, a MIDI menu for per-message receive and channel,
  tempo set by clock, knob or tap with a tempo lock across patches, and a HOLD FOR
  footswitch option for tuner, tempo or momentary use. Tested only on an MS-60B
  flashed with the MS-50G firmware; the MS-50G and MS-70CDR are untested. It pairs
  with the author's custom effects, which follow its tempo and Start and Stop. The
  repository also holds a parser and build tool for the pedals' updaters.
status: active
authors:
  - name: Luca Matturro (matujuice)
    url: https://github.com/matujuice
source: https://github.com/matujuice/zoom-ms-midistomp
source_status: open
license: MIT
distribution: patch-your-own
requires_stock: "3.10"
install_notes: >-
  Download Zoom's official MS-50G 3.10 updater, drag it onto MIDISTOMP-builder.exe
  from the releases page and run the updater it writes. Zoom's own updater takes
  the pedal back to stock. Since v1.1 the builder also accepts Zoom's Mac updater
  (tested on an MS-50G). The author warns that flashing modified firmware can
  brick a pedal and points to docs/safety.md in the repository.
brick_risk: true
tags: [midi, performance, fx, ui, patch]
