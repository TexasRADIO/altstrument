device: zoom-multistomp
name: ZoomMultistompZDL
summary: Custom ZDL effects for the original MultiStomp pedals (22 effects), a browser loader that turns NAM amp captures and cab IRs into effects, and a browser patch editor.
description: >-
  A fork of repeat98/ZoomMultistompZDL that adds a pack of 22 delay-category
  effects with their own screen artwork, a build toolchain that needs no Zoom
  SDK, and the effects from the matujuice pack. A browser loader fits Neural Amp
  Modeler A2 Lite captures and short cabinet filters into installable effects,
  and a Web MIDI patch editor edits knobs and effect order on the pedal. Tested
  on the MS-70CDR, with reports of the MS-50G working; the MS Plus and Four
  series use a different effect format and are not supported. Effects are
  installed with Zoom Effect Manager.
status: active
authors:
  - name: Roman Rusinov
    url: https://github.com/themanro
source: https://github.com/themanro/ZoomMultistompZDL
source_status: open
license: MIT
license_notes: >-
  The MIT grant covers the fork's original work (effects, browser tools, notes,
  artwork). It is a fork of repeat98/ZoomMultistompZDL, which has no licence
  file, so the upstream toolchain code it carries has no stated licence and the
  fork's MIT grant cannot cover it. Zoom's firmware and stock effects are not
  covered either; the LICENSE file spells this out.
homepage: https://themanro.github.io/ZoomMultistompZDL/tools/patch_editor.html
distribution: download
install_notes: >-
  Back up your patches and effect list, then load the ready-made .ZDL files from
  the dist folder with Zoom Effect Manager (Read Effects from folder), a few at
  a time. The patch editor needs Web MIDI in Opera or Edge and Zoom Effect
  Manager closed. The README warns that a bad effect file can stop the pedal
  finishing boot and describes removing it by starting the pedal in firmware
  update mode.
brick_risk: false
