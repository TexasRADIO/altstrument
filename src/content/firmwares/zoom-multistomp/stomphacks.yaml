device: zoom-multistomp
name: Stomphacks
kind: tool
summary: Clean-room toolchain for writing your own effects in C for Zoom MS Plus pedals, packing them into ZD2 files and installing them over USB-MIDI with safety checks.
description: >-
  The pipeline compiles an effect written in C with the free TI C6000 compiler,
  generates the DSP code and ZD2 container itself so that no Zoom file enters the
  build, and checks the result with a report before anything reaches a pedal.
  Install scripts back up the pedal, refuse effects whose ID or filename clash
  with stock ones, check free space and read the file back for comparison. The
  repository ships a small gain effect as a template and three routing effects
  for running two chains on one pedal. Hardware testing so far is on the
  MS-70CDR+; the other MS Plus models are expected to behave the same but are
  unconfirmed. Not supported or authorised by Zoom.
status: active
authors:
  - name: Thomas Hammer
    url: https://github.com/thammer
source: https://github.com/thammer/stomphacks
source_status: open
license: MIT
distribution: source-only
install_notes: >-
  Needs Python 3, the TI C6000 code generation tools 8.5.0 and a clone of
  mungewell/zoom-zt2 (with one upstream fix the README describes) inside the
  repository. Read SAFETY.md first: keep autosave off, keep experimental
  effects out of saved patches, and uninstall them at the end of a session.
brick_risk: true
tags: [sdk, fx, midi, python, research]
