    url: https://www.critterandguitari.com/
source: https://github.com/critterandguitari/Kaleidoloop
source_status: open
license: BSD-3-Clause
license_notes: LICENSE.txt grants BSD 3-Clause terms to files copyright Critter & Guitari; imported files carry their own authors and licenses in their comments.
homepage: https://critterandguitari.github.io/cg-docs/Other%20Instruments/kloop/
distribution: download
install_notes: >-
  Individual modes go into the unit's modes folder through USB-C Disk Mode.
  For the full OS, write the kaleidoloop-v1.0 image linked in the manual to
  the microSD card with balenaEtcher; this erases the card and its
  recordings.
