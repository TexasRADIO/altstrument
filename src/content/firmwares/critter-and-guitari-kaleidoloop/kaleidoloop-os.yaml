device: critter-and-guitari-kaleidoloop
name: Kaleidoloop OS and modes
summary: Kaleidoloop system software and its six Pure Data playback modes, written to the microSD card as a disk image, with the Pd patches, controller code and hardware test in an open repository.
description: >-
  The Kaleidoloop repository has a pd folder with the mother patch and the
  playback modes, and an hw folder with the code for the unit's controller and
  a hardware test. Its history includes a "pure playback" mode and a knob
  that speeds playback up and down, added in 2025, and a community pull
  request merged in December 2025. The user manual links the v1.0 disk image
  for a factory reset.
status: active
