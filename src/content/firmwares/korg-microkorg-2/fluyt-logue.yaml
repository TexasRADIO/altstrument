device: korg-microkorg-2
name: Fluyt
summary: Nine engines from Felucca, the open M-VAVE FM-1 firmware, ported to the microKORG2 as user oscillator units that play inside the instrument's own voice, filter and envelopes. Also built for the drumlogue.
description: >-
  The same nine Felucca engines as the drumlogue build (ANALOG, TRIO, PHASE,
  LOFI, WHEEL, NOISE, FORMANT, DRUM and the six-operator FM6), each as an osc
  module shown on the eight-character display as F-ANALOG, F-TRIO and so on,
  with 13 parameters over four pages and Felucca's presets. The unit renders one
  lane per voice and follows the instrument's pitch, so bend and glide come
  from the microKORG2; level, pan, envelope, filter and amp are the
  instrument's. Felucca is included unmodified at v1.0.2 with tables regenerated
  for 48 kHz; NOISE, FORMANT and FM6 envelopes run about 8.8% off because three
  constants in Felucca's source stay at 44.1 kHz. Sample-based engines and PHYS
  are not ported.
status: active
authors:
