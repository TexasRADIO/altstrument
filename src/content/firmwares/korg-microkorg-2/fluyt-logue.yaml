  (BSD-3-Clause, KORG); the FM6 core is an msfa/Dexed port (Apache-2.0). See
  docs/LICENSING.md.
homepage: https://rgrvdotnl.itch.io/fluyt-logue
distribution: download
requires_stock: "2.0.0 or later (logue SDK 2.1.0 units)"
install_notes: >-
  Download the prebuilt units from the itch.io page (name your own price, free
  allowed) or build them with build-microkorg2.sh. Hold the first option button
  while powering on to enter USB mass storage mode, copy each .mk2unit into a
  SlotN folder under Units/Oscs, then choose the oscillator (F-ANALOG and so on).
