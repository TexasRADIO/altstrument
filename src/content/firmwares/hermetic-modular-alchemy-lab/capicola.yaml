license_notes: LICENSE is the GNU AGPL v3; no "or later" grant was found in the README or source headers checked.
homepage: https://hermeticmodular.com/modules/alchemy-lab/capicola
distribution: download
install_notes: >-
  Flash from the Hermetic Modular web programmer, or download capicola.bin
  from the GitHub releases, hold B3 through the roughly two-second boot window
  to enter update mode, and flash over the front USB-C port with dfu-util.
  Building from source needs cmake, ninja and arm-none-eabi-gcc; the Alchemy
  SDK and libDaisy are git submodules.
