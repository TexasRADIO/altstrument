device: hermetic-modular-alchemy-lab
name: Capicola
summary: Open-source real-time time stretcher and pitch shifter that snaps to input transients to stay on the beat, with envelope followers and trigger outputs, built on the keyframe extrema sampling method from a DAFx26 paper.
description: >-
  Capicola, by Heavylight Industries in collaboration with Hermetic Modular,
  reduces incoming audio to keyframes at its local peaks and valleys and
  stretches it by overlap-add between them, with pitch and time controlled
  separately. When a transient passes the threshold the read head jumps back
  to the present, so stretched audio stays aligned to the rhythm of the
  input. The Quality control sets how much the keyframe representation is
  compressed, and distortion is applied to the keyframes before
  interpolation. Input and output envelope followers and their triggers can
  modulate the knobs internally or go out on the CV jacks. The method is
  described in the paper "Keyframe Time Stretching via Extrema Sampling"
  presented at DAFx26.
