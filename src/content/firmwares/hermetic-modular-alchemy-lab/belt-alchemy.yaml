device: hermetic-modular-alchemy-lab
name: Belt
summary: Live vocal processor for the Alchemy Lab V2 with pitch correction to a chosen key and scale, up to four diatonic harmony voices, a doubler and a formant control.
description: >-
  You sing into the module's audio inputs and Belt retunes the voice to the
  selected key and scale at an adjustable speed, then adds harmony voices that
  follow the scale from the sung note. One LED ring works as a tuner. Version
  0.2.0 adds a USB audio interface mode and controller support through the USB-C
  port for a Launchpad Mini MK3, a Launch Control XL and a GP2040-CE pad. It
  shares its engine with the author's Belt vocal processor for the Ableton Move
  and carries the same SD-card firmware picker as the author's other Alchemy
  Lab firmwares. Hermetic Modular did not write or endorse it.
status: active
authors:
  - name: Tim Cox (timncox)
    url: https://github.com/timncox
source: https://github.com/timncox/belt-alchemy
source_status: open
license: MIT
license_notes: One file derived from STMicroelectronics' USB device library keeps ST's license (src/LICENSE-ST-USB.md).
homepage: https://timncox.github.io/belt-alchemy/
distribution: download
requires_stock: Alchemy Lab V2 board
install_notes: >-
  Hold B3 at power-on to enter update mode, then flash belt_alchemy.bin from
  Hermetic's web programmer or with dfu-util. Alternatively put the .bin in the
  /alchemy folder of the microSD card and switch to it from another family
  firmware's Settings page. Belt keeps its working state in preset slot 14, so
  anything another firmware saved there is overwritten. The release notes say it
  has been played on one module; the repository's design notes leave the CPU
  load of seven pitch-shifting voices unmeasured.
brick_risk: false
tags: [fx, performance, usb-audio, platform]
versions:
  - version: v0.2.0
    date: 2026-09-26
    url: https://github.com/timncox/belt-alchemy/releases/tag/v0.2.0
    notes: Beta. Adds USB audio mode, Launchpad and GP2040-CE pad support, and held punch effects.
