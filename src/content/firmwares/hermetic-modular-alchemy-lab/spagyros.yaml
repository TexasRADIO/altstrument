device: hermetic-modular-alchemy-lab
name: Spagyros
summary: Official stereo end-of-chain performance effects firmware with three effect slots in series, chosen from nine effects such as DJ filter, beat repeat and chopper, and stereo recording to the SD card.
description: >-
  Spagyros chains three effects in series, one per row of pots: the left pot
  sets depth and the right pot a character macro, a button cycles each row's
  effect, and pressing two buttons bypasses everything. The nine effects
  include a DJ filter, bit crusher, riser, chopper, beat repeat,
  reverse/slow, phaser, DJ echo and a space reverb, each with extra
  parameters set from the web programmer and stored in presets. It follows a
  24 PPQN external clock and can record its stereo output to the SD card as
  WAV files.
status: active
