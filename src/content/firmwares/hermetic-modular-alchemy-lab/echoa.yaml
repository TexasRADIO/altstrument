    url: https://hermeticmodular.com/
source_status: closed
license: proprietary
license_notes: Closed-source official firmware, included with the Alchemy Lab. Built on the MIT-licensed Alchemy SDK.
homepage: https://hermeticmodular.com/modules/alchemy-lab/echoa
distribution: browser-installer
install_notes: >-
  Flash from the Hermetic Modular web programmer (hermeticmodular.com/program)
  over the front USB-C port in a Chromium-based browser. Presets saved on
  1.3.0 read as empty on 1.4.0, and presets from 1.0.0 cannot be loaded by
  1.1.0; updating through the web programmer backs up and migrates them.
