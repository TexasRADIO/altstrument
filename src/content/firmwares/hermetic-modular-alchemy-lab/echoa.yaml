device: hermetic-modular-alchemy-lab
name: Echoa
summary: Official stereo dual delay with four delay lines that move from comb resonance through echo to reverb, with series, parallel, mono and spectral routing, per-line engine character, presets and parameter locks.
description: >-
  Echoa runs two stereo delay lines, four lines in total, each with its own
  time, feedback, mix, damping, diffusion and multitap settings. Delay times
  range from 1 ms to 16 s, so short settings give Karplus-Strong style comb
  resonance and high diffusion turns a line into a reverb tail. Each line can
  use a digital, BBD, tape or vinyl engine. The six CV inputs are assignable
  with per-input amounts, and the firmware has 16 preset slots, parameter
  locks of up to 16 seconds on every pot, and a colorblind-safe LED palette.
status: active
authors:
