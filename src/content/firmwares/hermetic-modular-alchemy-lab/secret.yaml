device: hermetic-modular-alchemy-lab
name: Secret
summary: >-
  Chaotic-attractor oscillator for the Alchemy Lab with twelve models, V/Oct, and a TAME control that settles each
  model onto one of its own periodic orbits.
description: >-
  Secret is the Lab successor to the author's Teensy Chaos module and runs twelve attractor models in two banks
  chosen on B1. TAME uses delayed feedback control to lock a model to a periodic orbit where one can be found, and
  leaves Lorenz, Chua and Lorenz-Lu-Chen free. The firmware is built on the Alchemy SDK at 480 MHz, with a load
  governor and measured step limits per model; the README lists four models that top out within the playing range.
  Version 1.1.0 removed hard sync and reworked TAME.
status: active
authors:
  - name: David Baghurst (Eight4aWish)
    url: https://github.com/Eight4aWish
source: https://github.com/Eight4aWish/eurorack_daisy_patch_init/tree/main/daisy_chaos
source_status: open
license: MIT
license_notes: >-
  Original work and the Alchemy SDK are MIT, and the release carries a NOTICES file. The panel files derive from
  Hermetic Modular's MIT template.
homepage: https://eight4awish.com/modules/secret/
distribution: download
requires_stock: Alchemy Lab V2
install_notes: >-
  Connect the front USB-C, hold B3 while powering on to enter DFU, then flash with make flash or load the release
  .bin in Hermetic Modular's web programmer. With Secret already running, make program-live reboots into the
  bootloader over USB. The tools refuse a DFU device that does not offer QSPI at 0x90040000.
brick_risk: false
tags: [oscillator, synth-engine, chaos, open-source]
