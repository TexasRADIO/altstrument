device: hermetic-modular-alchemy-lab
name: Stencil
summary: Rhythmic gate for the Alchemy Lab V2 and the Daisy Patch that chops incoming audio into trance-gate, ducking, lowpass-gate and Morse-code patterns.
description: >-
  Stencil cuts a stereo input into rhythm with a gate mask. Patterns come from
  16 factory banks, a Euclidean generator, one user pattern up to 32 steps sent
  from a web page, or Morse code, where you type a word on the author's web page
  and the gate follows its dits and dahs. The same engine builds for the Daisy
  Patch as well as the Alchemy Lab, and on the Patch the removed audio is output
  on a second pair of jacks. The author says it is inspired by two existing
  products without being a clone of either, and that the name is a placeholder.
  The release is an early build, tested on a computer but not run on hardware.
  Hermetic Modular did not write or endorse it.
status: active
authors:
  - name: Tim Cox (timncox)
    url: https://github.com/timncox
source: https://github.com/timncox/stencil
source_status: open
license: MIT
homepage: https://timncox.github.io/alchemy-lab/stencil/
distribution: download
requires_stock: Alchemy Lab V2 board
install_notes: >-
  For the Alchemy Lab, copy stencil_alchemy.bin into the /alchemy folder of the
  microSD card and switch to it from the SD picker of a family firmware that is
  already running (hold B2 and B3 for two seconds, then B1). The release also
  holds stencil_patch.bin for the Daisy Patch, which goes in /modules on the
  Patch's card. The release is an untested early build.
brick_risk: false
tags: [fx, performance, euclidean, platform]
versions:
