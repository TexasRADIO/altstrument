homepage: https://eight4awish.com/modules/wish/
distribution: download
requires_stock: Alchemy Lab V2
install_notes: >-
  Connect the front USB-C, hold B3 while powering on to enter DFU, then flash the release .bin with make flash or the
  Hermetic Modular web programmer. With Wish or Secret already running, make program-live reboots into the bootloader
  over USB.
brick_risk: false
