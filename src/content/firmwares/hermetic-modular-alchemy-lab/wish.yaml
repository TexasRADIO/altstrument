device: hermetic-modular-alchemy-lab
name: Wish
summary: >-
  Mutable Instruments Beads granular texture synthesizer for the Alchemy Lab, running Beads' own DSP behind the six
  knobs and three buttons, with freeze, seed and randomiser layers.
description: >-
  Beads is a granular processor with four recording qualities, a delay mode, a reverb and a wavetable voice for when
  nothing is patched in. Wish runs the original DSP, compiled from Mutable Instruments' source, which Émilie Gillet
  published on 2026-10-12, and the port was built and first played that day. A load governor thins the grains at the
  heaviest settings, where the first build hung. The attenuverters become randomisers on a layer reached by holding
  B3. Settings are saved three seconds after a change.
status: active
