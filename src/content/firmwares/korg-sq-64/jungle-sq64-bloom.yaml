    url: https://github.com/ivanvihe
source: https://github.com/ivanvihe/jungle-sq64-bloom/tree/feature/generative-bloom
source_status: open
license: MIT
license_notes: >-
  MIT, with Aleph Void LLC's copyright notice kept from the Euclidean firmware
  it derives from. The Korg SQ-64 emulator used for testing is a separate
  GPL-2.0-only project and is not part of the firmware code.
homepage: https://github.com/ivanvihe/jungle-sq64-bloom
distribution: source-only
requires_stock: "Stock update mode (2.0x) for the first install"
install_notes: >-
  Build it with make and the GNU Arm toolchain, check the image against the
  SQ-64 firmware specification, and load the resulting .vsb in the browser
  emulator. The README says nothing in its workflow authorizes a physical
  update, and that the board contract's MCU, electrical limits and recovery
  path are unverified. It uses the same updater, storage map and saved-project
  slots as the Euclidean firmware it derives from.
brick_risk: true
tags: [sequencer, generative, euclidean, turing-machine, fractal, cv-gate, midi, os]
