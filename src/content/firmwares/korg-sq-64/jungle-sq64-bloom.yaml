device: korg-sq-64
name: Jungle SQ-64 Bloom
summary: Experimental generative sequencer firmware for the SQ-64 that adds fractal-variation, Turing-register and scale-quantised tracks and six track C engines to Aleph Void's Euclidean base. Emulator only; the author says not to flash hardware.
description: >-
  A prototype built on the Euclidean firmware's panel, output and updater code.
  Pressing PATTERN switches between the Euclidean layer and a generative layer
  in which track A plays lazy fractal variations of a trunk of up to 64 steps,
  track B is a shift-register Turing engine with lock, rests and gradual
  mutation, track C selects among Euclidean, random walk, weighted random,
  Markov, arpeggiator and harmonic-progression engines, and track D stays a
  Euclidean drum track. Output is quantised to one of fourteen scales, with a
  seeded random generator for replay, a ratchet scheduler and a CRC-checked
  project format. The README labels it an early milestone, marks it emulator
  only and says not to flash a physical SQ-64. The work is on the
  feature/generative-bloom branch, with an open pull request into the
  repository's main branch, which still equals the Euclidean base. The authors
  of the Qu-Bit Bloom module are cited only as functional inspiration.
status: active
authors:
