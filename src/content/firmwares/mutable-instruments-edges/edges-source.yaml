device: mutable-instruments-edges
name: Edges (official source)
summary: Source code for the Edges firmware and bootloader, published by Émilie Gillet in the pichenettes/eurorack repository, together with the hardware design files.
description: >-
  The edges folder in the pichenettes/eurorack repository holds the AVR
  application for the module's ATxmega32A4U, a bootloader, the timer and
  digital oscillator code, MIDI handling and voice allocation, the lookup
  tables and the hardware design files. It builds with the avrlibx library and
  a makefile in the folder. The repository README asks that the Mutable
  Instruments name not be used on derivative works.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/edges
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The repository README gives GPL 3.0 for AVR code, MIT for STM32 code and
  CC BY-SA 3.0 for hardware. The Edges source files carry a GPL header that
  says version 3 or, at your option, any later version. The repository has no
  top-level LICENSE file.
homepage: https://pichenettes.github.io/mutable-instruments-documentation/modules/edges/
distribution: source-only
install_notes: >-
  Build with the makefile in the edges folder and an AVR toolchain. The folder
  includes a bootloader (its fuse settings enable it) and the makefile carries
  SysEx packaging options, but the documentation site gives no update
  procedure and only offers the original firmware image for reverting to
  stock. Treat flashing as an ISP job and keep a backup of the stock image.
brick_risk: true
tags: [official, chiptune, oscillator, open-source]
versions:
  - version: master @ 61d7146
    date: 2019-04-02
    url: https://github.com/pichenettes/eurorack/commit/61d7146
    notes: No tagged releases; this is the latest commit touching the edges folder.
