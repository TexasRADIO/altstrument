homepage: https://github.com/brendanclarke/LXR#readme
distribution: download
install_notes: >-
  Copy firmware image/FIRMWARE.BIN to the root of the SD card and switch the
  LXR on while holding the main encoder button. The repository also builds the
  image with make firmware, which needs arm-none-eabi-gcc, avr-gcc and a host
  C++ compiler.
