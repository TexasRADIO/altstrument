device: sonic-potions-lxr
name: LXR Catalyst Edition
summary: Large extension of the original LXR 0.37 firmware that adds per-voice morph, one-shot LFO shapes, MIDI CC control of every voice parameter, rolls, a looper, track transposition, sample import and many editing shortcuts.
description: >-
  Brendan Clarke's fork keeps the core sound of the LXR and widens its
  control. Each voice gets its own morph value, reachable from the PERF page,
  step automation, velocity and LFO modulation, and the mod wheel controls
  global or per-voice morph. New LFO shapes include one-shot waves and an
  exponential triangle. Voices have direct CC mappings without NRPN, and MIDI
  input can be switched off per voice. The sequencer gains step and track copy,
  automation-only steps, per-track pattern assignment and timing scale, an
  instant pattern switch option, roll recording in three modes and a looper on
  the step buttons. Samples placed in SAMPLES and LOOPS folders on the SD card
  are imported as one-shots or loops. The repository includes a rewritten
  manual and notes for working with LLM coding tools. The README documents the
  encoder acceleration for four-phase encoders only.
status: active
