device: m-vave-smk-37
name: OberVave SMK-37
summary: >-
  Beta build of zvenson's OberVave 8-voice polysynth for the SMK-37 Pro, Elite and MKE-P37, with the pads as
  the step sequencer and the faders on filter and effects.
description: >-
  The same synth, programs and screens as the FM-1 version, with the SMK-37's controls put to work: velocity
  from the unit's factory curves, wheels for bend and vibrato, and two fader banks. The SMK-37 layer comes
  from genkigenki's reference port of the fm1-to-smk37 kit. The README says it has not yet run on a real
  SMK-37. It also lists the Donner Starrykey 37 Play (with the Pro package). There are no key LEDs and no
  TRS MIDI input.
status: active
authors:
- name: Sven Trogus (zvenson)
  url: https://github.com/zvenson
- name: genkigenki
  url: https://github.com/genkigenki
source: https://github.com/zvenson/obervave
source_status: open
license: GPL-3.0-only
license_notes: >-
  Platform code carries Leo Kuroshita's Felucca copyright and SLOOP's changes; LICENSING.md lists who wrote
  each part, including the SMK-37 board layer by M. Geisler (genkigenki).
homepage: https://github.com/zvenson/obervave/blob/main/SMK37.md
distribution: download
install_notes: >-
  SMK37.md asks for a full flash backup first and says the unit's factory key, pad calibration and Bluetooth
  pairing data must not be overwritten. It installs one of three model-specific packages with
  tools/fm1_install.py over USB, from stock or another Felucca-family firmware, in about three minutes. Holding
  OCTAVE- at power-on starts only the updater. To go back, install your model's factory package with M-VAVE's
  own updater.
brick_risk: true
tags: [synth-engine, sequencer, fx, reverb, delay, midi, usb-midi, performance]
