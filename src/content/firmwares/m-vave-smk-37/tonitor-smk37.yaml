device: m-vave-smk-37
name: Tonitor SMK-37
summary: >-
  Tonitor ported to the SMK-37 Pro: six tracks on seven engines, loopers, a physics sequencer and tracks that
  play along with what you play, for electroacoustic and live ambient music. Large high-contrast screen.
description: >-
  Separate firmware that shares its core with Tonitor for the FM-1 and began from Tonitor 0.53. The six tracks
  each take one of seven engines (FM, ANIMA, CALIGULA, RUSSOLO, DRUID, BAYAREA and HIVE), with sounds generated
  from a seed and steered toward an ambient or experimental path. All 37 keys follow the chosen scale. It has
  loopers with up to eight overdubs per track, BALLSY (a physics sequencer), BRICKLAYER (a note-by-note step
  sequencer), chords and latched notes, and REACT, SHADOW and ARP modes in which chosen tracks answer the
  one being played. Sessions and presets, USB and TRS MIDI and USB audio are included. The screen uses very
  large type for low vision. The project numbers its builds and marks itself a work in progress; the
  repository's notes give per-engine processor costs and a flash backup procedure for the keyboard.
