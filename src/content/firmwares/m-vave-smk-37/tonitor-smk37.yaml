homepage: https://nzimas.github.io/tonitor-smk37/
distribution: browser-installer
install_notes: >-
  Browser installer in desktop Chrome, Edge or Opera over USB. It installs over M-VAVE's firmware, SLOOP,
  Felucca or an earlier Tonitor, and refuses a package made for the FM-1. Back up the keyboard's flash first;
  the backup tool runs from a Mac (docs/smk37/backup.md), and parts of the flash such as pairing data and
  calibration are unique to each unit. To go back, install M-VAVE's own SMK-37 Pro firmware file with the same
  installer. Saving sessions overwrites data other firmwares keep in the same flash area. Unofficial; may void
  the warranty.
brick_risk: true
