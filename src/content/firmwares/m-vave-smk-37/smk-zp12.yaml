homepage: https://github.com/djStrombo/smk-zp12
distribution: source-only
install_notes: >-
  Build with tools/build.py --board smk37 (JieLi toolchain and the AC79 SDK tools needed; the workflow shows the
  steps). The repository has no installer script of its own and no install steps for the SMK-37, so work out the
  flashing route yourself and take a full flash backup first. Flashing is at your own risk.
