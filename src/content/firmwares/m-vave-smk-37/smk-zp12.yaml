device: m-vave-smk-37
name: SMK-zp12
summary: >-
  Port of zvenson's zp12 12-bit sampling drum machine to the SMK-37, with the SMK's keys, pads, encoders and faders
  wired in, plus scale and chord modes and a MIDI controller mode. Source only, with a CI build.
description: >-
  A fork of zp12 2.4.4 that adds an SMK-37 board layer: input handling for the keyboard's keys, pads, encoders, faders
  and wheels, the SMK's flash map and LCD code, a USB and TRS MIDI path, and changes in the zp12 application itself.
  Those add a scale quantizer, chord entry and a MIDI mode in the style of the SMK-dee port, with banks
  for knobs, faders and pads. The README is still zp12's own text for the FM-1 and does not describe the port, so
  its controls and state are not documented; the repository description calls it an attempt. A GitHub Actions
  workflow builds the SMK-37 packages (identity SMK-37 Pro_970) and uploads them as workflow artifacts; there
  are no releases.
