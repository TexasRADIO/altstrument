homepage: https://genkigenki.github.io/smk37/help.html
distribution: browser-installer
requires_stock: M-VAVE SMK-37 V016 (the page asks you to supply the file)
install_notes: >-
  Use the Repair section of the help page in Chrome or Edge with the keyboard on USB; it asks for M-VAVE's V016 file,
  which it does not host. If it stops, press Repair again and it carries on where it stopped. The README says a power cut
  at any step leaves a state the page can continue from, tested on a simulated flash. Unofficial; at your own risk.
