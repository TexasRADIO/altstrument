device: m-vave-smk-37
name: SMK-37 Repair
summary: >-
  Small firmware that repairs M-VAVE's damaged key mapping on the SMK-37 while keeping the keyboard's calibration, wheel
  values and Bluetooth pairings, driven from a repair page on the genkigenki SMK-37 site.
description: >-
  For one case: after going back to M-VAVE's firmware, every key reads C and the synth is silent. M-VAVE's firmware
  rebuilds a clean mapping when its end marker is missing, but the rebuild erases the calibration, the pairings and the
  wheel values next to it. This firmware copies those to a free flash area, releases the stock marker, and after M-VAVE's V016
  has rebuilt the mapping writes them back, verifies them and erases its copy. It writes nothing at start,
  acts only on a SysEx command from the page (or SEQ PLAY held for 3 seconds), and never touches the boot area, the USR area
  or the last sector. The page runs the whole sequence, which installs this firmware and M-VAVE's V016 file twice
  in turn, in about ten minutes; you download V016 from M-VAVE yourself. It builds on fm1-base and felucca-bsp
  and covers the Pro, Elite and MKE-P37 names.
