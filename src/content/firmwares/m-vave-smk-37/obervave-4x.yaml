device: m-vave-smk-37
name: OberVave 4x
summary: >-
  Fork of zvenson's OberVave that adds a four-track sequencer with MIDI out on the TRS jack, motion recording,
  four engine parts and a MIDI-controller mode for the SMK-37.
description: >-
  Keeps the OberVave 8-voice polysynth, its 99 programs and its effects, and adds a groovebox layer on top. The
  four tracks share a 256-step pool and each routes to its own engine part, to MIDI out (USB and the SMK-37 Pro's
  TRS jack) or to a drum slot that is still a stub. Other additions are two motion lanes per track, eight
  patterns, a metronome with count-in, and a controller mode in which the panel sends CCs and the engine stays
  silent. The release is a beta tested on one SMK-37 Pro; the FM-1 package builds but the new features are
  untested there.
