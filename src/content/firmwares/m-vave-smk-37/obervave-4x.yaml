source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md lists who wrote each part: the platform is Leo Kuroshita's Felucca code with SLOOP's changes, the
  synth and the sequencer base are zvenson's, and the SMK-37 board layer is M. Geisler's (genkigenki). The
  groovebox additions are credited to zvenson in that file.
distribution: download
requires_stock: SMK-37 / SMK-37 Pro, Elite or MKE-P37 on stock or another Felucca-family firmware
install_notes: >-
  The release has one package per model (Pro, Elite, MKE-P37) plus an FM-1 one. SMK37.md asks for a full flash
  backup first, using the fm1-to-smk37 kit, and warns that the unit's factory key and pad calibration are unique
  to it. A package is installed over USB with tools/fm1_install.py, which takes about three minutes. Holding
  OCTAVE- at power-on brings up the USB rescue screen, and M-VAVE's factory package restores the stock firmware.
brick_risk: true
