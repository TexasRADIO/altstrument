source: https://github.com/jstnfst/te-op1
source_status: open
license: unspecified
homepage: https://te-op1.pages.dev/
distribution: source-only
install_notes: >-
  Build mondo with build.bat (MSVC) or the repository's master-control.sh build
  script. The device-copy and backup subcommands are Windows only; the OP-1
  Field appears over USB as an MTP device.
