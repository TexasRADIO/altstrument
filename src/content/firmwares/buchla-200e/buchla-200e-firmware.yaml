device: buchla-200e
name: buchla-200e-firmware
summary: >-
  Byte-level patches for Buchla's published 291e v30.1 firmware, plus disassembly maps, an 8051 emulator and protocol
  notes for the 210e and 223e, rebuilt from the user's own download with scripts that check exactly which bytes changed.
description: >-
  Five patch packages for the 291e Triple Morphing Filter change a few bytes each: edge-triggering the panel
  interrupt so that one press moves one step, a rebuilt routine, a longer panel debounce window, a guard against
  an output blip when the CV select changes, and a version marker that makes a patched unit report p.01 on the 225e.
  The author reports that the first and the version marker were flashed and accepted on a module and that the other
  three are offline or emulated only. For the 210e there is a map of the v30.5A image and a comparison with v30.2 with
  open questions, and for the 223e there are decoded surface protocol notes, bench captures and controller plans, with
  no patch for either yet. The repository also holds an 8051 emulator that runs a 200e image offline, a hex analysis
  and patch tool, and a hash index of the firmware downloads on Buchla's site. Each package has notes, a list of
  changed addresses, a diff and an apply script, and the apply script fails if any other byte differs. The repository
  holds no Buchla firmware, stock or patched, and the README says it is work in progress.
status: active
authors:
  - name: pasei
    url: https://github.com/pasei-dev
source: https://github.com/pasei-dev/buchla-200e-firmware
source_status: patcher-only
license: MIT
license_notes: >-
  The MIT license covers the scripts, documents, disassembly maps and patch deltas. NOTICE.md states that Buchla's
  200e firmware is proprietary, is not in the repository, and is not covered by that license; a patched image is
  Buchla's code with these bytes in it, so users build it themselves from their own download. GitHub shows the
  license as "Other". The analysis tooling and the C sources behind two patches were deliberately left out of the
  published tree.
distribution: patch-your-own
requires_stock: 291e v30.1 (291Ev301.hex) for the patches; the hash in the repository's firmware index must match
install_notes: >-
  Download the module's zip from Buchla's 200e downloads page, run tools/setup-images.py to verify it against the
  published SHA-256 and unpack it, then run a patch's apply.sh to build the image offline. Flashing is done with a
  Silicon Labs debug adapter on the module's debug socket, not with the USB firmware card, and docs/hardware/c2-flashing.md
  says to read the module's flash first because that read is the only way back from a wrong write. Buchla's own
  notes and the device note here warn that getting past the factory flash lock erases the bootloader, calibration and
  presets, and the repository records a 2023 case of a bricked panel image. Each patch's notes.md gives its
  acceptance gesture and rollback.
brick_risk: true
tags: [patch, bugfixes, research, emulator]
