device: korg-volca-sample
name: LUMON OS XL
summary: Unofficial firmware for the first-generation volca sample, built from Korg's 1.42 image. Adds per-step eight-bar Predictability, microtiming, ratchets, intra-bar looping, musical pitch scales and a LIVE page with beat repeat, backcue gestures and freeze.
description: >-
  Version 1.0 is distributed as an updater WAV and a bundle that install through
  the volca sample's normal audio update; the instrument shows LUMON OS at start-up.
  Predictability lets each of the 16 steps in each of the ten parts follow one of 16
  eight-bar play patterns. Other changes include microtiming of plus or minus 15
  units of 1/32 step, trigger echo, up to four ratchet strokes, sixteen SPEED
  scales, sixteen equal sample zones, audio pattern export, a tempo-synced lo-fi
  delay and a quantised freeze effect. The author credits Pajen's earlier firmware
  for research and ideas such as bar filtering and access to extra reverb programs,
  and states the build input is Korg 1.42, not Pajen's image. The repository
  publishes the extension sources, but the images also contain Korg's code and the
  author grants no redistribution license. A companion tool, Volca Studio XL
  (MIT), can also transfer the firmware.
status: active
