  repository holds the LUMON extension sources (C and assembly) but not Korg's
  firmware; generated images contain Korg code and data.
homepage: https://github.com/MicheleDataBeat/lumon-os-xl/releases/tag/v1.0
distribution: download
install_notes: >-
  Play the updater WAV from the release into the volca sample using Korg's audio
  update procedure; Korg 1.41 or 1.42 does not need to be installed first. The
  README links an installation guide, and the native version check can show 1.60,
  which is the updater transport version rather than the release number.
