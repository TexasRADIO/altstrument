device: korg-volca-sample
name: Pajen unofficial firmware
summary: Unofficial volca sample firmware with chromatic sample playback, polyphony, MIDI velocity, probability triggering, drone mode and extra MIDI CCs.
description: >-
  Beta 7 lets you play samples chromatically from a MIDI keyboard. Coverage
  also lists polyphony, per-part and per-pattern note and pitch options, extra
  reverb programs, probability triggering, an insta-drone mode and new MIDI
  CC values. The features can be switched off in the global menu and the
  official firmware can be restored. One report says it may need a little more
  current than stock. Discussion and downloads were in a long-running
  Gearspace (formerly Gearslutz) thread.
status: dormant
