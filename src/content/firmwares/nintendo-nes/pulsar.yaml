device: nintendo-nes
name: Pulsar
summary: LSDJ-style tracker that runs on a real NES from a PowerPak cartridge or in an emulator, with a synth engine that runs independently of the sequencer.
description: >-
  A tracker by Neil Baldwin, the successor to Baldwin's earlier NTRQ, whose interface and commands follow LSDJ. Its manual
  says the synthesis engine runs separately from the sequencer at 180 Hz, three times the rate of a typical NES audio
  engine. The repository holds the assembly source for ca65, ready-made NTSC and PAL ROM builds, an HTML manual
  and PowerPak mapper files. The readme says it runs on an NTSC NES with a PowerPak cartridge, or in the Nestopia and
  Nintendulator emulators, and that it needs a 32 KB save file.
status: dormant
authors:
