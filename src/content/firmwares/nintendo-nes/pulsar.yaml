homepage: https://neilbaldwin.codeberg.page/nes-audio/manuals/pulsar/Pulsar.html
distribution: download
requires_stock: NTSC NES with a PowerPak cartridge, or an emulator with 32 KB save support
install_notes: >-
  For a PowerPak, copy MAP01.MAP from the PowerPak folder to the POWERPAK folder on the compact flash card and put a
  blank 32 KB pulsar.sav in the SAV folder. Pulsar formats an unrecognised save file on boot, and the PowerPak needs a
  reset held for a few seconds to save. The repository contains prebuilt ROMs; this catalog links to it and does not
  host them.
brick_risk: false
tags: [tracker, chiptune, lsdj-style]
