device: nintendo-nes
name: Chip Maestro
kind: tool
summary: Open design files and code for a NES cartridge with a MIDI input jack that plays the console's sound chip from a MIDI keyboard.
description: >-
  The repository holds the board layout, schematic, label artwork, a CPLD design and Arduino-style MIDI code
  (chip-maestro.ino with a channel class and a MIDI library) for a cartridge that gives the NES a MIDI input. The
  author built it after seeing the band Anamanaguchi play live with a NES MIDI tracker. They say the CPLD part
  is out of date and that a modern microcontroller with configurable logic would be a better base.
status: dormant
