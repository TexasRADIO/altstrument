  their owners.
homepage: https://synth-hub.elevatech.xyz/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, Edge, Brave or Opera and click CONNECT USB, then pick the synth, or run the Astro
  app locally from the app folder with npm install and npm run dev. WebUSB and Web MIDI need HTTPS or localhost. The
  firmware panel only reports versions and never writes firmware, so updates still go through Behringer's own
  SynthTribe.
brick_risk: false
