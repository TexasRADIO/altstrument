device: behringer-tools
name: SynthHUB
kind: tool
summary: Browser app that edits settings, runs a step sequencer and checks firmware versions on 71 Behringer synths and drum machines over WebUSB and Web MIDI SysEx.
description: >-
  Rights warning: the repository bundles Behringer product photos and a manifest of links to Behringer manuals, and
  its firmware panel reads release lists and download links from Behringer's cloud service through server-side
  client credentials that are kept outside the repository. SynthHUB is an installable offline web app that stands in
  for Behringer's SynthTribe and Control Tribe editors. It finds devices by USB vendor id and sends SysEx to read and
  change per-device settings, with a step sequencer (ratchets, per-step velocity, gate and probability, live MIDI
  recording), patch and pattern libraries, MIDI file import, poly-chain setup and CV calibration references. It
  also imports and exports Control Tribe project files for the Swing. The firmware panel reads the device's version
  and compares it with Behringer's latest; it never flashes, and it lists Behringer's own download links for
  reference. The parameter tables were recovered for interoperability. It needs a Chromium-based browser.
status: active
authors:
