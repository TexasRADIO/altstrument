device: korg-minilogue-xd
name: VoxHumana
summary: Oscillator for the minilogue xd that simulates the Vox Humana preset of the Polymoog 280a with a detuned saw and pulse pair and three configurable LFOs.
description: >-
  The unit uses one sawtooth and one pulse oscillator, slightly detuned, with
  three LFOs modulating the pitch of each and the pulse width. The filter,
  envelope and effects are left to the instrument. The author built it from a
  magazine article on the sound and notes that the Polymoog's divide-down
  oscillators kept all keys in phase, which the minilogue xd cannot do, so chords
  differ from the original. It was not tested on the prologue or NTS-1.
status: dormant
