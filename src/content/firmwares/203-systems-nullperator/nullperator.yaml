license: BSD-3-Clause
license_notes: GitHub reports the license as Other because the LICENSE file is the BSD 3-Clause text carried over from picoTracker (copyright Discodirt and xiphonics, inc.) followed by a list of bundled third-party components, each under its own license. The README states that the project is distributed under the BSD 3-Clause License.
homepage: https://203.io/products/operator-deposit
distribution: source-only
install_notes: >-
  The hardware build is done with ESP-IDF using the Node selector for the ESP32-S3, as described in docs/HARDWARE.md
  in the repository: idf.py build, then flash and monitor from the sources directory with the build directory set
  to build/node. The repository has no release downloads, and the shop page says factory firmware, an SDK and
  hardware documentation are to be published around the release date.
brick_risk: false
