    url: https://github.com/xerydian
source: https://github.com/xerydian/elektron-emu
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and the README gives no license for the
  code. Elektron's panel photos in it are Elektron's, as the README says.
distribution: download
requires_stock: Digitakt II 1.16, Syntakt 1.41, Analog Rytm MKII 1.73, Digitone II 1.11, Model:Cycles 1.13
install_notes: >-
  Download the OS .syx for each machine from Elektron's support page yourself
  and put it in the plug-in's Firmware folder, which the plug-in creates. Copy
  the .vst3 to the system VST3 folder and rescan plug-ins in the DAW. On macOS,
  run the xattr command in the README to clear the quarantine flag. The first
  start takes up to two minutes. Nothing is flashed to a device.
