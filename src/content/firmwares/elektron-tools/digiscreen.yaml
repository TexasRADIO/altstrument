    url: https://github.com/irpina
source: https://github.com/irpina/digiscreen
source_status: open
license: GPL-2.0-or-later
license_notes: The LICENSE file is the GPL version 2 text and the README states "GPL-2.0-or-later".
homepage: https://irpina.github.io/digiscreen/
install_notes: >-
  Power the device from its own supply, connect it to the phone with a USB-C
  OTG cable, close Transfer, Overbridge and other apps that hold its MIDI port,
  then open the page in Chrome and press Connect. The device's USB setting must
  offer class-compliant MIDI. Nothing is flashed to the device.
