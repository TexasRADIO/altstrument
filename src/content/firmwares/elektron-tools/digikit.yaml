device: elektron-tools
name: digikit
kind: tool
summary: Emulator that runs the real Digitakt II and Digitone II OS (ColdFire control CPU and SHARC+ DSP) with front panel and display, plus analysis tools and a patch toolchain that adds machines and effects to your own .syx. Aimed at new machines and sounds.
status: active
authors:
  - name: m-dwyer
    url: https://github.com/m-dwyer
source: https://github.com/ElekLabs/digikit
source_status: open
license: AGPL-3.0-or-later
license_notes: The LICENSE file is the AGPL v3 text and the README states "or later". NOTICE adds section 7 terms on attribution, origin and use of the digikit name.
distribution: source-only
requires_stock: Digitakt II 1.17 and Digitone II 1.12 for patching; the emulator also runs 1.16 and 1.11
install_notes: >-
  Build with mise and uv, and supply your own Elektron .syx files; none are in
  the repository. The README says no patched image has been installed on a
  device yet and that device recovery has not been tested on hardware.
tags: [emulator, research]
