device: korg-nts-1
name: schollz logue effects
summary: "Docker-based build setup and small effects for the NTS-1 and minilogue xd: simplepan, distortion, clipper, overdrive, pitch shift, tremolo and others, plus a pick of units from Korg's index."
description: >-
  Some units are the author's own, such as simplepan, a left and right pan
  effect with rate and depth, and a distortion; others are units taken from
  Korg's unit index and wired into one workflow. A Dockerfile and Makefile
  build all units into one folder together with logue-cli, and make targets can
  upload everything into chosen slots or clear the instrument and upload all.
