device: korg-nts-1
name: key4
summary: Four-voice polyphonic oscillator for the NTS-1 inspired by the volca keys, with poly, unison, octave, fifth and ring-modulated modes and a drive control.
description: >-
  The oscillator keeps the last four notes it was given and renders them with
  band-limited saw or square waves. The mode parameter picks poly, unison,
  octave, fifth, unison with ring modulation or poly with ring modulation, and
  a second parameter sets drive. The repository is a single C source plus
  makefile and manifest for the logue SDK, has no README, and has had no
  commits since May 2023. The manifest is marked version 0.9-0.
status: dormant
