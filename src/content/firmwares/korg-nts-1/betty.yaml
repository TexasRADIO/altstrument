device: korg-nts-1
name: Betty
summary: "Rhythm generator oscillator for the NTS-1 and NTS-1 mkII: 16-step random patterns, three-voice polyphony from a bank of 12 samples, triggered by pressing notes or running the arpeggiator."
description: >-
  Betty holds 16 rhythm patterns of 16 steps each, advanced by pressing any
  note, so running the arpeggiator gives instant playback. A pattern, or a random
  one through the rnd parameter, can be chosen for each of three sample groups.
  The two encoders set the amount of ducking triggered by the kick and the
  tuning. The repository has a build for the original NTS-1 and a separate
  build for the NTS-1 mkII.
status: dormant
