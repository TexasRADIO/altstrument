device: korg-nts-1
name: hypercubed nts-1 units
summary: "Three open NTS-1 units: a 12-voice chord oscillator that picks major or minor chords by key, an 808-style bass oscillator, and a distortion and clip mod effect."
description: >-
  chords-osc plays major or minor chords chosen from a quantized key, with
  fifths, triads, sevenths and suspended chords for notes outside the key;
  the shape knob sets the key, the alt knob sets one to four notes, and
  parameters choose saw, square or sine and detune. osc-808 is an 808-style bass
  oscillator with pitch decay, phase distortion, drive and pitch attack
  controls. distort-mod is a mod effect with soft clip, hard clip, wrap and fold
  modes. The index entry on Korg's site lists the effect for the minilogue xd
  and prologue as well.
