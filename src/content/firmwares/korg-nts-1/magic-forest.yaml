device: korg-nts-1
name: Magic Forest
summary: NTS-1 oscillator that generates lo-fi forest ambience with pan flute and claves, meant to run from a latched arpeggiator.
description: >-
  The two encoders set the volume of the pan flute and claves group and of the
  ambience, and the oscillator parameters tune each group separately. The
  README suggests a latched arpeggiator with a longer pattern length for
  instant ambience, with the EG set to Open.
status: dormant
