device: korg-nts-1
name: Tweeeeeak NTS oscillators
summary: "Free oscillators by Tweeeeeak! for the NTS-1 and NTS-1 mkII: RoaR random sound and sequence generator, ROAT, J6 chord player, Proba-B probability sequencer and a Volca Bass style triple oscillator."
description: >-
  RoaR generates random digital sounds and 16-step sequences from one knob and
  can sync to the arpeggiator, sequencer or external gear. J6 is a chord player
  and sequencer inspired by the Roland J-6, with 100 chord sets, 100 playing
  patterns and a 16-step chord sequencer. Other oscillators include the ROAT
  8-bit experimental oscillator, the Proba-B probability sequencer and a
  Volca Bass style oscillator. Releases carry separate units for the original
  NTS-1 and the mkII. Tweeeeeak! is a registered developer in Korg's SDK
  developer ID list.
