device: korg-nts-1
name: logue-fx (dukesrg)
summary: "Open collection of custom effects by dukesrg for the NTS-1, minilogue xd and prologue: Crusher, Gator, Hyper, Kompressor, Looper, Vibrator, LFO and Delay BPM, built from one wrapper header for all effect slots."
description: >-
  Crusher is a bit crusher and decimator, Gator a Kaossilator-style gate
  arpeggiator, Hyper a unison effect inspired by supersaw, Kompressor a peak
  downward compressor and expander, Looper a Kaossilator-style loop recorder,
  Vibrator a vibrato and pitch shifter, LFO a vibrato with selectable waveform
  and Delay BPM a delay tied to tempo. A shared header lets one source file
  build for the modulation, delay and reverb slots, and most effects are
  offered for all three. The third parameter control is not available in the
  modulation slot, and the Looper shortens its loop on the NTS-1 to fit the
  SDRAM, depending on record format and tempo.
status: dormant
