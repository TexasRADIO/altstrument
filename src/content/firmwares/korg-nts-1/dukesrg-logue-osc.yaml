    url: https://github.com/dukesrg
source: https://github.com/dukesrg/logue-osc
source_status: open
license: unspecified
license_notes: The repository has no license file; the bundled SDK fork carries Korg's BSD-3-Clause license.
homepage: https://dukesrg.github.io/logue-osc/
distribution: download
install_notes: Precompiled units are on the releases page. Load them with Korg's librarian for your instrument, or build them from the repository with the logue SDK.
