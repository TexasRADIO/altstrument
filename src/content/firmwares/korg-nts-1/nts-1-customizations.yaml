device: korg-nts-1
name: nts-1-customizations
kind: tool
summary: "Korg's official hardware customization repository for the NTS-1 digital kit: custom panel reference board data with schematics, KiCad project, Gerbers, BOM and Arduino libraries."
description: >-
  The repository holds the files for the NTS-1 Custom Panel reference board
  revision C: Arduino IDE libraries, raw Gerber data, a KiCad project, bills of
  materials with Mouser part numbers, a PCB reference and a part placement
  diagram, plus an Arduino Boards Manager package description. A companion web
  site covers assembly, programming and examples. It supports building a
  custom control surface for the instrument rather than changing the unit
  software.
