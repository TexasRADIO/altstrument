device: arturia-beatstep
name: beatstep-cli
kind: tool
summary: Cross-platform command-line program that reads and writes BeatStep settings over SysEx, including loading and saving preset files, setting pad colours and reading the firmware version.
description: >-
  A C++ program built with CMake on top of RtMidi. Subcommands list the MIDI devices, load or save a
  .beatstep preset file, change the colour of a pad LED, report the firmware version, and get or set
  single parameters by their SysEx ids. It also has a debugging command that emulates a BeatStep to
  watch the messages another program sends. It works with the stock firmware and does not change the
  operating system.
