device: synthux-spotykach
name: SpotykachX
summary: Experimental fork of the official 1.2.0 firmware where deck A switches between sound and effect engines such as an Audrey II voice, an oscillator and a Benjolin.
description: >-
  SpotykachX is built on the official Spotykach firmware 1.2.0. According to its
  README it is a work in progress in which deck A can switch between different
  sound and effect engines, and it lists a Valhalla-style reverb, Microcosm
  Mosaic, Plaits, Rings and Elements as planned. The README says the project was
  mainly written with Codex. A demo video linked from the README shows the first
  engines.
status: active
authors:
