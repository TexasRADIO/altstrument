    url: https://github.com/chenhaoyt2025
source: https://github.com/chenhaoyt2025/SpotykachX
source_status: open
license: MIT
homepage: https://github.com/chenhaoyt2025/SpotykachX/releases
distribution: download
install_notes: >-
  Download the .bin from the releases page, or build it with make (output
  build/spotykachx.bin). Put the Spotykach into its USB bootloader DFU mode and
  run make program-dfu, as with the official firmware. Control and MIDI
  mappings are documented in CONTROL_MAPPING.md and MIDI_CONTROL.md in the
  repository.
