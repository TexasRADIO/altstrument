device: bastl-instruments-citadel
name: Knoscillator
summary: Stereo oscillator app that traces a rotating 3D knot, with FM, a sequencer and stereo delay, written for the Citadel Eurorack module.
description: >-
  Knoscillator was written for Citadel and generates its left and right outputs from the X and Y coordinates of a
  rotating three-dimensional curve. The MODE button cycles through trefoil, Lissajous and torus knots, two integer
  coefficients (1 to 8) set how complex the knot is, and a morph control blends between neighbouring knots. The LFO
  controls the speed and direction of rotation, TIMBRE applies phase modulation in three dimensions with a
  switchable FM ratio, and a macro control sets the wet level, filter and feedback of Citadel's tempo-synced stereo
  delay. Sequencing, pattern, quantizer and tap tempo follow Bastl's Alchemist app, and the manual recommends the
  Alchemist panel. The author wrote it first for Befaco's Lich module. It is built on Bastl's Kastle 2 firmware
  framework, which Citadel shares, and the Kastle 2 has its own entry for it. Bastl's app list gives it a community
  app ID.
status: active
authors:
  - name: Damien Quartz
    url: https://github.com/ddf
source: https://github.com/ddf/kastle2
source_status: open
license: MIT
license_notes: >-
  MIT, with the app's source files carrying Damien Quartz's copyright alongside Marek Mach's (Bastl Instruments).
  The repository is a fork of Bastl's kastle2, whose README keeps Bastl's panel graphics, case artwork and sample
