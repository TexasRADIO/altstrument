  contain Wave Bard samples.
homepage: https://github.com/ddf/kastle2/blob/release/KNOSCILLATOR.md
distribution: download
install_notes: >-
  Download the .uf2 from the GitHub release. Switch the unit off, hold SHIFT while switching it on so it appears as a
  USB drive, and copy the .uf2 onto it. The manual recommends the Alchemist panel for the control labels. Bastl's own
  .uf2 files put an official app back the same way.
