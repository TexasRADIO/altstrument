device: novation-circuit-tracks
name: ctpatch
kind: tool
summary: Python module that reads, edits and writes Circuit Tracks synth patch SysEx (.syx) files as typed objects, and can send patches to the device.
description: >-
  Parses a single-patch SysEx file into dataclasses covering the patch name,
  voice, oscillators, mixer, filter, envelopes, LFOs, effects and modulation
  matrix, so patches can be changed or generated from a script. An example
  script shows reading a patch, changing it, writing it back and sending it
  to the device. It needs Python 3.10 or newer. The last commit is from
  September 2023.
status: dormant
