homepage: https://github.com/insolentconstruct/eurorack/releases/tag/storage-recovery-2026.10.27
distribution: download
requires_stock: Beads with a working audio updater (FREEZE held at power-on, FREEZE and SEED LEDs flashing alternately)
install_notes: >-
  Use it only when the module does not start and its updater still works.
  Unplug all CV cables, patch the audio interface to IN L, set TIME to a middle
  position, power on with FREEZE held and play storage-recovery.wav as for any
  Beads update. The mode LED blinking green means done; if the three ASSIGN
  LEDs are also lit the calibration was reset. Blinking red means it failed, and
  the remaining route is an ST-Link flash. Afterwards install a normal firmware
  the same way: Mutable Instruments' Beads 1.7, the early 2024 patch firmware or
  a Drizzlet release.
brick_risk: false
tags: [recovery, bugfixes]
