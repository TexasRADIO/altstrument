device: mutable-instruments-beads
name: Drizzlet storage recovery
summary: One-off recovery image for a Beads that fails at start-up, which erases the settings and saved frozen buffer and rewrites the settings at factory values. It is not a working firmware.
description: >-
  Published by the Drizzlet author for a Beads that stops at start-up with a
  steady LED while its updater still works, which Mutable Instruments users have
  reported with the stock firmware since 2023. The author does not know whether
  Drizzlet can cause it. The image runs before any settings are read. It erases
  the flash sectors that hold the saved frozen buffer without reading them,
  keeps the CV calibration only if it reads back cleanly and is within 25
  percent of the factory values, and rewrites the settings. The module then does
  nothing until a normal firmware update is installed. If the calibration was
  reset, the CV inputs need recalibrating with accurate 1 V and 3 V references.
  The author tested it on one healthy module only and says it cannot support
  anyone's hardware. It does not come from Mutable Instruments.
status: active
authors:
