homepage: https://justinjoe.com/op1-mod
distribution: patch-your-own
requires_stock: R246
install_notes: >-
  Back up the OP-1 in disk mode first. Download the patch and apply.py from the
  project's download page (the page also offers a PDF manual), then run apply.py
  with your official op1_246.op1 and the patch; nothing is written if the
  checksum differs. Copy the result to the OP-1 in upload mode (hold COM at
  power-on, press 1, plug in USB) and press COM. The bootloader stays stock.
  Before returning to stock, switch every sound that uses KEYS, ITER, FILTER,
  the new effects or the TIDE LFO to stock options, or the stock firmware stops
  at boot with an "Invalid synth patch" message; flashing the mod again clears
  that. The author warns that bursts of hundreds of MIDI CCs can make the unit
  ignore USB MIDI until the cable is replugged.
brick_risk: false
