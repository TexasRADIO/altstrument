device: teenage-engineering-op-1
name: OP-1 Mods
summary: Patch for the official OP-1 R246 firmware that adds a KEYS electric-piano engine, chord mode and scales, six effects, a TIDE LFO, a piano-roll TRACK sequencer, a Shift latch and MIDI CC control of most knobs.
description: >-
  The download is a binary patch plus a small Python script, apply.py, that
  checks your official op1_246.op1 against a stored SHA-256 and writes a modded
  .op1 file. The patch is described as holding none of Teenage Engineering's
  code. New effects are CRUSH (bitcrusher), BELL (ring mod into tuned strings),
  MOON (phaser and vibe), MIMIC (tempo-synced echo), LINGER (plate reverb with
  freeze) and SPIN CYCLE (rotary speaker), each with its own screen. KEYS
  models tine, reed and clav sounds without samples, six voices. TIDE adds
  seven waveforms and four sync modes, and the TRACK sequencer is a seventh
  sequencer with a piano roll. The scale feature started from the OP-1 note
  quantization patch by stfj, moved in memory and with corrected scale tables.
  The author states it has run on two OP-1 units and works on the original
  OP-1 only. TAPE, a tape-damage and chorus effect, is listed as planned. The
  project is unofficial and not affiliated with Teenage Engineering.
status: active
