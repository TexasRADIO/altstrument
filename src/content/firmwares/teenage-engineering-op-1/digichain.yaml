device: teenage-engineering-op-1
name: DigiChain
kind: tool
summary: Browser app that joins samples into slice-marked chains and drum kits for the OP-1, OP-1 Field and OP-Z, and also for the Digitakt, Octatrack and Dirtywave M8, and splits existing kits back into samples.
description: >-
  Converts batches of audio files to a chosen bit depth, sample rate and channel
  layout, edits them (trim, normalize, reverse, pitch, slice) and joins them into
  chains with slice markers written for the target device. Besides the OP-1
  family and OP-Z it exports for the Elektron Digitakt and Octatrack and the
  Dirtywave M8, and it imports OP-1 and OP-Z drum kits, Octatrack .ot files and
  OP-1 Field tape files for slicing. It runs in the browser without a
  connection once loaded, and desktop builds exist for Windows and macOS. It
  does not talk to a device and does not touch device firmware.
status: active
