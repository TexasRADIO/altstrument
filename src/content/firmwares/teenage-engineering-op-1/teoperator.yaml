    url: https://github.com/schollz
source: https://github.com/schollz/teoperator
source_status: open
license: MIT
homepage: https://teoperator.com
distribution: source-only
install_notes: >-
  Needs ffmpeg. Install with the Go toolchain as the README describes, or use the
  hosted page. The GitHub releases carry no attached binaries.
