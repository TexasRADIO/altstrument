device: teenage-engineering-op-1
name: teoperator
kind: tool
summary: Go command-line program and web server that turn audio files into OP-1 and OP-Z drum and synth patches, with the key and slice metadata written into the .aif.
description: >-
  Converts wav, aif, mp3 or flac input to the mono 44.1 kHz .aif patch format
  and writes the metadata the OP-1 and OP-Z read. Subcommands build sample-based
  synth patches with an optional base frequency, drum kits from several files,
  drum patches sliced at detected transients, and loop patches cut into equal
  slices. A built-in web server offers the same conversion in a browser, and the
  author's write-up explains the reverse-engineered patch metadata.
status: dormant
authors:
