device: nintendo-ds
name: HobbyChop GRiDS
summary: >-
  Paid DS ROM: a chord-driven synthwave groovebox with pad, lead and bass voices and a drum machine built without samples.
description: >-
  GRiDS is a synthwave and darksynth groovebox for the Nintendo DS with a paraphonic pad, a supersaw lead, a sub bass
  and a synthesized 80s drum machine, tied together by a chord-aware 32-step sequencer with song mode and stereo
  chorus. The manual says the pad, lead and bass render in software on the ARM7 at 32768 Hz in stereo and the ROM
  contains no samples. The shop page lists the DS, DS Lite, DSi and 3DS with a flash card, an SD card for saving and
  an optional mDS-style slot-2 cartridge for MIDI.
status: active
authors:
  - name: HobbyChop
    url: https://www.hobbychop.com/
source_status: binary-only
license: proprietary
license_notes: >-
  No licence is stated on the shop page, which calls it homebrew provided as is. The page names the third-party
  components calico (Zope Public License 2.1), libfat (BSD-3-Clause) and libnds (zlib). The GitHub repository
  https://github.com/HobbyChop/GRiDS holds the manual, with no source or ROM.
homepage: https://www.hobbychop.com/product/grids
distribution: commercial
install_notes: >-
  Sold as a downloadable .nds ROM for $12 at the product page, run from a DS flash card with an SD card for saving.
  MIDI needs the separately sold mDS slot-2 cartridge on an original DS or DS Lite.
brick_risk: false
tags: [synth, groovebox, synthwave, midi, commercial]
versions:
  - version: "3.0.0B"
    url: https://www.hobbychop.com/product/grids
    notes: Version shown on the product page, which gives no release date.
