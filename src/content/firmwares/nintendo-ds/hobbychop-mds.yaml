device: nintendo-ds
name: HobbyChop mDS
kind: tool
summary: RP2040 firmware for a DS and DS Lite slot-2 cartridge that passes hardware MIDI in and out to DS apps such as sDS and the HobbyChop synth ROMs.
description: >-
  mDS is a MIDI interface built on a Raspberry Pi Pico (RP2040) that plugs into the GBA slot of an original DS or DS
  Lite. The cartridge presents MIDI state to the DS as a small block of memory in the slot's SRAM window, and the DS
  app reads it; the DS cannot write back, so outgoing MIDI is triggered by reads of special addresses. It has opto-
  isolated MIDI in, MIDI out, a status LED and a USB boot-mode (UF2) firmware update. The DSi and 3DS have no slot-2,
  so it does not work on them. The README documents the protocol for writing DS programs.

  The firmware runs on the cartridge's RP2040, not on the DS, so it is listed as a tool. HobbyChop also sells a
  finished adapter.
status: active
authors:
