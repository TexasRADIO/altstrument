    url: https://github.com/HobbyChop
source: https://github.com/HobbyChop/mDS
source_status: open
license: CC-BY-NC-SA-4.0
license_notes: A Creative Commons non-commercial licence, so the firmware source is not open source in the OSI sense.
homepage: https://www.hobbychop.com/product/nds-and-nds-lite-midi-adapter
distribution: download
install_notes: >-
  The GitHub release carries a UF2 file that is drag-and-dropped onto the RP2040 in USB boot mode. Hardware is sold as
  a finished adapter at the linked shop page, or built from the repository.
brick_risk: false
