    url: https://github.com/tedbrakob
source: https://github.com/tedbrakob/pd-midi-synth
source_status: open
license: Unlicense
homepage: https://tedbrakob.github.io/pd-midi-synth-controller/
distribution: source-only
install_notes: >-
  Build with the Playdate SDK using make, then load bin/output.pdx. The controller demo page at the homepage sends MIDI
  to the Playdate from a Web MIDI browser.
brick_risk: false
tags: [synth, midi, serial]
