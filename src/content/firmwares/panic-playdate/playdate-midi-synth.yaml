device: panic-playdate
name: Playdate MIDI Synth
summary: Small Playdate app that plays a MIDI keyboard through the console's speaker, receiving note, pedal and bend messages as JSON over the serial interface.
description: >-
  Receives MIDI-style messages, including note on, note off and damper pedal, as serialized JSON through the Playdate's
  serial message interface and plays them with the console's built-in synthesizer. A companion web page,
  Playdate MIDI Synth Controller, sends the messages from a computer MIDI keyboard. It builds with make or VS Code
  and runs in the simulator.
status: dormant
authors:
