device: panic-playdate
name: Modular Play
summary: Casual patching playground for the Playdate in which modules are connected with cables to build generative music.
description: >-
  A playground game for making small music patches by dragging cables between modules. The author says it is meant to be
  fun and not for serious use, and that it works as well in the Playdate Simulator on a computer as on the console.
  The code base is about thirty thousand lines of Lua and was published as open source in February 2025, with a
  later devlog adding a MIDI note emitter module. The paid itch.io version offers modular_play_1_0_0.pdx.zip.
status: dormant
