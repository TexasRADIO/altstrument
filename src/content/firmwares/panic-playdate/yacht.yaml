device: panic-playdate
name: Yacht
summary: Music studio for the Playdate in Lua with a piano roll, drum pattern editor, three synths with oscillator, wavetable and sampler voices, a mixer and song arrangement.
description: >-
  A piano roll with note editing and automation, a drum pattern editor with velocity, accent, chance and per-step mute,
  and three synthesizer channels with oscillator, wavetable and sampler modes, where the sampler can record from the
  Playdate microphone. A sample-based drum machine has six drum slots, a mixer sets volume and pan, patterns are arranged
  into songs, and playing notes are visualised.
