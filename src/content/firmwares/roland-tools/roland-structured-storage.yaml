    url: https://github.com/DrKnackeratorStrikesAgain
source: https://github.com/DrKnackeratorStrikesAgain/Roland-Structured-Storage
source_status: open
license: MIT
distribution: source-only
install_notes: >-
  An ES6 module set with no package or build step. Copy the files into a project
  and import RolandStructuredFileFactory and the other classes from them. Work on
  copies of your project files and keep backups.
