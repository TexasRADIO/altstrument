device: roland-tools
name: Roland Structured Storage
kind: tool
summary: JavaScript library that parses and writes Roland structured binary files, including project files for the MC-707, MC-101, SH-4d and Verselab MV-1, and Fantom and ZEN-Core files.
description: >-
  Reads these files into a tree of chunks and named properties, lets you change
  values or compare two files, and writes the result back out as binary. Mapped
  formats include MC-707, MC-101 and MV-1 project files, SH-4d projects and
  patches, and ZEN-Core tones, kits and properties. Sample and sequencer import and
  export and most ZEN-Core sample data are listed as still to do. A separate
  command-line repository by the same author inspects files, and a pattern file
  for the ImHex hex editor shows the layout. It is a code library with no user
  interface of its own, and the format coverage varies by device.
status: active
authors:
