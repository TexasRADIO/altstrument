    url: https://github.com/lnetzel
source: https://github.com/lnetzel/CHOMPI-Pipes
source_status: open
license: MIT
license_notes: The LICENSE file names CHOMPI Club as copyright holder; the CHOMPI name and marks are not covered, see TRADEMARKS.md.
distribution: download
install_notes: >-
  Download CHOMPI_PIPES_1.0.bin from the release and use it as the only .bin in
  the SD card root, or add it to the multi-firmware launcher's FIRMWARE folder.
  Keep the original firmware to return to stock.
brick_risk: false
