device: chase-bliss-chompi
name: PIPES
summary: Six-voice organ firmware with four pipe ranks per voice, tonewheel-style character, percussion, fuzz, rotary speaker, delay, reverb, a modulation mode, 15 presets and an SD card recorder.
description: >-
  Each of the six voices stacks four pipe ranks (8 foot, 4 foot, 2 2/3 foot and
  2 foot) with per-pipe level, character, length, attack and release. The
  effects are a Hammond-style percussion on the play key, fuzz with tone, a
  rotary-speaker stage, a stereo bucket-brigade-style delay, a plate reverb and
  a global vibrato. The toggle switch selects a modulation mode in which pipe
  volume, character and pitch drift slowly. Fifteen presets are stored in a
  Pipes folder on the card, most controls answer MIDI CC, and a recorder writes
  48 kHz 16-bit WAV files to the card. The stereo aux input is mixed in and
  bypasses the organ effects. The README gives no statement about testing on
  hardware.
status: active
authors:
