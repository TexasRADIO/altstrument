  are not covered, see TRADEMARKS.md.
homepage: https://github.com/lnetzel/CHOMPI-lnetzel/releases
distribution: download
requires_stock: TAPE 2.0
install_notes: >-
  Download the .bin from a release and put it on the SD card as the only .bin in the root, then
  power on; the LEDs turn green when the drive can be connected. Eject the drive on the computer
  before unplugging. To return to an instrument, put that firmware's .bin on the card, or use the
  Multi-Firmware Launcher.
brick_risk: false
tags: [utility, usb, sd-card]
