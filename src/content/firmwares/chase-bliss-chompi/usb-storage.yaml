device: chase-bliss-chompi
name: CHOMPI USB Storage
summary: Utility firmware that makes the CHOMPI's microSD card appear on a computer as a USB drive, so recordings and audio files can be moved without taking the card out.
description: >-
  The CHOMPI shows up as a standard USB mass storage device on its USB-C port, named CHOMPI-SD,
  so Windows and macOS need no driver; the README says it was verified on Windows only. Ejecting
  the drive restarts the unit, which brings back the Multi-Firmware Launcher picker if that is
  installed, and the Overdub and Chompi keys offer a confirmed restart as well. At start-up the
  bottom row of keys lights in blue to show how full the card is. It is not an instrument and does
  not add USB access to TAPE, TEMPO or WAVE. The same build is bundled in Multi-Firmware Launcher
  1.1 and later.
status: active
authors:
