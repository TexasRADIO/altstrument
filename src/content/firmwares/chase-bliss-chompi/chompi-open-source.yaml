device: chase-bliss-chompi
name: CHOMPI open source firmware
summary: "Official open-source release of the CHOMPI firmware: TAPE 2.0 sampler, TEMPO 1.0 pattern generator, WAVE 1.0 wavetable synth and a beta bootloader, with hardware files and factory card profiles."
description: >-
  Released as a discontinuation open-source bundle. TAPE 2.0 is the sampler
  firmware every unit shipped with. TEMPO 1.0 is its pattern generator
  counterpart. WAVE 1.0 is a wavetable synth that the repository positions as
  a starting point for people writing their own firmware. Bootloader v6.4
  (beta) never shipped on units and was written to improve stability with the
  Daisy Seed and fix edge cases inherited from the Electrosmith bootloader.
  The repository also contains PCB, BOM and enclosure files and the factory
  microSD card profiles. The repository says it is a permanent source and
  will likely get no further updates.
