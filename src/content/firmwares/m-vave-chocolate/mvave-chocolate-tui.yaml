device: m-vave-chocolate
name: mvave-chocolate-tui
kind: tool
summary: >-
  Linux terminal UI that writes Chocolate switch configuration with SysEx via amidi: 16-switch grid (4
  banks of 4), mode switching, real-time MIDI monitor, auto-detection.
description: >-
  Needs Go and alsa-utils, with the Chocolate in USB (U) mode rather than HOST. Written so a Windows VM
  or Wine is not needed to change footswitch assignments.
status: active
authors:
