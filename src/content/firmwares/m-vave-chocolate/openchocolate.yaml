  url: https://github.com/majabojarska
source: https://github.com/majabojarska/OpenChocolate
source_status: open
license: unspecified
license_notes: No LICENSE file in the repository.
distribution: source-only
install_notes: >-
  Run the app from source (npm install, npm run dev) in a Web MIDI browser such as Chrome or Edge.
