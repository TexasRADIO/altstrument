device: m-vave-chocolate
name: mvave-chocolate-sysex
kind: tool
summary: >-
  Notes and SysEx dumps for the Chocolate: mode switching, discovery, reading current settings and write
  messages, usable with aseqsend on Linux.
description: >-
  Documentation only. The author notes configuration worked only while the official app was running (seemingly
  because the device wants SysEx inside a single USB request) and that SysEx over BLE MIDI did not work.
  Superseded in practice by OpenChocolate's fuller spec.
