homepage: https://willbearfruits.github.io/samplooler/
distribution: browser-installer
install_notes: >-
  The project page has a flash button that needs Chrome or Edge on a computer. Hold BOOT while plugging the board in,
  because the running firmware uses USB for MIDI and audio and the browser only finds the board in download mode. The
  desktop app and tools/flash.sh write the bootloader, partition table and app without touching the settings and the
  stored loops. To build from source, use ESP-IDF 5.5.1 (firmware/ folder).
brick_risk: false
