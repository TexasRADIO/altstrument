device: serious-shit-samplooler
name: Samplooler
summary: Looper firmware for the Samplooler Stack. Hold the button to record up to 20 seconds, let go to loop, and tilt the board to change speed and direction, with tape or grain playback, 18 input voices, USB MIDI and USB audio.
description: >-
  Tipping the board forward plays the loop faster and tipping it back plays it in reverse, with an optional snap to
  octaves and fifths. Rolling it sideways adds a tape delay to one side and a stutter to the other. TAPE mode ties pitch
  to speed and GRAIN mode separates them. Optional input voices from the SING engine (autotune, harmonies, choir,
  vocoder, echo) can process the signal before it records, and eight loops are stored on the board and kept through
  updates. Several boards talk over an ESP-NOW radio link, sharing tempo, key and scale. USB carries MIDI and a
  32 kHz sound card on one cable. The project page also runs the playback engine in a browser.
