device: serious-shit-samplooler
name: WRECK
summary: Breakcore-to-doom instrument firmware for the Samplooler Stack. One knob moves from a chopped break at double tempo down to a drone, with tilt, stick and knocks adding chaos, a step grid and sampling from the mic or USB.
description: >-
  WRECK plays a synthesised drum kit by itself and the knob moves through four zones, breakcore at twice the tempo,
  hardcore, sludge at half tempo and drone at a quarter. Tilt adds chaos or drags the tape, rolling reverses or stutters,
  the joystick adds rolls, dives, crush and drive, and knocking on the box triggers a fill. A 16-step grid chops the
  break by hand, and takes of up to eight seconds can be sampled from the mic, the USB sound card input or WRECK itself.
  The README says no recording of anyone else's break is bundled. Boards on the radio link keep the same beat. The README
  says the latest build has so far run only in the simulator; an earlier build ran on a board.
