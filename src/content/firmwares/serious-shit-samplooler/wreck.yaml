install_notes: >-
  Install it from the project page in Chrome or Edge, or with the Samplooler Library desktop app, and flash the
  Samplooler firmware back the same way. The settings and stored loops stay on the board. To build, use ESP-IDF 5.5.1 in
  the instrument's firmware folder.
