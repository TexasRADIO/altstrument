device: serious-shit-samplooler
name: MANTRA
summary: Formant-singing instrument firmware for the Samplooler Stack, with chants, overtone singing, a public-domain "Daisy Bell" and an optional wall of amps. Tilt, roll, flat turns and knocks shape the voice.
description: >-
  MANTRA sings through its own formant engine rather than any speech program's code. Sounds include OM, monks, OM MANI,
  khoomei, sygyt, kargyraa and "Daisy Bell" in sung, hummed and 8-bit versions, plus three settings that bring in a held,
  fuzzed chord with feedback. Tilting the box changes the vowel, rolling it changes the pitch, laying it flat walks the
  overtone up the harmonics and knocking triggers a singing bowl. The mic can send the player's own voice through the
  same mouth, and holding REC loops the result. The README says the chant ran on a board, and the amp section has so
  far been heard only in the simulator.
