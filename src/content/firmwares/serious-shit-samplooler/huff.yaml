device: serious-shit-samplooler
name: HUFF
summary: Breath-controlled wind instrument firmware for the Samplooler Stack. Blow at the mic to play, tilt the board to change the note, with ocarina, flute, pan pipe, shakuhachi, clarinet, tin whistle and bottle models.
description: >-
  HUFF reads breath from the microphone and plays a physical model, with louder blowing giving a louder note and, on
  the flutes and clarinet, a jump to the next register when blown hard. Tilt picks the note along a ladder, leaning
  sideways adds vibrato or a bend, and the joystick bends the pitch. The sound list also has presets such as cave, desert
  and theremin, and eight places for the player's own. Holding REC records a phrase that loops. USB MIDI sends notes,
  breath as CC 2, pitch bend, every setting and program changes, and takes notes, breath, bend and the sustain pedal as
  input. It joins the radio link to share key, scale and tempo with other boards. The README says it was installed from
  the desktop app and has not been played much.
