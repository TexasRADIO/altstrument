device: serious-shit-samplooler
name: Samplooler Library
kind: tool
summary: Desktop app that lists the Samplooler instruments, installs any of them on a Stack over USB, restores the Samplooler firmware, and shows a connected board's settings and log. Tauri app, built from source; Linux first.
description: >-
  The app reads the instrument list from the project page or a local folder and caches what it downloads, so a firmware
  can be installed again offline. A board running one of the firmwares is found by its MIDI port name and asked over
  SysEx to restart into download mode. The app then checks that the serial port's MAC matches that board and writes the
  bootloader, partition table and program, leaving the settings and stored loops alone. It will not open boards that are
  not from this project. It also installs a build from a folder of the user's own, and for the Samplooler, WRECK, MANTRA and
  HUFF it shows and changes settings over MIDI. The roadmap lists ready-made Linux packages next, then macOS and Windows.
