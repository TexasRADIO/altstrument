name: MPC Sample
manufacturer: Akai Professional
category: sampler
tagline: Battery-powered portable MPC-style sampler and sequencer
description: >-
  The MPC Sample is a portable standalone sampler, sequencer and effects unit
  from Akai Professional, styled after the vintage MPC60. It has 16 velocity and
  pressure sensitive RGB pads, a colour display, three knobs, a slider, a
  built-in speaker and microphone and four effects engines. Samples load from a
  microSD card or over USB-C, and projects can be opened on MPC hardware running
  MPC software 3.8 or later.
stock_firmware: "1.3"
links:
  manufacturer: https://www.akaipro.com/mpc-sample
notes: >-
  No custom firmware exists for the MPC Sample. The only third-party software
  listed is a project editor and generator that works on its project files.
related: [akai-mpc-live]
