name: Electribe 2 / 2 Sampler
manufacturer: Korg
category: groovebox
tagline: Pattern-based groovebox in synth and sampler variants
platform: TI Sitara CPU + Blackfin DSP
stock_firmware: "2.02"
links:
  manufacturer: https://www.korg.com/us/products/dj/electribe_sampler/
  community:
    - label: Hacktribe wiki
      url: https://github.com/bangcorrupt/hacktribe/wiki
    - label: Freetribe docs
      url: https://bangcorrupt.github.io/freetribe-docs/
notes: >-
  The stock updater writes straight to flash, so a bad write can leave the
  unit unable to boot. The Hacktribe wiki documents a Debrick procedure that
  needs a JTAG header or SPI flash access. Hacktribe patches the Electribe 2
  Sampler 2.02 firmware and can also be applied to the synth model after
  editing the file header.
