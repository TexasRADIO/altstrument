name: Elektron cross-device tools
manufacturer: Elektron
category: tools
tagline: Loaders, emulators and analysis tools for several Elektron boxes
links:
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: Modwerk
