name: MPC Live / Live II / X / One / Key 61
manufacturer: Akai Professional
category: sampler
tagline: Linux-based standalone MPC generation
platform: Embedded Linux (shared base with Force)
links:
  manufacturer: https://www.akaipro.com/products/collections/mpc/
  community:
    - label: MPC-LiveXplore wiki
      url: https://github.com/TheKikGen/MPC-LiveXplore/wiki
notes: >-
  Existing mods patch Akai's update images rather than replacing the
  application. Reports on mpc-forums in 2026 suggest rooting newer firmware on
  second-generation hardware (Live II) is harder because the update image is
  checked, and that the patch has to be redone after each Akai update. Akai
  has made no statement on this and the reports are unconfirmed.
