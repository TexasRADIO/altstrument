name: Launchpad Pro (MK1)
manufacturer: Novation
category: controller
tagline: 8x8 pad grid controller with USB and DIN MIDI
platform: STM32
links:
  manufacturer: https://novationmusic.com/products/launchpad-pro
  community:
    - label: lpp-performance-cfw unbrick guide
      url: https://github.com/mat1jaczyyy/lpp-performance-cfw/blob/master/unbrick.md
related: [novation-launchpad]
notes: >-
  MK1 only; the Launchpad Pro MK3 is covered under the Launchpad family entry.
  Novation released an open firmware framework for this model rather than the
  factory source, and nearly every custom build descends from it. Firmware is
  sent as SysEx while the unit is in bootloader mode (hold Setup while powering
  on). Open firmware drops the stock Live port, so mods differ in whether they
  keep Ableton integration.
