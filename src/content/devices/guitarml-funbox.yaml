related: [cleveland-hothouse, pedalpcb-terrarium]
notes: >-
  Open hardware with KiCad design files in the repository (125B enclosure, about
  $120 to $150 to build per the README). Programs are loaded with the Electrosmith
  web programmer or a make target; some modules (Mars, Neptune) use SRAM and
  need the Daisy bootloader. Funbox effects have been ported to the Cleveland
  Hothouse.
