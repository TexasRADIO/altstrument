notes: >-
  Only the 2025 arc with a pushbutton supports monome's iii scripting
  firmware, and it ships with it, so no separate install is needed; older arcs
  keep their stock firmware and can use the viii browser emulator for iii
  scripts. Arc is also used with norns, ansible and crow, and a protocol-compatible
  DIY clone has its own open firmware.
