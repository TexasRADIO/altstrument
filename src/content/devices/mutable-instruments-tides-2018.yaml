name: Tides 2018
manufacturer: Mutable Instruments
category: eurorack
tagline: Tidal modulator, 2018 version (discontinued)
description: >-
  Tides 2018 is a 14HP Eurorack function generator and oscillator designed by
  Émilie Gillet and sold by Mutable Instruments from 2018 to 2022, as a
  redesign of the original Tides. It has AD, AR and looping modes, shape, slope
  and smoothness controls, an external clock or PLL input that can run at 1/16
  to 16 times the clock rate, and four outputs with several output modes. The
  module uses an STM32F373 at 72 MHz and a DAC8164.
platform: STM32F3
stock_firmware: "1.2"
links:
