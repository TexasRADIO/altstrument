name: USBSID-Pico
manufacturer: LouD
category: synth
tagline: Open-source Pico board that plays one or two real SID chips over USB
description: >-
  USBSID-Pico is an open-source board by the maker LouD that carries a Raspberry
  Pi Pico or Pico 2 and two sockets for MOS 6581, 6582 and 8580 SID chips or
  SID replacements such as SIDKick-pico, ARMSID, FPGASID and SwinSID. It appears
  to a computer, phone or browser as a USB device, and SID players, C64
  emulators, SID trackers and WebUSB pages write to the chips in real time. It
  also acts as a USB MIDI device, which the project describes as beta. Later
  board revisions set the socket voltage, filter capacitors and shunt resistor
  automatically for the detected chip.
platform: Raspberry Pi RP2040 or RP2350 (Pico, Pico W, Pico 2, Pico 2 W)
links:
  manufacturer: https://usbsid.loudai.nl
  community:
