notes: >-
  Board design files and the firmware are published in the same repository. The
  v1.0 and v1.3 boards are under CC BY-SA 4.0 and the v1.5 board is under CC
  BY-NC-ND 4.0. The maker sells assembled boards through a SmallRun pre-order
  and a reseller. SID chips are not included, and the author warns that the
  project is a hobby build with no guarantees against damage to the chips or
  to connected equipment. An embedded USBSID-Player and Cynthcart firmware
  variant overclocks the Pico to 250 MHz.
