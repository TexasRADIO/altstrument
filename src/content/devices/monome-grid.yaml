notes: >-
  The 40h, monome kit and early series grids have public firmware sources
  (some under non-commercial CC terms), while the 2022 grid, grid one and grid
  zero take monome's open iii firmware, which can switch back to the original
  serial mode. Grids from 2020-2021 and the older FTDI-based editions cannot run iii; use
  the viii browser emulator instead. Most grid apps run on the host or norns
  through serialosc and are software. No repository for 2011-2021 grid
  firmware was found. DIY grid clones (NeoTrellis-based) are covered by the
  neotrellis-monome entry.
