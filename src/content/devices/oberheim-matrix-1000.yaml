name: Matrix-1000
manufacturer: Oberheim
category: synth
tagline: Rack-mount analog polysynth module
description: >-
  The Matrix-1000 is a one-rack-space analog synthesizer module from Oberheim,
  introduced in the late 1980s as a compact version of the Matrix-6. It has six
  voices, each with two digitally controlled oscillators, a resonant low-pass
  filter, envelopes and LFOs, and holds 1,000 patches (800 factory and 200
  user). It has almost no front-panel editing, so sounds are normally edited
  over MIDI from a computer. The control board is built around a Motorola 6809.
platform: Motorola 6809
stock_firmware: "1.11"
links:
  community:
    - label: MATRIXSYNTH comparison post
      url: https://www.matrixsynth.com/2020/09/original-matrix-1000-firmware-vs-gligli.html
    - label: Tauntek Matrix-1000 firmware page
      url: http://www.tauntek.com/Matrix1000Firmware.htm
notes: >-
  Both alternative firmwares are EPROM images (27C256) that replace the stock
  system ROM, so they need a chip swap rather than a software update. Keep the
  original chip to revert. The Tauntek page also covers a separate Matrix-6/6R
  firmware, which is not listed here.
