name: MetaModule
manufacturer: 4ms Company
category: eurorack
tagline: Virtual modular host that runs ported VCV-style plugins in a module
links:
  manufacturer: https://metamodule.info
  community:
    - label: MetaModule firmware repository
      url: https://github.com/4ms/metamodule
    - label: Plugin SDK examples
