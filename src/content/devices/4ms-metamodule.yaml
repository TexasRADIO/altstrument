notes: >-
  The firmware and plugin SDK are open, so the scene is mostly plugins: VCV
  Rack modules recompiled with the SDK wrapper, plus native plugins. The
  MetaModule name may not be used in derivative works; phrases such as
  "for MetaModule" are allowed when promoting a plugin.
