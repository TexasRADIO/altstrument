name: OP-1 (original)
manufacturer: Teenage Engineering
category: synth
tagline: Portable synth, sampler and tape sequencer
description: >-
  The OP-1 is a portable synthesizer, sampler and sequencer from Teenage
  Engineering of Stockholm, released in 2011. It combines multiple synth and
  drum engines, built-in effects, several sequencers, a four-track tape-style
  recorder and an FM radio for sampling. The device has a small colour display,
  four colour-coded encoders, a rechargeable battery and USB audio and MIDI. A
  Blackfin DSP runs the instrument.
platform: Analog Devices Blackfin
stock_firmware: R246
links:
  manufacturer: https://teenage.engineering/products/op-1
  community:
    - label: op-forums custom firmware thread
      url: https://op-forums.com/t/custom-firmware-on-the-op-1/4283/680
notes: >-
  Original OP-1 only. No custom firmware was found for the OP-1 Field, OP-Z,
  EP-133, EP-1320 or Pocket Operators. R246 (2022-12-13) is the latest official
  OP-1 update on Teenage Engineering's download page. Repacker-based mods target
  older builds (tested on 235); op1r targets R246 only. Mods are installed
  through the standard update mode and leave the bootloader untouched.
