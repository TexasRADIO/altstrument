notes: >-
  16n is a monome-lineage open-hardware faderbank that sends USB and TRS MIDI,
  CV and monome-style i2c to Teletype, ansible and similar modules. Firmware is
  MIT and hardware is CC-BY-SA-4.0. The original Teensy 16n and the RP2040
  16nx have separate firmware repositories and are configured with the
  same browser editor.
related: [monome-teletype, monome-ansible, bpcmusic-telex]
