name: MIDI Captain (Nano 4 / Mini 6 / 10)
manufacturer: PaintAudio
category: foot-controller
tagline: CircuitPython-based MIDI foot controllers with colour displays
platform: CircuitPython
links:
  manufacturer: https://paintaudio.com/
  community:
    - label: PySwitch emulator and configurator
      url: https://pyswitch.tunetown.de/
    - label: PySwitch thread on the Kemper forum
      url: https://forum.kemper-amps.com/forum/thread/65206-pyswitch-an-alternative-customizable-firmware-for-paintaudio-midi-captain-contro/
notes: >-
  The controllers present a USB drive (hold switch 1 while powering up), so
  firmware is installed by copying files. Both projects here are written in
  CircuitPython. PySwitch recommends saving the drive's original contents
  first, including the license folder, if you may want to restore the
  manufacturer firmware, and supports multi-boot alongside it.
