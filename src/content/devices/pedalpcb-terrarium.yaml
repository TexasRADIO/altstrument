name: Terrarium
manufacturer: PedalPCB
category: pedal
tagline: Daisy Seed pedal PCB with six knobs and two footswitches
platform: Electrosmith Daisy Seed
links:
  manufacturer: https://www.pedalpcb.com/product/pcb351/
  community:
    - label: Terrarium build docs
      url: https://docs.pedalpcb.com/project/Terrarium.pdf
related: [cleveland-hothouse, guitarml-funbox]
notes: >-
  A 125B-format PCB for a Daisy Seed. Pedal firmware for it is flashed with the
  Electrosmith web programmer or DFU, so no manufacturer firmware is replaced.
  The GuitarML Seed pedal and the bkshepherd Guitar Pedal framework both run on
  the Terrarium hardware.
