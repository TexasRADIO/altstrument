notes: >-
  Host-side tools that serve more than one monome device: the libavr32 library
  and multipass framework behind the AVR32 modules, a Docker build image, the
  monome-rack VCV Rack emulation, and the diii / viii editors for iii-mode
  grids and arcs. serialosc and libmonome, the host drivers that let computer
  and norns software talk to grids and arcs, are software and not catalogued.
