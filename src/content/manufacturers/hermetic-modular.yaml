name: Hermetic Modular
website: https://hermeticmodular.com/
notes: Seattle Eurorack maker run by Luke Pendergrass. Its Alchemy Lab module is a field-programmable platform that runs any of the company's firmwares, flashed from a browser, and its MIT-licensed Alchemy SDK and board support are published on GitHub (github.com/hermetic-modular). A second platform, Azoth, is announced as coming soon.
